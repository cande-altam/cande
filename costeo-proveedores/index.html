<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Candela — Costeo y Proveedores</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --cream:#EEEBD7; --cream-dark:#dedad8; --cream-mid:#e5e1cc;
  --black:#22201F; --black-soft:#3a3836;
  --terra:#E15D46; --terra-light:#ea7a65; --terra-pale:#f9ddd8;
  --turq:#9BD6CC; --turq-dark:#6bbfb4; --turq-pale:#d8f0ed;
  --gray:#9a9888; --gray-light:#ccc9b5; --white:#ffffff;
  --green:#27ae60; --green-pale:#e8f8f0;
  --shadow-sm:0 1px 3px rgba(34,32,31,.06),0 1px 2px rgba(34,32,31,.04);
  --shadow-md:0 4px 16px rgba(34,32,31,.08),0 2px 6px rgba(34,32,31,.05);
  --shadow-lg:0 12px 40px rgba(34,32,31,.12),0 4px 12px rgba(34,32,31,.06);
  --shadow-terra:0 4px 18px rgba(225,93,70,.30);
  --shadow-turq:0 4px 18px rgba(155,214,204,.35);
  --r:14px;--r-sm:8px;--r-xs:6px;
}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--cream);color:var(--black);min-height:100vh;font-weight:300;font-size:14px;}

/* HEADER */
.header{background:var(--black);padding:0 28px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200;height:68px;box-shadow:0 1px 0 rgba(255,255,255,.06),0 4px 24px rgba(0,0,0,.3);}
.logo{display:flex;align-items:center;gap:10px;}
.logo-mark{font-size:22px;}
.logo-text-wrap{display:flex;flex-direction:column;line-height:1.1;}
.logo-name{font-size:15px;font-weight:600;color:var(--cream);letter-spacing:.2px;}
.logo-sub{font-size:9px;color:var(--gray);font-weight:400;letter-spacing:2px;text-transform:uppercase;margin-top:2px;}
.nav-desktop{display:flex;gap:2px;align-items:center;flex-wrap:wrap;}
.nav-btn{padding:8px 14px;border:none;background:transparent;color:rgba(255,255,255,.45);cursor:pointer;font-size:12.5px;font-family:'Plus Jakarta Sans',sans-serif;font-weight:400;border-radius:8px;transition:all .2s cubic-bezier(.25,.8,.25,1);letter-spacing:.2px;white-space:nowrap;}
.nav-btn:hover{color:var(--cream);background:rgba(255,255,255,.08);}
.nav-btn.active{color:#fff;background:var(--terra);font-weight:600;box-shadow:var(--shadow-terra);}
.nav-logout{padding:8px 14px;border:1px solid rgba(255,255,255,.15);background:transparent;color:rgba(255,255,255,.6);cursor:pointer;font-size:12px;border-radius:8px;font-family:'Plus Jakarta Sans',sans-serif;}
.nav-logout:hover{color:#fff;border-color:rgba(255,255,255,.4);}
.nav-hamburger{display:none;flex-direction:column;gap:5px;cursor:pointer;padding:8px;background:none;border:none;}
.nav-hamburger span{width:22px;height:2px;background:var(--gray);border-radius:2px;display:block;}
.nav-mobile-menu{display:none;position:fixed;top:60px;left:0;right:0;background:var(--black);z-index:199;padding:12px;flex-direction:column;gap:4px;border-bottom:1px solid #3a3836;box-shadow:0 8px 24px rgba(0,0,0,.3);}
.nav-mobile-menu.open{display:flex;}
.nav-mobile-btn{padding:14px 18px;border:none;background:transparent;color:rgba(255,255,255,.5);cursor:pointer;font-size:14px;font-family:'Plus Jakarta Sans',sans-serif;font-weight:400;border-radius:10px;text-align:left;}
.nav-mobile-btn.active{color:#fff;background:var(--terra);font-weight:600;}
@media(max-width:900px){.nav-desktop{display:none;}.nav-hamburger{display:flex;}}

/* MAIN */
.main{padding:28px;max-width:1160px;margin:0 auto;width:100%;}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.main > *{animation:fadeUp .3s ease both;}
.page-title{font-size:22px;font-weight:700;color:var(--black);margin-bottom:4px;letter-spacing:-.3px;}
.page-sub{color:var(--gray);font-size:13px;margin-bottom:24px;font-weight:400;}

/* SECTION BLOCK */
.section-block{background:var(--white);border:1px solid rgba(34,32,31,.07);border-radius:var(--r);padding:22px 24px;margin-bottom:16px;box-shadow:var(--shadow-sm);}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:12px;flex-wrap:wrap;}
.section-title{font-size:14px;font-weight:600;color:var(--black);display:flex;align-items:center;gap:8px;}

/* TABS */
.tabs{display:flex;border-bottom:1.5px solid var(--cream-dark);margin-bottom:20px;overflow-x:auto;}
.tab{padding:11px 22px;cursor:pointer;font-size:13px;color:var(--gray);border:none;background:none;font-family:'Plus Jakarta Sans',sans-serif;font-weight:400;border-bottom:2px solid transparent;margin-bottom:-1.5px;white-space:nowrap;}
.tab:hover{color:var(--black);}
.tab.active{color:var(--terra);border-bottom-color:var(--terra);font-weight:600;}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 18px;border-radius:10px;border:none;cursor:pointer;font-size:13px;font-family:'Plus Jakarta Sans',sans-serif;font-weight:600;transition:all .2s cubic-bezier(.25,.8,.25,1);letter-spacing:.2px;}
.btn-primary{background:var(--terra);color:#fff;box-shadow:var(--shadow-terra);}
.btn-primary:hover{background:var(--terra-light);}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;}
.btn-turq{background:var(--turq);color:var(--black);box-shadow:var(--shadow-turq);}
.btn-turq:hover{background:var(--turq-dark);color:#fff;}
.btn-ghost{background:rgba(34,32,31,.04);border:1px solid rgba(34,32,31,.12);color:var(--gray);}
.btn-ghost:hover{border-color:var(--black);color:var(--black);background:rgba(34,32,31,.06);}
.btn-danger{background:#fdecea;color:#b83a25;border:1px solid #f5c4bc;}
.btn-danger:hover{background:var(--terra);color:#fff;border-color:var(--terra);}
.btn-sm{padding:6px 13px;font-size:12px;border-radius:8px;}
/* Botón cuadrado solo-ícono, para acciones frecuentes en filas de tabla sin llenarlas de texto.
   Siempre con title= para que se entienda qué hace al pasar el mouse. */
.btn-icon{padding:0;width:30px;height:30px;justify-content:center;font-size:14px;border-radius:8px;flex:0 0 auto;}
.row-actions{display:flex;gap:5px;align-items:center;justify-content:flex-end;}
/* Pie del panel expandido: acciones menos frecuentes / destructivas, lejos del flujo normal. */
.panel-footer-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;padding-top:12px;border-top:1px solid var(--cream-dark);}

/* BADGES */
.badge{font-size:11px;padding:3px 10px;border-radius:100px;font-weight:500;letter-spacing:.2px;display:inline-block;}
.badge-pagado{background:var(--green-pale);color:var(--green);}
.badge-no-pagado{background:#fff3ee;color:var(--terra);}
.badge-alerta{background:#fdecea;color:#b83a25;}
.badge-ok{background:var(--turq-pale);color:var(--turq-dark);}
.badge-neutro{background:var(--cream);color:var(--gray);}
.badge-suba{background:#fdecea;color:#c0392b;font-weight:700;}
.badge-baja{background:var(--green-pale);color:var(--green);font-weight:700;}
.badge-suba-abrupta{background:#c0392b;color:#fff;font-weight:800;font-size:12px;padding:4px 12px;box-shadow:0 2px 8px rgba(192,57,43,.35);animation:pulse-alerta 1.6s ease-in-out infinite;}
.precio-subio{color:#c0392b;font-weight:800;}
.form-input.precio-subio{border-color:#c0392b;box-shadow:0 0 0 2px rgba(192,57,43,.12);}
@keyframes pulse-alerta{0%,100%{opacity:1;}50%{opacity:.72;}}
.alerta-precio-card{border:1.5px solid #f0b4ac;background:#fff6f5;border-radius:var(--r-sm);padding:12px 16px;margin-bottom:10px;}
.alerta-precio-card.abrupta{border-color:#c0392b;background:#fdecea;box-shadow:0 2px 10px rgba(192,57,43,.18);}

/* FORMS */
.form-row{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-bottom:12px;}
.form-group{display:flex;flex-direction:column;gap:6px;flex:1;min-width:150px;}
.form-label{font-size:10px;color:var(--gray);text-transform:uppercase;letter-spacing:1px;font-weight:600;}
.form-input,.form-select{padding:10px 14px;background:var(--cream);border:1.5px solid var(--cream-dark);border-radius:var(--r-sm);color:var(--black);font-size:13px;outline:none;width:100%;font-family:'Plus Jakarta Sans',sans-serif;font-weight:400;transition:border-color .15s,box-shadow .15s;}
.form-input:focus,.form-select:focus{border-color:var(--terra);box-shadow:0 0 0 3px rgba(225,93,70,.12);}
textarea.form-input{resize:vertical;min-height:60px;}

/* TOGGLE */
.toggle{width:38px;height:22px;border-radius:11px;background:var(--cream-dark);position:relative;cursor:pointer;transition:background .25s;flex-shrink:0;border:none;}
.toggle.on{background:var(--turq);}
.toggle::after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .25s;box-shadow:0 1px 4px rgba(0,0,0,.2);}
.toggle.on::after{transform:translateX(16px);}

/* TABLE */
.data-table-wrap{overflow-x:auto;}
.data-table{width:100%;border-collapse:collapse;font-size:13px;background:var(--white);}
/* Encabezado fijo: en listas largas se pierde de vista qué columna es cada cosa. */
.data-table th{text-align:left;padding:10px 14px;color:var(--gray);border-bottom:1.5px solid var(--cream-dark);font-weight:600;font-size:10px;text-transform:uppercase;letter-spacing:.7px;white-space:nowrap;position:sticky;top:0;background:var(--white);z-index:2;}
.data-table td{padding:12px 14px;border-bottom:1px solid var(--cream-mid);color:var(--black);font-weight:300;vertical-align:middle;}
.data-table tr:last-child td{border-bottom:none;}
.data-table tbody tr:hover td{background:rgba(155,214,204,.10);}
/* La fila abierta queda marcada, y su panel se lee como continuación de ella y no como otra fila. */
.data-table tr.fila-abierta td{background:var(--turq-pale);box-shadow:inset 3px 0 0 var(--turq);}
.data-table tr.fila-detalle td{border-bottom:2px solid var(--cream-dark);}
.data-table tr.fila-detalle:hover td{background:var(--cream);}

/* ITEM ROWS (factura / receta) */
.item-row{display:grid;grid-template-columns:2fr 1fr 1fr 32px;gap:8px;align-items:start;padding:6px 0;}
.item-row-header{font-size:10px;color:var(--gray);text-transform:uppercase;letter-spacing:.6px;font-weight:600;padding-bottom:6px;border-bottom:1px solid var(--cream-dark);margin-bottom:4px;}
.item-row-wrap{overflow-x:auto;}
@media(max-width:700px){.item-row,.item-row-header{grid-template-columns:repeat(4,160px);min-width:520px;}}
.recipe-row{display:grid;grid-template-columns:2fr 1fr 32px;gap:8px;align-items:center;padding:6px 0;}

/* INSUMO SEARCH PICKER */
.insumo-picker{position:relative;}
.insumo-picker-results{display:none;position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--white);border:1.5px solid var(--cream-dark);border-radius:var(--r-sm);box-shadow:var(--shadow-md);max-height:220px;overflow-y:auto;z-index:50;}
.insumo-picker-item{padding:9px 14px;font-size:13px;cursor:pointer;border-bottom:1px solid var(--cream-mid);}
.insumo-picker-item:last-child{border-bottom:none;}
.insumo-picker-item:hover{background:var(--turq-pale);}
.insumo-picker-item.insumo-picker-create{color:var(--terra);font-weight:600;}
.item-hint{grid-column:1/-1;font-size:11px;line-height:1.5;}
.item-hint:empty{display:none;}
.item-warn{color:#c0392b;font-weight:600;background:#fdecea;border-radius:6px;padding:4px 8px;margin-top:3px;}
.item-note{color:var(--terra);background:#fff5f3;border-radius:6px;padding:4px 8px;margin-top:3px;}

/* CARDS LIST */
.card-list{display:flex;flex-direction:column;gap:10px;}
.receta-card-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px;align-items:start;}
.mini-card{background:var(--white);border:1.5px solid var(--cream-dark);border-radius:var(--r-sm);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;box-shadow:var(--shadow-sm);}
.mini-card-title{font-size:13.5px;font-weight:600;color:var(--black);}
.mini-card-sub{font-size:11.5px;color:var(--gray);margin-top:2px;}

/* LOGIN */
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:80vh;}
.login-card{background:var(--white);border:1px solid rgba(34,32,31,.08);border-radius:20px;padding:44px 40px;width:360px;max-width:90vw;box-shadow:var(--shadow-lg);}
.login-title{font-size:22px;font-weight:700;color:var(--black);margin-bottom:6px;}
.login-sub{font-size:13px;color:var(--gray);margin-bottom:26px;font-weight:400;}
.admin-form{display:flex;flex-direction:column;gap:14px;}

/* MISC */
.loading{text-align:center;padding:80px 24px;color:var(--gray);font-size:13px;}
.empty-state{text-align:center;padding:48px 24px;color:var(--gray);font-size:13px;}
.spinner{width:34px;height:34px;border:3px solid var(--cream-dark);border-top-color:var(--terra);border-radius:50%;animation:spin .75s linear infinite;margin:0 auto 14px;}
@keyframes spin{to{transform:rotate(360deg);}}
#toast{position:fixed;bottom:24px;right:24px;left:auto;max-width:340px;background:var(--black);color:var(--cream);padding:14px 20px;border-radius:12px;font-size:13px;font-weight:500;opacity:0;transform:translateY(12px) scale(.97);transition:all .3s cubic-bezier(.25,.8,.25,1);pointer-events:none;z-index:999;box-shadow:0 8px 32px rgba(0,0,0,.25);}
#toast.show{opacity:1;transform:translateY(0) scale(1);}
#toast.success{border-left:3px solid var(--turq);}
#toast.warn{border-left:3px solid var(--terra);}
#toast.danger{border-left:3px solid #b83a25;}
.text-muted{color:var(--gray);font-size:12px;}
.photo-thumb{max-width:160px;border-radius:10px;box-shadow:var(--shadow-sm);display:block;}
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px;}
.stat-card{background:var(--white);border-radius:var(--r);padding:16px 18px;border:1px solid rgba(34,32,31,.07);box-shadow:var(--shadow-sm);}
.stat-label{font-size:10px;color:var(--gray);text-transform:uppercase;letter-spacing:.8px;margin-bottom:4px;font-weight:500;}
.stat-value{font-size:22px;font-weight:700;color:var(--black);}
.alert-box{padding:12px 18px;border-radius:10px;margin-bottom:16px;font-size:13px;display:flex;align-items:center;gap:10px;font-weight:400;}
.alert-warn{background:#fff5f3;border:1px solid var(--terra-pale);color:var(--terra);}
.alert-danger{background:#fdecea;border:1px solid #f5c4bc;color:#b83a25;}
.alert-turq{background:var(--turq-pale);border:1px solid var(--turq);color:var(--turq-dark);}
.delta-pos{color:#b83a25;font-weight:600;}
.delta-neg{color:var(--green);font-weight:600;}
@media(max-width:640px){
  .main{padding:14px 12px;}
  .header{padding:0 14px;height:60px;}
  .page-title{font-size:19px;}
  .section-block{padding:16px 14px;}
  .form-group{min-width:100%;}
}
</style>
</head>

<script type="module">

// Same Firebase project as the production-order system (Candela) — new data lives under costeo/*

// Storage, so this app needs zero extra Firebase setup beyond the existing database.

const TABS = [

// ── Helpers ──────────────────────────────────────────────
function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function todayISO() {
  return new Intl.DateTimeFormat("en-CA", { timeZone: "America/Argentina/Buenos_Aires", year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date());
}
function fmtDate(iso) {
  if (!iso) return "—";
  const [y, m, d] = iso.split("-");
  return `${d}/${m}/${y}`;
}
function fmtMoney(n) {
  const num = Number(n) || 0;
  return "$" + num.toLocaleString("es-AR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function fmtPct(n) {
  if (n === null || n === undefined || Number.isNaN(n)) return "—";
  const sign = n > 0 ? "+" : "";
  return `${sign}${n.toFixed(1)}%`;
}
// Buscador genérico reutilizado en las distintas vistas de listado (Facturas, Pagos, Proveedores,
// Insumos, Recetas y Bases): un input de texto que llama a `setter(valor)` en cada tecla.
function buscadorHtml(value, placeholder, setter) {
  return `<div class="form-row" style="margin-bottom:14px"><div class="form-group" style="max-width:320px"><input class="form-input" placeholder="🔎 ${escapeHtml(placeholder)}" value="${escapeHtml(value)}" oninput="${setter}(this.value)"></div></div>`;
}
function diasDesdeFecha(iso) {
  if (!iso) return Infinity;
  return (Date.now() - new Date(iso + "T00:00:00").getTime()) / 86400000;
}
// Una suba de precio se considera "abrupta" (alerta grande, no solo un aviso de rutina) a partir
// de este % en un solo salto. Las alertas se muestran mientras tengan menos de esta cantidad de
// días — pasado eso, ya se asume que compras la vio y se apaga sola sin necesidad de "descartarla".
const ALERTA_SUBA_ABRUPTA_UMBRAL = 15;
const ALERTA_RECIENCIA_DIAS = 14;
function alertaPrecioVigente(alertaPrecio) {
  return !!alertaPrecio && diasDesdeFecha(alertaPrecio.fecha) <= ALERTA_RECIENCIA_DIAS;
}
function monthKey(iso) { return iso.slice(0, 7); }
function monthsAgoISO(n) {
  const d = new Date();
  d.setMonth(d.getMonth() - n);
  return new Intl.DateTimeFormat("en-CA", { timeZone: "America/Argentina/Buenos_Aires", year: "numeric", month: "2-digit", day: "2-digit" }).format(d);
}
function monthLabel(key) {
  const [y, m] = key.split("-");
  const names = ["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
  return `${names[parseInt(m, 10) - 1]} ${y}`;
}
function showToast(msg, type = "success") {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.className = "show " + type;
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => { t.className = ""; }, 3200);
}
function objToSortedEntries(obj, cmp) {
  return Object.entries(obj || {}).sort(cmp);
}

async function attemptLogin(password) {
  let pass = state.config.adminPassword;
  if (!pass) {
    pass = DEFAULT_ADMIN_PASS;
    await set(ref(db, "costeo/config/adminPassword"), pass);
  }
  if (password === pass) {
    state.loggedIn = true;
    return true;
  }
  return false;
}

window.handleLoginSubmit = async function() {
  const input = document.getElementById("login-pass");
  const err = document.getElementById("login-err");
  const btn = document.getElementById("login-btn");
  btn.disabled = true; btn.textContent = "Ingresando...";
  try {
    const ok = await attemptLogin(input.value);
    if (ok) {
      err.style.display = "none";
      render();
    } else {
      err.style.display = "block";
      btn.disabled = false; btn.textContent = "Ingresar";
    }
  } catch (e) {
    console.error(e);
    err.textContent = "Error de conexión. Verificá tu internet.";
    err.style.display = "block";

// ── Navigation ───────────────────────────────────────────
// Cambiar de pestaña sí debe volver al tope: se avisa a render() para que no restaure la posición
// anterior y no pelee con este scroll.
let _resetScrollEnProximoRender = false;
window.navigate = function(view) {
  state.view = view;
  state.formOpen = false;
  state.mobileNavOpen = false;
  _resetScrollEnProximoRender = true;
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
};

// Los formularios de edición se renderizan arriba de todo en su vista. Si el usuario estaba
// scrolleado (ej. mirando el insumo #40 de una lista larga) y toca "Editar", el formulario aparece
// fuera de pantalla y da la sensación de que el botón no hizo nada. Esto lo trae a la vista.
function enfocarFormularioAbierto(inputId) {
  setTimeout(() => {
    const el = document.getElementById(inputId);
    if (!el) return;
    // Defensivo: si el entorno no implementa scrollIntoView/focus, el formulario igual quedó
    // abierto y usable — no vale la pena romper por no poder desplazar la pantalla.
    try { el.scrollIntoView({ behavior: "smooth", block: "center" }); } catch {}
    try { el.focus({ preventScroll: true }); } catch {}
  }, 0);
}

window.toggleMobileNav = function() {
  state.mobileNavOpen = !state.mobileNavOpen;

// ── Root render ──────────────────────────────────────────
function render() {
  const root = document.getElementById("app");
  if (!state.loggedIn) {
    root.innerHTML = renderLogin();
    return;
  }
  // render() reconstruye TODO el DOM, y eso resetea el scroll al tope. Como prácticamente cualquier
  // interacción pasa por acá (abrir una fila, guardar un precio, tildar un filtro), sin esto la
  // página "salta" al inicio en cada click y se pierde de vista lo que se estaba mirando.
  // Se guarda la posición y se restaura al final; navigate() la lleva al tope a propósito después.
  const scrollPrevio = _resetScrollEnProximoRender ? 0 : window.scrollY;
  _resetScrollEnProximoRender = false;
  root.innerHTML = `
    <div class="header">
      <div class="logo">
        <span class="logo-mark">☕</span>
        <div class="logo-text-wrap">

        <button class="nav-logout" onclick="handleLogout()">Salir</button>

    </div>

      <button class="nav-mobile-btn" onclick="handleLogout()">🚪 Salir</button>
    </div>
    <div class="main" id="main-content"></div>`;

  const container = document.getElementById("main-content");
  switch (state.view) {
    case "nueva-factura": renderNuevaFacturaView(container); break;

// =============================================================
// NUEVA FACTURA
// =============================================================
// Ayuda visible por ítem para detectar un escaneo mal interpretado ANTES de guardar: muestra la
// cantidad/importe que la IA leyó (para poder notar de un vistazo si la cantidad está mal, ej. "10 kg"
// cuando en realidad era "1 kg"), avisa si cantidad × precio no coincide con el importe de la línea,
// avisa si el precio cambia fuerte respecto al último conocido, y aclara cuándo un precio guardado
// NO va a actualizar el costo de los productos porque la regla de referencia lo mantiene sin cambios
// (protege el margen: una cotización más barata de otro proveedor no baja la referencia sola).
function itemHintHtml(insumoId, precioUnitario, cantidad, unidad, importe, marca) {
  const partes = [];
  const cant = cantidad !== "" && cantidad != null ? Number(cantidad) : null;
  const imp = importe !== "" && importe != null ? Number(importe) : null;
  if (cant !== null && Number.isFinite(cant)) {
    partes.push(`<span class="text-muted">Cant. detectada por IA: ${cant}${unidad ? " " + escapeHtml(unidad) : ""}${imp !== null && Number.isFinite(imp) ? ` · Importe de línea: ${fmtMoney(imp)}` : ""}</span>`);
  }
  const precio = parseFloat(precioUnitario);
  if (cant !== null && Number.isFinite(cant) && cant > 0 && imp !== null && Number.isFinite(imp) && imp > 0 && precio > 0) {
    const importeEsperado = cant * precio;
    if (Math.abs(importeEsperado - imp) / imp > 0.03) {
      partes.push(`<div class="item-warn">⚠️ Cantidad × precio (${fmtMoney(importeEsperado)}) no coincide con el importe de la línea (${fmtMoney(imp)}) — revisá la cantidad, puede estar mal leída por el escaneo.</div>`);
    }
  }
  if (insumoId && state.insumos[insumoId] && precio > 0) {
    const ins = state.insumos[insumoId];
    const precioRef = precioEfectivoInsumo(insumoId);
    if (precioRef > 0) {
      const cambioPct = ((precio - precioRef) / precioRef) * 100;
      if (Math.abs(cambioPct) >= 40) {
        partes.push(`<div class="item-warn">⚠️ Este precio es ${fmtPct(Math.abs(cambioPct))} ${cambioPct > 0 ? "más alto" : "más bajo"} que el último conocido (${fmtMoney(precioRef)}) — revisá si está bien escaneado antes de guardar.</div>`);
      } else {
        partes.push(`<span class="text-muted">Último precio conocido: ${fmtMoney(precioRef)}</span>`);
      }
      // Cada combinación proveedor+marca es su propia línea de precio (ver comboKeyPrecio) — la
      // suba/baja de referencia se evalúa contra ESA línea, no contra el insumo en general.
      const key = comboKeyPrecio(state._facturaProveedorId, marca);
      const seActualizara = !ins.proveedorPreferido || ins.proveedorPreferido === key || !(ins.precios && ins.precios[ins.proveedorPreferido]) || precio > ins.precios[ins.proveedorPreferido].precio;
      if (!seActualizara) {
        partes.push(`<div class="item-note">💡 Es más barato que el precio con el que se costea — queda registrado y destacado como oportunidad de compra, pero el costo de los productos NO baja (siempre se costea con el precio más alto).</div>`);
      }
    }
  }
  return partes.join("");
}

  const insumoId = row.querySelector(".item-insumo-id").value;

function esInsumoConocidoDeProveedor(ins, proveedorId) {
  if (!proveedorId || !ins.precios) return false;
  // Las claves de precios ahora pueden ser "proveedorId" (sin marca) o "proveedorId::marca" —
  // buscar cualquier línea de ese proveedor, tenga marca cargada o no.
  return Object.entries(ins.precios).some(([key, p]) => p.proveedorId === proveedorId || key === proveedorId || key.startsWith(`${proveedorId}::`));
}

// Prioritizes insumos already priced by the currently-selected proveedor (state._facturaProveedorId)
// so repeat invoices from the same proveedor are faster to load — "recuerda" lo que ya le compramos.
function insumoSearchMatches(query) {
  const q = query.trim().toLowerCase();
  const proveedorId = state._facturaProveedorId || "";
  const sorted = objToSortedEntries(state.insumos, (a, b) => a[1].nombre.localeCompare(b[1].nombre));
  let pool = q ? sorted.filter(([, ins]) => ins.nombre.toLowerCase().includes(q)) : sorted;
  if (proveedorId) {
    const conocidos = pool.filter(([, ins]) => esInsumoConocidoDeProveedor(ins, proveedorId));
    const otros = pool.filter(([, ins]) => !esInsumoConocidoDeProveedor(ins, proveedorId));
    pool = [...conocidos, ...otros];
  }
  return pool.slice(0, 8);
}

window.handleInsumoSearchInput = function(input) {
  const picker = input.closest(".insumo-picker");
  const query = input.value;
  const trimmed = query.trim();
  const proveedorId = state._facturaProveedorId || "";
  const matches = insumoSearchMatches(query);
  const exact = matches.some(([, ins]) => ins.nombre.toLowerCase() === trimmed.toLowerCase());

  const items = matches.map(([id, ins]) => `
    <div class="insumo-picker-item" data-id="${escapeHtml(id)}" data-nombre="${escapeHtml(ins.nombre)}" onmousedown="selectInsumoPicker(this)">
      ${escapeHtml(ins.nombre)}${ins.unidad ? ` <span class="text-muted">(${escapeHtml(ins.unidad)})</span>` : ""}${esInsumoConocidoDeProveedor(ins, proveedorId) ? ` <span class="text-muted">· ya comprado a este proveedor</span>` : ""}
    </div>`).join("");
  const createOption = trimmed && !exact
    ? `<div class="insumo-picker-item insumo-picker-create" data-id="" data-nombre="${escapeHtml(trimmed)}" onmousedown="selectInsumoPicker(this)">➕ Crear insumo "${escapeHtml(trimmed)}"</div>`
    : "";

  const resultsEl = picker.querySelector(".insumo-picker-results");
  resultsEl.innerHTML = items + createOption;
  resultsEl.style.display = (items || createOption) ? "block" : "none";
  picker.querySelector(".item-insumo-id").value = "";
};

function matchInsumoId(nombre) {
  if (!nombre) return "";
  const n = nombre.trim().toLowerCase();
  if (!n) return "";
  const exact = Object.entries(state.insumos).find(([, ins]) => ins.nombre.trim().toLowerCase() === n);
  if (exact) return exact[0];
  const partial = Object.entries(state.insumos).find(([, ins]) => {
    const insN = ins.nombre.trim().toLowerCase();
    return insN.length > 2 && (n.includes(insN) || insN.includes(n));
  });
  return partial ? partial[0] : "";
}

function compressImageToDataUrl(file, maxDim, quality) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("No se pudo leer el archivo."));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("No se pudo procesar la imagen."));
      img.onload = () => {
        let { width, height } = img;
        if (width > maxDim || height > maxDim) {
          const scale = maxDim / Math.max(width, height);
          width = Math.round(width * scale);
          height = Math.round(height * scale);
        }
        const canvas = document.createElement("canvas");
        canvas.width = width; canvas.height = height;
        canvas.getContext("2d").drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

window.handleFacturaFotoChange = async function(e) {

    const dataUrl = await compressImageToDataUrl(file, 1000, 0.6);
    state._facturaFotoDataUrl = dataUrl;
    document.getElementById("factura-foto-preview").innerHTML = `<img src="${dataUrl}" class="photo-thumb">`;
    document.getElementById("scan-btn").disabled = false;
    // Auto-scan as soon as a photo is chosen (camera or gallery) — the manual button stays
    // enabled below in case the auto-scan fails and the user wants to retry.
    await window.escanearFactura();
  } catch (err) {
    console.error(err);
    showToast("⚠️ No se pudo procesar la foto.", "warn");
  }
};

  document.getElementById("f-proveedor-nuevo").style.display = sel.value === "__new__" ? "" : "none";
  const cuitInput = document.getElementById("f-cuit");
  const p = sel.value && sel.value !== "__new__" ? state.proveedores[sel.value] : null;
  cuitInput.value = p ? (p.cuit || "") : "";
  // Remembered so the item picker can prioritize this proveedor's previously-supplied insumos.
  state._facturaProveedorId = sel.value && sel.value !== "__new__" ? sel.value : "";
};

function normCuit(s) {
  return String(s || "").replace(/\D/g, "");
}

window.escanearFactura = async function() {
  if (!state._facturaFotoDataUrl) return;
  const btn = document.getElementById("scan-btn");
  btn.disabled = true; btn.textContent = "🤖 Escaneando...";
  try {
    const base64 = state._facturaFotoDataUrl.split(",")[1];
    const insumosConocidos = Object.entries(state.insumos).map(([id, ins]) => ({ id, nombre: ins.nombre }));
    const resp = await fetch("/.netlify/functions/extraer-factura", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ imageBase64: base64, mediaType: "image/jpeg", insumosConocidos })
    });

    const rawText = await resp.text();
    let data;
    try {
      data = JSON.parse(rawText);
    } catch {
      // Netlify itself returns an HTML/plain-text body on timeouts (504) or crashes (502),
      // not JSON. Surface that instead of a silent generic failure.
      const reason = resp.status === 504
        ? "El escaneo tardó demasiado y se agotó el tiempo de espera del servidor."
        : `Respuesta inesperada del servidor (HTTP ${resp.status}).`;
      throw new Error(reason);
    }
    if (!resp.ok) throw new Error(data.error || `Error al escanear la factura (HTTP ${resp.status}).`);

    aplicarDatosEscaneados(data);
    showToast("✅ Factura escaneada. Revisá los datos antes de guardar.", "success");
  } catch (err) {
    console.error("Error al escanear factura:", err);
    const msg = err && err.message ? err.message : "Error desconocido.";
    showToast(`⚠️ No se pudo escanear: ${msg}`, "warn");
  } finally {
    btn.disabled = false; btn.textContent = "🤖 Escanear con IA";
  }
};

// Finds an existing proveedor matching AI-scanned invoice data. CUIT is the most reliable
// signal (unique fiscal id); razón social is what's actually printed on the invoice, which is
// generally more reliable than nombre comercial (the friendly/brand name we display in lists).
function matchProveedor(data) {
  const cuit = normCuit(data.cuit);
  if (cuit) {
    const byCuit = Object.entries(state.proveedores).find(([, p]) => normCuit(p.cuit) && normCuit(p.cuit) === cuit);
    if (byCuit) return byCuit;
  }
  const nombreProveedor = String(data.proveedor || "").trim().toLowerCase();
  if (!nombreProveedor) return null;
  const byRazonSocial = Object.entries(state.proveedores).find(([, p]) => p.contacto && p.contacto.trim().toLowerCase() === nombreProveedor);
  if (byRazonSocial) return byRazonSocial;
  const byNombreComercial = Object.entries(state.proveedores).find(([, p]) => p.nombre.trim().toLowerCase() === nombreProveedor);
  if (byNombreComercial) return byNombreComercial;
  return null;
}

// Rubros de proveedor disponibles (etiqueta libre por proveedor) y las palabras clave que
// permiten adivinar a qué rubro corresponde un ítem comprado, para inferir el proveedor de un
// recibo sin razón social ni CUIT legibles (algunos proveedores chicos —verdulero, carnicero—
// solo dan un recibo de pago, no una factura con esos datos).
const RUBROS_PROVEEDOR = ["Verdulería", "Carnicería/Fiambrería", "Panificados/Harinas", "Lácteos", "Bebidas", "Almacén/Varios", "Envases/Descartables", "Limpieza", "Otro"];
const RUBRO_KEYWORDS = {
  "Verdulería": ["manzana", "banana", "platano", "pera", "naranja", "limon", "mandarina", "frutilla", "fruta", "verdura", "lechuga", "tomate", "papa", "cebolla", "zanahoria", "zapallo", "verduleria", "citricos", "kiwi", "uva", "durazno", "banana", "ananá", "ananas", "palta", "choclo", "acelga", "espinaca", "zapallito", "berenjena", "morron"],
  "Carnicería/Fiambrería": ["carne", "vacio", "asado", "pollo", "milanesa", "jamon", "salame", "salamin", "fiambre", "chorizo", "matambre", "bondiola", "peceto", "nalga", "cuadril", "bife", "pechuga", "carnicero", "carniceria"],
  "Panificados/Harinas": ["harina", "levadura", "premezcla", "polvo de hornear", "almidon", "fecula", "semola", "afrecho", "salvado"],
  "Lácteos": ["leche", "queso", "manteca", "crema de leche", "yogur", "dulce de leche", "ricota", "lacteo"],
  "Bebidas": ["gaseosa", "agua mineral", "cerveza", "vino", "jugo", "soda", "coca cola", "sprite", "fanta", "bebida"],
  "Almacén/Varios": ["azucar", "sal", "aceite", "vinagre", "conserva", "enlatado", "especias", "condimento", "cacao", "chocolate", "te en hebras", "cafe", "yerba", "almacen"],
  "Envases/Descartables": ["caja", "bolsa", "film", "papel manteca", "envase", "descartable", "vaso", "bandeja", "etiqueta"],
  "Limpieza": ["lavandina", "detergente", "jabon", "limpiador", "desinfectante", "alcohol en gel", "papel higienico", "rollo de cocina"]
};
function inferirRubroItems(nombres) {
  const conteo = {};
  for (const nombreRaw of nombres || []) {
    const n = stripAccentsCosteo(nombreRaw || "").toLowerCase();
    if (!n) continue;
    for (const [rubro, kws] of Object.entries(RUBRO_KEYWORDS)) {
      if (kws.some(kw => n.includes(stripAccentsCosteo(kw).toLowerCase()))) {
        conteo[rubro] = (conteo[rubro] || 0) + 1;
        break; // cada ítem cuenta para el primer rubro que le pega, no se reparte entre varios
      }
    }
  }
  const entries = Object.entries(conteo).sort((a, b) => b[1] - a[1]);
  return entries.length ? entries[0][0] : null;
}
// Cuando un recibo no trae proveedor ni CUIT legibles, intenta adivinar el proveedor por el rubro
// de los productos comprados: si hay exactamente un proveedor cargado con ese rubro, lo
// preselecciona (queda igual de editable, es solo una sugerencia); si hay más de uno o ninguno,
// deja un aviso para que se elija/cargue a mano.
function sugerirProveedorPorRubro(nombresItems) {
  const rubro = inferirRubroItems(nombresItems);
  if (!rubro) return;
  const candidatos = Object.entries(state.proveedores).filter(([, p]) => p.rubro === rubro);
  if (candidatos.length === 1) {
    const sel = document.getElementById("f-proveedor");
    sel.value = candidatos[0][0];
    window.onFacturaProveedorChange(sel);
    showToast(`🧾 Recibo sin proveedor identificado — se asignó a "${candidatos[0][1].nombre}" según los productos (rubro: ${rubro}). Revisalo antes de guardar.`, "warn");
  } else if (candidatos.length > 1) {
    showToast(`🧾 Recibo sin proveedor identificado. Por los productos parece ser del rubro "${rubro}" — elegí cuál proveedor es de la lista.`, "warn");
  } else {
    showToast(`🧾 Recibo sin proveedor identificado. Por los productos parece ser del rubro "${rubro}", pero no tenés ningún proveedor cargado con ese rubro — elegilo o cargalo manualmente.`, "warn");
  }
}

function aplicarDatosEscaneados(data) {
  if (data.proveedor || data.cuit) {
    const sel = document.getElementById("f-proveedor");
    const match = matchProveedor(data);
    if (match) {
      sel.value = match[0];
      window.onFacturaProveedorChange(sel);
    } else if (data.proveedor) {
      sel.value = "__new__";
      document.getElementById("f-proveedor-nuevo").style.display = "";
      document.getElementById("f-proveedor-nombre-nuevo").value = data.proveedor;
    }
  } else if (Array.isArray(data.items) && data.items.length) {
    // Recibo de pago sin razón social ni CUIT legibles (algunos proveedores chicos no entregan
    // factura): tratamos de inferir el proveedor por el tipo de productos comprados (ej. frutas
    // y verduras -> el verdulero), buscando entre los proveedores que ya tienen ese rubro cargado.
    sugerirProveedorPorRubro(data.items.map(it => it.nombre));
  }
  if (data.cuit) document.getElementById("f-cuit").value = data.cuit;
  if (data.fecha && /^\d{4}-\d{2}-\d{2}$/.test(data.fecha)) document.getElementById("f-fecha").value = data.fecha;
  if (data.numeroFactura) document.getElementById("f-numero").value = data.numeroFactura;
  if (data.montoTotal != null && !Number.isNaN(Number(data.montoTotal))) document.getElementById("f-monto").value = data.montoTotal;
  if (data.iva != null && !Number.isNaN(Number(data.iva))) document.getElementById("f-iva-monto").value = data.iva;

  if (Array.isArray(data.items) && data.items.length) {
    const cont = document.getElementById("items-container");
    cont.innerHTML = data.items.map(it => {
      // Trust the AI's insumoId only if it's a real, current insumo — otherwise fall back
      // to the client-side name-matching heuristic as a safety net.
      const aiMatchId = it.insumoId && state.insumos[it.insumoId] ? it.insumoId : "";
      const matchedId = aiMatchId || matchInsumoId(it.nombre);
      return itemRowHtml({
        insumoId: matchedId || "",
        nombre: it.nombre || "",
        precioUnitario: it.precioUnitario ?? "",
        cantidad: it.cantidad ?? "",
        unidad: it.unidad ?? "",
        importe: it.importe ?? "",
        marca: it.marca ?? ""
      });
    }).join("");
  }
}

// Un insumo puede comprarse a más de un proveedor, y un mismo proveedor puede tener más de una
// marca (ej. Levadura: Calsa y Casa Naoum, y cada uno vende tanto Leudex como Duquesa a precios
// distintos). Cada combinación proveedor+marca es su propia "línea de precio" dentro de
// insumo.precios — comboKeyPrecio() arma esa clave. Sin marca, la clave es igual a la de antes
// (solo el proveedor) para no romper datos ya cargados.
function normMarca(s) {
  return String(s || "").trim();
}
// Devuelve la clave de la línea proveedor+marca con el precio más alto — la que se usa siempre
// para costear. Ante empate, la primera por orden de clave (estable entre renders).
function lineaPrecioMaxima(precios) {
  let mejorKey = null, mejorPrecio = -Infinity;
  for (const [k, p] of Object.entries(precios || {})) {
    const v = Number(p?.precio) || 0;
    if (v > mejorPrecio) { mejorPrecio = v; mejorKey = k; }
  }
  return mejorKey;
}
function comboKeyPrecio(proveedorId, marca) {
  const base = proveedorId || "_manual";
  const m = normMarca(marca);
  return m ? `${base}::${stripAccentsCosteo(m).toLowerCase()}` : base;
}

// Updates (or creates) an insumo's price for a specific proveedor+marca, keeping precioActual en
// sync según la regla de precios del negocio: si cambia de línea (otro proveedor y/o marca) y el
// precio nuevo es MAYOR al que se venía usando, esa pasa a ser el valor de referencia (protege el
// margen, refleja la suba enseguida). Si es MENOR, se mantiene la línea que ya se estaba usando —
// una cotización más barata de otra marca/proveedor no baja la referencia sola, hay que elegirla a
// mano ("Usar este"). Para la MISMA línea (mismo proveedor+marca) que ya era la preferida, siempre
// se toma su último precio.
// Registra una compra/cotización de un insumo. Escribe SIEMPRE el historial además de la línea
// proveedor+marca: el costeo se calcula sobre el historial (ver precioCosteoInsumo), así que si
// un llamador se olvidara de registrarla, esa compra no contaría para el costo.
async function actualizarPrecioInsumo(insumoId, { proveedorId, proveedorNombre, precio, marca, fecha, conIva, facturaId }) {
  const insumo = state.insumos[insumoId] || {};
  const key = comboKeyPrecio(proveedorId, marca);
  const precios = { ...(insumo.precios || {}) };
  // Cada línea proveedor+marca conserva como `precio` el MÁS ALTO que se le registró (es la base
  // de costeo) y guarda aparte la última compra real (`precioUltimo`). Así, si la última compra
  // salió más barata, queda registrada y visible para decidir dónde comprar, pero no abarata el
  // costeo — que es justamente la regla del negocio.
  precios[key] = {
    precio,                 // último precio conocido de esta línea proveedor+marca
    fechaUltimo: todayISO(),
    actualizadoTs: Date.now(),
    proveedorId: proveedorId || "",
    proveedorNombre: proveedorNombre || "",
    marca: normMarca(marca)
  };

  // precioActual queda como espejo persistido de la regla de costeo (ver precioCosteoInsumo):
  // el más alto entre las compras de los últimos 2 meses. El llamador todavía no escribió esta
  // compra en el historial, así que se la suma acá para que entre en el cálculo.
  const insumoConCompraNueva = {
    ...insumo,
    precios,
    historial: { ...(insumo.historial || {}), __nuevaCompra: { precio, fecha: todayISO() } }
  };
  const precioActual = precioCosteoInsumo(insumoConCompraNueva);
  // ⭐ informativo: qué línea está fijando hoy el costo (la más cara entre las recientes).
  const proveedorPreferido = (precios[key]?.precio === precioActual)
    ? key
    : (Object.keys(precios).find(k => precios[k]?.precio === precioActual) || lineaPrecioMaxima(precios) || key);

  const updates = { precios, proveedorPreferido, precioActual, actualizadoTs: Date.now() };
  // El valor de referencia efectivamente subió: deja una alerta con todos los datos para que
  // compras la vea, con un umbral aparte para subas "abruptas" que necesitan más visibilidad.
  const precioActualAnterior = insumo.precioActual ?? null;
  if (precioActualAnterior !== null && precioActual > precioActualAnterior + 0.005) {
    const pct = precioActualAnterior > 0 ? ((precioActual - precioActualAnterior) / precioActualAnterior) * 100 : null;
    updates.alertaPrecio = {
      precioAnterior: precioActualAnterior,
      precioNuevo: precioActual,
      pct,
      proveedorNombre: precios[proveedorPreferido]?.proveedorNombre || proveedorNombre || "",
      marca: precios[proveedorPreferido]?.marca || normMarca(marca),
      fecha: todayISO(),
      abrupta: pct !== null && pct >= ALERTA_SUBA_ABRUPTA_UMBRAL
    };
  }
  // La compra que se acaba de registrar salió MÁS BARATA que el precio con el que se costea:
  // se destaca como oportunidad de compra, pero deliberadamente no toca precioActual.
  if (precio < precioActual - 0.005) {
    const pctBaja = precioActual > 0 ? ((precioActual - precio) / precioActual) * 100 : null;
    updates.alertaBaja = {
      precioReferencia: precioActual,
      precioNuevo: precio,
      pct: pctBaja,
      proveedorNombre: proveedorNombre || "",
      marca: normMarca(marca),
      fecha: todayISO()
    };
  }
  await update(ref(db, `costeo/insumos/${insumoId}`), updates);
  const histEntry = {
    precio, fecha: fecha || todayISO(),
    proveedorId: proveedorId || "", proveedorNombre: proveedorNombre || "",
    marca: normMarca(marca), facturaId: facturaId || "",
    ...(conIva === undefined ? {} : { conIva })
  };
  const histRef = await push(ref(db, `costeo/insumos/${insumoId}/historial`), histEntry);
  state.insumos[insumoId] = {
    ...insumo, ...updates,
    historial: { ...(insumo.historial || {}), [histRef.key]: histEntry }
  };
  // referenciaActualizada = false avisa al llamador (ej. guardarFactura) que este precio quedó
  // guardado en el historial del proveedor pero NO cambió el costo de referencia — para que no
  // sea una sorpresa silenciosa cuando en realidad se esperaba una suba (ej. por un escaneo mal leído).
  const referenciaActualizada = precioActualAnterior === null || Math.abs(precioActual - precioActualAnterior) > 0.005;
  return { referenciaActualizada, precioActualAnterior, precioActualNuevo: precioActual };
}

// Como el costeo toma SIEMPRE el precio más alto, no hay forma (ni sentido) de elegir a mano una
// línea más barata como referencia. Lo que sí hace falta es poder quitar una línea cargada por
// error: si no, un precio mal tipeado quedaría inflando el costo para siempre.
window.quitarPrecioInsumo = async function(insumoId, lineaKey) {
  const insumo = state.insumos[insumoId];
  if (!insumo || !insumo.precios || !insumo.precios[lineaKey]) return;
  const linea = insumo.precios[lineaKey];
  const etiqueta = `${linea.proveedorNombre || "Carga manual"}${linea.marca ? " — " + linea.marca : ""}`;
  if (!confirm(`¿Quitar la línea de precio "${etiqueta}" (${fmtMoney(linea.precio)}) de "${insumo.nombre}"?\n\nEl historial de compras no se toca. Si era la línea más cara, el costo pasa a calcularse con la siguiente más alta.`)) return;
  const precios = { ...insumo.precios };
  delete precios[lineaKey];
  const proveedorPreferido = lineaPrecioMaxima(precios);
  const precioActual = proveedorPreferido ? (precios[proveedorPreferido]?.precio ?? 0) : 0;
  await update(ref(db, `costeo/insumos/${insumoId}`), { precios, proveedorPreferido: proveedorPreferido || "", precioActual, actualizadoTs: Date.now() });
  state.insumos[insumoId] = { ...insumo, precios, proveedorPreferido: proveedorPreferido || "", precioActual };
  showToast("🗑️ Línea de precio quitada.", "success");
  render();
};

window.guardarFactura = async function() {
  const proveedorSel = document.getElementById("f-proveedor").value;
  const proveedorNombreNuevo = document.getElementById("f-proveedor-nombre-nuevo").value.trim();
  const cuit = document.getElementById("f-cuit").value.trim();
  const fecha = document.getElementById("f-fecha").value;
  const numero = document.getElementById("f-numero").value.trim();
  const monto = parseFloat(document.getElementById("f-monto").value);
  const pagado = document.getElementById("f-estado-toggle").classList.contains("on");
  const preciosConIva = document.getElementById("f-iva-toggle").classList.contains("on");
  const ivaVal = parseFloat(document.getElementById("f-iva-monto").value);
  const iva = Number.isFinite(ivaVal) ? ivaVal : 0;
  const cargosAdicionalesVal = parseFloat(document.getElementById("f-cargos").value);
  const cargosAdicionales = Number.isFinite(cargosAdicionalesVal) ? cargosAdicionalesVal : 0;

  if (!proveedorSel) { showToast("⚠️ Elegí o creá un proveedor.", "warn"); return; }
  if (proveedorSel === "__new__" && !proveedorNombreNuevo) { showToast("⚠️ Escribí el nombre del nuevo proveedor.", "warn"); return; }
  if (!fecha) { showToast("⚠️ Elegí la fecha.", "warn"); return; }
  if (!(monto > 0)) { showToast("⚠️ Ingresá el monto total.", "warn"); return; }

  const saveBtn = document.getElementById("guardar-factura-btn");
  saveBtn.disabled = true; saveBtn.textContent = "Guardando...";

  try {
    let proveedorId = proveedorSel;
    let proveedorNombre;
    if (proveedorSel === "__new__") {
      const newProvRef = push(ref(db, "costeo/proveedores"));
      proveedorId = newProvRef.key;
      proveedorNombre = proveedorNombreNuevo;
      await set(newProvRef, { nombre: proveedorNombre, cuit, creadoTs: Date.now() });
    } else {
      proveedorNombre = state.proveedores[proveedorId]?.nombre || "";
    }

    // El id de la factura se reserva antes del loop para que cada compra quede enlazada a ella
    // en el historial del insumo (push() genera la clave sin escribir todavía).
    const facturaRef = push(ref(db, "costeo/facturas"));
    const facturaId = facturaRef.key;

    const itemRows = Array.from(document.querySelectorAll("#items-container .item-row"));
    const items = [];
    const sinActualizarReferencia = [];
    for (const row of itemRows) {
      const insumoIdSel = row.querySelector(".item-insumo-id").value;
      const nombreTyped = row.querySelector(".item-insumo-search").value.trim();
      const precioUnitario = parseFloat(row.querySelector(".item-precio").value);
      const marca = row.querySelector(".item-marca")?.value.trim() || "";
      if (!insumoIdSel && !nombreTyped) continue;
      if (!(precioUnitario > 0)) continue;

      let insumoId = insumoIdSel;
      let nombre;
      if (!insumoId) {
        const newInsRef = push(ref(db, "costeo/insumos"));
        insumoId = newInsRef.key;
        nombre = nombreTyped;
        await set(newInsRef, { nombre, unidad: "", creadoTs: Date.now() });
        state.insumos[insumoId] = { nombre, unidad: "" };
      } else {
        nombre = state.insumos[insumoId]?.nombre || nombreTyped;
      }
      const resultadoPrecio = await actualizarPrecioInsumo(insumoId, { proveedorId, proveedorNombre, precio: precioUnitario, marca, fecha, conIva: preciosConIva, facturaId });
      if (resultadoPrecio && !resultadoPrecio.referenciaActualizada) {
        sinActualizarReferencia.push({ nombre, marca, precioUnitario, precioReferencia: resultadoPrecio.precioActualAnterior });
      }
      items.push({ insumoId, nombre, precioUnitario, marca });
    }

    await set(facturaRef, {
      proveedorId, proveedorNombre, cuit, fecha, numeroFactura: numero,
      montoTotal: monto, iva, cargosAdicionales, preciosConIva,
      estado: pagado ? "pagado" : "no_pagado",
      foto: state._facturaFotoDataUrl || "", items, creadoTs: Date.now()
    });

    if (sinActualizarReferencia.length) {
      // No dejar esto como una sorpresa silenciosa (fue justo el problema reportado): un precio
      // guardado que no sube el costo de referencia amerita un aviso que el usuario tenga que
      // cerrar, no un toast de 3 segundos que se puede perder.
      const detalle = sinActualizarReferencia.map(x => `• ${x.nombre}${x.marca ? ` (${x.marca})` : ""}: se guardó a ${fmtMoney(x.precioUnitario)}, pero el costo de referencia sigue en ${fmtMoney(x.precioReferencia)} (un precio menor no reemplaza solo al que ya se estaba usando).`).join("\n");
      alert(`ℹ️ Factura guardada. ${sinActualizarReferencia.length} precio(s) NO actualizaron el costo de los productos:\n\n${detalle}\n\nSi te parece que en realidad debería haber subido (por ejemplo, un error de escaneo en la cantidad), corregilo desde Insumos.`);
    }
    showToast("✅ Factura guardada correctamente.", "success");
    state._facturaFotoDataUrl = null;
    navigate("facturas");
  } catch (err) {
    console.error(err);
    showToast("❌ Error al guardar la factura. Reintentá.", "danger");
    saveBtn.disabled = false; saveBtn.textContent = "💾 Guardar factura";
  }
};

window.setFacturasFiltro = function(f) {
  state.facturasFiltro = f;
  render();

function facturasDelMes(mes) {
  return objToSortedEntries(state.facturas, (a, b) => (a[1].fecha || "").localeCompare(b[1].fecha || ""))

function renderIvaView(container) {
  state.formOpen = true;

    <tr>

      </div>
      <div class="stat-row">
        <div class="stat-card"><div class="stat-label">Total comprado</div><div class="stat-value">${fmtMoney(totalCompras)}</div></div>
        <div class="stat-card"><div class="stat-label">IVA crédito fiscal (compras)</div><div class="stat-value">${fmtMoney(ivaCredito)}</div></div>

      </div>

      <div class="form-row" style="margin-top:6px;align-items:flex-end">
        <div class="form-group" style="max-width:260px">
          <label class="form-label">IVA débito fiscal del mes (ventas, opcional)</label>

      </div>

      ${facturasMes.length === 0 ? `<div class="empty-state">No hay facturas registradas en ${monthLabel(mes)}.</div>` : `
        <div class="data-table-wrap" style="margin-top:10px">
          <table class="data-table">
            <thead><tr><th>Fecha</th><th>Proveedor</th><th>N° Factura</th><th>Monto</th><th>IVA</th><th>Otros cargos</th></tr></thead>

// Guarda el costo calculado de una base/preparación elaborada como su precio "_manual" — una vez
// que un insumo tiene receta propia, esa receta manda sobre cualquier proveedor preferido anterior
// (mismo criterio que un producto: si hay receta, el costo sale de ahí). Deja constancia en historial.
async function guardarPrecioRecetaInsumo(insumoId, costo) {
  const insumo = state.insumos[insumoId] || {};
  const precios = { ...(insumo.precios || {}), _manual: { precio: costo, actualizadoTs: Date.now(), proveedorNombre: "Receta propia" } };
  await update(ref(db, `costeo/insumos/${insumoId}`), { precios, proveedorPreferido: "_manual", precioActual: costo, actualizadoTs: Date.now() });
  const hist = objToSortedEntries(insumo.historial, (a, b) => a[1].fecha.localeCompare(b[1].fecha));
  const last = hist.length ? hist[hist.length - 1][1] : null;
  const today = todayISO();
  if (!last || last.fecha !== today || Math.abs((last.precio || 0) - costo) >= 0.005) {
    await push(ref(db, `costeo/insumos/${insumoId}/historial`), { precio: costo, fecha: today, proveedorId: "", proveedorNombre: "Receta propia", facturaId: "" });
  }
  state.insumos[insumoId] = { ...state.insumos[insumoId], precios, proveedorPreferido: "_manual", precioActual: costo };
}
window.guardarInsumo = async function() {
  const nombre = document.getElementById("ins-nombre").value.trim();
  const unidad = document.getElementById("ins-unidad").value.trim();
  const precio = parseFloat(document.getElementById("ins-precio").value);
  const marca = document.getElementById("ins-marca").value.trim();
  if (!nombre) { showToast("⚠️ Ingresá el nombre del insumo.", "warn"); return; }

  const recetaRows = Array.from(document.querySelectorAll("#insumo-recipe-container .insumo-recipe-row"));
  const receta = {};
  for (const row of recetaRows) {
    const subId = row.querySelector(".insumo-recipe-insumo").value;
    const cantidad = parseFloat(row.querySelector(".insumo-recipe-cantidad").value);
    if (subId && cantidad > 0) receta[subId] = cantidad;
  }
  const tieneReceta = Object.keys(receta).length > 0;

  const id = state.editingInsumoId;
  try {
    if (id === "new") {
      const newRef = push(ref(db, "costeo/insumos"));
      await set(newRef, { nombre, unidad, receta, creadoTs: Date.now() });
      state.insumos[newRef.key] = { nombre, unidad, receta };
      if (tieneReceta) {
        const costo = Object.entries(receta).reduce((sum, [subId, cant]) => sum + precioEfectivoInsumo(subId) * cant, 0);
        await guardarPrecioRecetaInsumo(newRef.key, costo);
      } else if (precio > 0) {
        await actualizarPrecioInsumo(newRef.key, { proveedorId: "", proveedorNombre: "Carga manual", precio, marca, conIva: true });
      }
    } else {
      await update(ref(db, `costeo/insumos/${id}`), { nombre, unidad, receta });
      state.insumos[id] = { ...state.insumos[id], nombre, unidad, receta };
      if (tieneReceta) {
        const costo = Object.entries(receta).reduce((sum, [subId, cant]) => sum + precioEfectivoInsumo(subId) * cant, 0);
        await guardarPrecioRecetaInsumo(id, costo);
      }
    }
    showToast("✅ Insumo guardado.", "success");
    state.editingInsumoId = null;
    state.formOpen = false;
    render();
  } catch (err) {
    console.error(err);
    showToast("❌ Error al guardar el insumo.", "danger");
  }
};

  await remove(ref(db, `costeo/insumos/${id}`));

// Reclasifica un insumo como producto (ej. algo que en realidad es de reventa y quedó cargado

function stripAccentsCosteo(s) {
  return String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "");
}
function normalizeInsumoNombre(s) {
  let n = stripAccentsCosteo(s).toLowerCase().trim();
  n = n.replace(/\s*\(\d+\)\s*$/, ""); // strip a trailing numeric disambiguator like " (1)"
  n = n.replace(/\s+/g, " ");
  return n;
}
function levenshtein(a, b) {
  const m = a.length, n = b.length;
  if (!m) return n;
  if (!n) return m;
  const dp = new Array(n + 1);
  for (let j = 0; j <= n; j++) dp[j] = j;
  for (let i = 1; i <= m; i++) {
    let prev = dp[0];
    dp[0] = i;
    for (let j = 1; j <= n; j++) {
      const tmp = dp[j];
      dp[j] = a[i - 1] === b[j - 1] ? prev : 1 + Math.min(prev, dp[j], dp[j - 1]);
      prev = tmp;
    }
  }
  return dp[n];
}

// Conservative similarity check for the duplicate-suggestion tool: only flags pairs that are
// near-identical after normalizing (same product, different casing/spacing/typo) — NOT products
// that merely share a word (e.g. "Dulce de membrillo — Frucor" vs "— Prindal" are legitimately
// different insumos with different proveedores/precios, and must never be auto-flagged).
function buscarInsumosDuplicados() {
  const entries = objToSortedEntries(state.insumos, (a, b) => a[1].nombre.localeCompare(b[1].nombre));
  const pares = [];
  for (let i = 0; i < entries.length; i++) {
    for (let j = i + 1; j < entries.length; j++) {
      const [idA, insA] = entries[i], [idB, insB] = entries[j];
      const nA = normalizeInsumoNombre(insA.nombre), nB = normalizeInsumoNombre(insB.nombre);
      if (!nA || !nB) continue;
      const dist = levenshtein(nA, nB);
      const cerca = dist === 0 || (dist <= 2 && Math.min(nA.length, nB.length) > 4);
      if (cerca) pares.push({ idA, idB, insA, insB, dist });
    }
  }
  return pares.sort((a, b) => a.dist - b.dist);
}

window.toggleBuscarDuplicados = function() {
  state.mostrarDuplicados = !state.mostrarDuplicados;
  render();
};

window.fusionarDesdeSugerencia = function(idA, idB) {

// Detecta insumos que probablemente sean EL MISMO producto cargado varias veces con la marca ya
// incluida en el nombre (ej. "Levadura Leudex" y "Levadura Duquesa" en vez de un único insumo
// "Levadura" con esas dos marcas como líneas de precio separadas) — el problema real detrás del
// pedido "1 producto, diferentes proveedores y/o marcas". A diferencia de buscarInsumosDuplicados
// (nombres casi IDÉNTICOS, típico de errores de tipeo), acá se agrupa por la primera palabra del
// nombre, que en la inmensa mayoría del catálogo es el producto genérico y el resto es la marca.
// Palabras que describen un TIPO/variedad de producto, no una marca — si la palabra que sigue al
// nombre base es una de estas, NO se propone como variante de marca, porque en general se trata
// de productos genuinamente distintos (ej. "Leche entera" y "Leche descremada" no son la misma
// leche con otra marca; "Queso crema" y "Queso rallado" tampoco). La lista no es exhaustiva —
// prioriza evitar sugerencias erróneas (falsos positivos) por sobre encontrar todas las variantes
// reales posibles; siempre queda a criterio de quien revisa antes de fusionar.
const PALABRAS_TIPO_NO_MARCA = new Set([
  "entera", "enteras", "entero", "enteros", "descremada", "descremadas", "descremado", "descremados",
  "semidescremada", "semidescremadas", "deslactosada", "deslactosadas", "light", "diet", "natural", "naturales",
  "tradicional", "tradicionales", "especial", "especiales",
  "crema", "rallado", "rallada", "ralladas", "rallados", "untable", "untables", "sardo", "duro", "dura", "blando", "blanda",
  "molido", "molida", "molidos", "molidas", "picado", "picada", "picados", "picadas",
  "cortado", "cortada", "cortados", "cortadas", "fileteado", "fileteada", "trozado", "trozada",
  "polvo", "hebras", "grano", "granos", "rodajas", "cubos", "tiras",
  "fresca", "fresco", "frescas", "frescos", "seca", "seco", "secas", "secos",
  "congelada", "congelado", "congeladas", "congelados", "enlatada", "enlatado", "enlatadas", "enlatados",
  "chico", "chica", "chicos", "chicas", "grande", "grandes", "mediano", "mediana", "medianos", "medianas",
  "familiar", "individual", "gigante", "mini",
  "salado", "salada", "salados", "saladas", "dulce", "dulces", "picante", "picantes",
  "saborizado", "saborizada", "saborizados", "saborizadas", "integral", "integrales",
  "blanco", "blanca", "blancos", "blancas", "negro", "negra", "negros", "negras",
  "de", "del", "la", "el", "los", "las", "con", "sin", "para", "y"
]);
// La marca casi siempre es la ÚLTIMA palabra del nombre (no la segunda): "Baño de chocolate
// semiamargo Alpino" y "Baño de chocolate semiamargo Lodiser" comparten TODO menos la última
// palabra — la base real es "Baño de chocolate semiamargo" (varias palabras), no solo "Baño".
// Uses esto para agrupar por "todas las palabras menos la última" en vez de solo la primera, así
// nombres de varias palabras (con conectores como "de") también se agrupan bien. La última palabra
// se descarta como candidata a marca si es un descriptor de tipo/variedad conocido (ver
// PALABRAS_TIPO_NO_MARCA) — eso es justamente lo que mantiene separados a "Baño de chocolate
// semiamargo" y "Baño de chocolate blanco": son productos distintos, no la misma cosa con otra
// marca, aunque compartan casi todo el nombre.
function buscarVariantesMarca() {
  const entries = objToSortedEntries(state.insumos, (a, b) => a[1].nombre.localeCompare(b[1].nombre))
    .filter(([, ins]) => !(ins.receta && Object.keys(ins.receta).length)); // las bases no tienen "marca"
  const grupos = {};
  for (const [id, ins] of entries) {
    const palabras = ins.nombre.trim().split(/\s+/).filter(Boolean);
    if (palabras.length < 2) continue; // sin una segunda palabra no hay marca candidata
    const ultimaPalabra = palabras[palabras.length - 1];
    const ultimaPalabraNorm = stripAccentsCosteo(ultimaPalabra).toLowerCase();
    if (PALABRAS_TIPO_NO_MARCA.has(ultimaPalabraNorm) || /^\d+$/.test(ultimaPalabraNorm)) continue;
    const palabrasBase = palabras.slice(0, -1);
    const baseKey = normalizeInsumoNombre(palabrasBase.join(" "));
    if (baseKey.length < 4) continue; // evita agrupar por bases muy cortas/genéricas (ej. "de")
    (grupos[baseKey] ||= []).push({ id, ins, nombreBaseSugerido: palabrasBase.join(" "), marcaSugerida: ultimaPalabra });
  }
  return Object.values(grupos).filter(items => items.length >= 2);
}

window.toggleBuscarVariantesMarca = function() {
  state.mostrarVariantesMarca = !state.mostrarVariantesMarca;
  render();
};

window.fusionarGrupoDesdeSugerencia = function(idsCsv) {
  const ids = idsCsv.split(",");
  // Busca el grupo que CONTIENE a estos ids (no necesariamente coincide con exactitud: el estado
  // pudo cambiar entre el render de la sugerencia y el click) y se queda solo con esos miembros.
  const grupoCompleto = buscarVariantesMarca().find(items => ids.every(id => items.some(it => it.id === id)));
  const grupo = grupoCompleto ? grupoCompleto.filter(it => ids.includes(it.id)) : null;
  state.insumosMergeMode = true;
  state.insumosMergeSeleccion = {};
  state.insumosMergeMarcas = {};
  ids.forEach(id => { state.insumosMergeSeleccion[id] = true; });
  if (grupo) {
    state.insumosMergeSurvivor = grupo[0].id;
    state.insumosMergeNombreFinal = grupo[0].nombreBaseSugerido;
    // La marca sugerida se asigna a TODOS los miembros del grupo, incluido el que queda como
    // sobreviviente — sus propias líneas de precio también representaban una marca puntual
    // (la que tenía en su nombre original) y no deben quedar sin etiquetar tras la fusión.
    grupo.forEach(it => { state.insumosMergeMarcas[it.id] = it.marcaSugerida; });
  } else {
    state.insumosMergeSurvivor = ids[0];
    state.insumosMergeNombreFinal = "";
  }
  state.mostrarVariantesMarca = false;
  render();
};

// Envoltorios para los handlers inline de la barra de fusión: el script corre como <script
// type="module">, así que las variables de nivel superior como `state` viven en el scope del
// módulo y NO son visibles desde un atributo onclick/onchange en línea (esos corren en el scope
// global). Referenciar `state` directo ahí (como se hacía antes) tira ReferenceError en el
// navegador real y el botón no hace nada — silenciosamente, porque el error queda en la consola.
// Por eso cada handler inline solo puede llamar a una función ya colgada de `window`, nunca leer
// `state` directamente en el string del atributo.
window.setInsumoMergeSurvivor = function(id) {
  state.insumosMergeSurvivor = id;
};
window.setInsumoMergeMarca = function(id, marca) {
  state.insumosMergeMarcas[id] = marca;
};
window.setInsumoMergeNombreFinal = function(val) {
  state.insumosMergeNombreFinal = val;
};
window.fusionarInsumosSeleccionados = async function() {
  const ids = Object.keys(state.insumosMergeSeleccion);
  const survivor = state.insumosMergeSurvivor || ids[0];
  await fusionarInsumos(ids, survivor, state.insumosMergeMarcas, state.insumosMergeNombreFinal);
};

// Fusiona 2+ insumos duplicados en uno solo: combina precios por proveedor, historial,
// y remapea las recetas de productos que referenciaban a los insumos absorbidos.
// marcasPorInsumo (opcional): { insumoId: "Marca asignada" } — para el caso "1 producto, varias
// marcas" (ej. "Levadura Leudex" + "Levadura Duquesa" fusionados en un único "Levadura"): la marca
// asignada a cada insumo absorbido se aplica a TODAS sus líneas de precio, así no se pierde el
// detalle de qué marca era cada una una vez que dejan de ser insumos separados.
// nombreFinal (opcional): si se pasa, renombra el insumo que queda (ej. "Levadura" en vez del
// nombre que tenía uno de los absorbidos, que probablemente incluía la marca).
window.fusionarInsumos = async function(idsSeleccionados, survivorId, marcasPorInsumo = {}, nombreFinal = "") {
  const ids = idsSeleccionados.filter(id => state.insumos[id]);
  if (ids.length < 2 || !ids.includes(survivorId)) return;
  if (!confirm(`¿Fusionar ${ids.length} insumos en "${state.insumos[survivorId].nombre}"? Los otros se eliminan (su historial y precios se conservan dentro del que queda).`)) return;

  const survivor = state.insumos[survivorId];
  const others = ids.filter(id => id !== survivorId);

  // Determina el proveedorId real de una línea de precio ya existente, sea del esquema nuevo
  // (con `proveedorId` guardado explícito) o del viejo (la clave ERA el proveedorId, o "_manual").
  function proveedorIdDeEntry(key, p) {
    if (p && p.proveedorId !== undefined && p.proveedorId !== null) return p.proveedorId;
    if (key === "_manual") return "";
    const idx = key.indexOf("::");
    return idx >= 0 ? key.slice(0, idx) : key;
  }
  // Re-clava las líneas de precio de un insumo aplicándoles una marca (si se asignó una en la
  // fusión): cada combinación proveedor+marca queda con su propia clave, sin pisar otras líneas
  // del mismo proveedor. Se aplica tanto a los insumos absorbidos como al que queda como base —
  // si ESE insumo también representaba una marca puntual (típico: "Levadura Duquesa" fusionada
  // con "Levadura Leudex" en un único "Levadura"), sus propias líneas también deben etiquetarse.
  function reclavarConMarca(preciosOrigen, marcaAsignada) {
    const resultado = {};
    for (const [oldKey, p] of Object.entries(preciosOrigen || {})) {
      const marcaFinal = marcaAsignada || p.marca || "";
      const proveedorIdFinal = proveedorIdDeEntry(oldKey, p);
      const newKey = comboKeyPrecio(proveedorIdFinal, marcaFinal);
      resultado[newKey] = { oldKey, entry: { ...p, proveedorId: proveedorIdFinal, marca: marcaFinal } };
    }
    return resultado;
  }

  let precios = {};
  const marcaSurvivor = normMarca(marcasPorInsumo[survivorId]);
  for (const [newKey, { entry }] of Object.entries(reclavarConMarca(survivor.precios, marcaSurvivor))) {
    precios[newKey] = entry;
  }

  let historial = { ...(survivor.historial || {}) };
  if (marcaSurvivor) {
    for (const [hid, h] of Object.entries(historial)) {
      if (!h.marca) historial[hid] = { ...h, marca: marcaSurvivor };
    }
  }

  for (const id of others) {
    const o = state.insumos[id] || {};
    const marcaAsignada = normMarca(marcasPorInsumo[id]);
    for (const [newKey, { entry }] of Object.entries(reclavarConMarca(o.precios, marcaAsignada))) {
      if (!precios[newKey] || (entry.actualizadoTs || 0) > (precios[newKey].actualizadoTs || 0)) precios[newKey] = entry;
    }
    for (const [hid, h] of Object.entries(o.historial || {})) historial[`${id}_${hid}`] = marcaAsignada ? { ...h, marca: marcaAsignada } : h;
  }

  // Igual que en actualizarPrecioInsumo: tras fusionar, se costea con la línea MÁS CARA de todas
  // las que quedaron (las del sobreviviente y las de los absorbidos), no con la que traía el
  // sobreviviente.
  const proveedorPreferido = lineaPrecioMaxima(precios);
  const precioActual = proveedorPreferido ? (precios[proveedorPreferido]?.precio ?? 0) : (survivor.precioActual || 0);
  const nombreFinalLimpio = String(nombreFinal || "").trim();

  await update(ref(db, `costeo/insumos/${survivorId}`), {
    precios, historial, precioActual, actualizadoTs: Date.now(),
    ...(proveedorPreferido ? { proveedorPreferido } : {}),
    ...(nombreFinalLimpio ? { nombre: nombreFinalLimpio } : {})
  });

  for (const [prodId, p] of Object.entries(state.productos)) {
    const receta = p.receta || {};
    let changed = false;
    const newReceta = { ...receta };
    for (const id of others) {
      if (id in newReceta) {
        newReceta[survivorId] = (newReceta[survivorId] || 0) + newReceta[id];
        delete newReceta[id];
        changed = true;
      }
    }
    if (changed) await update(ref(db, `costeo/productos/${prodId}`), { receta: newReceta });
  }

  for (const id of others) await remove(ref(db, `costeo/insumos/${id}`));

  state.insumosMergeMode = false;
  state.insumosMergeSeleccion = {};
  state.insumosMergeSurvivor = null;
  state.insumosMergeMarcas = {};
  state.insumosMergeNombreFinal = "";
  showToast("✅ Insumos fusionados.", "success");
  render();
};

// Si el costo en vivo de una base/preparación (recalculado desde su propia receta) se movió
// respecto al precioActual guardado — por ejemplo porque cambió el precio de un ingrediente suyo
// al cargar una factura — lo vuelve a guardar, igual que actualizarCostoHistorialProducto hace con
// los productos. Se llama al entrar a Insumos o Análisis, no en cada render.
function actualizarPreciosBasesElaboradas() {
  Object.entries(state.insumos).forEach(([id, ins]) => {
    if (!ins.receta || !Object.keys(ins.receta).length) return;
    const costo = precioEfectivoInsumo(id);
    if (Math.abs((ins.precioActual || 0) - costo) < 0.005) return;
    guardarPrecioRecetaInsumo(id, costo);
  });
}

function recipeRowHtml({ insumoId = "", cantidad = "" } = {}, opts = {}) {
  const { containerClass = "recipe-row", selectClass = "recipe-insumo", cantidadClass = "recipe-cantidad", onchange = "recalcCostoProducto()", excludeId = null } = opts;
  const options = objToSortedEntries(state.insumos, (a, b) => a[1].nombre.localeCompare(b[1].nombre))
    .filter(([id]) => id !== excludeId)
    .map(([id, ins]) => `<option value="${id}" ${id === insumoId ? "selected" : ""}>${escapeHtml(ins.nombre)}${ins.unidad ? " (" + escapeHtml(ins.unidad) + ")" : ""} — ${fmtMoney(precioEfectivoInsumo(id))}</option>`).join("");
  return `
    <div class="${containerClass}">
      <select class="form-select ${selectClass}" onchange="${onchange}">
        <option value="">— Insumo —</option>
        ${options}
      </select>
      <input type="number" step="0.001" min="0" class="form-input ${cantidadClass}" placeholder="Cantidad usada" value="${cantidad ?? ""}" oninput="${onchange}">
      <button type="button" class="btn btn-danger btn-sm" onclick="this.closest('.${containerClass}').remove();${onchange}">✕</button>
    </div>`;
}
window.addRecipeRow = function() {
  document.getElementById("recipe-container").insertAdjacentHTML("beforeend", recipeRowHtml());
};

// Misma fila de receta que usan los productos, pero para la receta opcional de un insumo
// (bases/preparaciones elaboradas) — excluye el propio insumo de la lista para evitar auto-referencia.
function insumoRecipeRowOpts(excludeId) {
  return { containerClass: "insumo-recipe-row", selectClass: "insumo-recipe-insumo", cantidadClass: "insumo-recipe-cantidad", onchange: "recalcCostoInsumo()", excludeId: excludeId && excludeId !== "new" ? excludeId : null };
}
window.addInsumoRecipeRow = function() {
  document.getElementById("insumo-recipe-container").insertAdjacentHTML("beforeend", recipeRowHtml({}, insumoRecipeRowOpts(state.editingInsumoId)));
};
window.recalcCostoInsumo = function() {
  const rows = Array.from(document.querySelectorAll("#insumo-recipe-container .insumo-recipe-row"));
  let total = 0;
  for (const row of rows) {
    const insumoId = row.querySelector(".insumo-recipe-insumo").value;
    const cantidad = parseFloat(row.querySelector(".insumo-recipe-cantidad").value) || 0;
    total += precioEfectivoInsumo(insumoId) * cantidad;
  }
  const el = document.getElementById("costo-insumo-preview");
  if (el) el.textContent = fmtMoney(total);
  return total;
};
function recalcCostoInsumoSilencioso(receta) {
  if (!receta) return 0;
  return Object.entries(receta).reduce((sum, [subId, cantidad]) => sum + precioEfectivoInsumo(subId) * (Number(cantidad) || 0), 0);
}

window.recalcCostoProducto = function() {
  const rows = Array.from(document.querySelectorAll("#recipe-container .recipe-row"));
  let total = 0;
  for (const row of rows) {
    const insumoId = row.querySelector(".recipe-insumo").value;
    const cantidad = parseFloat(row.querySelector(".recipe-cantidad").value) || 0;
    const precio = precioEfectivoInsumo(insumoId);
    total += precio * cantidad;
  }
  const el = document.getElementById("costo-preview");
  if (el) el.textContent = fmtMoney(total);
  return total;
};

// Precio "en vivo" de un insumo: si es una base/preparación elaborada (tiene receta propia,
// ej. crema chantilly, bizcochuelo), se recalcula sumando el costo de sus propios ingredientes
// en vez de usar el precioActual guardado — así cualquier producto que la use ve siempre el costo
// al día, sin depender de que alguien vuelva a guardar la base a mano. visiting evita ciclos.
// ─────────────────────────────────────────────────────────────────────────────
// REGLA DE COSTEO (definida por el negocio)
// Se costea con el precio MÁS ALTO entre las compras de los últimos COSTEO_VENTANA_DIAS.
// De esa única regla salen las tres condiciones pedidas:
//   · Solo pesan los proveedores/marcas a los que realmente se les compra (si no hay compra
//     reciente de esa línea, no entra en el cálculo).
//   · Una compra puntual más barata NO baja el costo: la compra cara reciente sigue mandando.
//   · Una baja sostenida SÍ termina bajando el costo sola, cuando la compra cara queda fuera
//     de la ventana de 2 meses y deja de contar.
// Se calcula en vivo (no solo al guardar) justamente para que el paso del tiempo surta efecto.
// ─────────────────────────────────────────────────────────────────────────────
const COSTEO_VENTANA_DIAS = 60; // 2 meses

function precioCosteoInsumo(ins) {
  const hist = Object.values(ins?.historial || {}).filter(h => h && h.fecha);
  const recientes = hist.filter(h => diasDesdeFecha(h.fecha) <= COSTEO_VENTANA_DIAS);
  if (recientes.length) return Math.max(...recientes.map(h => Number(h.precio) || 0));
  // Sin compras en la ventana: se usa la última compra conocida, para no quedarse sin costo.
  if (hist.length) {
    const ordenado = hist.slice().sort((a, b) => a.fecha.localeCompare(b.fecha));
    return Number(ordenado[ordenado.length - 1].precio) || 0;
  }
  // Sin historial (ej. líneas cargadas por importación): el más alto de las líneas registradas.
  const lineas = Object.values(ins?.precios || {}).map(p => Number(p?.precio) || 0);
  return lineas.length ? Math.max(...lineas) : (Number(ins?.precioActual) || 0);
}

function precioEfectivoInsumo(insumoId, visiting) {
  const ins = state.insumos[insumoId];
  if (!ins) return 0;
  const receta = ins.receta || {};
  if (Object.keys(receta).length) {
    const seen = visiting || new Set();
    if (seen.has(insumoId)) return ins.precioActual || 0;
    seen.add(insumoId);
    return Object.entries(receta).reduce((sum, [subId, cantidad]) => sum + precioEfectivoInsumo(subId, seen) * (Number(cantidad) || 0), 0);
  }
  return precioCosteoInsumo(ins);
}

function calcCostoProducto(producto) {
  const receta = producto.receta || {};
  if (Object.keys(receta).length) {
    return Object.entries(receta).reduce((sum, [insumoId, cantidad]) => {
      const precio = precioEfectivoInsumo(insumoId);
      return sum + precio * (Number(cantidad) || 0);
    }, 0);
  }
  // Producto de reventa vinculado a un insumo (caso fiambres: el jamón cocido se compra a varios
  // proveedores/marcas y además se usa como insumo de otras recetas). Se carga UNA sola vez como
  // insumo — con todas sus líneas proveedor+marca — y el producto toma de ahí su costo de compra,
  // así se costea con la misma regla y no hay dos lugares donde mantener el precio.
  if (producto.insumoVinculadoId && state.insumos[producto.insumoVinculadoId]) {
    return precioEfectivoInsumo(producto.insumoVinculadoId) * (Number(producto.insumoVinculadoCantidad) || 1);
  }
  // Sin receta armada: usamos el costo estimado a mano, si lo cargaron (útil para catálogos
  // grandes importados donde no es realista armar una receta ingrediente por ingrediente para todo).
  return Number(producto.costoManual) || 0;
}

function costoProductoFuente(producto) {
  if (producto.receta && Object.keys(producto.receta).length) return "receta";
  if (producto.insumoVinculadoId && state.insumos[producto.insumoVinculadoId]) return "insumo";
  if (producto.costoManual > 0) return "manual";
  return "sin_datos";
}

// Modelo de costeo: el costo (de receta, o de compra para retail) representa el 28% del precio de
// venta ideal; el resto se reparte en costos fijos (37%), renta esperada (20%) y mermas (15%).
// Con el costo real conocido, se despeja el precio sugerido con una regla de tres simple:
// costo / 0.28 = precioSugerido, y de ahí el resto de las porciones.
const COSTEO_MODELO = { variable: 0.28, fijo: 0.37, renta: 0.20, merma: 0.15 };
function calcModeloCosteo(producto) {
  const costo = calcCostoProducto(producto);
  if (!costo) return null;
  const precioSugerido = costo / COSTEO_MODELO.variable;
  return {
    costo,
    fijoSugerido: precioSugerido * COSTEO_MODELO.fijo,
    rentaSugerida: precioSugerido * COSTEO_MODELO.renta,
    mermaSugerida: precioSugerido * COSTEO_MODELO.merma,
    precioSugerido
  };
}

// Snapshots a producto's computed cost into costoHistorial (like insumo price historial),
// so the Análisis view can compare cost variation over time — at most once per day, and only
// when the cost actually moved, since this piggybacks on viewing Análisis rather than a cron.
async function actualizarCostoHistorialProducto(id, producto) {
  const costoActual = calcCostoProducto(producto);
  const hist = objToSortedEntries(producto.costoHistorial, (a, b) => a[1].fecha.localeCompare(b[1].fecha));
  const last = hist.length ? hist[hist.length - 1][1] : null;
  const today = todayISO();
  if (last && last.fecha === today) return;
  if (last && Math.abs(last.costo - costoActual) < 0.005) return;
  await push(ref(db, `costeo/productos/${id}/costoHistorial`), { costo: costoActual, fecha: today });
  // Igual que con insumos: si el costo genuinamente subió (no la primera carga), dejar una alerta
  // con el detalle completo, marcando aparte las subas "abruptas" para una notificación más grande.
  if (last && costoActual > last.costo + 0.005) {
    const pct = last.costo > 0 ? ((costoActual - last.costo) / last.costo) * 100 : null;
    await update(ref(db, `costeo/productos/${id}`), {
      alertaPrecio: {
        costoAnterior: last.costo,
        costoNuevo: costoActual,
        pct,
        fecha: today,
        abrupta: pct !== null && pct >= ALERTA_SUBA_ABRUPTA_UMBRAL
      }
    });
  }
}
