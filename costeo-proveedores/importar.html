<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --cream:#EEEBD7; --cream-dark:#dedad8; --cream-mid:#e5e1cc;
  --black:#22201F; --gray:#9a9888; --white:#ffffff;
  --terra:#E15D46; --terra-light:#ea7a65; --terra-pale:#f9ddd8;
  --turq:#9BD6CC; --turq-dark:#6bbfb4; --turq-pale:#d8f0ed;
  --green:#27ae60; --green-pale:#e8f8f0;
  --shadow-sm:0 1px 3px rgba(34,32,31,.06),0 1px 2px rgba(34,32,31,.04);
  --shadow-md:0 4px 16px rgba(34,32,31,.08),0 2px 6px rgba(34,32,31,.05);
  --shadow-lg:0 12px 40px rgba(34,32,31,.12),0 4px 12px rgba(34,32,31,.06);
  --shadow-terra:0 4px 18px rgba(225,93,70,.30);
  --r:14px;--r-sm:8px;
}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--cream);color:var(--black);min-height:100vh;font-weight:300;font-size:14px;}
.main{max-width:720px;margin:0 auto;padding:40px 24px;}
.page-title{font-size:22px;font-weight:700;margin-bottom:6px;letter-spacing:-.3px;}
.page-sub{color:var(--gray);font-size:13px;margin-bottom:24px;}
.section-block{background:var(--white);border:1px solid rgba(34,32,31,.07);border-radius:var(--r);padding:22px 24px;margin-bottom:16px;box-shadow:var(--shadow-sm);}
.section-title{font-size:14px;font-weight:600;margin-bottom:14px;}
.btn{display:inline-flex;align-items:center;gap:6px;padding:11px 22px;border-radius:10px;border:none;cursor:pointer;font-size:14px;font-family:'Plus Jakarta Sans',sans-serif;font-weight:600;transition:all .2s;}
.btn-primary{background:var(--terra);color:#fff;box-shadow:var(--shadow-terra);}
.btn-primary:hover{background:var(--terra-light);}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;}
.form-input{padding:10px 14px;background:var(--cream);border:1.5px solid var(--cream-dark);border-radius:var(--r-sm);color:var(--black);font-size:13px;outline:none;width:100%;font-family:'Plus Jakarta Sans',sans-serif;margin-bottom:12px;}
.form-input:focus{border-color:var(--terra);box-shadow:0 0 0 3px rgba(225,93,70,.12);}
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px;}
.stat-card{background:var(--cream);border-radius:var(--r-sm);padding:14px 16px;text-align:center;}
.stat-value{font-size:22px;font-weight:700;}
.stat-label{font-size:10px;color:var(--gray);text-transform:uppercase;letter-spacing:.6px;margin-top:2px;}
.alert-box{padding:12px 16px;border-radius:10px;margin-bottom:16px;font-size:13px;}
.alert-warn{background:#fff5f3;border:1px solid var(--terra-pale);color:var(--terra);}
.alert-turq{background:var(--turq-pale);border:1px solid var(--turq);color:var(--turq-dark);}
.log-box{background:var(--black);color:var(--cream);border-radius:var(--r-sm);padding:14px 16px;font-family:monospace;font-size:12px;max-height:340px;overflow-y:auto;white-space:pre-wrap;line-height:1.5;}
#login-err{color:var(--terra);font-size:12px;display:none;margin-top:6px;}
.progress-bar{height:8px;background:var(--cream-dark);border-radius:100px;overflow:hidden;margin-bottom:16px;}
.progress-fill{height:100%;background:var(--terra);width:0%;transition:width .2s;}
</style>
</head>

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function normKey(s) {
  return String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().trim();
}
function todayISO() {
  return new Intl.DateTimeFormat("en-CA", { timeZone: "America/Argentina/Buenos_Aires", year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date());
}

const app_ = document.getElementById("app");
let adminPass = null;

function renderLogin() {
  app_.innerHTML = `
    <div class="page-title">Importar datos iniciales</div>
    <div class="page-sub">Carga única de proveedores, insumos y precios de venta de productos desde los archivos que compartiste. Usa la misma contraseña de administración de Costeo &amp; Proveedores.</div>
    <div class="section-block">
      <input type="password" class="form-input" id="login-pass" placeholder="Contraseña">
      <button class="btn btn-primary" id="login-btn">Ingresar</button>
      <div id="login-err">Contraseña incorrecta.</div>
    </div>`;
  document.getElementById("login-btn").addEventListener("click", handleLogin);
  document.getElementById("login-pass").addEventListener("keydown", e => { if (e.key === "Enter") handleLogin(); });
}

async function handleLogin() {
  const val = document.getElementById("login-pass").value;
  const snap = await get(ref(db, "costeo/config/adminPassword"));
  const pass = snap.val() || "costeo2025";
  if (val === pass) {
    adminPass = val;
    renderSummary();
  } else {
    document.getElementById("login-err").style.display = "block";
  }
}

function renderSummary() {
  const sinPrecio = DATA.insumos.filter(i => !i.precioUnitario).length;
  const numProductos = (DATA.productos || []).length;
  const numPlu = (DATA.plu || []).length;
  const numRecetas = (DATA.recetas || []).length;
  app_.innerHTML = `
    <div class="page-title">Importar datos iniciales</div>
    <div class="page-sub">Revisá los números antes de confirmar. Esta acción es segura de repetir: si un proveedor, insumo o producto ya existe (por nombre), se salta la creación y no se duplica; los pasos de costos/recetas sí completan datos en productos ya existentes, sin pisar su precio de venta.</div>
    <div class="section-block">
      <div class="section-title">Resumen de lo que se va a importar</div>
      <div class="stat-row">
        <div class="stat-card"><div class="stat-value">${DATA.proveedores.length}</div><div class="stat-label">Proveedores</div></div>
        <div class="stat-card"><div class="stat-value">${DATA.insumos.length}</div><div class="stat-label">Insumos</div></div>
        <div class="stat-card"><div class="stat-value">${numProductos}</div><div class="stat-label">Productos (precio venta)</div></div>
        <div class="stat-card"><div class="stat-value">${numPlu}</div><div class="stat-label">Costos de reventa (PLU)</div></div>
        <div class="stat-card"><div class="stat-value">${numRecetas}</div><div class="stat-label">Recetas elaboradas</div></div>
      </div>
      <div class="alert-box alert-warn">⚠️ ${sinPrecio} insumos no tenían un precio válido en el Excel — se van a crear igual, en $0, para que los completes a mano desde la pestaña Insumos.</div>
      <div class="alert-box alert-turq">ℹ️ Algunos insumos tienen el mismo nombre pero distinta marca o proveedor (ej. "Dulce de membrillo — Frucor" vs "— Prindal") — se cargan como insumos separados, ya que tienen precios distintos.</div>
      ${numProductos ? `<div class="alert-box alert-turq">ℹ️ Los ${numProductos} productos se crean solo con nombre y precio de venta (activos, con precio válido en el Excel de Fudo), sin receta — así quedan listos para costear.</div>` : ""}
      ${numPlu ? `<div class="alert-box alert-turq">ℹ️ ${numPlu} productos de reventa (lácteos, fiambres, bebidas y almacén — de la hoja "PLU" de Costos.xlsx, solo los marcados Activo) reciben un costo cargado a mano (Costo Total con IVA de esa planilla). Si el producto ya existe (por nombre), solo se le agrega el costo, sin tocar su precio de venta actual.</div>` : ""}
      ${numRecetas ? `<div class="alert-box alert-turq">ℹ️ ${numRecetas} productos elaborados (de la hoja "Recetas" de Costos.xlsx) reciben su receta con cantidades de insumos, matcheados contra el catálogo de insumos ya cargado (creando ${(DATA.nuevosInsumos || []).length} insumos nuevos sin precio para los que no tenían equivalente: ${(DATA.nuevosInsumos || []).join(", ")}). El costo de estos productos pasa a calcularse por receta, no a mano.</div>` : ""}
      <button class="btn btn-primary" id="start-btn">🚀 Importar ahora</button>
    </div>`;
  document.getElementById("start-btn").addEventListener("click", runImport);
}

async function runImport() {
  const btn = document.getElementById("start-btn");
  btn.disabled = true;
  app_.insertAdjacentHTML("beforeend", `
    <div class="section-block">
      <div class="section-title">Progreso</div>
      <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
      <div class="log-box" id="log-box"></div>
    </div>`);
  const logBox = document.getElementById("log-box");
  const progressFill = document.getElementById("progress-fill");
  const log = (msg) => { logBox.textContent += msg + "\n"; logBox.scrollTop = logBox.scrollHeight; };

  const [provSnap, insSnap, prodSnap] = await Promise.all([
    get(ref(db, "costeo/proveedores")),
    get(ref(db, "costeo/insumos")),
    get(ref(db, "costeo/productos"))
  ]);
  const existingProv = provSnap.val() || {};
  const existingIns = insSnap.val() || {};
  const existingProd = prodSnap.val() || {};
  const provByKey = {};
  Object.values(existingProv).forEach(p => { provByKey[normKey(p.nombre)] = true; });
  // insByKey/prodByKey store the real id (not just true) — the later cost/receta import steps
  // need the id to update an already-existing insumo/producto, not just know it exists.
  const insByKey = {};
  Object.entries(existingIns).forEach(([id, i]) => { insByKey[normKey(i.nombre)] = id; });
  const prodByKey = {};
  Object.entries(existingProd).forEach(([id, p]) => { prodByKey[normKey(p.nombre)] = id; });

  const productos = DATA.productos || [];
  const plu = DATA.plu || [];
  const recetas = DATA.recetas || [];
  const nuevosInsumos = DATA.nuevosInsumos || [];
  const total = DATA.proveedores.length + DATA.insumos.length + productos.length + plu.length + nuevosInsumos.length + recetas.length;
  let done = 0;
  const tick = () => { done++; progressFill.style.width = Math.round((done / total) * 100) + "%"; };

  let provCreated = 0, provSkipped = 0, insCreated = 0, insSkipped = 0, insSinPrecio = 0, prodCreated = 0, prodSkipped = 0;

  log(`Importando ${DATA.proveedores.length} proveedores…`);
  for (const p of DATA.proveedores) {
    if (provByKey[normKey(p.nombre)]) {
      provSkipped++;
      log(`  ⏭️  Proveedor ya existe, salteado: ${p.nombre}`);
      tick();
      continue;
    }
    await set(push(ref(db, "costeo/proveedores")), {
      nombre: p.nombre, cuit: p.cuit, telefono: p.telefono, contacto: p.contacto, notas: p.notas,
      creadoTs: Date.now()
    });
    provByKey[normKey(p.nombre)] = true;
    provCreated++;
    tick();
  }
  log(`✅ Proveedores: ${provCreated} creados, ${provSkipped} ya existían.\n`);

  log(`Importando ${DATA.insumos.length} insumos…`);
  const fecha = todayISO();
  for (const it of DATA.insumos) {
    if (insByKey[normKey(it.nombre)]) {
      insSkipped++;
      log(`  ⏭️  Insumo ya existe, salteado: ${it.nombre}`);
      tick();
      continue;
    }
    const precio = it.precioUnitario || 0;
    const newRef = push(ref(db, "costeo/insumos"));
    await set(newRef, { nombre: it.nombre, unidad: it.unidad, precioActual: precio, actualizadoTs: Date.now() });
    if (precio > 0) {
      await push(ref(db, `costeo/insumos/${newRef.key}/historial`), {
        precio, fecha, proveedorId: "", proveedorNombre: it.proveedorNombre || "Carga inicial", facturaId: ""
      });
    } else {
      insSinPrecio++;
    }
    insByKey[normKey(it.nombre)] = newRef.key;
    insCreated++;
    tick();
  }
  log(`✅ Insumos: ${insCreated} creados (${insSinPrecio} sin precio, completar a mano), ${insSkipped} ya existían.\n`);

  log(`Importando ${productos.length} productos (precio de venta)…`);
  for (const pr of productos) {
    if (prodByKey[normKey(pr.nombre)]) {
      prodSkipped++;
      log(`  ⏭️  Producto ya existe, salteado: ${pr.nombre}`);
      tick();
      continue;
    }
    const newProdRef = push(ref(db, "costeo/productos"));
    await set(newProdRef, {
      nombre: pr.nombre, precioVenta: pr.precioVenta, categoria: pr.categoria || "", receta: {}, creadoTs: Date.now()
    });
    prodByKey[normKey(pr.nombre)] = newProdRef.key;
    prodCreated++;
    tick();
  }
  log(`✅ Productos: ${prodCreated} creados sin receta (completala en "Productos y recetas"), ${prodSkipped} ya existían.\n`);

  log(`Importando costos de ${plu.length} productos de reventa (hoja PLU)…`);
  let pluCreated = 0, pluCostoAgregado = 0;
  for (const item of plu) {
    const key = normKey(item.nombre);
    const existingId = prodByKey[key];
    if (existingId) {
      await update(ref(db, `costeo/productos/${existingId}`), { costoManual: item.costoManual });
      pluCostoAgregado++;
    } else {
      const newRef = push(ref(db, "costeo/productos"));
      await set(newRef, {
        nombre: item.nombre, precioVenta: item.precioVenta, costoManual: item.costoManual,
        categoria: item.categoria || "", receta: {}, creadoTs: Date.now()
      });
      prodByKey[key] = newRef.key;
      pluCreated++;
    }
    tick();
  }
  log(`✅ Costos de reventa: ${pluCostoAgregado} productos existentes recibieron su costo, ${pluCreated} productos nuevos creados con costo.\n`);

  log(`Creando ${nuevosInsumos.length} insumos nuevos para las recetas (sin precio, completar a mano)…`);
  for (const nombreInsumo of nuevosInsumos) {
    const key = normKey(nombreInsumo);
    if (insByKey[key]) { tick(); continue; }
    const newRef = push(ref(db, "costeo/insumos"));
    await set(newRef, { nombre: nombreInsumo, unidad: "kg", creadoTs: Date.now() });
    insByKey[key] = newRef.key;
    tick();
  }
  log(`✅ Insumos nuevos para recetas listos.\n`);

  log(`Importando ${recetas.length} recetas de productos elaborados (hoja Recetas)…`);
  let recetaAgregada = 0, recetaCreada = 0, recetaSinInsumo = 0;
  for (const rec of recetas) {
    const receta = {};
    for (const [insumoNombre, cantidad] of Object.entries(rec.receta)) {
      const insumoId = insByKey[normKey(insumoNombre)];
      if (insumoId) receta[insumoId] = cantidad;
      else recetaSinInsumo++;
    }
    const key = normKey(rec.nombre);
    const existingId = prodByKey[key];
    if (existingId) {
      await update(ref(db, `costeo/productos/${existingId}`), { receta });
      recetaAgregada++;
    } else {
      const newRef = push(ref(db, "costeo/productos"));
      await set(newRef, { nombre: rec.nombre, precioVenta: rec.precioVenta ?? null, receta, creadoTs: Date.now() });
      prodByKey[key] = newRef.key;
      recetaCreada++;
    }
    tick();
  }
  log(`✅ Recetas: ${recetaAgregada} agregadas a productos existentes, ${recetaCreada} productos nuevos creados con receta.`);
  log(`\n🎉 Importación terminada.`);

  app_.insertAdjacentHTML("beforeend", `
    <div class="section-block">
      <div class="alert-box alert-turq">Listo. Podés ir a <a href="index.html">Costeo &amp; Proveedores</a> a revisar los datos. Esta página es de uso único — podés cerrarla o ignorarla de ahora en más (volver a ejecutarla no duplica nada).</div>
    </div>`);
  btn.textContent = "Importación completa";
}

onValue(ref(db, "costeo/config"), () => {}, { onlyOnce: true });
renderLogin();
</script>
