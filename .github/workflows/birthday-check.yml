name: 🎂 Cumpleaños Club Candela

on:
  schedule:
    # 8:00 AM hora Argentina (UTC-3) = 11:00 AM UTC
    - cron: '0 11 * * *'
  workflow_dispatch: # permite ejecutar manualmente desde GitHub

jobs:
  check-birthdays:
    runs-on: ubuntu-latest

    steps:
      - name: Verificar cumpleaños y notificar por Telegram
        uses: actions/github-script@v7
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        with:
          script: |
            const https = require('https');

            // Fecha de hoy en Argentina (UTC-3)
            const now = new Date(Date.now() - 3 * 60 * 60 * 1000);
            const todayMM = String(now.getUTCMonth() + 1).padStart(2, '0');
            const todayDD = String(now.getUTCDate()).padStart(2, '0');
            const todayLabel = `${todayDD}/${todayMM}`;

            console.log(`Revisando cumpleaños para hoy: ${todayDD}/${todayMM}`);

            // Fetch Firebase REST API
            const firebaseUrl = 'https://pedidos-de-clientes-4775b-default-rtdb.firebaseio.com/clients.json?auth=AIzaSyDFqS6RG1fkOZGo1x2-WcfT82am7ERHgyY';

            const data = await new Promise((resolve, reject) => {
              https.get(firebaseUrl, (res) => {
                let body = '';
                res.on('data', chunk => body += chunk);
                res.on('end', () => {
                  try { resolve(JSON.parse(body)); }
                  catch (e) { reject(new Error('Error al parsear Firebase: ' + e.message)); }
                });
              }).on('error', reject);
            });

            if (!data) {
              console.log('No hay clientes en la base de datos.');
              return;
            }

            function matchesBirthday(cumple) {
              if (!cumple) return false;
              const s = String(cumple).trim();
              if (/^\d{2}-\d{2}$/.test(s)) {
                const [mm, dd] = s.split('-');
                return mm === todayMM && dd === todayDD;
              }
              if (/^\d{2}\/\d{2}/.test(s)) {
                const parts = s.split('/');
                return parts[0] === todayDD && parts[1] === todayMM;
              }
              if (/^\d{4}-\d{2}-\d{2}$/.test(s)) {
                const [, mm, dd] = s.split('-');
                return mm === todayMM && dd === todayDD;
              }
              return false;
            }

            const cumpleaneros = Object.values(data).filter(c =>
              c.club && matchesBirthday(c.club.cumple)
            );

            if (cumpleaneros.length === 0) {
              console.log(`Sin cumpleaños hoy (${todayLabel}).`);
              return;
            }

            // Armar mensaje Telegram
            const lista = cumpleaneros.map(c => {
              const tel = c.phone ? ` · 📱 ${c.phone}` : '';
              const sellos = c.club.sellos !== undefined ? ` · ⭐ ${c.club.sellos} sellos` : '';
              return `• *${c.name}*${tel}${sellos}`;
            }).join('\n');

            const mensaje = `🎂 *Cumpleaños Club Candela · ${todayLabel}*\n\n${lista}\n\n_Recordá saludar y ofrecer el beneficio del club_ 🎁`;

            // Enviar mensaje por Telegram
            const telegramUrl = `https://api.telegram.org/bot${process.env.TELEGRAM_TOKEN}/sendMessage`;
            const payload = JSON.stringify({
              chat_id: process.env.TELEGRAM_CHAT_ID,
              text: mensaje,
              parse_mode: 'Markdown',
            });

            await new Promise((resolve, reject) => {
              const req = https.request(telegramUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Content-Length': Buffer.byteLength(payload) },
              }, (res) => {
                let body = '';
                res.on('data', chunk => body += chunk);
                res.on('end', () => {
                  const r = JSON.parse(body);
                  if (r.ok) { console.log('Telegram enviado OK'); resolve(); }
                  else reject(new Error('Telegram error: ' + JSON.stringify(r)));
                });
              });
              req.on('error', reject);
              req.write(payload);
              req.end();
            });

            console.log(`Notificación enviada: ${cumpleaneros.length} cumpleaños hoy.`);
