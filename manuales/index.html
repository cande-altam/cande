<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Manuales y Recetario · Candela</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --cream:#EEEBD7; --cream-dark:#dedad8; --cream-mid:#e5e1cc;
  --black:#22201F; --black-soft:#3a3836; --gray:#8a8878; --white:#fff;
  --terra:#E15D46; --terra-pale:#f9ddd8; --turq:#9BD6CC; --turq-dark:#5fb3a7; --turq-pale:#d8f0ed;
  --c-regla:#f9ddd8; --c-prohibido:#fdecea; --c-atencion:#fffbe6; --c-pendiente:#f0eee2; --c-nota:#f7f5ea;
  --shadow:0 4px 16px rgba(34,32,31,.08),0 2px 6px rgba(34,32,31,.05);
  --r:14px;
  --th-bg:#e3f2ee; --th-borde:#c9e4dd; --th-tinta:#2b6f64;
}
html{-webkit-text-size-adjust:100%;}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--cream);color:var(--black);font-size:15px;line-height:1.6;min-height:100vh;}
button,input,select,textarea{font-family:inherit;font-size:inherit;}
button{color:inherit;-webkit-appearance:none;appearance:none;}
a{color:inherit;}
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 16px;border-radius:10px;border:none;cursor:pointer;font-weight:600;font-size:14px;transition:all .15s;text-decoration:none;}
.btn-primary{background:var(--terra);color:#fff;} .btn-primary:hover{filter:brightness(1.05);}
.btn-ghost{background:var(--white);color:var(--black-soft);border:1.5px solid var(--cream-dark);} .btn-ghost:hover{border-color:var(--terra);}
.btn-turq{background:var(--turq);color:var(--black);}
.btn-danger{background:#fdecea;color:#b42318;border:1.5px solid #f5c6c0;}
.btn-sm{padding:6px 11px;font-size:12px;border-radius:8px;}
.btn:disabled{opacity:.55;cursor:not-allowed;}
.input{width:100%;padding:11px 13px;border:1.5px solid var(--cream-dark);border-radius:10px;background:var(--white);color:var(--black);outline:none;}
.input:focus{border-color:var(--terra);box-shadow:0 0 0 3px rgba(225,93,70,.12);}
.label{display:block;font-size:12px;font-weight:600;color:var(--black-soft);margin:0 0 5px;}
.muted{color:var(--gray);font-size:13px;}
.error{color:#b42318;font-size:13px;margin-top:10px;}

/* Login */
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;}
.gate-card{background:var(--white);border-radius:var(--r);padding:30px 26px;max-width:380px;width:100%;box-shadow:var(--shadow);}
.gate-card h1{font-size:20px;letter-spacing:-.3px;margin:6px 0 4px;}
.gate-card .campo{margin-top:14px;}

/* Barra superior */
.top{position:sticky;top:0;z-index:50;background:var(--black);color:var(--cream);display:flex;align-items:center;gap:10px;padding:10px 16px;min-height:56px;}
.top .marca{font-weight:700;font-size:15px;flex:1;min-width:0;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.top .marca small{display:block;font-weight:400;font-size:11px;color:rgba(238,235,215,.6);letter-spacing:.4px;}
.top .tb{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:var(--cream);padding:7px 11px;border-radius:9px;cursor:pointer;font-size:12px;font-weight:600;white-space:nowrap;}
.top .tb.on{background:var(--terra);border-color:var(--terra);color:#fff;}
.main{max-width:900px;margin:0 auto;padding:20px 16px 60px;}
.h-pag{font-size:22px;font-weight:700;letter-spacing:-.4px;}
.sub-pag{color:var(--gray);font-size:13px;margin:4px 0 16px;}
.bloque{background:var(--white);border-radius:var(--r);padding:18px 18px;margin-bottom:14px;box-shadow:0 1px 3px rgba(34,32,31,.05);}
.bloque h3{font-size:15px;margin-bottom:8px;}

/* Inicio */
.buscar{position:relative;margin-bottom:16px;}
.buscar .input{padding-left:38px;font-size:15px;}
.buscar span{position:absolute;left:13px;top:50%;transform:translateY(-50%);opacity:.6;}
.parte-cab{display:flex;align-items:center;gap:10px;margin:26px 2px 10px;}
.parte-cab .ic{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.parte-cab .n{font-size:13px;font-weight:700;letter-spacing:.2px;color:var(--black);}
.parte-cab .c{font-size:11px;font-weight:600;color:var(--gray);background:rgba(34,32,31,.06);border-radius:100px;padding:1px 8px;}
.parte-cab .d{font-size:12px;color:var(--gray);font-weight:400;margin-top:1px;}
.grilla{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px;}
.tarjeta{background:var(--white);color:var(--black);border-radius:16px;padding:14px;cursor:pointer;border:1.5px solid transparent;transition:transform .15s,box-shadow .15s,border-color .15s;text-align:left;width:100%;display:flex;gap:12px;align-items:flex-start;box-shadow:0 1px 2px rgba(34,32,31,.05),0 2px 8px rgba(34,32,31,.04);font-family:inherit;}
.tarjeta:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:rgba(225,93,70,.35);}
.tarjeta:active{transform:scale(.99);}
.tarjeta .ic{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;}
.tarjeta .tx{flex:1;min-width:0;}
.tarjeta .t{font-weight:650;font-size:15px;line-height:1.3;color:var(--black);letter-spacing:-.1px;}
.tarjeta .a{font-size:12.5px;color:var(--gray);margin-top:3px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.tarjeta .e{margin-top:7px;font-size:11px;font-weight:600;}
.tarjeta .flecha{color:#ccc9b5;font-size:20px;align-self:center;flex-shrink:0;}
.e-leido{color:var(--turq-dark);} .e-nuevo{color:var(--terra);} .e-act{color:#b7791f;}
.tuyos .tarjeta{border-color:var(--turq);}
.bienvenida{display:flex;gap:14px;align-items:center;background:linear-gradient(120deg,var(--black) 0%,#3a3836 100%);color:var(--cream);border-radius:18px;padding:18px;cursor:pointer;border:none;width:100%;text-align:left;margin:6px 0 4px;font-family:inherit;}
.bienvenida .ic{width:48px;height:48px;border-radius:14px;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;}
.bienvenida .t{font-weight:700;font-size:16px;color:#fff;} .bienvenida .a{font-size:13px;color:rgba(238,235,215,.7);margin-top:2px;}
.bienvenida .flecha{margin-left:auto;font-size:22px;color:rgba(238,235,215,.6);}
.progreso{background:var(--white);border-radius:16px;padding:14px 16px;margin:0 0 14px;display:flex;align-items:center;gap:14px;}
.progreso .barra{flex:1;height:8px;background:var(--cream-mid);border-radius:100px;overflow:hidden;}
.progreso .barra div{height:100%;background:linear-gradient(90deg,var(--turq-dark),var(--turq));border-radius:100px;transition:width .4s;}
.progreso .n{font-size:13px;font-weight:600;white-space:nowrap;}
.res{background:var(--white);border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer;}
.res:hover{box-shadow:var(--shadow);}
.res .t{font-weight:600;} .res .s{font-size:13px;color:var(--black-soft);margin-top:4px;}
mark{background:#ffe58a;border-radius:3px;padding:0 1px;}

/* Manual */
.man-head{margin-bottom:12px;}
.man-head .vol{font-size:13px;color:var(--gray);cursor:pointer;margin-bottom:8px;display:inline-block;}
.man-head h1{font-size:26px;line-height:1.2;letter-spacing:-.5px;}
.man-head .ver{font-size:13px;color:var(--gray);margin-top:6px;}
.indice{position:sticky;top:56px;z-index:40;background:var(--cream);display:flex;gap:6px;overflow-x:auto;padding:8px 0 10px;margin-bottom:8px;scrollbar-width:thin;}
.indice a{flex-shrink:0;padding:6px 12px;border-radius:100px;border:1.5px solid var(--cream-dark);background:var(--white);font-size:12px;text-decoration:none;color:var(--black-soft);white-space:nowrap;}
.indice a:hover{border-color:var(--terra);color:var(--terra);}
.indice a.on{background:var(--black);border-color:var(--black);color:var(--cream);}
#arriba{position:fixed;right:16px;bottom:calc(20px + env(safe-area-inset-bottom));z-index:120;width:46px;height:46px;border-radius:50%;border:none;background:var(--black);color:var(--cream);font-size:20px;box-shadow:var(--shadow);cursor:pointer;opacity:0;pointer-events:none;transition:opacity .2s;}
#arriba.ver{opacity:.92;pointer-events:auto;}
.doc{background:var(--white);border-radius:var(--r);padding:22px 22px 26px;font-size:15.5px;line-height:1.65;overflow-wrap:break-word;word-break:normal;}
.doc h1{display:none;}
.doc h2{font-size:19px;margin:28px 0 10px;padding-top:14px;border-top:1px solid var(--cream-dark);scroll-margin-top:110px;}
.doc h2:first-child{margin-top:0;padding-top:0;border-top:none;}
.doc h3{font-size:16px;margin:20px 0 8px;scroll-margin-top:110px;}
.doc h4{font-size:15px;margin:0 0 6px;}
.doc p{margin:0 0 10px;}
.doc ul,.doc ol{margin:0 0 12px 22px;} .doc li{margin-bottom:4px;}
.doc img{max-width:100%;height:auto;border-radius:8px;}
.doc .tabla{overflow-x:auto;margin:6px 0 16px;}
.doc table{border-collapse:collapse;width:100%;font-size:14px;}
.doc th,.doc td{border:1px solid var(--cream-dark);padding:8px 10px;text-align:left;vertical-align:top;}
.doc th{background:var(--th-bg);color:var(--black);border-color:var(--th-borde);font-weight:700;font-size:15px;line-height:1.35;padding:10px 12px;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
.doc th *{color:inherit;}
.doc tbody tr:nth-child(even) td{background:#fbfaf4;}
.doc tbody td:first-child:not(:last-child){font-weight:600;}
/* Organigrama: un árbol de verdad (antes era un dibujo con espacios y guiones que se desarmaba). */
.org{margin:12px 0 20px;}
.org-cima{display:flex;flex-direction:column;align-items:center;}
.org-nodo{background:var(--white);border:1.5px solid var(--cream-dark);border-radius:12px;padding:10px 16px;text-align:center;width:100%;max-width:340px;box-shadow:0 1px 3px rgba(34,32,31,.06);}
.org-nodo b,.org-nodo strong{display:block;font-size:16px;line-height:1.25;}
.org-nodo span{display:block;font-size:12.5px;color:var(--gray);line-height:1.4;margin-top:3px;}
.org-dir{background:var(--terra-pale);border-color:#f1c2b8;}
.org-ger{background:#fdf1ee;border-color:#f1c2b8;}
.org-linea{width:2px;height:18px;background:#d8d3c4;margin:0 auto;}
.org-ramas{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px 14px;position:relative;margin-top:18px;padding-top:20px;border-top:2px solid #d8d3c4;}
.org-rama{position:relative;background:var(--white);border:1.5px solid var(--cream-dark);border-top:5px solid var(--turq);border-radius:12px;padding:12px 14px;}
.org-rama::before{content:"";position:absolute;top:-27px;left:50%;width:2px;height:21px;background:#d8d3c4;}
.org-rama:nth-child(n+4)::before{display:none;}
.org-rama>b,.org-rama>strong{display:block;font-size:15px;line-height:1.25;}
.org-rama>span{display:block;font-size:12px;color:var(--gray);line-height:1.4;margin:3px 0 8px;}
.org-rama ul{list-style:none;margin:0!important;padding:0;}
.org-rama li{font-size:13.5px;padding:5px 0 5px 14px;position:relative;border-top:1px dashed var(--cream-dark);margin:0!important;}
.org-rama li::before{content:"";position:absolute;left:2px;top:13px;width:6px;height:6px;border-radius:50%;background:var(--turq);}
.org-rama li ul li{border-top:none;padding:2px 0 2px 14px;font-size:13px;color:var(--black-soft);}
.org-rama li ul li::before{background:var(--cream-dark);top:9px;}
.org-c1{border-top-color:#e8b46a;} .org-c2{border-top-color:#9BD6CC;} .org-c3{border-top-color:#E15D46;} .org-c4{border-top-color:#b9a3d6;} .org-c5{border-top-color:#7fb07a;} .org-c6{border-top-color:#a8a496;}
.org-rama>.org-rol,.org-rol{display:block;margin:8px 0 0;color:var(--black);background:#fff7e0;border:1px solid #f0dca0;border-radius:9px;padding:6px 9px;font-size:12px;line-height:1.4;}
.org-nota{text-align:center;font-size:12.5px;color:var(--gray);margin-top:12px;}
.org-flujo{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px;margin:12px 0 16px;}
.org-paso{background:var(--white);border:1.5px solid var(--cream-dark);border-radius:100px;padding:7px 14px;font-size:13.5px;font-weight:600;}
.org-paso.org-fin{background:var(--terra-pale);border-color:#f1c2b8;}
.org-flecha{color:var(--gray);font-size:18px;line-height:1;}
.doc td p:last-child,.doc th p:last-child{margin-bottom:0;}
.cuadro{border-radius:10px;padding:13px 15px;margin:10px 0 16px;background:var(--c-nota);}
.cuadro p:last-child{margin-bottom:0;}
.cuadro-regla{background:var(--c-regla);} .cuadro-prohibido{background:var(--c-prohibido);} .cuadro-atencion{background:var(--c-atencion);}
.cuadro-pendiente{background:var(--c-pendiente);} .cuadro-nota{background:var(--c-nota);}
.cuadro-tipo{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:rgba(34,32,31,.55);margin-bottom:4px;}
.doc p.check{display:flex;gap:10px;align-items:flex-start;padding:4px 0;margin:0;cursor:pointer;}
.doc p.check input{width:20px;height:20px;margin-top:2px;flex-shrink:0;accent-color:var(--turq-dark);}
.doc p.check.hecho span{text-decoration:line-through;color:var(--gray);}
.man-pie{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-top:14px;}
.leido-ok{color:var(--turq-dark);font-weight:600;font-size:14px;}

/* Gerencia */
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;}
.fila-p{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 0;border-top:1px solid var(--cream-dark);flex-wrap:wrap;}
.fila-p:first-child{border-top:none;}
.fila-p .n{font-weight:600;} .fila-p .u{font-size:12px;color:var(--gray);}
.chip{display:inline-block;padding:2px 9px;border-radius:100px;font-size:11px;font-weight:600;}
.chip-ok{background:var(--turq-pale);color:#2c6e65;} .chip-baja{background:#fdecea;color:#b42318;}
.acciones{display:flex;gap:6px;flex-wrap:wrap;}
.form-g{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.puestos{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:4px 14px;margin-top:6px;}
.puestos label{display:flex;gap:8px;align-items:flex-start;font-size:13px;cursor:pointer;padding:3px 0;}
.puestos input{margin-top:3px;accent-color:var(--terra);}
.cred{background:var(--turq-pale);border-radius:12px;padding:14px 16px;margin-top:12px;}
.cred code{font-size:16px;font-weight:700;background:#fff;padding:2px 8px;border-radius:6px;}
.prev-parte{font-weight:700;margin:12px 0 4px;}
.prev-m{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:4px 0;border-bottom:1px dashed var(--cream-dark);}
.aviso{background:var(--c-atencion);border-radius:10px;padding:10px 12px;font-size:13px;margin:10px 0;}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--black);color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:all .25s;z-index:300;max-width:calc(100% - 32px);}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
#toast.warn{background:#8a5a00;} #toast.error{background:#b42318;}
/* Editor */
.ed-meta{display:grid;grid-template-columns:2fr 1.3fr;gap:10px;margin-bottom:10px;}
.ed-meta2{display:grid;grid-template-columns:1fr 1.3fr;gap:10px;margin-bottom:12px;}
.ed-barra{position:sticky;top:56px;z-index:45;display:flex;flex-wrap:wrap;gap:4px;background:var(--black-soft);padding:7px;border-radius:12px 12px 0 0;}
.ed-barra button{background:rgba(255,255,255,.1);color:#fff;border:none;border-radius:7px;padding:6px 9px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;}
.ed-barra button:hover{background:rgba(255,255,255,.22);}
.ed-barra .sep{width:1px;background:rgba(255,255,255,.2);margin:2px 3px;}
.ed-barra .b-regla{background:var(--c-regla);color:var(--black);} .ed-barra .b-prohibido{background:var(--c-prohibido);color:var(--black);}
.ed-barra .b-atencion{background:var(--c-atencion);color:var(--black);} .ed-barra .b-pendiente{background:var(--c-pendiente);color:var(--black);} .ed-barra .b-nota{background:var(--c-nota);color:var(--black);}
.doc.editable{border-radius:0 0 var(--r) var(--r);min-height:60vh;outline:none;border:2px solid var(--black-soft);border-top:none;}
.doc.editable:focus{border-color:var(--terra);}
.doc.editable .cuadro{outline:1px dashed rgba(34,32,31,.18);}
.ed-estado{font-size:12px;color:var(--gray);}
.ed-pie{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-top:12px;}
.versiones{margin-top:8px;font-size:13px;}
.versiones div{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px dashed var(--cream-dark);}
.orden-btn{background:none;border:1px solid var(--cream-dark);border-radius:6px;cursor:pointer;padding:1px 6px;font-size:11px;}
/* Recetario (lectura): mismo diseño que el Recetario editable (recetario/index.html) — inicio por
   categorías, cards que giran (adelante la foto, atrás el resumen) y la ficha con tabla. */
.rec-panel{background:var(--white);border:1px solid rgba(34,32,31,.07);border-radius:var(--r);padding:22px 24px;box-shadow:0 1px 2px rgba(34,32,31,.05),0 2px 8px rgba(34,32,31,.04);margin-bottom:16px;}
.rec-migas{display:flex;align-items:center;gap:8px;margin-bottom:14px;font-size:14px;}
.rec-migas a{color:var(--terra);text-decoration:none;font-weight:600;cursor:pointer;}
.rec-migas span{color:var(--gray);}
.rec-lbl{display:block;font-size:10.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--gray);margin-bottom:6px;}
.rec-buscar{width:100%;font:inherit;font-size:15px;padding:11px 14px;border-radius:10px;border:1px solid var(--cream-dark);background:var(--cream);color:var(--black);outline:none;margin-bottom:16px;}
.rec-buscar:focus{border-color:var(--terra);background:var(--white);}
.rec-cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;}
.rec-cat{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:18px 16px;border-radius:var(--r);border:1.5px solid var(--cream-dark);background:var(--cream);cursor:pointer;font-family:inherit;text-align:left;transition:all .2s;}
.rec-cat:hover{border-color:var(--terra);background:var(--white);transform:translateY(-2px);box-shadow:var(--shadow);}
.rec-cat b{font-size:15px;color:var(--black);}
.rec-cat-ico{font-size:30px;line-height:1;margin-bottom:6px;}
.rec-sub{font-size:11px;color:var(--gray);font-weight:400;}
.rec-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;}
.rec-pie-lista{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:12px;}
.rec-pie-lista button{background:none;border:none;color:var(--terra);font-weight:600;font-size:12px;cursor:pointer;padding:4px 0;}
.giro{perspective:1200px;height:300px;}
.giro-in{position:relative;width:100%;height:100%;transition:transform .6s cubic-bezier(.25,.8,.25,1);transform-style:preserve-3d;cursor:pointer;border-radius:var(--r);outline:none;}
.giro-in:focus-visible{box-shadow:0 0 0 3px rgba(225,93,70,.35);}
.giro.girada .giro-in{transform:rotateY(180deg);}
.cara{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:var(--r);background:var(--white);border:1px solid rgba(34,32,31,.08);box-shadow:0 1px 3px rgba(34,32,31,.06);overflow:hidden;display:flex;flex-direction:column;}
.frente:hover{box-shadow:var(--shadow);}
.frente .rec-foto{flex:1;min-height:0;background:var(--cream);display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:56px;}
.frente .rec-foto .sinfoto{opacity:.55;}

<template id="sugerido-organigrama-v2">
<h2>Para qué sirve</h2>
<p>Para saber <b>a quién recurrir</b> ante cada situación, no para marcar jerarquías. En un negocio de este tamaño, el organigrama es un mapa, no una pirámide.</p>

<h2>1. La estructura</h2>
<div class="org">
<div class="org-cima">
<div class="org-nodo org-dir"><b>Dirección</b><span>El dueño · conducción del negocio</span></div>
<div class="org-linea"></div>
<div class="org-nodo org-ger"><b>Gerencia</b><span>Cande · personas, decisiones e informes de turno</span></div>
</div>
<div class="org-ramas">
<div class="org-rama org-c1"><b>Administración</b><span>Dinero, pagos a proveedores, sobres de depósito y diferencias de caja</span></div>
<div class="org-rama org-c6"><b>Compras</b><span>Una persona</span><ul><li>Insumos</li><li>Reparto de mercadería</li><li>Vehículo</li></ul></div>
<div class="org-rama org-c2"><b>Locales de venta</b><span>San Luis y SLA 5.0 · atención al público</span><ul><li>Cajeros</li><li>Vendedores y mozos</li><li>Baristas</li></ul><span class="org-rol">⭐ <b>Experto del turno</b>: un rol que rota entre ellos, no un nivel más.</span></div>
<div class="org-rama org-c3"><b>Cocina de locales</b><span>Las cocinas de San Luis y de SLA 5.0</span><ul><li>Jefe de cocina<ul><li>Uno para los dos locales</li></ul></li><li>Cocineros</li><li>Ayudante de cocina</li></ul></div>
<div class="org-rama org-c4"><b>Cuadra de producción</b><span>Un maestro por área</span><ul><li>Maestro de área<ul><li>Panadería</li><li>Pastelería</li><li>Facturería</li><li>Especialidades</li><li>Sándwiches</li></ul></li></ul></div>
<div class="org-rama org-c5"><b>Limpieza</b><span>Local San Luis y cuadra de producción</span></div>
</div>
</div>

<h2>2. Quién es quién</h2>
<div class="tabla"><table><thead><tr><th>Nivel</th><th>Quién</th><th>De qué responde</th></tr></thead><tbody>
<tr><td>Dirección</td><td>El dueño</td><td>La conducción del negocio</td></tr>
<tr><td>Gerencia</td><td>Cande. Está por encima de todos los puestos y por debajo de Dirección</td><td>Personas, decisiones e informes de turno</td></tr>
<tr><td>Administración</td><td>A definir</td><td>Dinero, pagos a proveedores, sobres de depósito, diferencias de caja</td></tr>
<tr><td>Compras</td><td>Una persona</td><td>Insumos, reparto de mercadería y vehículo</td></tr>
<tr><td>Locales de venta</td><td>San Luis y SLA 5.0</td><td>Atención al público: caja, mostrador, salón y barra</td></tr>
<tr><td>Cocina de locales</td><td>Un jefe de cocina para los dos locales, cocineros y ayudante de cocina</td><td>Las cocinas de San Luis y de SLA 5.0</td></tr>
<tr><td>Cuadra de producción</td><td>Un maestro por área</td><td>Panadería, Pastelería, Facturería, Especialidades y Sándwiches</td></tr>
<tr><td>Limpieza</td><td>A definir</td><td>Local San Luis y cuadra de producción</td></tr>
</tbody></table></div>

<h2>3. El Experto del turno no es un nivel</h2>
<div class="cuadro cuadro-regla"><p><b>El Experto no está "arriba" de sus compañeros.</b> Es un rol dentro del turno, no un escalón del organigrama. Rota, lo ocupa gente de distintos puestos, y hoy es uno y mañana otro.</p></div>
<p>Sigue siendo cajero, vendedor, mozo o barista. Lo que tiene es la responsabilidad de que ese turno salga bien, y por eso es a quien se recurre primero. Lo elige Gerencia por desempeño y cobra un bono aparte.</p>
<p>En la cuadra de producción no hay Experto del turno: cada área tiene su maestro.</p>

<h2>4. A quién recurrir</h2>
<div class="tabla"><table><thead><tr><th>Si necesitás…</th><th>Andá a</th></tr></thead><tbody>
<tr><td>Resolver algo del turno · una duda · un conflicto con un cliente</td><td>Experto del turno</td></tr>
<tr><td>Autorizar una devolución · devolver dinero a un cliente</td><td>Gerencia</td></tr>
<tr><td>Algo sobre tu turno, tu franco o tu sueldo</td><td>Gerencia</td></tr>
<tr><td>Plantear un problema con un compañero</td><td>Experto del turno</td></tr>
<tr><td>Plantear un problema con el Experto</td><td>Administración, directamente (ver Código de ética)</td></tr>
<tr><td>Acoso, discriminación o maltrato</td><td>Administración, directamente (ver Código de ética)</td></tr>
<tr><td>Dinero para pagar un proveedor · una diferencia de caja</td><td>Administración</td></tr>
<tr><td>Un insumo que falta</td><td>Cargalo en la Web de Pedidos de Producción. Lo compra Compras</td></tr>
<tr><td>Algo que se rompió o no funciona</td><td>Experto del turno, que lo pasa al informe</td></tr>
<tr><td>Algo del vehículo</td><td>Compras, que es responsable del vehículo</td></tr>
</tbody></table></div>

<h2>5. Cómo circula la información</h2>
<div class="org-flujo"><span class="org-paso">El equipo</span><span class="org-flecha">→</span><span class="org-paso">Experto del turno</span><span class="org-flecha">→</span><span class="org-paso">Informe diario</span><span class="org-flecha">→</span><span class="org-paso org-fin">Gerencia</span><span class="org-flecha">→</span><span class="org-paso">Habla con la persona, si hace falta</span></div>
<ul>
<li>Cada turno envía su informe. Hay un Experto por turno en cada local, y cada uno deja el suyo.</li>
<li>Solo Gerencia lee los informes. Ningún otro rol tiene acceso.</li>
<li>Gerencia es quien habla con la persona si hace falta. <b>El Experto informa, no sanciona.</b></li>
</ul>

<h2>Pendientes de definición</h2>
<p>☐ Confirmar el nombre de Dirección para el dueño, para no confundirlo con Gerencia. Si un manual dice "avisá a Gerencia", nadie tiene que dudar de a quién.</p>
<p>☐ Quién ocupa Administración, y si es la misma persona que Gerencia en algún momento del día.</p>
<p>☐ A quién reporta el maestro de área: directo a Gerencia o a través de Administración.</p>
<p>☐ Si hay más de un turno en la cuadra de producción, y si cada turno tiene su maestro.</p>

<h2>Documentos relacionados</h2>
<ul><li>Experto del turno</li><li>Código de ética y convivencia</li><li>Jefe de cocina</li><li>Maestro de área</li><li>Compras</li></ul>
</template>
<template id="sugerido-club-candela">
<h2>1. Objetivo</h2>
<p>Explicar paso a paso cómo funciona el <b>Club Candela</b>, el programa de beneficios para clientes, y qué hace cada persona del equipo: cómo se suma un cliente, cómo se entregan los premios y el cupón de bienvenida, cómo se ayuda a un cliente que perdió el acceso a su tarjeta y cómo se usan la base de clientes y los vouchers.</p>
<div class="cuadro cuadro-nota"><p><b>En pocas palabras:</b> el cliente escanea el QR de la mesa o del mostrador y suma <b>1 sello por día</b>. Con <b>10 visitas</b> se lleva <b>una merienda gratis</b>. Al registrarse, además, gana <b>1 medialuna para llevar</b> si nos sigue en Instagram (@candelacafe.salta).</p></div>

<h2>2. Dónde se usa</h2>
<div class="tabla"><table><thead><tr><th>Pantalla</th><th>Quién la usa</th><th>Para qué</th></tr></thead><tbody>
<tr><td>Tarjeta del cliente (se abre con el QR de mesa)</td><td>Cliente, desde su celular</td><td>Registrarse, sumar el sello del día, ver su tarjeta, su código y su cupón de bienvenida.</td></tr>
<tr><td>⭐ Club (sistema de Pedidos de Clientes)</td><td>Caja, experto del turno y Gerencia</td><td>Buscar clientes, entregar premios y cupones, asignar PIN, imprimir los QR y configurar el programa.</td></tr>
<tr><td>👥 Clientes (mismo sistema)</td><td>Experto del turno y Gerencia</td><td>Ver la base unificada de clientes (pedidos + Club), filtrar y exportar a CSV.</td></tr>
<tr><td>🎟️ Vouchers (mismo sistema)</td><td>Caja y Gerencia</td><td>Validar, canjear, generar y anular vouchers de regalo o vendidos.</td></tr>
</tbody></table></div>

<h2>3. Quién hace qué</h2>
<div class="tabla"><table><thead><tr><th>Rol</th><th>Responsabilidad en el Club</th></tr></thead><tbody>
<tr><td>Cliente</td><td>Escanea el QR, se registra una sola vez y suma su sello en cada visita. Muestra su código en caja para canjear.</td></tr>
<tr><td>Vendedores y mozos</td><td>No suman sellos ni canjean nada. Invitan al cliente a sumarse al Club, le explican cómo funciona y lo mandan a caja para canjear.</td></tr>
<tr><td>Cajero/a</td><td>Entrega premios y cupones de bienvenida, asigna PIN y valida vouchers desde el sistema.</td></tr>
<tr><td>Experto del turno</td><td>Resuelve casos raros, controla que los QR estén en todas las mesas y revisa la base de clientes.</td></tr>
<tr><td>Gerencia / administradora</td><td>Configura el premio, los límites y los locales, habilita las cuentas del personal y es la única que puede borrar clientes.</td></tr>
</tbody></table></div>

<h2>4. Conceptos clave</h2>
<div class="tabla"><table><thead><tr><th>Concepto</th><th>Qué es</th></tr></thead><tbody>
<tr><td>Sello</td><td>Una visita. Se suma solo cuando el cliente escanea el QR: <b>1 por día</b>, hasta <b>4 por semana</b> y únicamente en horario de atención (7 a 21 h). Se marca con el isotipo de Candela.</td></tr>
<tr><td>Tarjeta</td><td>Réplica digital de la tarjeta física: 10 casilleros. Con 10 sellos hay premio.</td></tr>
<tr><td>Premio</td><td>Una merienda gratis (lo define Gerencia). Al entregarlo se descuentan 10 sellos.</td></tr>
<tr><td>Código de 3 palabras</td><td>El “alias” de cada cliente, por ejemplo <b>TORTA.LUNA.CANELA</b>. Aparece en el recuadro rojo de su tarjeta. Es lo que se tipea en caja. No importan mayúsculas, puntos ni espacios.</td></tr>
<tr><td>PIN</td><td>4 números que elige el cliente. Con su WhatsApp y su PIN abre la tarjeta desde cualquier celular.</td></tr>
<tr><td>Cupón de bienvenida</td><td>1 medialuna para llevar por seguir a @candelacafe.salta. Solo para clientes nuevos y solo el día en que se registran.</td></tr>
</tbody></table></div>
<div class="cuadro cuadro-regla"><p><b>Nadie suma sellos a mano.</b> El sello lo suma el cliente escaneando el QR. Si alguien te pide que le sumes un sello, explicale que tiene que escanear el QR de la mesa o del mostrador.</p></div>

<h2>5. Cómo se suma un cliente (para explicarle)</h2>
<ol>
<li>Escanea con la cámara del celular el QR de la mesa o del mostrador.</li>
<li>La primera vez toca <b>“Soy nuevo, quiero registrarme”</b> y completa: nombre, WhatsApp (código de área sin 0 y número sin 15), cumpleaños (opcional, ¡hay regalo!) y un <b>PIN de 4 números</b>. Toca <b>Crear mi tarjeta</b>.</li>
<li>Se suma el sello del día: la tarjeta gira y el isotipo cae en el casillero.</li>
<li>Unos segundos después le aparece el cartel del <b>regalo de bienvenida</b> (ver punto 8).</li>
<li>En las próximas visitas solo escanea el QR y se suma el sello.</li>
<li>Si cambia de celular o el QR se abre en otro navegador, toca <b>“¿Ya tenés tarjeta?”</b> y entra con su WhatsApp y su PIN: ve todos sus sellos.</li>
</ol>
<p>Conviene que guarde el link de la tarjeta en favoritos ⭐ para volver a verla.</p>
<div class="cuadro cuadro-atencion"><p><b>Ojo:</b> si abre el QR desde la cámara de Instagram, WhatsApp, Google Lens, en modo incógnito o después de borrar los datos del navegador, le va a pedir registrarse aunque ya tenga tarjeta. No tiene que crear otra: que toque <b>“¿Ya tenés tarjeta?”</b>. Cada WhatsApp tiene una sola tarjeta.</p></div>

<h2>6. Entrar a ⭐ Club (personal)</h2>
<ol>
<li>Abrí el sistema de <b>Pedidos de Clientes</b> y tocá <b>⭐ Club</b>.</li>
<li>Ingresá con el email y la contraseña de la cuenta del personal.</li>
<li>Vas a ver tres pestañas: <b>🔎 Atender</b>, <b>🖨️ QR de mesas</b> y <b>⚙️ Configuración</b>.</li>
</ol>
<p>Si aparece <b>“Cuenta no habilitada”</b>, avisá a Gerencia: esa cuenta todavía no tiene permiso de personal.</p>
<div class="cuadro cuadro-prohibido"><p><b>Prohibido</b> pasar la contraseña del personal o abrir el sistema en el celular de un cliente. Si un cliente abre su tarjeta en un navegador con la sesión del personal, le aparece el aviso “Sesión del personal abierta”: la tarjeta se usa siempre desde el celular del cliente.</p></div>

<h2>7. Entregar el premio (merienda gratis)</h2>
<ol>
<li>El cliente avisa que completó la tarjeta (en su celular dice “¡Completaste tu tarjeta!”).</li>
<li>Entrá a <b>⭐ Club → 🔎 Atender</b>.</li>

// ── Registro con link de invitación ─────────────────────
// Gerencia comparte un link por rol; cada persona elige su usuario y su contraseña y queda
// "pendiente" hasta que Gerencia la aprueba con un toque. La cuenta se crea con una instancia
// aparte de Firebase para poder escribir la solicitud antes de entrar con la sesión normal.
async function registrarme({ nombre, usuario, pass, pass2 }) {
  nombre = String(nombre || "").trim(); usuario = normalizarUsuario(usuario);
  if (!INVITACION) throw new Error("Falta el link de invitación: pedíselo a Gerencia.");
  if (nombre.length < 3) throw new Error("Escribí tu nombre y apellido.");
  if (usuario.length < 3) throw new Error("El usuario tiene que tener al menos 3 letras o números.");
  if (usuario === "gerencia") throw new Error("Ese usuario está reservado.");
  if (String(pass || "").length < 6) throw new Error("La contraseña tiene que tener al menos 6 caracteres.");
  if (pass !== pass2) throw new Error("Las dos contraseñas no coinciden.");
  const k = await claveUsuario(usuario);
  if ((await get(ref(db, `manuales/login/${k}`))).val()) throw new Error(`El usuario «${usuario}» ya existe. Probá con otro (por ejemplo, agregale la inicial del apellido).`);
  const email = emailNuevo();
  const app2 = initializeApp(firebaseConfig, "registro-" + Date.now());
  try {
    const a2 = getAuth(app2);
    try { await setPersistence(a2, inMemoryPersistence); } catch {}
    const cred = await createUserWithEmailAndPassword(a2, email, pass);
    const db2 = getDatabase(app2);
    try {
      await set(ref(db2, `manuales/solicitudes/${cred.user.uid}`), { nombre, usuario, email, codigo: INVITACION, ts: Date.now() });
    } catch (e) {
      try { await deleteUser(cred.user); } catch {}
      throw new Error("El link de invitación no es válido o Gerencia lo desactivó. Pedile uno nuevo.");
    }
    try { await set(ref(db2, `manuales/login/${k}`), email); }
    catch (e) {
      try { await remove(ref(db2, `manuales/solicitudes/${cred.user.uid}`)); } catch {}
      try { await deleteUser(cred.user); } catch {}
      throw new Error(`El usuario «${usuario}» ya existe. Probá con otro.`);
    }
    try { await signOut(a2); } catch {}
  } finally {
    try { await deleteApp(app2); } catch {}
  }
  await signInWithEmailAndPassword(auth, email, pass);
}

// Limpieza del HTML: solo etiquetas y atributos de texto. Nada de scripts, estilos, eventos ni
// enlaces javascript:. Se aplica al importar y otra vez al mostrar.
const TAGS_OK = new Set(["P", "H1", "H2", "H3", "H4", "H5", "H6", "STRONG", "B", "EM", "I", "U", "S", "UL", "OL", "LI", "TABLE", "THEAD", "TBODY", "TR", "TD", "TH", "BR", "IMG", "A", "SPAN", "DIV", "SUP", "SUB", "BLOCKQUOTE", "CODE", "PRE", "HR"]);
const ATTRS_OK = { A: ["href"], IMG: ["src", "alt"], TD: ["colspan", "rowspan"], TH: ["colspan", "rowspan"] };
function limpiarHtml(html) {
  const doc = new DOMParser().parseFromString(`<div>${html}</div>`, "text/html");
  const raiz = doc.body.firstChild;
  const recorrer = el => {
    for (const n of [...el.childNodes]) {
      if (n.nodeType === 8) { n.remove(); continue; }
      if (n.nodeType !== 1) continue;
      if (!TAGS_OK.has(n.tagName)) {
        if (["SCRIPT", "STYLE", "IFRAME", "OBJECT", "EMBED", "LINK", "META", "TEMPLATE", "SVG", "MATH", "FORM", "NOSCRIPT"].includes(n.tagName)) { n.remove(); continue; }
        recorrer(n); n.replaceWith(...n.childNodes); continue;
      }
      for (const a of [...n.attributes]) {
        const nom = a.name.toLowerCase();
        const permitido = (ATTRS_OK[n.tagName] || []).includes(nom) || nom === "id" || nom === "class";
        if (!permitido) { n.removeAttribute(a.name); continue; }
        if (nom === "class") {
          const ok = a.value.split(/\s+/).filter(c => /^(cuadro|cuadro-(regla|prohibido|atencion|pendiente|nota)|tabla|org|org-[a-z0-9]+)$/.test(c));
          if (ok.length) n.setAttribute("class", ok.join(" ")); else n.removeAttribute("class");
          continue;
        }
        if (nom === "href" && !/^(https?:|mailto:|#)/i.test(a.value.trim())) n.removeAttribute(a.name);
        if (nom === "src" && !/^(data:image\/(png|jpe?g|gif|webp);base64,|https:)/i.test(a.value.trim())) n.removeAttribute(a.name);
      }
      if (n.tagName === "A" && n.getAttribute("href") && !n.getAttribute("href").startsWith("#")) { n.setAttribute("target", "_blank"); n.setAttribute("rel", "noopener"); }
      recorrer(n);
    }
  };
  recorrer(raiz);
  return raiz.innerHTML;
}

const TIPOS_CUADRO = { f9ddd8: "regla", fdecea: "prohibido", fffbe6: "atencion", f0eee2: "pendiente", f7f5ea: "nota" };
const NOMBRE_CUADRO = { regla: "Regla", prohibido: "Nunca", atencion: "Atención", pendiente: "Pendiente de definir", nota: "Nota" };
const FONDO_ENCABEZADO = "e5e1cc";
function tipoPorTexto(t) {
  if (/Prohibid|PROHIBID|Nunca se|no se negocia|Lo que nunca/.test(t)) return "prohibido";
  if (/Atención|Ojo|Importante/.test(t)) return "atencion";
  if (/A definir|Pendiente|Borrador|falta definir/.test(t)) return "pendiente";
  if (/La regla|Regla de oro/.test(t)) return "regla";
  return "nota";
}
function colorDeCss(style) {
  const m = /background(?:-color)?\s*:\s*#?([0-9a-f]{6})/i.exec(style || "");
  return m ? m[1].toLowerCase() : null;
}
// Los colores de los cuadros (regla, prohibido…) y de los encabezados de tabla viven en el
// sombreado de las celdas del .docx, que el conversor no conserva: se leen directo del XML, en
// el mismo orden en que aparecen las tablas.
async function coloresTablasDocx(buf) {
  const JSZip = await cargarScript("JSZip");
  const zip = await JSZip.loadAsync(buf);
  const xml = await zip.file("word/document.xml").async("string");
  const d = new DOMParser().parseFromString(xml, "application/xml");
  const W = "http://schemas.openxmlformats.org/wordprocessingml/2006/main";
  const hijos = (n, nom) => [...n.childNodes].filter(c => c.localName === nom);
  const fill = tc => {
    if (!tc) return null;
    const pr = hijos(tc, "tcPr")[0];
    const shd = pr && hijos(pr, "shd")[0];
    const f = shd && (shd.getAttributeNS(W, "fill") || shd.getAttribute("w:fill"));
    return f && /^[0-9a-f]{6}$/i.test(f) ? f.toLowerCase() : null;
  };
  return [...d.getElementsByTagNameNS(W, "tbl")].map(t => {
    const filas = hijos(t, "tr");
    const celdas = filas[0] ? hijos(filas[0], "tc") : [];
    return { filas: filas.length, celdas: celdas.length, fill: fill(celdas[0]) };
  });
}
async function htmlDeArchivo(nombre, buf) {
  if (/\.docx$/i.test(nombre)) {
    const mammoth = await cargarScript("mammoth");
    const r = await mammoth.convertToHtml({ arrayBuffer: buf }, {
      styleMap: ["p[style-name='Title'] => h1:fresh", "p[style-name='Subtitle'] => p:fresh", "p[style-name='Título'] => h1:fresh"],
    });
    let colores = [];
    try { colores = await coloresTablasDocx(buf); } catch (e) { console.warn("colores", e); }
    return { html: r.value, colores };
  }
  if (/\.html?$/i.test(nombre)) return { html: new TextDecoder("utf-8").decode(buf), colores: null };
  throw new Error("Formato no soportado: subí el .docx (o el .html) del manual.");
}

// Arma los manuales: uno por cada Título 1. Los "Parte N — …" son separadores de grupo; la
// portada (antes de la primera parte) queda como "Cómo usar este manual", sin el índice.
function procesarDocumento(html, colores) {
  const doc = new DOMParser().parseFromString(html, "text/html");
  const tablas = [...doc.body.querySelectorAll("table")];
  const avisos = [];
  const usarColores = colores && colores.length === tablas.length;
  if (colores && !usarColores) avisos.push(`No coincidió la cantidad de tablas (${tablas.length} contra ${colores.length}): el tipo de cada cuadro se dedujo por el texto.`);
  tablas.forEach((t, i) => {
    const filas = t.rows.length, celdas = filas ? t.rows[0].cells.length : 0;
    const fill = usarColores ? colores[i].fill : colorDeCss(t.rows[0]?.cells[0]?.getAttribute("style")) || colorDeCss(t.rows[0]?.cells[0]?.getAttribute("bgcolor") ? "background:" + t.rows[0].cells[0].getAttribute("bgcolor") : "");
    if (filas === 1 && celdas === 1) {
      const tipo = TIPOS_CUADRO[fill] || tipoPorTexto(t.textContent);
      const div = doc.createElement("div");
      div.className = `cuadro cuadro-${tipo}`;
      div.innerHTML = t.rows[0].cells[0].innerHTML;
      t.replaceWith(div);
      return;
    }
    // Encabezado: la primera fila (toda tabla de los manuales tiene una).
    if (filas > 1 && !t.querySelector("th")) {
      const thead = doc.createElement("thead");
      const tr = doc.createElement("tr");
      for (const c of [...t.rows[0].cells]) { const th = doc.createElement("th"); th.innerHTML = c.innerHTML; for (const a of ["colspan", "rowspan"]) if (c.getAttribute(a)) th.setAttribute(a, c.getAttribute(a)); tr.appendChild(th); }
      thead.appendChild(tr);
      t.rows[0].remove();
      t.insertBefore(thead, t.firstChild);
    }
    const w = doc.createElement("div"); w.className = "tabla";
    t.replaceWith(w); w.appendChild(t);
  });
  // Párrafos vacíos (separadores), saltos de página y líneas hechas con guiones bajos: cada sección ya tiene su raya.
  for (const p of [...doc.body.querySelectorAll("p")]) {
    const t = p.textContent.trim();
    if ((!t && !p.querySelector("img")) || /^[_\-—–=·.\s]{5,}$/.test(t)) p.remove();
  }
  doc.body.querySelectorAll("hr").forEach(h => h.remove());

  const nodos = [...doc.body.childNodes].filter(n => n.nodeType === 1);
  const manuales = [];
  let parte = { nombre: "Inicio", descripcion: "", orden: 0, interna: false };
  let actual = null, enParte = false, partesVistas = 0;
  const cerrar = () => { if (actual) { manuales.push(actual); actual = null; } };
  for (const n of nodos) {
    if (n.tagName === "H1") {
      cerrar();
      const t = n.textContent.replace(/\s+/g, " ").trim();
      const mp = /^Parte\s+(\d+)\s*[—–\-:.]\s*(.+)$/i.exec(t);
      if (mp) {
        partesVistas++;
        parte = { nombre: mp[2].trim(), descripcion: "", orden: Number(mp[1]) || partesVistas, interna: /gu[ií]as internas/i.test(mp[2]) };
        enParte = true;
        continue;
      }
      enParte = false;
      actual = { titulo: t, parte, nodos: [], portada: partesVistas === 0 };
      continue;
    }
    if (enParte) {
      // Bajada de la parte: el primer párrafo. El resto (la lista de manuales) se descarta.
      if (!parte.descripcion && n.tagName === "P") {
        parte.descripcion = n.textContent.trim();
        if (/no se reparten/i.test(parte.descripcion)) parte.interna = true;
      }
      continue;
    }
    if (actual) actual.nodos.push(n);
    else if (n.tagName === "H2" || manuales.length || n.textContent.trim()) {
      // Contenido antes de cualquier Título 1: se agrupa en la portada.
      actual = { titulo: "Cómo usar este manual", parte, nodos: [n], portada: true };
    }
  }
  cerrar();

  const ids = new Set();
  const salida = [];
  manuales.forEach((m, i) => {
    let nodosM = m.nodos;
    if (m.portada) {
      // Portada: se saltea la carátula (lo que está antes del primer H2) y la sección "Índice".
      const iH2 = nodosM.findIndex(n => n.tagName === "H2");
      nodosM = iH2 >= 0 ? nodosM.slice(iH2) : nodosM;
      const out = []; let saltar = false;
      for (const n of nodosM) {
        if (n.tagName === "H2") saltar = /^[ÍI]ndice$/i.test(n.textContent.trim());
        if (!saltar) out.push(n);
      }
      nodosM = out;
      if (!nodosM.length) return;
      if (/^Manuales de Procedimientos$/i.test(m.titulo)) m.titulo = "Cómo usar este manual";
    }
    // Línea de versión: "Versión 2.1 · Septiembre 2026 · Aplica a San Luis y SLA 5.0"
    let version = "", aplicaA = "";
    const iv = nodosM.slice(0, 3).findIndex(n => n.tagName === "P" && /^Versi[oó]n\b/i.test(n.textContent.trim()));
    if (iv >= 0) {
      const t = nodosM[iv].textContent.replace(/\s+/g, " ").trim();
      const ma = /Aplica a\s+(.+)$/i.exec(t);
      aplicaA = ma ? ma[1].trim() : "";
      version = t.replace(/\s*·\s*Aplica a.+$/i, "").trim();
      nodosM = nodosM.filter((_, j) => j !== iv);
    }
    const cont = doc.createElement("div");
    nodosM.forEach(n => cont.appendChild(n.cloneNode(true)));
    let k = 0;
    const secciones = [];
    cont.querySelectorAll("h2,h3").forEach(h => { h.id = `s${++k}`; if (h.tagName === "H2") secciones.push({ id: h.id, t: h.textContent.trim().slice(0, 80) }); });
    let id = slug(m.titulo); let n2 = 2; while (ids.has(id)) id = `${slug(m.titulo)}-${n2++}`; ids.add(id);
    const html = limpiarHtml(cont.innerHTML);
    const texto = cont.textContent.replace(/\s+/g, " ").trim();
    salida.push({ id, titulo: m.titulo, parte: m.parte.nombre, parteDescripcion: m.parte.descripcion, parteOrden: m.parte.orden, orden: i,
      visible: !m.parte.interna, version, aplicaA, secciones, html, texto, palabras: texto ? texto.split(" ").length : 0 });
  });
  if (!salida.length) avisos.push("No se encontraron manuales: el documento tiene que usar «Título 1» para el nombre de cada manual.");
  return { manuales: salida, avisos };
}

async function elegirArchivo(file) {
  if (!file) return;
  S.importando = true; S.importacion = null; pintar();
  try {
    const buf = await file.arrayBuffer();
    const { html, colores } = await htmlDeArchivo(file.name, buf);
    const r = procesarDocumento(html, colores);
    for (const m of r.manuales) m.hash = (await sha256(m.html)).slice(0, 16);
    // Si ya había manuales, se respeta la visibilidad que eligió Gerencia.
    for (const m of r.manuales) if (S.indice[m.id] && typeof S.indice[m.id].visible === "boolean") m.visible = S.indice[m.id].visible;
    S.importacion = { archivo: file.name, tamano: file.size, ...r };
  } catch (e) {
    console.error(e);
    S.importacion = { error: e.message || String(e) };
  } finally {
    S.importando = false; pintar();
  }
}

async function darDeAlta({ nombre, usuario, pass, roles }) {

  { id: "cajero", nombre: "Cajero/a", claves: ["cajeros"] },

  { id: "ayudante-de-cocina", nombre: "Ayudante de cocina", claves: ["ayudante de cocina"], recetario: true },
  { id: "maestro-de-area", nombre: "Maestro/a de área", claves: ["maestro de area", "panaderia", "pasteleria", "factureria", "especialidades", "sandwiches", "bases"] },

  { id: "limpieza", nombre: "Limpieza", claves: ["limpieza"] },
];
function esComun(m) { return /^(inicio|documentos comunes)$/i.test(clave(m.parte)); }
function rolesSugeridos() {
  const lista = Object.entries(S.indice || {}).map(([id, m]) => ({ id, ...m }));
  const out = {};
  ROLES_SUGERIDOS.forEach((r, i) => {
    const manuales = {};
    for (const m of lista) {
      if (m.visible === false) continue;
      if (esComun(m) || r.claves.some(k => clave(m.titulo).startsWith(k))) manuales[m.id] = true;
    }
    out[r.id] = { nombre: r.nombre, manuales, recetario: !!r.recetario, orden: i };
  });
  return out;
}
// Lo que puede ver alguien con estos roles. Se guarda en personal/{uid}/accesos: es lo que
// revisan las reglas (no pueden recorrer los roles en cada lectura).
function accesosDe(roles, rolesDef = S.roles) {
  const manuales = {}; let recetario = false; const nombres = [];
  for (const rid of Object.keys(roles || {})) {
    const r = rolesDef[rid]; if (!r) continue;
    nombres.push(r.nombre);
    Object.keys(r.manuales || {}).forEach(id => { manuales[id] = true; });
    if (r.recetario) recetario = true;
  }
  return { manuales, recetario, roles: nombres };
}
// Rutas para actualizar los accesos de todos los que tienen alguno de estos roles.
function updAccesos(rolesDef, rolIds) {
  const upd = {};
  for (const [uid, p] of Object.entries(S.personal || {})) {
    if (!Object.keys(p.roles || {}).some(r => rolIds.includes(r))) continue;
    upd[`personal/${uid}/accesos`] = accesosDe(p.roles, rolesDef);
  }
  return upd;
}
async function crearRolesSugeridos() {
  const sug = rolesSugeridos();
  const nuevos = Object.fromEntries(Object.entries(sug).filter(([id]) => !S.roles[id]));
  if (!Object.keys(nuevos).length) { toast("Ya están todos los roles sugeridos."); return; }
  await update(ref(db, "manuales"), Object.fromEntries(Object.entries(nuevos).map(([id, r]) => [`roles/${id}`, r])));
  S.roles = { ...S.roles, ...nuevos };
  toast(`✓ ${Object.keys(nuevos).length} roles creados. Revisalos y ajustá lo que haga falta.`);
  pintar();
}
async function guardarRol(rid, { nombre, manuales, recetario }) {
  nombre = String(nombre || "").trim();
  if (!nombre) throw new Error("El rol necesita un nombre.");
  const id = rid || (() => { let b = slug(nombre), id = b, n = 2; while (S.roles[id]) id = `${b}-${n++}`; return id; })();
  const orden = S.roles[id]?.orden ?? Object.keys(S.roles).length;
  const rol = { nombre, manuales: manuales || {}, recetario: !!recetario, orden };
  const rolesDef = { ...S.roles, [id]: rol };
  await update(ref(db, "manuales"), { [`roles/${id}`]: rol, ...updAccesos(rolesDef, [id]) });
  S.roles = rolesDef;
  for (const [uid, p] of Object.entries(S.personal)) if (p.roles?.[id]) S.personal[uid] = { ...p, accesos: accesosDe(p.roles, rolesDef) };

// Checklists (☐) tildables mientras se usan en el turno; marcas de búsqueda dentro del texto.
function htmlParaMostrar(html, buscar) {
  let h = limpiarHtml(html || "");
  const d = new DOMParser().parseFromString(`<div>${h}</div>`, "text/html");
  // En el celular cada fila de tabla se muestra como tarjeta: cada celda lleva el nombre de su columna.
  d.querySelectorAll("table").forEach(t => {
    const filas = [...t.rows];
    if (!filas.length || (filas.length === 1 && filas[0].cells.length === 1)) return;
    if (filas.length > 1 && !t.querySelector("th")) {
      const thead = d.createElement("thead"), tr = d.createElement("tr");
      for (const c of [...filas[0].cells]) { const th = d.createElement("th"); th.innerHTML = c.innerHTML; for (const a of ["colspan", "rowspan"]) if (c.getAttribute(a)) th.setAttribute(a, c.getAttribute(a)); tr.appendChild(th); }
      thead.appendChild(tr); filas[0].remove(); t.insertBefore(thead, t.firstChild);
    }
    const cab = t.tHead && t.tHead.rows[0] ? [...t.tHead.rows[0].cells].map(c => c.textContent.trim()) : null;
    const cols = Math.max(...filas.map(f => f.cells.length));
    t.classList.add("apilada"); if (cols <= 2) t.classList.add("dos-col");
    if (cab) [...t.tBodies].forEach(tb => [...tb.rows].forEach(f => [...f.cells].forEach((c, i) => { if (cab[i]) c.setAttribute("data-label", cab[i]); })));
  });
  if (buscar) {
    const k = clave(buscar);
    const w = d.createTreeWalker(d.body, NodeFilter.SHOW_TEXT);
    const nodos = []; while (w.nextNode()) nodos.push(w.currentNode);
    for (const t of nodos) {
      const i = clave(t.nodeValue).indexOf(k);
      if (i < 0) continue;
      const m = d.createElement("mark");
      const resto = t.splitText(i); resto.splitText(buscar.length);
      m.textContent = resto.nodeValue; resto.replaceWith(m);
    }
  }
  h = d.body.firstChild.innerHTML;
  let n = 0;
  h = h.replace(/<p>\s*☐\s*([\s\S]*?)<\/p>/g, (_, r) => `<p class="check" data-check="${n++}"><input type="checkbox" tabindex="-1"><span>${r}</span></p>`);
  return h;
}

function activarIndice() {

function marcarSeccion() {
  const nav = document.querySelector(".indice");
  if (!nav || !_secciones.length) return;
  let actual = _secciones[0];
  for (const h of _secciones) { if (h.getBoundingClientRect().top < 160) actual = h; else break; }
  const a = nav.querySelector(`a[data-sec="${actual.id}"]`);
  if (!a || a.classList.contains("on")) return;
  nav.querySelectorAll("a.on").forEach(x => x.classList.remove("on"));
  a.classList.add("on");

// ── Editor de manuales (Gerencia) ───────────────────────

const BORRADOR_MS = 1500;

function claveBorrador(e) { return e.id || e.nuevoKey; }

// Manuales escritos fuera del sitio y listos para sumar (el contenido está en un <template>).

const SUGERIDOS = [

    descripcion: "Tarjeta de sellos, cupón de bienvenida, PIN, QR de mesas, base de clientes y vouchers, paso a paso.",
    aplicaA: "Cajeros, experto del turno, vendedores y mozos", roles: ["cajero", "experto-del-turno", "vendedor-mozo"] },

  if (!esGerencia()) return [];

async function abrirSugerido(claveSug) {

    await abrirEditor(destino[0], null, { origen: x.clave, html: document.getElementById("sugerido-" + x.clave).innerHTML.trim(), version: `Versión ${x.version || "2.0"} · ${mes}`,

    aplicaA: x.aplicaA || "", visible: true, roles: Object.fromEntries((x.roles || []).filter(r => S.roles[r]).map(r => [r, true])), html,

async function descartarSugerido(claveSug) {

async function abrirEditor(id, borradorKey, cambios) {
  let e;

    const b = S.borradores[borradorKey];
    e = { ...b, id: b.id || null, nuevoKey: b.id ? null : borradorKey, recuperado: b.guardadoEn };
  } else if (id) {
    const m = S.indice[id];
    if (!m) return;
    const html = await cargarHtml(id);
    e = { id, titulo: m.titulo, parte: m.parte, nuevaParte: "", version: m.version || "", aplicaA: m.aplicaA || "", visible: m.visible !== false,
      roles: Object.fromEntries(Object.entries(S.roles).filter(([, r]) => r.manuales?.[id]).map(([rid]) => [rid, true])), html };
    let b = S.borradores[id];
    try { const local = JSON.parse(localStorage.getItem("manual-borrador-" + id) || "null"); if (local && (!b || local.guardadoEn > b.guardadoEn)) b = local; } catch {}
    if (b && (b.guardadoEn || 0) > (m.editado || S.meta?.editadoEn || S.meta?.importadoEn || 0) && b.html !== html) e = { ...e, ...b, id, recuperado: b.guardadoEn };
  } else {

  S.edit = { ...e, pendiente: false, estado: e.recuperado ? `Recuperé lo que estabas escribiendo (${new Date(e.recuperado).toLocaleString("es-AR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" })}).` : "" };
  if (cambios) S.edit = { ...S.edit, ...cambios };

  S.vista = "editar";

}
function leerEditor() {
  const e = S.edit; if (!e) return null;

    e.titulo = v("ed-titulo").value; e.parte = v("ed-parte").value; e.nuevaParte = v("ed-nueva-parte") ? v("ed-nueva-parte").value : "";

function marcarCambio() {

function estadoEditor(txt) { if (S.edit) S.edit.estado = txt; const el = document.getElementById("ed-estado"); if (el) el.textContent = txt; }
async function guardarBorrador() {
  clearTimeout(_timerBorrador);
  const e = leerEditor(); if (!e || !e.pendiente) return;
  const k = claveBorrador(e);
  const b = { id: e.id || null, titulo: e.titulo, parte: e.parte, nuevaParte: e.nuevaParte || "", version: e.version, aplicaA: e.aplicaA, visible: e.visible, roles: e.roles, html: limpiarHtml(e.html), guardadoEn: Date.now(), ...(e.origen ? { origen: e.origen } : {}) };

// HTML de un manual listo para guardar: limpio, tablas envueltas, títulos con id e índice.
function analizarHtml(html) {
  const d = new DOMParser().parseFromString(`<div>${limpiarHtml(html)}</div>`, "text/html");
  const cont = d.body.firstChild;
  cont.querySelectorAll("table").forEach(t => { if (!t.parentElement.classList.contains("tabla")) { const w = d.createElement("div"); w.className = "tabla"; t.replaceWith(w); w.appendChild(t); } });
  cont.querySelectorAll("p").forEach(p => { if (!p.textContent.trim() && !p.querySelector("img")) p.remove(); });
  let k = 0; const secciones = [];
  cont.querySelectorAll("h2,h3").forEach(h => { h.id = `s${++k}`; if (h.tagName === "H2") secciones.push({ id: h.id, t: h.textContent.trim().slice(0, 80) }); });

  return { html: cont.innerHTML, texto, secciones, palabras: texto ? texto.split(" ").length : 0 };
}
async function publicarEdicion() {

  if (!parte) throw new Error("Elegí o escribí la parte del manual.");
  const a = analizarHtml(e.html);
  if (!a.texto) throw new Error("El manual está vacío.");
  const ahora = Date.now();
  const existentes = Object.entries(S.indice || {});
  const id = e.id || (() => { let b = slug(titulo), id = b, n = 2; while (S.indice[id] || S.papelera[id]) id = `${b}-${n++}`; return id; })();
  const previo = S.indice[id];
  const mismaParte = existentes.filter(([x, m]) => m.parte === parte && x !== id);

// Barra de herramientas: actúa sobre lo seleccionado en el editor.
function bloquesSeleccionados(editor) {
  const sel = window.getSelection(); if (!sel || !sel.rangeCount) return [];
  const r = sel.getRangeAt(0);
  if (!editor.contains(r.commonAncestorContainer)) return [];
  const tope = n => { while (n && n.parentNode !== editor) n = n.parentNode; return n; };
  const a = tope(r.startContainer), b = tope(r.endContainer);
  if (!a || !b) return [];

  return hijos.slice(Math.min(i, j), Math.max(i, j) + 1);
}
function aplicarCuadro(editor, tipo) {

  if (!bloques.length) return;
  if (bloques.length === 1 && bloques[0].nodeType === 1 && bloques[0].classList.contains("cuadro")) {
    const c = bloques[0];
    if (!tipo || c.classList.contains("cuadro-" + tipo)) { c.replaceWith(...c.childNodes); }
    else c.className = `cuadro cuadro-${tipo}`;
    return;
  }
  if (!tipo) return;
  const div = document.createElement("div");
  div.className = `cuadro cuadro-${tipo}`;
  bloques[0].before(div);
  for (const b of bloques) {
    if (b.nodeType === 3) { if (!b.textContent.trim()) { b.remove(); continue; } const p = document.createElement("p"); p.textContent = b.textContent; b.replaceWith(p); div.appendChild(p); continue; }
    if (b.classList?.contains("cuadro")) div.append(...b.childNodes), b.remove(); else div.appendChild(b);
  }
}
function alternarCheck(editor) {
  const sel = window.getSelection(); if (!sel || !sel.rangeCount) return;
  const r = sel.getRangeAt(0);
  const bloques = [...editor.querySelectorAll("p,li")].filter(b => r.intersectsNode(b));
  if (!bloques.length) return;
  const poner = !bloques.every(b => b.textContent.trim().startsWith("☐"));
  for (const b of bloques) {
    const t = b.firstChild;
    if (poner) { if (!b.textContent.trim().startsWith("☐")) b.insertBefore(document.createTextNode("☐ "), t); }
    else if (t && t.nodeType === 3) t.nodeValue = t.nodeValue.replace(/^\s*☐\s*/, "");

}
function celdaActual(editor) {
  const sel = window.getSelection(); if (!sel || !sel.rangeCount) return null;
  let n = sel.getRangeAt(0).startContainer;
  while (n && n !== editor && !(n.nodeType === 1 && (n.tagName === "TD" || n.tagName === "TH"))) n = n.parentNode;
  return n && n !== editor ? n : null;
}
function comandoTabla(editor, cmd) {
  if (cmd === "tabla") {
    const html = `<div class="tabla"><table><thead><tr><th>Título</th><th>Título</th></tr></thead><tbody><tr><td>…</td><td>…</td></tr><tr><td>…</td><td>…</td></tr></tbody></table></div><p><br></p>`;
    document.execCommand("insertHTML", false, html);

  }

  if (cmd === "fila+") { const n = document.createElement("tr"); for (let i = 0; i < tr.children.length; i++) { const td = document.createElement("td"); td.innerHTML = "<br>"; n.appendChild(td); } (tr.parentNode.tagName === "THEAD" ? tabla.tBodies[0] || tabla.appendChild(document.createElement("tbody")) : tr.parentNode).insertBefore(n, tr.parentNode.tagName === "THEAD" ? (tabla.tBodies[0]?.firstChild || null) : tr.nextSibling); }

function categoriaReceta(r) {
  const g = (r.grupo || "").trim();
  return RENOMBRES_CATEGORIA[clave(g)] || g || (r.tipo === "subreceta" ? "Bases" : "Sin categoría");
}
function posCategoria(c) {
  const k = clave(c).replace(/s$/, "");
  const i = ORDEN_CATEGORIAS.findIndex(o => clave(o).replace(/s$/, "") === k);
  return i < 0 ? ORDEN_CATEGORIAS.length : i;
}
const compararCategorias = (a, b) => (a === "Sin categoría") - (b === "Sin categoría") || posCategoria(a) - posCategoria(b) || a.localeCompare(b, "es");
function fmtCant(c, u) { if (c == null || c === "") return "c/n"; const n = Math.round(Number(c) * 1000) / 1000; return `${n.toLocaleString("es-AR")} ${u === "porcion" ? "porción" : u || ""}`.trim(); }
function bruta(c, merma) { const m = Number(merma) || 0; return c == null ? null : m > 0 && m < 100 ? c / (1 - m / 100) : c; }
function alergenosDe(r, vis = new Set()) {
  const out = {}; if (!r || vis.has(r.id)) return out; vis.add(r.id);
  Object.entries(r.alergenos || {}).forEach(([k, v]) => { if (v) out[k] = true; });
  r.ingredientes.forEach(l => { if (l.tipo === "subreceta" && S.rec.recetas[l.recetaId]) Object.assign(out, alergenosDe(S.rec.recetas[l.recetaId], vis)); });
  return out;
}
async function cargarFotoReceta(r) {
  if (!r.tieneFoto || S.rec.fotos[r.id] !== undefined) return;
  S.rec.fotos[r.id] = null;
  try {
    const v = (await get(ref(db, `recetario/areas/${r.area}/fotos/${r.id}`))).val();
    S.rec.fotos[r.id] = typeof v === "string" && v.startsWith("data:image/") ? v : null;
  } catch { S.rec.fotos[r.id] = null; }
  document.querySelectorAll(`[data-foto="${r.id}"]`).forEach(el => { if (S.rec.fotos[r.id]) el.innerHTML = `<img src="${S.rec.fotos[r.id]}" alt="">`; });
}
// Ícono de cada categoría: el mismo que usa el Recetario editable.
function iconoCategoria(c) {
  const k = clave(c);
  if (k.includes("croissant") || k.includes("medialuna")) return "🥐";
  if (k.includes("envasad")) return "📦";
  if (k.includes("horneado")) return "🧁";
  if (k.includes("jugo") || k.includes("bebida") || k.includes("licuado")) return "🧃";
  if (k.includes("base")) return "🥣";
  if (k.includes("combo")) return "🍱";
  if (k.includes("postre") || k.includes("dulce") || k.includes("torta")) return "🍰";
  if (k.includes("salsa") || k.includes("aderezo")) return "🫙";
  if (k.includes("masa") || k.includes("pan")) return "🥖";
  if (k.includes("trago")) return "🥤";
  if (k.includes("entrada") || k.includes("ensalada")) return "🥗";
  if (k.includes("sandw") || k.includes("sanwi") || k.includes("tostado")) return "🥪";
  if (k.includes("desayuno") || k.includes("merienda")) return "☕";
  if (c === "Sin categoría") return "📁";
  return "🍽️";
}
const TIPOS_RECETA = { plato: "Plato", subreceta: "Subreceta" };
const nombreLineaReceta = l => l.tipo === "subreceta" ? (S.rec.recetas[l.recetaId]?.nombre || l.nombre || "") : (l.nombre || "");
const rindeReceta = r => [r.rendimiento ? `Rinde ${fmtCant(r.rendimiento, r.unidadRendimiento)}` : "", r.porciones ? `${r.porciones} porción${r.porciones == 1 ? "" : "es"}` : ""].filter(Boolean).join(" · ");
// Igual que el Recetario editable: primero las categorías; adentro de cada una, las cards.
function vistaRecetario() {
  escucharRecetario();
  const todas = Object.values(S.rec.recetas);
  let cuerpo;
  if (S.rec.error) cuerpo = `<div class="bloque">${esc(S.rec.error)}</div>`;
  else if (S.rec.cargando && !todas.length) cuerpo = `<div class="muted">Cargando recetas…</div>`;
  else if (!todas.length) cuerpo = `<div class="bloque">Todavía no hay recetas cargadas.</div>`;
  else {
    const porCat = {};
    todas.forEach(r => { const c = categoriaReceta(r); porCat[c] = (porCat[c] || 0) + 1; });
    const cats = Object.keys(porCat).sort(compararCategorias);
    if (S.recCat && !porCat[S.recCat]) S.recCat = "";
    const q = clave(S.recQ);
    const migas = S.recCat ? `<div class="rec-migas"><a data-act="rec-cat" data-cat="">🏠 Recetas</a><span>›</span><b>${iconoCategoria(S.recCat)} ${esc(S.recCat)}</b></div>` : "";
    const buscador = `<label class="rec-lbl" for="rec-buscar">Buscar</label>
      <input class="rec-buscar" id="rec-buscar" data-input="rec-buscar" placeholder="${S.recCat ? `Buscar en ${esc(S.recCat)}` : "Buscar una receta, código o ingrediente"}" value="${esc(S.recQ)}" autocomplete="off" enterkeyhint="search">`;
    let contenido;
    if (!S.recCat && !q) {
      contenido = `<div class="rec-cats">${cats.map(c => `<button class="rec-cat" data-act="rec-cat" data-cat="${esc(c)}">
          <span class="rec-cat-ico">${iconoCategoria(c)}</span><b>${esc(c)}</b><span class="rec-sub">${porCat[c]} receta${porCat[c] === 1 ? "" : "s"}</span></button>`).join("")}</div>`;
    } else {
      const lista = todas.filter(r => (!S.recCat || categoriaReceta(r) === S.recCat) && (!q || clave(r.nombre + " " + (r.codigo || "") + " " + r.ingredientes.map(nombreLineaReceta).join(" ")).includes(q)))
        .sort((a, b) => compararCategorias(categoriaReceta(a), categoriaReceta(b)) || a.nombre.localeCompare(b.nombre, "es"));
      contenido = lista.length
        ? `<div class="rec-grid">${lista.map(cardReceta).join("")}</div>
           <div class="rec-pie-lista"><span class="rec-sub">${lista.length} receta${lista.length === 1 ? "" : "s"} · tocá una card para ver el resumen del otro lado</span>
             <button data-act="girar-todas">${S.recTodasGiradas ? "📷 Ver las fotos" : "📋 Dar vuelta todas"}</button></div>`
        : `<div class="rec-sub" style="text-align:center;padding:30px 10px;font-size:13px">Ninguna receta coincide con la búsqueda.</div>`;
      setTimeout(() => lista.slice(0, 40).forEach(cargarFotoReceta), 0);
    }
    cuerpo = `<div class="rec-panel">${migas}${buscador}${contenido}</div>`;
  }
  return `${barra()}<div class="main">
    <div class="h-pag">🍳 Recetario · Cocina</div>
    <div class="sub-pag">Fichas técnicas de cocina: ingredientes, cantidades, pasos y alérgenos.${esGerencia() ? ` Se editan en <a href="/recetario/" target="_blank" rel="noopener">el Recetario</a>.` : ""}</div>
    ${cuerpo}
  </div>`;
}
// Card con dos caras, como en el Recetario editable: adelante la foto y el nombre; atrás, un resumen
// con las cantidades.
function cardReceta(r) {
  const girada = S.recTodasGiradas ? !S.recGiradas.has(r.id) : S.recGiradas.has(r.id);
  const linea = l => `<li><span>${esc(nombreLineaReceta(l))}${l.tipo === "subreceta" ? ` <small>(subreceta)</small>` : ""}</span><b>${esc(fmtCant(l.cantidad, l.unidad))}</b></li>`;
  const rinde = rindeReceta(r);
  const foto = S.rec.fotos[r.id] ? `<img src="${S.rec.fotos[r.id]}" alt="${esc(r.nombre)}">` : `<span class="sinfoto">${iconoCategoria(categoriaReceta(r))}</span>`;
  return `<div class="giro ${girada ? "girada" : ""}" data-receta="${esc(r.id)}">
    <div class="giro-in" data-act="girar" data-id="${esc(r.id)}" role="button" tabindex="0" aria-label="${esc(r.nombre)}: dar vuelta la card">
      <div class="cara frente">
        <div class="rec-foto" data-foto="${esc(r.id)}">${foto}</div>
        <div class="pie"><div class="nom">${esc(r.nombre)}</div><div class="sub">${esc([r.codigo, TIPOS_RECETA[r.tipo] || r.tipo].filter(Boolean).join(" · "))}</div></div>
      </div>
      <div class="cara dorso">
        <div class="nom">${esc(r.nombre)}</div>
        <div class="rinde">${esc(rinde)}</div>
        <div class="cuerpo">
          ${r.ingredientes.length ? `<ul>${r.ingredientes.map(linea).join("")}</ul>` : `<div class="rinde">Sin ingredientes cargados.</div>`}
          ${r.empaque.length ? `<div class="sec">Empaque</div><ul>${r.empaque.map(linea).join("")}</ul>` : ""}
        </div>
        <button class="btn btn-primary btn-sm ver" data-act="receta" data-id="${esc(r.id)}">Ver ficha completa →</button>
      </div>
    </div>
  </div>`;
}
// Ficha como la del Recetario editable (sin editar, eliminar ni costeo).

    <tbody>${lineas.map(l => {
      const sub = l.tipo === "subreceta";
      const nombre = esc(nombreLineaReceta(l));
      const b = bruta(l.cantidad == null ? null : Number(l.cantidad), l.merma);

    <div class="rec-migas" style="margin-top:4px"><a data-act="rec-cat" data-cat="">🏠 Recetas</a><span>›</span><a data-act="rec-cat" data-cat="${esc(categoriaReceta(r))}">${iconoCategoria(categoriaReceta(r))} ${esc(categoriaReceta(r))}</a></div>
    <div class="rec-detalle-head">
      <div>
        <div class="rec-titulo">${esc(r.nombre)}</div>
        <div class="rec-chips">
          <span class="rec-badge rec-${esc(r.tipo)}">${esc(TIPOS_RECETA[r.tipo] || r.tipo || "")}</span>
          ${r.codigo ? `<span class="rec-chip">${esc(r.codigo)}</span>` : ""}
          <span class="rec-chip">${esc(categoriaReceta(r))}</span>
          ${rinde ? `<span class="rec-sub">${esc(rinde)}</span>` : ""}
        </div>
      </div>
      <div class="rec-acciones-det">
        <button class="btn btn-ghost btn-sm" data-act="imprimir">🖨️ Imprimir</button>
        <button class="btn btn-ghost btn-sm" data-act="recetario">← Volver</button>
      </div>
    </div>
    <div class="rec-panel rec-hero">
      ${r.tieneFoto ? `<div class="rec-foto" data-foto="${esc(r.id)}">${S.rec.fotos[r.id] ? `<img src="${S.rec.fotos[r.id]}" alt="">` : "Cargando foto…"}</div>` : ""}
      <div style="flex:1;min-width:240px">
        <div class="rec-tit">Preparación</div>
        ${r.pasos.length ? `<ol class="rec-pasos">${r.pasos.map(p => `<li>${esc(p)}</li>`).join("")}</ol>` : `<div class="rec-sub">Sin pasos cargados.</div>`}
        <div class="rec-tit" style="margin-top:18px">Alérgenos <span class="rec-sub">(ANMAT)</span></div>
        ${al.length ? `<div class="rec-chips">${al.map(k => `<span class="rec-aler">${esc(ALERGENOS[k] || k)}</span>`).join("")}</div>` : `<div class="rec-sub">No contiene alérgenos de declaración obligatoria.</div>`}
      </div>
    </div>
    <div class="rec-panel">
      <div class="rec-tit" style="margin-bottom:12px">Ingredientes</div>
      ${r.ingredientes.length ? tabla(r.ingredientes, true) : `<div class="rec-sub">Sin ingredientes cargados.</div>`}
      ${r.empaque.length ? `<div class="rec-tit" style="margin:20px 0 12px">Empaque</div>${tabla(r.empaque, false)}` : ""}
    </div>
    ${r.observaciones ? `<div class="rec-panel"><div class="rec-tit">Observaciones</div><div style="white-space:pre-wrap">${esc(r.observaciones)}</div></div>` : ""}
    ${usos.length ? `<div class="rec-panel rec-usos"><div class="rec-tit">Se usa en</div>${usos.map(u => `<a href="#" data-act="receta" data-id="${esc(u.id)}">${esc(u.nombre)}</a>`).join("")}</div>` : ""}
  </div>`;
}

function pintar() {
  if (!rootEl) return;
  // El editor no se redibuja mientras se escribe: se perdería el cursor y lo escrito.
  if (S.vista === "editar" && S.edit && S.rol === "gerencia") {
    const m = rootEl.querySelector("[data-editor]");
    if (m && m.getAttribute("data-editor") === claveBorrador(S.edit)) return;
  }
  const activo = document.activeElement;
  const focoId = activo && activo.id ? activo.id : null;
  const sel = focoId && typeof activo.selectionStart === "number" ? [activo.selectionStart, activo.selectionEnd] : null;
  let html;
  if (!S.authListo) html = `<div class="gate"><div class="muted">Cargando…</div></div>`;
  else if (S.user && S.rol === "pendiente") html = vistaPendiente();
  else if (!S.user || !S.rol) html = S.user && !S.rol ? `<div class="gate"><div class="muted">Verificando tu acceso…</div></div>` : vistaLogin();
  else if (S.vista === "editar" && esGerencia() && S.edit) html = vistaEditor();
  else if (S.vista === "manual") html = vistaManual();
  else if (S.vista === "recetario" && tieneRecetario()) html = vistaRecetario();
  else if (S.vista === "receta" && tieneRecetario()) html = vistaReceta();
  else if (S.vista === "cuenta" && S.rol === "empleado") html = vistaCuenta();
  else if (S.vista === "gerencia" && esGerencia()) html = vistaGerencia();
  else html = vistaInicio();
  rootEl.innerHTML = html;
  if (S.vista === "manual") activarIndice();
  if (S.vista === "editar" && S.edit) {
    const c = document.getElementById("ed-cuerpo");
    if (c) c.innerHTML = limpiarHtml(S.edit.html || "");
    pintarEditorVersiones();
  }
  if (focoId) {
    const el = document.getElementById(focoId);
    if (el && el.type !== "file") { try { el.focus({ preventScroll: true }); if (sel && el.setSelectionRange) el.setSelectionRange(sel[0], sel[1]); } catch {} }
  }
}

// ── Eventos ──────────────────────────────────────────────
function marcadosDe(form, nombre) {
  return Object.fromEntries([...form.querySelectorAll(`input[name="${nombre}"]:checked`)].map(i => [i.value, true]));
}
async function salirEditor() {
  if (S.edit?.pendiente) await guardarBorrador();
  const id = S.edit?.id;
  S.edit = null; S.versiones = null;
  if (id) abrirManual(id); else { S.vista = "inicio"; pintar(); }
}
async function onClick(ev) {
  const chk = ev.target.closest("p.check");
  if (chk && !ev.target.closest("[contenteditable]")) {
    const k = chk.getAttribute("data-check");
    const c = S.checks[S.manualId] = S.checks[S.manualId] || {};
    c[k] = !c[k];
    chk.classList.toggle("hecho", !!c[k]);
    const inp = chk.querySelector("input"); if (inp) inp.checked = !!c[k];
    ev.preventDefault();
    return;
  }
  const ed = ev.target.closest("[data-ed]");
  if (ed) { ev.preventDefault(); comandoEditor(ed.getAttribute("data-ed")); return; }
  const el = ev.target.closest("[data-act]");
  if (!el) return;
  const act = el.getAttribute("data-act");
  const uid = el.getAttribute("data-uid");
  try {
    if (S.vista === "editar" && S.edit && ["inicio", "recetario", "gerencia", "salir"].includes(act)) {
      if (S.edit.pendiente) await guardarBorrador();
      S.edit = null;
    }
    if (act === "inicio") { S.vista = "inicio"; S.manualId = null; pintar(); window.scrollTo(0, 0); }
    else if (act === "abrir") { ev.preventDefault(); abrirManual(el.getAttribute("data-id"), el.getAttribute("data-buscar") || ""); }
    else if (act === "ir") { ev.preventDefault(); const t = document.getElementById(el.getAttribute("data-sec")); if (t) t.scrollIntoView({ behavior: "smooth", block: "start" }); }
    else if (act === "leido") await marcarLeido(el.getAttribute("data-id"));
    else if (act === "imprimir") window.print();
    else if (act === "cuenta") { S.vista = "cuenta"; pintar(); }
    else if (act === "gerencia") { S.vista = "gerencia"; pintar(); }
    else if (act === "gerencia-tab") { S.vista = "gerencia"; S.tabGer = el.getAttribute("data-tab"); pintar(); }
    else if (act === "tab") { S.tabGer = el.getAttribute("data-tab"); pintar(); }
    else if (act === "recetario") { S.vista = "recetario"; S.recId = null; pintar(); window.scrollTo(0, 0); }
    else if (act === "receta") { ev.preventDefault(); S.vista = "receta"; S.recId = el.getAttribute("data-id"); pintar(); window.scrollTo(0, 0); }
    else if (act === "rec-cat") { ev.preventDefault(); S.recCat = el.getAttribute("data-cat"); S.recQ = ""; S.vista = "recetario"; S.recId = null; pintar(); window.scrollTo(0, 0); }
    else if (act === "girar") {
      const id = el.getAttribute("data-id");
      S.recGiradas.has(id) ? S.recGiradas.delete(id) : S.recGiradas.add(id);
      el.closest(".giro")?.classList.toggle("girada");
    }
    else if (act === "girar-todas") { S.recTodasGiradas = !S.recTodasGiradas; S.recGiradas = new Set(); pintar(); }
    else if (act === "salir") { cortarDatos(); S.errorLogin = ""; S.rec = { recetas: {}, fotos: {}, cargando: false, error: "", escuchando: false }; await signOut(auth); }
    else if (act === "otra-pass") { ev.preventDefault(); S.alta = { ...S.alta, pass: contrasenaNueva() }; pintar(); }
    else if (act === "modo-login") { ev.preventDefault(); S.modoRegistro = false; S.errorLogin = ""; pintar(); }
    else if (act === "modo-registro") { ev.preventDefault(); S.modoRegistro = true; S.errorLogin = ""; pintar(); }
    else if (act === "diagnosticar") { ev.preventDefault(); await diagnosticar(); }
    else if (act === "alta-modo") { S.altaModo = el.getAttribute("data-m"); pintar(); }
    else if (act === "copiar-link") { try { await navigator.clipboard.writeText(linkInvitacion(el.getAttribute("data-c"))); toast("📋 Link copiado."); } catch { toast("No se pudo copiar: mantené apretado el link y copialo.", "warn"); } }
    else if (act === "desactivar-link") await desactivarInvitacion(el.getAttribute("data-c"));
    else if (act === "rechazar") await rechazarSolicitud(uid);
    else if (act === "copiar-creados") { try { await navigator.clipboard.writeText(S.creadosSesion.filter(c => !c.error).map(textoCredencial).join("\n") + `\n${location.origin}/manuales/`); toast("📋 Copiados."); } catch { toast("No se pudo copiar.", "warn"); } }
    else if (act === "limpiar-creados") { S.creadosSesion = []; pintar(); }
    else if (act === "baja") await darDeBaja(uid);
    else if (act === "reactivar") await reactivar(uid);
