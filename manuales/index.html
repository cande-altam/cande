<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>Candela — Manuales de Procedimientos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --cream:#EEEBD7; --cream-dark:#dedad8; --cream-mid:#e5e1cc;
  --black:#22201F; --black-soft:#3a3836;
  --terra:#E15D46; --terra-light:#ea7a65; --terra-pale:#f9ddd8;
  --turq:#9BD6CC; --turq-dark:#6bbfb4; --turq-pale:#d8f0ed;
  --gray:#9a9888; --gray-light:#ccc9b5; --white:#ffffff;
  --green:#27ae60; --green-pale:#e8f8f0;
  --amber:#f0a500; --amber-pale:#fffbe6;
  --red:#c0392b; --red-pale:#fdecea;
  --shadow-sm:0 1px 3px rgba(34,32,31,.06),0 1px 2px rgba(34,32,31,.04);
  --shadow-md:0 4px 16px rgba(34,32,31,.08),0 2px 6px rgba(34,32,31,.05);
  --shadow-lg:0 12px 40px rgba(34,32,31,.12),0 4px 12px rgba(34,32,31,.06);
  --shadow-terra:0 4px 18px rgba(225,93,70,.30);
  --r:14px;--r-sm:8px;--r-xs:6px;
  --sidebar:290px;
}
html{-webkit-text-size-adjust:100%;}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--cream);color:var(--black);
  font-weight:300;font-size:15px;line-height:1.65;min-height:100vh;}

/* ══════════ LOGIN ══════════ */
#gate{position:fixed;inset:0;background:var(--cream);display:flex;align-items:center;justify-content:center;padding:24px;z-index:200;}
.gate-card{background:var(--white);border-radius:var(--r);padding:34px 30px;max-width:380px;width:100%;box-shadow:var(--shadow-lg);text-align:center;}
.gate-logo{font-size:34px;margin-bottom:10px;}
.gate-t{font-size:19px;font-weight:700;letter-spacing:-.3px;}
.gate-s{font-size:13px;color:var(--gray);margin:6px 0 22px;}

/* ══════════ SHELL ══════════ */
.shell{display:flex;min-height:100vh;}
.sidebar{width:var(--sidebar);flex-shrink:0;background:var(--white);border-right:1px solid var(--cream-dark);
  position:fixed;top:0;bottom:0;left:0;overflow-y:auto;z-index:60;padding-bottom:30px;}
.side-head{padding:22px 20px 14px;border-bottom:1px solid var(--cream-dark);position:sticky;top:0;background:var(--white);z-index:2;}
.side-brand{font-size:15px;font-weight:800;letter-spacing:-.3px;line-height:1.25;}
.side-brand span{color:var(--terra);}
.side-sub{font-size:11px;color:var(--gray);margin-top:3px;text-transform:uppercase;letter-spacing:.7px;font-weight:500;}
.search-wrap{padding:12px 14px 6px;}
.search-in{width:100%;padding:9px 13px;border:1.5px solid var(--cream-dark);background:var(--cream);border-radius:10px;
  font-family:inherit;font-size:13px;outline:none;color:var(--black);}
.search-in:focus{border-color:var(--terra);box-shadow:0 0 0 3px rgba(225,93,70,.10);background:var(--white);}
.nav-group{padding:10px 12px 2px;}
.nav-gt{font-size:10px;font-weight:700;color:var(--gray);text-transform:uppercase;letter-spacing:.9px;padding:0 8px 6px;}
.nav-i{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:9px;cursor:pointer;font-size:13.5px;
  font-weight:400;transition:background .13s,color .13s;margin-bottom:1px;line-height:1.35;}
.nav-i:hover{background:var(--cream);}
.nav-i.on{background:var(--black);color:var(--cream);font-weight:600;}
.nav-i .ic{font-size:15px;flex-shrink:0;width:19px;text-align:center;}
.nav-i .tx{flex:1;min-width:0;}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.d-ok{background:var(--green);} .d-mid{background:var(--amber);} .d-low{background:var(--terra);} .d-bad{background:var(--red);}

.main{flex:1;margin-left:var(--sidebar);min-width:0;}
.topbar{position:sticky;top:0;z-index:50;background:rgba(238,235,215,.93);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--cream-dark);padding:11px 30px;display:flex;align-items:center;gap:10px;}
.burger{display:none;background:var(--white);border:1px solid var(--cream-dark);border-radius:9px;
  width:38px;height:38px;font-size:17px;cursor:pointer;flex-shrink:0;}
.crumb{font-size:12px;color:var(--gray);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500;}
.doc{max-width:820px;margin:0 auto;padding:34px 30px 90px;}

/* ══════════ BOTONES ══════════ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border-radius:10px;border:none;
  cursor:pointer;font-family:inherit;font-size:13px;font-weight:600;transition:all .16s;white-space:nowrap;}
.btn-p{background:var(--terra);color:#fff;box-shadow:var(--shadow-terra);}
.btn-p:hover{background:var(--terra-light);}
.btn-g{background:var(--white);color:var(--black);border:1.5px solid var(--cream-dark);}
.btn-g:hover{border-color:var(--gray-light);background:var(--cream-mid);}
.btn-d{background:var(--black);color:var(--cream);}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn-sm{padding:7px 12px;font-size:12px;}
.in{width:100%;padding:10px 14px;background:var(--cream);border:1.5px solid var(--cream-dark);border-radius:var(--r-sm);
  color:var(--black);font-size:14px;outline:none;font-family:inherit;}
.in:focus{border-color:var(--terra);box-shadow:0 0 0 3px rgba(225,93,70,.12);background:var(--white);}

/* ══════════ MARKDOWN ══════════ */
.md h1{font-size:27px;font-weight:800;letter-spacing:-.6px;line-height:1.2;margin:0 0 6px;}
.md h2{font-size:19px;font-weight:700;letter-spacing:-.3px;margin:34px 0 12px;padding-top:14px;border-top:1px solid var(--cream-dark);}
.md h2:first-of-type{border-top:none;padding-top:0;}
.md h3{font-size:16px;font-weight:700;margin:24px 0 9px;}
.md h4{font-size:14px;font-weight:700;margin:18px 0 6px;color:var(--black-soft);}
.md p{margin:0 0 13px;}
.md strong{font-weight:700;}
.md em{font-style:italic;color:var(--black-soft);}
.md a{color:var(--terra);text-decoration:none;border-bottom:1px solid var(--terra-pale);font-weight:500;}
.md a:hover{border-bottom-color:var(--terra);}
.md code{background:var(--cream-mid);padding:2px 6px;border-radius:5px;font-size:.87em;
  font-family:ui-monospace,'SF Mono',Menlo,monospace;font-weight:500;}
.md pre{background:var(--black);color:var(--cream);padding:15px 18px;border-radius:var(--r-sm);overflow-x:auto;
  margin:0 0 15px;font-size:12.5px;line-height:1.6;}
.md pre code{background:none;padding:0;color:inherit;font-weight:400;}
.md ul,.md ol{margin:0 0 14px;padding-left:22px;}
.md li{margin-bottom:5px;}
.md li::marker{color:var(--gray);}
.md hr{border:none;border-top:1px solid var(--cream-dark);margin:28px 0;}
.md blockquote{background:var(--white);border-left:3px solid var(--turq);border-radius:0 var(--r-sm) var(--r-sm) 0;
  padding:14px 18px;margin:0 0 16px;box-shadow:var(--shadow-sm);}
.md blockquote > *:last-child{margin-bottom:0;}
.md blockquote h2,.md blockquote h3{margin-top:0;border:none;padding-top:0;font-size:15px;}
.md blockquote.warn{border-left-color:var(--amber);background:var(--amber-pale);box-shadow:none;}
.md blockquote.stop{border-left-color:var(--red);background:var(--red-pale);box-shadow:none;}
.md blockquote.key{border-left-color:var(--terra);background:var(--terra-pale);box-shadow:none;}
.md blockquote.ok{border-left-color:var(--green);background:var(--green-pale);box-shadow:none;}
.tw{overflow-x:auto;margin:0 0 16px;border-radius:var(--r-sm);border:1px solid var(--cream-dark);background:var(--white);}
.md table{border-collapse:collapse;width:100%;font-size:13.5px;}
.md th{background:var(--cream-mid);font-weight:700;text-align:left;padding:9px 13px;
  border-bottom:1.5px solid var(--cream-dark);white-space:nowrap;font-size:12.5px;}
.md td{padding:9px 13px;border-bottom:1px solid var(--cream-dark);vertical-align:top;}
.md tr:last-child td{border-bottom:none;}
.md .chk{list-style:none;padding-left:2px;}
.md .chk li{display:flex;gap:9px;align-items:flex-start;padding:6px 10px;background:var(--white);
  border:1px solid var(--cream-dark);border-radius:var(--r-xs);margin-bottom:5px;}
.md .chk .bx{flex-shrink:0;font-size:14px;color:var(--gray);line-height:1.5;}
.md .chk li.done{background:var(--green-pale);border-color:#bfe6d0;}
.md .chk li.done .bx{color:var(--green);}
.doc-meta{font-size:12px;color:var(--gray);margin:14px 0 26px;padding-bottom:16px;border-bottom:1px solid var(--cream-dark);
  display:flex;gap:14px;flex-wrap:wrap;align-items:center;}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:100px;font-size:11px;font-weight:600;}
.b-ok{background:var(--green-pale);color:#1e8449;} .b-mid{background:var(--amber-pale);color:#8a6100;}
.b-low{background:var(--terra-pale);color:var(--terra);} .b-bad{background:var(--red-pale);color:var(--red);}

/* ══════════ EDITOR ══════════ */
.ed-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px;padding:12px 14px;
  background:var(--white);border:1px solid var(--cream-dark);border-radius:var(--r-sm);position:sticky;top:56px;z-index:40;}
.ed-bar .sp{flex:1;}
.ed-hint{font-size:11.5px;color:var(--gray);}
textarea.ed{width:100%;min-height:66vh;padding:18px 20px;border:1.5px solid var(--cream-dark);border-radius:var(--r-sm);
  font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:13.5px;line-height:1.75;background:var(--white);
  color:var(--black);outline:none;resize:vertical;}
textarea.ed:focus{border-color:var(--terra);box-shadow:0 0 0 3px rgba(225,93,70,.10);}

/* ══════════ VARIOS ══════════ */
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(90px);background:var(--black);
  color:var(--cream);padding:12px 22px;border-radius:100px;font-size:13.5px;font-weight:600;z-index:300;
  box-shadow:var(--shadow-lg);transition:transform .28s cubic-bezier(.2,.9,.3,1.3);max-width:90vw;text-align:center;}
.toast.on{transform:translateX(-50%) translateY(0);}
.toast.warn{background:var(--amber);color:var(--black);}
.toast.err{background:var(--red);color:#fff;}
.scrim{position:fixed;inset:0;background:rgba(34,32,31,.45);z-index:55;display:none;}
.scrim.on{display:block;}
.hit{margin:0 12px 4px;padding:8px 10px;background:var(--cream);border-radius:8px;font-size:12px;cursor:pointer;}
.hit:hover{background:var(--cream-mid);}
.hit b{display:block;font-size:12.5px;font-weight:700;margin-bottom:2px;}
.hit span{color:var(--gray);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.home-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:13px;margin:0 0 30px;}
.card{background:var(--white);border:1px solid var(--cream-dark);border-radius:var(--r);padding:16px 17px;cursor:pointer;
  transition:transform .16s,box-shadow .16s,border-color .16s;}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);border-color:var(--turq);}
.card .ci{font-size:23px;margin-bottom:8px;}
.card .cn{font-weight:700;font-size:14.5px;margin-bottom:4px;letter-spacing:-.2px;}
.card .cd{font-size:12px;color:var(--gray);line-height:1.5;}
.sec-t{font-size:12px;font-weight:700;color:var(--gray);text-transform:uppercase;letter-spacing:.9px;margin:0 0 12px;}

@media(max-width:900px){
  .sidebar{transform:translateX(-100%);transition:transform .26s cubic-bezier(.3,.9,.3,1);box-shadow:var(--shadow-lg);}
  .sidebar.on{transform:translateX(0);}
  .main{margin-left:0;}
  .burger{display:flex;align-items:center;justify-content:center;}
  .topbar{padding:10px 15px;}
  .doc{padding:22px 17px 80px;}
  .md h1{font-size:23px;} .md h2{font-size:17.5px;} .md table{font-size:12.5px;}
  .md th,.md td{padding:8px 10px;}
  .ed-bar{top:54px;}
}
@media print{
  .sidebar,.topbar,.ed-bar,.toast,.scrim,.no-print{display:none!important;}
  .main{margin:0;} .doc{max-width:100%;padding:0;}
  body{background:#fff;font-size:11pt;}
  .md blockquote,.tw,.card{box-shadow:none;break-inside:avoid;}
  .md h1,.md h2,.md h3{break-after:avoid;}
  .md table{break-inside:auto;} .md tr{break-inside:avoid;}
  .md .chk li{background:none;border:1px solid #ccc;break-inside:avoid;}
  .md a{color:#000;border:none;}
  .doc-meta{border-bottom:1px solid #999;}
}
</style>
</head>
<body>

<div id="gate">
  <div class="gate-card">
    <div class="gate-logo">📖</div>
    <div class="gate-t">Manuales de Procedimientos</div>
    <div class="gate-s">Candela Café &amp; Patisserie</div>
    <button class="btn btn-p" style="width:100%" id="gate-enter">Entrar a leer</button>
    <div style="margin-top:16px;padding-top:16px;border-top:1px solid var(--cream-dark)">
      <input class="in" type="password" id="gate-pass" placeholder="Clave de edición (opcional)" autocomplete="current-password"/>
      <button class="btn btn-g btn-sm" style="width:100%;margin-top:8px" id="gate-edit">Entrar con permiso de edición</button>
      <div id="gate-err" style="color:var(--terra);font-size:12px;margin-top:8px;display:none">Clave incorrecta</div>
    </div>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<div class="shell" id="shell" style="display:none">
  <aside class="sidebar" id="sidebar">
    <div class="side-head">
      <div class="side-brand">Candela <span>Café &amp; Patisserie</span></div>
      <div class="side-sub">Manuales</div>
    </div>
    <div class="search-wrap"><input class="search-in" id="q" placeholder="🔍 Buscar en los manuales…"/></div>
    <div id="nav"></div>
  </aside>
  <main class="main">
    <div class="topbar">
      <button class="burger" id="burger">☰</button>
      <div class="crumb" id="crumb"></div>

      <button class="btn btn-p btn-sm no-print" id="btn-edit" style="display:none">✏️ Editar</button>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set, get, onValue, update, push } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDtV-TC_GmylUNwwB1n-23u1t44C-ZtNvU",
  authDomain: "pedidos-de-produccion-ee3cb.firebaseapp.com",
  databaseURL: "https://pedidos-de-produccion-ee3cb-default-rtdb.firebaseio.com",
  projectId: "pedidos-de-produccion-ee3cb",
  storageBucket: "pedidos-de-produccion-ee3cb.firebasestorage.app",
  messagingSenderId: "744141794971",
  appId: "1:744141794971:web:9639c8bf3834e4978ae03e"
};
const fb = initializeApp(firebaseConfig);
const db = getDatabase(fb);

const PASS_DEFAULT = "manuales2026";
const SEED = {"cajeros": {"titulo": "Cajeros", "icono": "🧾", "grupo": "venta", "estado": "ok", "resumen": "Caja, medios de pago, señas, cuentas corrientes y pedidos de clientes.", "orden": 1, "contenido": "# Manual de Procedimientos — Cajeros\n\n**Candela Café & Patisserie**\n*Versión 2.0 | Junio 2026*\n\n---\n\n## 🎯 Objetivo del rol\n\nEl/la cajero/a **registra todas las ventas del local**, maneja la caja con\nexactitud y coordina los pedidos de clientes con el equipo de producción usando\nlas herramientas digitales.\n\n---\n\n## 🖥️ Tus herramientas digitales\n\nTrabajás con tres herramientas:\n\n1. **FUDO** — Sistema de punto de venta. Ventas, caja, stock y cuentas corrientes.\n2. **Web Pedidos de Clientes** — `pedidos-de-clientes-cc.netlify.app`\n   Para cargar encargues y pedidos a futuro.\n3. **Web Pedidos de Producción** — `pedidos-produccion.netlify.app`\n   Para cargar el pedido diario de cada área.\n\n> 📖 Paso a paso completo, PINs y horarios límite en\n> **[Herramientas digitales](../comunes/herramientas-digitales.md)**.\n\n---\n\n## 1. Apertura de caja\n\n1. Contá el **fondo inicial**.\n2. Registrá la apertura en **FUDO**.\n3. Verificá que haya **cambio suficiente** en billetes y monedas.\n\n> ⚠️ **Si el fondo no cuadra, avisá al encargado antes de atender al público.**\n\n---\n\n## 2. Registro de ventas\n\n1. El cliente pide → cargás los productos en **FUDO**.\n2. **Confirmás el total** con el cliente.\n3. Cobrás y emitís el comprobante (ticket o factura).\n4. Todo queda en FUDO — nada se deja sin registrar.\n\n> ⚠️ **Nunca se entrega un producto sin que esté registrado en FUDO.**\n\n---\n\n## 3. Medios de pago y facturación\n\n### Efectivo\n- Contá el dinero **frente al cliente**.\n- Entregá el cambio de inmediato.\n\n### Tarjeta (débito / crédito)\n- El cliente pasa la tarjeta en el lector.\n- **Esperá la confirmación del sistema** antes de entregar el producto.\n\n### Transferencia / Mercado Pago\n- **Verificá en el celular que el pago llegó** antes de entregar.\n\n### Facturación\n- **Ticket:** siempre.\n- **Factura A o B:** cuando el cliente la pide → completar datos en FUDO.\n\n---\n\n## 4. Devoluciones\n\n1. Escuchá el motivo de la devolución.\n2. **Avisá al encargado** para que autorice.\n3. Registrá la devolución en FUDO.\n\n> ⚠️ **Sin autorización del encargado, no se hace ninguna devolución.**\n\n---\n\n## 5. Señas — Cómo registrar un adelanto\n\nCuando un cliente deja una seña para un pedido futuro:\n\n1. Cargá el pedido en la **Web de Pedidos de Clientes**.\n2. Registrá el **cobro de la seña en FUDO**.\n3. Entregá un **comprobante** al cliente con el monto y la fecha de entrega.\n4. **Anotá en el pedido de la web** el monto ya abonado.\n\n> ℹ️ El pedido queda en la web y el pago queda en FUDO — **los dos registros son\n> necesarios**.\n\n---\n\n## 6. Cuentas corrientes\n\n- Las cuentas corrientes se gestionan desde **FUDO**.\n- **Confirmá siempre el saldo disponible** antes de cerrar la venta.\n- Para habilitar una nueva CC, el cliente debe estar **dado de alta por el encargado**.\n\n---\n\n## 7. Cierre de caja\n\n1. Contá **todo el efectivo** en caja.\n2. Registrá el cierre en **FUDO**.\n3. Separá el **fondo para el turno siguiente**.\n4. Prepará el **sobre de depósito**.\n5. Entregá el sobre al **encargado**.\n\n> ⚠️ **Si hay diferencia, informala antes de salir** (ver Sección 8).\n\n---\n\n## 8. Diferencias de caja\n\n| Caso | Qué hacer |\n|---|---|\n| **Sobrante** | Informar al encargado — **no tocarlo** |\n| **Faltante** | Informar al encargado — puede requerir descuento según reglamento |\n\n> ⚠️ **Las diferencias siempre se reportan, aunque sean pequeñas.**\n\n---\n\n## 9. Movimientos de stock\n\n- **Roturas, consumo interno, diferencias de inventario** → se registran en FUDO.\n- Pedí **autorización al encargado** antes de registrar cualquier movimiento especial.\n\n---\n\n## 10. Pedidos de mercadería\n\nLos pedidos de mercadería se cargan desde la **Web de Pedidos de Producción**.\n\n> **No se usan papeles ni WhatsApp para esto — todo va a la web.**\n\n---\n\n## 11. 🖥️ Web — Pedidos de Clientes\n\n`pedidos-de-clientes-cc.netlify.app`\n\n**¿Para qué sirve?** Para cargar pedidos de clientes a futuro: tortas de\ncumpleaños, encargues especiales, catering.\n\n**¿Cuándo se usa?** Cada vez que un cliente hace un pedido para retirar **en otro\ndía o en otra fecha**.\n\n### Paso a paso\n\n1. Ingresá a `pedidos-de-clientes-cc.netlify.app`\n2. Tocá **\"Ventas\"** en el menú\n3. Completá los datos del cliente: nombre completo, teléfono, fecha de entrega,\n   local (SLA 5.0 o San Luis)\n4. Agregá los productos por área — el sistema pide un **PIN** por área:\n\n   | Área | PIN |\n   |---|---|\n   | Panadería | `1111` |\n   | Pastelería | `2222` |\n   | Facturería | `3333` |\n   | Especialidades | `4444` |\n   | Sandwiches | `5555` |\n   | PIN maestro (ver todo) | `1412` |\n\n5. Ingresá el PIN → seleccioná productos y cantidades → repetí para cada área\n6. Revisá el pedido completo\n7. Tocá **\"Confirmar\"**\n\n✅ El pedido queda registrado y llega automáticamente al área de producción.\n\n### Errores frecuentes\n\n- ❌ **Fecha mal cargada** → verificá en el calendario.\n- ❌ **PIN incorrecto** → consultá la tabla de PINs.\n- ❌ **Pedido no confirmado** → siempre tocá \"Confirmar\" al final.\n\n---\n\n## 12. 🖥️ Web — Pedidos de Producción\n\n`pedidos-produccion.netlify.app`\n\n**¿Para qué sirve?** Para avisarle a producción cuánto necesita preparar de cada\nproducto. Se carga **una vez por turno**, antes del horario límite de cada área.\n\n### Horarios límite\n\n> ⚠️ **Si no cargás a tiempo, producción no puede cumplir.**\n\n| Área | Cargar antes de |\n|---|---|\n| Panadería | **9:00 hs** |\n| Pastelería | **16:00 hs** |\n| Especialidades | **21:00 hs** |\n| Facturería | **21:00 hs** |\n| Sandwiches | **21:00 hs** |\n| Cocina San Luis | **21:00 hs** |\n\n### Paso a paso\n\n1. Ingresá a `pedidos-produccion.netlify.app`\n2. Seleccioná el local: **SLA 5.0** o **San Luis**\n3. Seleccioná el área (ej: Panadería)\n4. Ingresá las cantidades de cada producto\n5. Revisá el pedido\n6. Tocá **\"Confirmar pedido\"**\n\n✅ Producción ya puede ver el pedido desde su pantalla.\n\n### Importante\n\n- Cargá siempre **antes del horario límite**.\n- El pedido es para el **día siguiente** (salvo que el encargado indique otra cosa).\n- Si te olvidaste, **avisá al encargado inmediatamente**.\n\n---\n\n## 13. Atención de llamadas y WhatsApp\n\n1. Atendé con: *\"Candela Café & Patisserie, ¡hola! ¿En qué te puedo ayudar?\"*\n2. Si el cliente hace un pedido → **cargalo en la Web de Pedidos de Clientes**\n   (Sección 11).\n3. Si es una consulta de precio o disponibilidad → respondé y anotá si hay pedido.\n4. **WhatsApp: respondé en menos de 10 minutos** en horario comercial.\n\n---\n\n## 14. Indicadores de desempeño (KPIs)\n\n| Indicador | Meta |\n|---|---|\n| Diferencia de caja | **0** por turno |\n| Ventas registradas en FUDO | **100%** |\n| Pedidos de Producción | Cargados **antes del horario límite** de cada área |\n| Pedidos de Clientes | Cargados **en el momento** que el cliente lo solicita |\n| Respuesta WhatsApp | **< 10 minutos** en horario comercial |\n\n---\n\n## 15. Faltas y consecuencias\n\n| Falta | Consecuencia |\n|---|---|\n| No registrar una venta en FUDO | Llamado de atención escrito |\n| Diferencia de caja sin informar | Descuento según reglamento |\n| Pedido de producción no cargado a tiempo | Se registra como incidencia |\n| Pedido de cliente no cargado | Se registra como incidencia |\n\n---\n\n## ✅ Checklist diario — Cajero/a\n\n*Imprimí o revisá este checklist en cada turno.*\n\n### Apertura\n\n- ☐ Fondo de caja contado y registrado en FUDO\n- ☐ Cambio suficiente disponible\n- ☐ FUDO funcionando correctamente\n- ☐ Web Pedidos de Clientes accesible (abrir y verificar)\n- ☐ Web Pedidos de Producción accesible (abrir y verificar)\n- ☐ Revisé los pedidos de clientes pendientes del día\n- ☐ Cargué el pedido de **Panadería** antes de las **9:00 hs**\n\n### Durante el turno\n\n- ☐ Todas las ventas registradas en FUDO\n- ☐ Comprobantes entregados a cada cliente\n- ☐ Pedido de **Pastelería** cargado antes de las **16:00 hs**\n- ☐ Pedidos de Clientes cargados en el momento que se reciben\n- ☐ WhatsApp respondido en menos de 10 minutos\n\n### Cierre\n\n- ☐ Pedidos de Producción cargados para el turno noche\n      (Especialidades / Facturería / Sandwiches / Cocina San Luis — antes de las **21:00 hs**)\n- ☐ Pedidos de Clientes del día: todos cargados, ninguno pendiente\n- ☐ Caja contada y registrada en FUDO\n- ☐ Diferencia informada al encargado (si la hay)\n- ☐ Fondo separado para el turno siguiente\n- ☐ Sobre de depósito preparado y entregado\n\n---\n\n## Documentos relacionados\n\n- [Herramientas digitales](../comunes/herramientas-digitales.md)\n- [Atención al cliente y reclamos](../comunes/atencion-y-reclamos.md)\n- [Higiene y presentación](../comunes/higiene-y-presentacion.md)\n"}, "vendedores-y-mozos": {"titulo": "Vendedores y Mozos", "icono": "🛍️", "grupo": "venta", "estado": "ok", "resumen": "Mostrador y salón: atención, upselling, vitrinas y servicio de mesa.", "orden": 2, "contenido": "# Manual de Procedimientos — Vendedores y Mozos\n\n**Candela Café & Patisserie**\n*Versión 2.0 | Junio 2026*\n\n---\n\n## 📖 Cómo usar este manual\n\nEste manual es para vos, que según el día trabajás en el **mostrador como\nVendedor/a** o en el **salón como Mozo/a**. Los dos roles son del mismo equipo —\nla atención, la calidad y los estándares son los mismos.\n\n| Si tu turno es… | Leé |\n|---|---|\n| 🛍️ **En mostrador** | Parte 1 |\n| 🪑 **En salón** | Parte 2 |\n| 🖥️ **Herramientas digitales** (ambos roles) | Parte 3 |\n\n---\n\n## 🖥️ Tus herramientas digitales\n\n1. **FUDO** — Sistema de ventas. Para registrar todo.\n2. **Web Pedidos de Clientes** — `pedidos-de-clientes-cc.netlify.app`\n   Para cargar encargues y pedidos a futuro.\n3. **Web Pedidos de Producción** — `pedidos-produccion.netlify.app`\n   Para cargar el pedido diario de cada área.\n\n> 📖 Paso a paso completo, PINs y horarios límite en\n> **[Herramientas digitales](../comunes/herramientas-digitales.md)**.\n\n---\n\n# PARTE 1 — Cuando trabajás en mostrador (Vendedor/a)\n\n## 🎯 Objetivo\n\nBrindar una atención de excelencia, asesorar al cliente sobre los productos y\n**registrar cada venta en FUDO**.\n\n---\n\n## 1. Atención al cliente — 7 pasos\n\n1. **Saludar** — Con una sonrisa y contacto visual: *\"¡Hola! ¿Te puedo ayudar?\"*\n2. **Escuchar** — Dejá que el cliente se exprese sin interrumpir.\n3. **Asesorar** — Describí los productos con entusiasmo. Destacá los favoritos del día.\n4. **Ofrecer más** — Sugerí un complemento (ver Sección 2).\n5. **Confirmar el pedido** — Repetí lo que el cliente eligió antes de cobrar.\n6. **Cobrar y registrar** — Registrá en FUDO. Entregá el comprobante.\n7. **Despedir** — *\"¡Que lo disfrutes! Hasta la próxima.\"*\n\n---\n\n## 2. Técnicas de venta — Upselling en mostrador\n\nEl upselling es **ofrecer algo más que mejore la experiencia** del cliente.\nNo es presionar — es asesorar.\n\n| Si el cliente pide… | Ofrecé… |\n|---|---|\n| Un café | *\"¿Lo acompañás con unas medialunas? Hoy salieron recién.\"* |\n| Una porción | *\"¿Querés llevar una caja también? Tenemos descuento para llevar.\"* |\n| Algo para llevar | *\"¿Te armamos una cajita mixta?\"* |\n\n> ℹ️ **Ofrecé una vez, con naturalidad. Si el cliente dice que no, no insistas.**\n\n---\n\n## 3. Reclamos en mostrador — Método LAST\n\nCuando un cliente tiene un problema, seguí estos 4 pasos:\n\n1. **L — Listen (Escuchar)**: Dejá que el cliente cuente todo sin interrumpir.\n2. **A — Apologize (Disculparse)**: *\"Lamentamos mucho esto, no debería haber pasado.\"*\n3. **S — Solve (Resolver)**: Ofrecé una solución concreta — reponer, cambiar, devolver.\n4. **T — Thanks (Agradecer)**: *\"Gracias por avisarnos, eso nos ayuda a mejorar.\"*\n\n> ⚠️ **Nunca discutas con el cliente. Nunca niegues el problema. Siempre avisá al\n> encargado si el reclamo es grande.**\n\n---\n\n## 4. Despacho de pan\n\n- Todos los panes se despachan **con pinza y papel — nunca con la mano**.\n- **Verificá siempre la frescura.** Pan viejo no sale.\n- Si una bandeja está baja, avisá a producción o reponé desde el depósito.\n- Cuando un producto se agota → **avisá al encargado de inmediato**.\n\n---\n\n## 5. Empaque de pastelería\n\n- Usá siempre la **caja, bolsa o bandeja correspondiente** al tamaño del producto.\n- **Separar productos húmedos de secos** en el empaque.\n- Tortas y piezas delicadas → entregar con cuidado y bolsa firme.\n- **Verificá que el cliente vea el producto** antes de cerrarlo.\n\n---\n\n## 6. Vitrinas y reposición\n\n- Las vitrinas **siempre limpias y ordenadas**.\n- Los productos con **etiqueta de precio visible** en todo momento.\n- **FIFO**: primero entra, primero sale. Los productos más viejos adelante.\n- Revisá la vitrina **al inicio del turno, a la mitad y antes del cierre**.\n\n---\n\n## 7. Fiambres y lácteos\n\n- **Verificá la fecha de vencimiento** al inicio del turno.\n- Mantené la heladera limpia y organizada.\n- **Productos vencidos** → retirá y avisá al encargado de inmediato.\n- **No rompas la cadena de frío** — no dejes productos fuera de la heladera sin\n  necesidad.\n\n---\n\n## 8. Apertura y cierre del mostrador\n\n### Apertura\n\n1. Limpieza general del mostrador y vitrina.\n2. Reposición de productos (pan, pastelería, bebidas).\n3. Verificar etiquetas de precios.\n4. Encender equipos y verificar que todo funciona.\n5. **Cargar pedido de Panadería en la web (antes de las 9:00 hs).**\n\n### Cierre\n\n1. Guardar y cubrir los productos restantes.\n2. Limpiar vitrina, mostrador y heladera.\n3. Apagar equipos.\n4. **Cargar pedidos de producción para el turno siguiente**\n   (Especialidades, Facturería, Sandwiches — antes de las 21:00 hs).\n5. Dejar el área lista para el turno siguiente.\n\n---\n\n## 9. Higiene y orden en mostrador\n\n- **Lavarse las manos** antes de manipular alimentos y después de cobrar.\n- **Uniforme limpio y completo** en todo momento.\n- **No comer ni tomar** en el área de atención.\n- Mantener el mostrador **libre de objetos personales**.\n\n---\n\n# PARTE 2 — Cuando trabajás en salón (Mozo/a)\n\n## 🎯 Objetivo\n\nAsegurar que cada cliente que se siente en el salón tenga una experiencia\nexcelente: **bienvenida cálida, servicio rápido y despedida amable**.\n\n---\n\n## 10. Apertura del salón\n\n1. Revisá que todas las **mesas y sillas** estén limpias y alineadas.\n2. Verificá que la **vajilla, servilleteros y azucareros** estén completos en cada mesa.\n3. Limpiá los **vidrios y vitrinas** del salón.\n4. Revisá la **carta**: que esté limpia, completa y sin faltantes.\n5. **Sincronizate con barra** sobre lo que hay disponible y lo que falta.\n\n---\n\n## 11. Recibir al cliente\n\n1. Recibí al cliente en la entrada en **menos de 30 segundos**.\n2. Saludá con una sonrisa: *\"¡Hola! ¿Cuántos son?\"*\n3. **Acompañalos a la mesa personalmente.**\n4. Entregá la carta.\n5. Acercate en **máximo 2 minutos** para tomar el pedido.\n\n---\n\n## 12. Toma de pedidos en mesa — 7 pasos\n\n1. **Acercate** a la mesa con energía y contacto visual.\n2. **Escuchá** sin interrumpir lo que el cliente quiere.\n3. **Asesorá** si el cliente tiene dudas — describí los platos con detalle.\n4. **Sugerí algo más** — hacé upselling de forma natural (ver Sección 13).\n5. **Repetí el pedido** antes de alejarte para confirmar que anotaste bien.\n6. **Registrá en FUDO** inmediatamente.\n7. **Avisá a barra/cocina** y confirmá los tiempos.\n\n> ### 🔑 Regla de oro\n> **Tiempo máximo para acercarte a la mesa = 2 minutos.**\n\n---\n\n## 13. Upselling en mesa\n\n| Si el cliente pide… | Ofrecé… |\n|---|---|\n| Café | *\"¿Te lo acompañamos con algo dulce? Hoy tenemos X.\"* |\n| Torta | *\"¿La querés con helado? Le suma mucho.\"* |\n| Sandwich | *\"¿Querés una bebida con eso?\"* |\n| (Es un grupo) | *\"¿Compartimos una tabla para empezar?\"* |\n\n> ℹ️ **Ofrecé una vez, con naturalidad. Si el cliente dice que no, no insistas.**\n\n---\n\n## 14. Servicio de mesa — Tiempos y estándares\n\n### Tiempos de entrega esperados\n\n| Categoría | Tiempo máximo |\n|---|---|\n| Bebidas (café, infusiones) | **3 a 5 minutos** |\n| Pastelería | **1 a 2 minutos** |\n| Sandwiches / Cocina | **8 a 12 minutos** |\n\n### Estándares de servicio\n\n- **Llevá los pedidos completos** — si falta algo, avisá antes de ir a la mesa.\n- **Verificá que el pedido sea correcto** antes de servirlo.\n- **Revisá la mesa cada 5 minutos** para ver si necesitan algo más.\n- Si un pedido se va a demorar, **avisá al cliente proactivamente**.\n\n---\n\n## 15. Cobro y cierre de mesa\n\n1. Cuando el cliente pida la cuenta, **cerrala en FUDO inmediatamente**.\n2. Llevá el ticket a la mesa.\n3. Esperá que el cliente pague.\n4. Si paga con tarjeta o transferencia → **verificá la confirmación** antes de\n   liberar la mesa.\n5. Agradecé y despedí: *\"¡Muchas gracias! Hasta la próxima.\"*\n6. **Limpiá y prepará la mesa** para el próximo cliente en menos de 2 minutos.\n\n---\n\n## 16. Cierre del salón\n\n1. Limpiar todas las **mesas, sillas y el piso** del salón.\n2. Guardar la **vajilla seca y limpia**.\n3. Limpiar **vidrios y vitrinas** del salón.\n4. Revisar **baños** y dejarlos limpios.\n5. Apagar **luces y equipos**.\n6. **Reportar al encargado** cualquier incidencia del turno.\n\n---\n\n## 17. Reclamos en salón — Método LAST\n\n1. **L — Listen (Escuchar)**: Dejá que el cliente cuente sin interrumpir.\n2. **A — Apologize (Disculparse)**: *\"Lamentamos mucho esto, no debería haber pasado.\"*\n3. **S — Solve (Resolver)**: Ofrecé una solución — reponer, cambiar, no cobrar el ítem.\n4. **T — Thanks (Agradecer)**: *\"Gracias por avisarnos, eso nos ayuda a mejorar.\"*\n\n> ⚠️ **Nunca discutas con el cliente. Para reclamos grandes, llamá al encargado de\n> inmediato.**\n\n---\n\n# PARTE 3 — Herramientas digitales (ambos roles)\n\n## 18. 🖥️ Web — Pedidos de Clientes\n\n`pedidos-de-clientes-cc.netlify.app`\n\n**¿Para qué sirve?** Para cargar pedidos de clientes a futuro: tortas de\ncumpleaños, encargues especiales, catering.\n\n### Paso a paso\n\n1. Ingresá a `pedidos-de-clientes-cc.netlify.app`\n2. Tocá **\"Ventas\"** en el menú\n3. Completá los datos del cliente: nombre completo, teléfono, fecha de entrega,\n   local (SLA 5.0 o San Luis)\n4. Agregá los productos por área — el sistema pide un **PIN** por área:\n\n   | Área | PIN |\n   |---|---|\n   | Panadería | `1111` |\n   | Pastelería | `2222` |\n   | Facturería | `3333` |\n   | Especialidades | `4444` |\n   | Sandwiches | `5555` |\n   | PIN maestro (ver todo) | `1412` |\n\n5. Ingresá el PIN del área → elegí los productos y cantidades\n6. Repetí para cada área que corresponda\n7. Revisá el pedido completo\n8. Tocá **\"Confirmar\"**\n\n✅ El pedido llega automáticamente a producción.\n\n### Errores frecuentes\n\n- ❌ **Fecha mal cargada** → verificá en el calendario.\n- ❌ **PIN incorrecto** → consultá la tabla.\n- ❌ **No confirmaste el pedido** → siempre tocá \"Confirmar\" al final.\n\n---\n\n## 19. 🖥️ Web — Pedidos de Producción\n\n`pedidos-produccion.netlify.app`\n\n**¿Para qué sirve?** Para avisar a producción cuánto necesita preparar. Se carga\n**una vez por turno**, antes del horario límite.\n\n### Horarios límite\n\n| Área | Cargar antes de |\n|---|---|\n| Panadería | **9:00 hs** |\n| Pastelería | **16:00 hs** |\n| Especialidades | **21:00 hs** |\n| Facturería | **21:00 hs** |\n| Sandwiches | **21:00 hs** |\n| Cocina San Luis | **21:00 hs** |\n\n### Paso a paso\n\n1. Ingresá a `pedidos-produccion.netlify.app`\n2. Seleccioná el local: **SLA 5.0** o **San Luis**\n3. Seleccioná el área\n4. Ingresá las cantidades de cada producto\n5. Revisá el pedido\n6. Tocá **\"Confirmar pedido\"**\n\n✅ Producción puede ver el pedido de inmediato.\n\n> ⚠️ **Si te olvidaste de cargar a tiempo, avisá al encargado inmediatamente.**\n\n---\n\n# PARTE 4 — Indicadores y checklist\n\n## 20. Indicadores de desempeño (KPIs)\n\n### Como Vendedor/a\n\n| Indicador | Meta |\n|---|---|\n| Ventas registradas en FUDO | **100%** |\n| Vitrina repuesta y limpia | Durante **todo** el turno |\n| Tiempo de atención en mostrador | **< 3 minutos** |\n| Pedido de Producción | Cargado **antes del horario límite** |\n\n### Como Mozo/a\n\n| Indicador | Meta |\n|---|---|\n| Primer contacto con el cliente | **< 2 minutos** |\n| Tiempos de entrega | Café 3-5 min · Pastelería 1-2 min · Sandwich 8-12 min |\n| Mesa preparada para el próximo cliente | **< 2 minutos** |\n| Pedido de Producción | Cargado **antes del horario límite** |\n\n---\n\n## ✅ Checklist diario — Vendedor/a y Mozo/a\n\n### Apertura — Mostrador (Vendedor/a)\n\n- ☐ Mesas y sillas del mostrador limpias y ordenadas\n- ☐ Vitrina limpia y con productos repuestos\n- ☐ Vajilla, servilleteros y azucareros completos\n- ☐ Carta limpia y completa\n- ☐ Heladera revisada (vencimientos, limpieza)\n- ☐ Uniforme correcto\n- ☐ Pedido de **Panadería** cargado en la web (antes de las **9:00 hs**)\n- ☐ Web Pedidos de Clientes disponible\n\n### Apertura — Salón (Mozo/a)\n\n- ☐ Mesas y sillas alineadas y limpias\n- ☐ Vidrios y vitrinas del salón limpios\n- ☐ Vajilla completa en mesas\n- ☐ Carta disponible en cada mesa\n- ☐ Servilleteros y azucareros completados\n- ☐ Uniforme correcto\n- ☐ Coordinación con barra (disponibilidad del día)\n- ☐ Depósito revisado y ordenado\n- ☐ Pedido de **Panadería** cargado en la web (antes de las **9:00 hs**)\n\n### Durante el turno\n\n- ☐ Clientes recibidos en menos de 2 minutos\n- ☐ Upselling aplicado en cada atención\n- ☐ Vajilla sucia retirada rápidamente\n- ☐ Limpieza de piso y mesas en curso\n- ☐ Limpieza de vidrios y vitrinas\n- ☐ Reposición de utensilios cuando es necesario\n- ☐ Pedido de **Pastelería** cargado en la web (antes de las **16:00 hs**)\n- ☐ Pedidos de Clientes cargados inmediatamente al recibirlos\n- ☐ Ventas digitales cobradas correctamente\n- ☐ Pedidos verificados antes de entregar\n\n### Cierre\n\n- ☐ Mesas/sillas limpias y ordenadas\n- ☐ Salón limpio para el turno siguiente\n- ☐ Vajilla seca y guardada para el próximo turno\n- ☐ Vitrina y heladera ordenadas\n- ☐ Baño personal en orden\n- ☐ Depósito ordenado\n- ☐ Pedidos de Producción noche cargados\n      (Especialidades / Facturería / Sandwiches / Cocina San Luis — antes de las **21:00 hs**)\n- ☐ Pedidos de Clientes: ninguno pendiente\n- ☐ Incidencias del turno reportadas al encargado\n\n---\n\n## Documentos relacionados\n\n- [Herramientas digitales](../comunes/herramientas-digitales.md)\n- [Atención al cliente y reclamos](../comunes/atencion-y-reclamos.md)\n- [Higiene y presentación](../comunes/higiene-y-presentacion.md)\n"}, "baristas": {"titulo": "Baristas", "icono": "☕", "grupo": "venta", "estado": "ok", "resumen": "Barra: apertura, estándares de espresso y leche, cierre y mantenimiento.", "orden": 3, "contenido": "# Manual de Procedimientos — Baristas\n\n**Candela Café & Patisserie**\n*Versión 2.0 | Junio 2026*\n\n---\n\n## 🎯 Objetivo del rol\n\nPreparar y servir bebidas y productos de barra con **calidad constante, rapidez y\nuna atención amable en cada taza**.\n\n---\n\n## 🖥️ Tu herramienta digital\n\nUsás una herramienta digital en tu turno:\n\n- **Web Pedidos de Producción** — `pedidos-produccion.netlify.app`\n  Para cargar el pedido diario de insumos y avisarle a cada área cuánto producir.\n\n> ℹ️ La **Web de Pedidos de Clientes no es de tu área** — esa la usan caja y ventas.\n\n> 📖 Paso a paso completo y horarios límite en\n> **[Herramientas digitales](../comunes/herramientas-digitales.md)**.\n\n---\n\n## 1. Apertura de barra\n\n1. **Encendé los equipos**: cafetera, vaporizador, molinos.\n2. Verificá que haya **insumos suficientes**: café, leche, azúcar, vasos, servilletas.\n3. **Limpiá la barra y los utensilios** antes de empezar.\n4. **Calibrá la molienda** del café (según el clima o el lote).\n5. Preparate un **café de prueba** — verificá sabor, temperatura y extracción.\n6. **Avisá al encargado** si algo no está en condiciones.\n\n> ⚠️ **No arranques a atender si la cafetera no está a temperatura y la molienda no\n> está correcta.**\n\n---\n\n## 2. Toma de pedidos\n\n1. **Escuchá el pedido completo** antes de empezar a preparar.\n2. Si hay dudas, preguntá: *\"¿Solo o con leche?\"* / *\"¿Grande o chico?\"*\n3. **Repetí el pedido** antes de prepararlo para confirmar.\n4. **Registrá en FUDO** si estás atendiendo en barra directamente.\n\n---\n\n## 3. Servicio de bebidas\n\n### Espresso y derivados\n\n| Parámetro | Estándar |\n|---|---|\n| Temperatura del agua | **90–94 °C** |\n| Extracción (espresso doble) | **25–30 segundos** |\n| Crema | Color **avellana uniforme** |\n\n### Leche vaporizada\n\n| Parámetro | Estándar |\n|---|---|\n| Temperatura final | **65–70 °C** |\n| Textura | Cremosa y sedosa, **sin burbujas grandes** |\n| Para latte art | Leche con **microespuma** |\n\n### Bebidas frías\n\n- Usar siempre **hielo limpio**.\n- Servir en **vaso frío**.\n- Respetar las **proporciones de la receta estándar**.\n\n### Tiempos de entrega\n\n- Bebidas de barra (café, té, chocolate): **máximo 3 a 5 minutos**.\n- Si hay demora, **avisale al cliente o al mozo proactivamente**.\n\n---\n\n## 4. Mantenimiento durante el turno\n\n- **Limpiar el portafiltro** después de cada espresso.\n- **Limpiar la lanza vaporizadora inmediatamente** después de usar.\n- **Reponer insumos antes de que se acaben** — no esperes a quedarte sin nada.\n- Mantener la barra **seca y ordenada** en todo momento.\n- **Lavar los utensilios** entre preparaciones.\n\n---\n\n## 5. Cierre de barra\n\n1. **Descargá y limpiá el portafiltro** y los grupos de la cafetera.\n2. **Limpiá la lanza vaporizadora a fondo.**\n3. Limpiá la **bandeja escurridora** y la **pileta de barra**.\n4. **Guardá los insumos correctamente** (café sellado, leche en heladera).\n5. **Apagá los equipos en el orden correcto**: molino → vaporizador → cafetera.\n6. Dejá la barra **limpia y lista para el turno siguiente**.\n\n---\n\n## 6. Manejo de caja en barra\n\n- **Registrá todo en FUDO antes de preparar.**\n- **No cerrés una mesa o venta sin que esté registrada.**\n- Si hay un pedido de salón, **coordiná con el mozo** antes de empezar a preparar.\n\n---\n\n## 7. Reclamos — Método LAST\n\nCuando un cliente tiene un problema con su bebida:\n\n1. **L — Listen (Escuchar)**: Dejá que el cliente cuente sin interrumpir.\n2. **A — Apologize (Disculparse)**: *\"Lamentamos mucho esto, lo resolvemos ahora.\"*\n3. **S — Solve (Resolver)**: Ofrecé **rehacer la bebida** o una alternativa.\n4. **T — Thanks (Agradecer)**: *\"Gracias por decírnoslo, nos ayuda a mejorar.\"*\n\n> ⚠️ **Para problemas grandes, llamá al encargado. Nunca discutas con el cliente.**\n\n---\n\n## 8. 🖥️ Web — Pedidos de Producción\n\n`pedidos-produccion.netlify.app`\n\n### ¿Para qué sirve?\n\nPara cargar cuánto necesita producción preparar de cada producto. También podés\n**ver los pedidos del día y la guía de producción** desde esta web.\n\n### ¿Cuándo se usa?\n\n**Una vez por turno**, antes del horario límite de cada área.\nSi no cargás a tiempo, producción no puede cumplir.\n\n### Horarios límite\n\n| Área | Cargar antes de |\n|---|---|\n| Panadería | **9:00 hs** |\n| Pastelería | **16:00 hs** |\n| Especialidades | **21:00 hs** |\n| Facturería | **21:00 hs** |\n| Sandwiches | **21:00 hs** |\n| Cocina San Luis | **21:00 hs** |\n\n### Paso a paso — cómo cargar el pedido\n\n1. Abrí el navegador e ingresá a `pedidos-produccion.netlify.app`\n2. Seleccioná el local: **SLA 5.0** o **San Luis**\n3. Seleccioná el área (ej: Panadería)\n4. Ingresá las cantidades de cada producto\n5. Revisá el pedido\n6. Tocá **\"Confirmar pedido\"**\n\n✅ Producción puede ver el pedido de inmediato.\n\n### Paso a paso — cómo ver la guía de producción\n\n1. Ingresá a `pedidos-produccion.netlify.app`\n2. Seleccioná el local\n3. Tocá **\"Guía\"** o **\"Cuadra\"** en el menú\n4. Podés **imprimir** o consultar desde la pantalla\n\n### Importante\n\n- Cargá **antes del horario límite** de cada área.\n- El pedido es para el **día siguiente** (salvo que el encargado indique otra cosa).\n- Si te olvidaste, **avisá al encargado inmediatamente**.\n\n---\n\n## 9. Indicadores de desempeño (KPIs)\n\n| Indicador | Meta |\n|---|---|\n| **Calidad de bebidas** | Espresso con crema uniforme, leche a temperatura correcta |\n| **Tiempo de entrega** | Máximo **3 a 5 minutos** por bebida de barra |\n| **Barra limpia** | Siempre ordenada y sin residuos visibles |\n| **Pedido de Producción** | Cargado **antes del horario límite** de cada área |\n| **Sin desperdicios** | Insumos repuestos a tiempo, sin cortes de stock evitables |\n\n---\n\n## ✅ Checklist diario — Barista\n\n*Imprimí o revisá este checklist en cada turno.*\n\n### Apertura\n\n- ☐ Cafetera encendida y a temperatura\n- ☐ Molino calibrado y funcionando\n- ☐ Café de prueba realizado — sabor y extracción correctos\n- ☐ Insumos disponibles: café, leche, azúcar, vasos, servilletas\n- ☐ Barra y utensilios limpios\n- ☐ Heladera con leche suficiente\n- ☐ Web Pedidos de Producción disponible (abrir y verificar)\n- ☐ Pedido de **Panadería** cargado en la web (antes de las **9:00 hs**)\n\n### Durante el turno\n\n- ☐ Portafiltro limpiado después de cada preparación\n- ☐ Lanza vaporizadora limpiada inmediatamente después de usar\n- ☐ Barra seca y ordenada en todo momento\n- ☐ Insumos repuestos antes de que se agoten\n- ☐ Utensilios lavados entre preparaciones\n- ☐ Pedido de **Pastelería** cargado en la web (antes de las **16:00 hs**)\n\n### Cierre\n\n- ☐ Portafiltro y grupos de cafetera limpios a fondo\n- ☐ Lanza vaporizadora limpiada a fondo\n- ☐ Bandeja escurridora y pileta limpias\n- ☐ Insumos guardados correctamente (café sellado, leche en heladera)\n- ☐ Equipos apagados en orden correcto (molino → vaporizador → cafetera)\n- ☐ Barra lista para el turno siguiente\n- ☐ Pedidos de Producción noche cargados\n      (Especialidades / Facturería / Sandwiches / Cocina San Luis — antes de las **21:00 hs**)\n- ☐ Incidencias del turno reportadas al encargado\n\n---\n\n## Documentos relacionados\n\n- [Herramientas digitales](../comunes/herramientas-digitales.md)\n- [Atención al cliente y reclamos](../comunes/atencion-y-reclamos.md)\n- [Higiene y presentación](../comunes/higiene-y-presentacion.md)\n"}, "encargado-de-local": {"titulo": "Encargado de Local", "icono": "🔑", "grupo": "venta", "estado": "low", "resumen": "Autorizaciones, escalamiento, control de pedidos y cierre del local.", "orden": 4, "contenido": "# Manual de Procedimientos — Encargado de Local\n\n**Candela Café & Patisserie**\n*Versión 0.9 — BORRADOR | Agosto 2026*\n\n> 🚧 **Este manual es un borrador.** Está reconstruido a partir de las **37 menciones\n> al encargado** que aparecen en los manuales de Cajeros, Vendedores/Mozos, Baristas y\n> Compras — es decir, desde lo que el resto del equipo espera de este puesto.\n>\n> **Falta confirmar** horarios, alcance sobre el personal y varias cosas más, listadas\n> al final. Revisalo y corregilo antes de repartirlo.\n\n---\n\n## 🎯 Objetivo del rol\n\n**Que el local funcione.** El encargado es quien abre y cierra, quien autoriza lo que\nnadie más puede autorizar, y a quien todo el equipo recurre cuando algo se sale de lo\nprevisto.\n\nLos otros manuales lo dicen de una forma muy concreta: **cada vez que un procedimiento\nse rompe, el paso siguiente es \"avisá al encargado\".** Este manual es el otro lado de\nesa frase.\n\n---\n\n## 1. Sos el punto de escalamiento\n\nEsto es lo primero que hay que entender del puesto. El equipo tiene instrucciones\nexplícitas de recurrir a vos en estos casos:\n\n### Te avisan de inmediato\n\n| Situación | Quién avisa | Manual |\n|---|---|---|\n| El fondo de caja no cuadra **antes de abrir** | Cajero | Cajeros §1 |\n| Diferencia de caja al cierre (sobrante o faltante) | Cajero | Cajeros §8 |\n| Un producto **se agotó** | Vendedor | Vendedores §4 |\n| Un producto está **vencido** | Vendedor | Vendedores §7 |\n| Un equipo **no está en condiciones** en la apertura | Barista | Baristas §1 |\n| Un **reclamo grande** de un cliente | Todos | Común |\n| Un pedido de producción **no se cargó a tiempo** | Quien debía cargarlo | Todos |\n\n### Te piden autorización\n\nNada de esto puede pasar sin tu visto bueno:\n\n| Qué | Regla | Manual |\n|---|---|---|\n| **Devoluciones** | *\"Sin autorización del encargado, no se hace ninguna devolución\"* | Cajeros §4 |\n| **Movimientos de stock** | Roturas, consumo interno, diferencias de inventario | Cajeros §9 |\n| **Alta de cuenta corriente** | El cliente debe estar dado de alta por vos | Cajeros §6 |\n\n### Te entregan\n\n| Qué | Cuándo | Manual |\n|---|---|---|\n| **Sobre de depósito** | Al cierre de caja | Cajeros §7 |\n| **Incidencias del turno** | Al cierre, todos los roles | Todos |\n\n> ### 🔑 La regla del escalamiento\n> Que el equipo te avise **no es que te estén molestando** — es que el procedimiento\n> funciona. El problema aparece cuando **no** te avisan. Si alguien resolvió por su\n> cuenta algo que requería autorización, corregilo aunque haya salido bien.\n\n---\n\n## 2. Apertura del local\n\nAntes de que abra el local, verificá que las tres áreas estén listas:\n\n| Área | Qué verificar | Responsable |\n|---|---|---|\n| **Caja** | Fondo contado, cambio suficiente, FUDO funcionando | Cajero |\n| **Mostrador / Salón** | Vitrinas repuestas, precios visibles, mesas limpias | Vendedor / Mozo |\n| **Barra** | Cafetera a temperatura, molienda calibrada, café de prueba hecho | Barista |\n\nTambién:\n\n- ☐ **Las dos webs abren** — Pedidos de Producción y Pedidos de Clientes\n- ☐ **Pedidos de clientes del día** revisados: qué se entrega hoy y a qué hora\n- ☐ **Personal completo** — si falta alguien, reorganizá antes de abrir\n- ☐ **Uniformes correctos**\n\n> ⚠️ **No abras con un equipo en falta sin haber reorganizado los puestos.** Es\n> preferible demorar la apertura cinco minutos que arrancar el turno improvisando.\n\n---\n\n## 3. Control de los pedidos de producción\n\nEste es el punto donde el local le falla al resto del negocio, y es tuyo.\n\n**Cada área carga su propio pedido**, pero **vos sos quien verifica que se cargó.**\n\n| Horario | Qué tiene que estar cargado |\n|---|---|\n| **9:00** | Panadería |\n| **16:00** | Pastelería |\n| **21:00** | Especialidades · Facturería · Sandwiches · Cocina San Luis |\n\nSi un horario pasó y el pedido no está:\n\n1. **Cargalo vos o hacelo cargar en el momento.**\n2. Avisá al área de producción que va tarde.\n3. **Registralo como incidencia** — si se repite, es un problema de la persona, no del día.\n\n> 📖 Detalle en **[Herramientas digitales](../comunes/herramientas-digitales.md)**.\n\n---\n\n## 4. Manejo de caja\n\n### Diferencias\n\n| Caso | Qué hacés |\n|---|---|\n| **Sobrante** | Lo recibís y lo registrás. **No se toca** |\n| **Faltante** | Lo registrás. Puede requerir descuento según reglamento |\n\n> ⚠️ **Toda diferencia se reporta, aunque sea mínima.** Una diferencia chica que no se\n> informa es peor que una grande que sí — porque rompe la costumbre de informar.\n\n### Sobre de depósito\n\nEl cajero te lo entrega al cierre. Verificá que el monto coincida con el cierre de FUDO\nantes de recibirlo.\n\n### ⛔ La caja del local no paga proveedores\n\n**Ningún pago a proveedor sale de la caja.** Si un proveedor llega a cobrar y no hay\ndinero enviado por Administración, **no se le paga** — se avisa a Administración.\n\n> 📖 El circuito completo está en\n> **[Pedidos y pagos a proveedores](../comunes/pedidos-y-pagos-a-proveedores.md)**.\n\n---\n\n## 5. Recepción de mercadería\n\nAl local llega mercadería por **dos vías**:\n\n### De Compras\n\nDos veces por día: **a primera hora** y **antes de las 13:00**.\nEl local revisa lo que llega. **No se firma nada.**\n\nSi falta algo → se reclama **en el momento**, no después.\n\n### Directo del proveedor\n\nAlgunos proveedores entregan en el local. En ese caso:\n\n1. **El área de atención verifica** que llegó lo pedido.\n2. Si hay faltante o algo vino mal → **el cajero reclama al proveedor**.\n3. **Avisale a Compras**, para que quede registro de ese proveedor.\n\n> 📖 Ver **[Manual de Compras](../produccion/compras.md)**.\n\n---\n\n## 6. Reclamos de clientes\n\nEl equipo maneja los reclamos con el **método LAST** y te escala los grandes.\n\nCuando un reclamo llega a vos:\n\n1. **Escuchá al cliente primero**, no a tu empleado. La versión interna viene después.\n2. **Nunca corrijas a alguien de tu equipo delante del cliente.** Resolvé primero,\n   hablá después.\n3. **Resolvé con una decisión concreta** — no cobrar, reponer, compensar.\n4. Después del reclamo, **hablá con quien atendió**: qué pasó y qué se hace la próxima.\n\n> 📖 El método completo en\n> **[Atención al cliente y reclamos](../comunes/atencion-y-reclamos.md)**.\n\n---\n\n## 7. Cierre del local\n\n- ☐ **Caja cerrada** y registrada en FUDO\n- ☐ **Sobre de depósito** recibido y verificado\n- ☐ **Diferencias** registradas (si las hubo)\n- ☐ **Pedidos de producción de las 21:00** cargados — Especialidades, Facturería,\n      Sandwiches, Cocina San Luis\n- ☐ **Pedidos de clientes** del día: ninguno pendiente de cargar\n- ☐ **Salón, mostrador y barra** limpios y listos para mañana\n- ☐ **Productos guardados**, heladeras cerradas\n- ☐ **Equipos apagados**, luces y llaves\n- ☐ **Incidencias del turno** registradas\n\n---\n\n## 8. Incidencias — Qué registrar\n\nTodos los roles te reportan incidencias al cierre. Estas son las que los manuales\nmencionan explícitamente:\n\n- Venta no registrada en FUDO\n- Diferencia de caja\n- Pedido de producción no cargado a tiempo\n- Pedido de cliente no cargado\n- Producto vencido en vitrina o heladera\n- Faltante en una entrega\n- Reclamo de cliente que escaló\n\n> 🚧 **A definir:** dónde se registran. Hoy los manuales dicen \"reportar al encargado\"\n> pero no existe un lugar donde queden asentadas. Sin registro, no se puede ver si algo\n> se repite. Ver \"Pendientes\".\n\n---\n\n## 9. Indicadores de desempeño (KPIs)\n\n| Indicador | Meta |\n|---|---|\n| **Apertura en horario** | 100% |\n| **Pedidos de producción cargados a tiempo** | 100% — los tres horarios |\n| **Diferencias de caja** | Todas reportadas, ninguna sin registrar |\n| **Reclamos escalados** | Resueltos en el día |\n| **Productos vencidos en vitrina** | **0** |\n| **Incidencias** | Registradas el mismo día |\n\n---\n\n## ✅ Checklist diario — Encargado de local\n\n### Apertura\n\n- ☐ Caja verificada con el cajero (fondo y cambio)\n- ☐ Vitrinas repuestas y con precios visibles\n- ☐ Barra lista (cafetera, molienda, café de prueba)\n- ☐ Las dos webs abren correctamente\n- ☐ Pedidos de clientes del día revisados\n- ☐ Personal completo y con uniforme correcto\n- ☐ Mercadería del primer reparto recibida y revisada\n\n### Durante el turno\n\n- ☐ Pedido de **Panadería** cargado (9:00)\n- ☐ Pedido de **Pastelería** cargado (16:00)\n- ☐ Mercadería del segundo reparto recibida (antes de las 13:00)\n- ☐ Devoluciones y movimientos de stock autorizados uno por uno\n- ☐ Reclamos escalados atendidos\n- ☐ Vitrina revisada a mitad de turno\n\n### Cierre\n\n- ☐ Pedidos de las **21:00** cargados (Esp / Fact / Sand / Cocina SL)\n- ☐ Pedidos de clientes: ninguno pendiente\n- ☐ Caja cerrada, sobre de depósito recibido y verificado\n- ☐ Diferencias registradas\n- ☐ Local limpio y equipos apagados\n- ☐ Incidencias del turno registradas\n\n---\n\n## 🚧 Pendientes de definición\n\nTodo esto **falta confirmar** — el manual está reconstruido desde afuera, no relevado\ncon quien ocupa el puesto:\n\n- [ ] **¿Hay un encargado por local?** ¿SLA 5.0 y San Luis tienen cada uno el suyo, o\n      hay uno solo para ambos?\n- [ ] **Horario del puesto.** ¿Cubre todo el día o hay turnos? ¿Quién es el\n      responsable cuando el encargado no está?\n- [ ] **Alcance sobre el personal.** ¿Arma los turnos? ¿Autoriza francos y cambios?\n      ¿Aplica los llamados de atención que mencionan los manuales de Cajeros?\n- [ ] **Dónde se registran las incidencias.** Hoy no hay lugar. Es el hueco más\n      concreto de todo el sistema: siete tipos de incidencia que se \"reportan\" y\n      no quedan en ningún lado.\n- [ ] **Relación con Administración.** Qué decide el encargado solo y qué consulta.\n      Hoy la frontera aparece solo en el tema pagos.\n- [ ] **Cronogramas y horarios del personal.** Existe una planilla *\"Horarios y\n      calendarios\"* y hubo un módulo de cronogramas en la app que se revirtió.\n      Definir si eso es responsabilidad de este puesto.\n- [ ] **Apertura y cierre de local.** ¿Quién tiene llaves? ¿El encargado abre y cierra\n      físicamente o delega?\n\n---\n\n## Documentos relacionados\n\n- [Manual de Cajeros](cajeros.md)\n- [Manual de Vendedores y Mozos](vendedores-y-mozos.md)\n- [Manual de Baristas](baristas.md)\n- [Manual de Compras](../produccion/compras.md)\n- [Herramientas digitales](../comunes/herramientas-digitales.md)\n- [Atención al cliente y reclamos](../comunes/atencion-y-reclamos.md)\n- [Pedidos y pagos a proveedores](../comunes/pedidos-y-pagos-a-proveedores.md)\n"}, "compras": {"titulo": "Compras", "icono": "🛒", "grupo": "produccion", "estado": "mid", "resumen": "Reparto a locales, recorrido de compras, dinero del día y rendición.", "orden": 5, "contenido": "# Manual de Procedimientos — Compras\n\n**Candela Café & Patisserie**\n*Versión 1.0 | Julio 2026*\n\n---\n\n## 🎯 Objetivo del rol\n\nGarantizar que **cada área tenga lo que necesita para producir** y que **cada local\nreciba su mercadería del día**, comprando al mejor precio disponible y rindiendo\ncada peso gastado.\n\nEl puesto lo ocupa **una sola persona**, y su trabajo tiene **dos aristas**:\n\n| Arista | En qué consiste |\n|---|---|\n| 🚚 **Reparto** | Llevar la mercadería del día a cada local de venta |\n| 🛒 **Compra** | Comprar todos los insumos y materias primas que pide cada área |\n\n> ⚠️ **Este puesto maneja dinero.** Casi todas las compras se pagan en el momento, con\n> efectivo que entrega Administración (ver Sección 3). Todo lo que se gasta se rinde\n> con factura (ver Sección 8).\n\n---\n\n## 🕗 Horario\n\n**Todos los días, de 6:45 a 13:00 hs.**\n\n| Hora | Qué pasa |\n|---|---|\n| **6:45** | Inicio del turno — **primer reparto** de mercadería a los locales |\n| **9:00** | **Revisión del pedido completo** del día y armado del recorrido |\n| **9:00** | **Estimado de gasto** calculado y pasado a Administración → retiro del efectivo |\n| **9:00 – 13:00** | Recorrido de compras |\n| **Antes de las 13:00** | **Segundo reparto** a los locales |\n| **Cierre** | Marcar en el sistema lo comprado y dejar los pendientes |\n\n---\n\n## 🖥️ Tu herramienta digital\n\n- **Web Pedidos de Producción** — `pedidos-produccion.netlify.app` → sección **Insumos**\n\nDesde ahí ves todo lo que pidió cada área y cada local, y vas marcando lo que comprás.\n\n> 📖 Referencia general en **[Herramientas digitales](../comunes/herramientas-digitales.md)**.\n\n---\n\n## 1. Primer reparto — 6:45 hs\n\n1. Cargá la mercadería del día para **SLA 5.0** y **San Luis**.\n2. Llevala a cada local a primera hora.\n3. **Cada local revisa la mercadería que llega.** No se firma nada — la revisión es\n   responsabilidad de quien recibe en el local.\n\n> ℹ️ Si un local detecta un faltante, lo reclama en el momento. No lo dejes para\n> después del recorrido.\n\n---\n\n## 2. Revisión del pedido — 9:00 hs\n\nA las 9:00 abrís el sistema y **mirás el pedido completo del día** antes de salir.\nEste es el momento en que se arma el recorrido.\n\n### Las tres prioridades\n\nCada área marca sus insumos con un color. **El color define qué tan urgente es:**\n\n| Color | Significado | Qué implica para vos |\n|---|---|---|\n| 🔴 **Urgente** | El área lo necesita **hoy** | **Se consigue hoy sí o sí.** No es negociable |\n| 🟡 **Stock bajo** | Se está por acabar | Compralo si el recorrido lo permite |\n| 🟢 **Stock OK** | Reposición normal | Puede esperar al próximo recorrido |\n\n> ⚠️ **Un insumo en rojo no puede quedar pendiente al final del día.** Si no lo\n> conseguís en el recorrido normal, hay que salir a buscarlo (ver Sección 7).\n\n### Los comentarios\n\nCada insumo puede llevar una **nota del área**. Son aclaraciones dirigidas a vos:\nmarca específica, tamaño, proveedor preferido, alguna condición particular.\n**Leelas antes de comprar** — evitan la mitad de los errores de compra.\n\n### Cómo ordenar la vista para armar el recorrido\n\nLa pantalla de insumos se puede ordenar de tres formas. Usá la que te sirva en cada\nmomento:\n\n| Orden | Cuándo usarlo |\n|---|---|\n| 🚚 **Por proveedor** | Para **armar el recorrido** — agrupa todo lo que comprás en cada parada |\n| ⚡ **Por prioridad** | Para ver **qué es urgente** de un vistazo, sin importar el área |\n| 🏪 **Por local/área** | Para chequear que **ninguna área quedó sin atender** |\n\n---\n\n## 3. El dinero del día\n\nUna vez armado el recorrido, y **antes de salir**, resolvés la plata.\n\n### Paso a paso\n\n1. **Calculá un estimado de gasto del día** en base al pedido que acabás de revisar.\n2. **Comunicaselo a Administración.**\n3. **Administración te entrega el efectivo.**\n4. Salís al recorrido y **pagás en el momento** cada compra.\n5. **Si el efectivo no alcanza** → se resuelve con una **transferencia**.\n\n> ### 🔑 El efectivo nunca sale de la caja de un local.\n> Toda la plata con la que Compras trabaja viene de Administración.\n\n### Los dos circuitos de pago\n\nHay **dos formas** en que se le paga a un proveedor. Las dos pasan por Administración:\n\n| | **A — Compras sale a comprar** | **B — El proveedor entrega en el local** |\n|---|---|---|\n| **Quién paga** | Compras, en el recorrido | Quien recibe en el local |\n| **Cuándo** | En el momento de la compra | En el día de pago del proveedor |\n| **De dónde sale la plata** | Efectivo que Administración entregó contra el estimado | Efectivo que Administración envía al local |\n| **Si no alcanza** | Transferencia | Transferencia |\n| **Caja del local** | ⛔ Nunca se toca | ⛔ Nunca se toca |\n\n> 📖 El circuito **B** y el calendario de qué proveedor se pide y se paga cada día\n> están en\n> **[Pedidos y pagos a proveedores](../comunes/pedidos-y-pagos-a-proveedores.md)**.\n\n---\n\n## 4. La regla del pedido\n\n> ### 🔑 Cada área es responsable de su propio pedido de insumos.\n> **Si un área no carga lo que necesita, nadie lo va a comprar.**\n\nCompras no adivina ni repone por su cuenta. Lo que no está en el sistema, no existe.\nSi un área reclama un insumo que nunca cargó, la falta es del área — pero avisale al\nencargado para que no vuelva a pasar.\n\n---\n\n## 5. Proveedores\n\n- Un mismo insumo puede tener **varios proveedores**, y cada proveedor puede ofrecer\n  **varias marcas**. No hay un proveedor único por producto.\n- El sistema guarda un **proveedor por producto**, que sirve para agrupar el recorrido.\n\n### Días de pedido y de pago\n\n> ### 🔑 Cada proveedor tiene día fijo de pedido y día fijo de pago.\n> El calendario completo está en\n> **[Pedidos y pagos a proveedores](../comunes/pedidos-y-pagos-a-proveedores.md)**.\n\nLo esencial:\n\n- **Los pedidos solo se hacen en el día que le corresponde a cada proveedor.**\n- **Lunes y jueves** son los días pesados de pedido (8 y 9 proveedores).\n- **Al hacer un pedido hay que avisar a Administración** para que autorice la\n  transferencia o envíe el efectivo al local.\n- **Ningún pago sale de la caja del local.** Sin excepción.\n\n### Compras grandes — Autorización\n\n> **Una compra de más de 50 ítems se considera compra grande.**\n> **Las autoriza Administración.** No salgas a comprar sin ese visto bueno.\n\n---\n\n## 6. Recepción de mercadería\n\nHay **dos caminos** según cómo entregue el proveedor:\n\n### A) Compras la trae\n\nEs el caso normal: comprás en el recorrido y la llevás vos.\n\n### B) El proveedor entrega directo en el local\n\nAlgunos proveedores llevan la mercadería directamente a SLA 5.0 o San Luis.\nEn ese caso:\n\n1. **El área de atención del local verifica** que la mercadería llegó correctamente.\n2. Si hay un faltante o algo vino mal, **el cajero hace el reclamo al proveedor\n   que corresponda**.\n3. **Avisale a Compras** que hubo un problema, para que quede registrado y no se\n   repita con ese proveedor.\n\n### Registro\n\nAlgunos insumos se registran en FUDO y otros no.\n\n> 🚧 **A definir:** falta la regla de qué insumo va a FUDO y cuál no. Hoy se decide\n> por costumbre. Ver \"Pendientes\" al final.\n\n---\n\n## 7. Faltantes y urgencias\n\nSi un área se queda sin un insumo **en pleno turno**:\n\n1. El área lo marca como 🔴 **Urgente** en el sistema.\n2. **Compras lo debe conseguir ese mismo día.**\n3. Si ya pasaste por el proveedor habitual, buscá una alternativa — otro proveedor,\n   otra marca, comercio minorista.\n\n> ⚠️ **Un urgente no se posterga.** Si por algún motivo no se pudo conseguir, avisá\n> a Administración y al área **antes de terminar el turno** — no lo dejes descubrir\n> al día siguiente.\n\n---\n\n## 8. Cierre — Marcado y rendición\n\n### Marcar lo comprado\n\n**A medida que avanzás con las compras del día, marcá en el sistema cada producto\nque ya compraste.** No lo dejes todo para el final.\n\n- Lo que marcás pasa a **Comprados**.\n- Lo que queda sin marcar queda como **Pendiente** y aparece en el pedido del\n  día siguiente.\n\n> Esto es lo que hace que nada se pierda entre un día y el otro. Si no marcás, el\n> sistema no sabe qué falta.\n\n### Rendición de dinero\n\nLas compras del recorrido se pagan **en el momento**, con el efectivo que\nAdministración te entregó contra el estimado de la mañana (Sección 3). Al cierre:\n\n1. Juntá **todas las facturas** del día.\n2. Presentalas a **Administración**.\n3. **Administración verifica cada día que lo pagado coincida con las facturas\n   presentadas.**\n\n> ⚠️ **Una compra sin factura no se puede rendir.** Pedí comprobante siempre, incluso\n> en compras chicas.\n\nEl circuito del dinero se cierra así:\n\n```\nEstimado de gasto  ──►  Efectivo de Administración  ──►  Compras del día\n                                                              │\n                                                              ▼\n                          Administración verifica    ◄──  Facturas rendidas\n```\n\nLo que se estimó, lo que se entregó y lo que se facturó tienen que cerrar entre sí.\n\n---\n\n## 9. Segundo reparto — Antes de las 13:00\n\nAntes de terminar el turno, hacé el **segundo reparto** a los locales con lo que\ncompraste durante la mañana.\n\nIgual que en el primero: **cada local revisa lo que recibe, no se firma nada.**\n\n---\n\n## 10. Indicadores de desempeño (KPIs)\n\n| Indicador | Meta |\n|---|---|\n| **Urgentes resueltos** | **100%** el mismo día |\n| **Repartos** | Los dos hechos en horario (mañana y antes de las 13:00) |\n| **Marcado en el sistema** | Todo lo comprado marcado antes de cerrar el turno |\n| **Rendición** | Facturas presentadas a Administración **todos los días** |\n| **Coincidencia pagado / facturado** | **Sin diferencias** |\n| **Autorizaciones** | Ninguna compra de +50 ítems sin visto bueno de Administración |\n\n---\n\n## ✅ Checklist diario — Compras\n\n*Imprimí o revisá este checklist en cada turno.*\n\n### Inicio del turno (6:45)\n\n- ☐ Mercadería del día cargada para SLA 5.0\n- ☐ Mercadería del día cargada para San Luis\n- ☐ Primer reparto entregado en ambos locales\n- ☐ Faltantes reportados por los locales, anotados\n\n### Revisión del pedido (9:00)\n\n- ☐ Pedido completo del día revisado en el sistema\n- ☐ Insumos 🔴 **Urgente** identificados\n- ☐ Comentarios de cada área leídos\n- ☐ Recorrido armado (vista ordenada **por proveedor**)\n- ☐ **Estimado de gasto del día** calculado\n- ☐ Estimado comunicado a Administración\n- ☐ **Efectivo recibido** antes de salir\n- ☐ Si el pedido supera los **50 ítems** → autorización de Administración pedida\n\n### Durante el recorrido (9:00 – 13:00)\n\n- ☐ Cada producto comprado, **marcado en el sistema en el momento**\n- ☐ Factura pedida y guardada en cada compra\n- ☐ Si el efectivo no alcanzó → transferencia pedida a Administración\n- ☐ Urgentes conseguidos — o alternativa buscada\n- ☐ Áreas avisadas si algo no se consiguió\n\n### Cierre (antes de las 13:00)\n\n- ☐ Segundo reparto entregado en ambos locales\n- ☐ Todos los productos comprados marcados en el sistema\n- ☐ Pendientes revisados — quedan para mañana\n- ☐ Ningún 🔴 urgente sin resolver (o Administración avisada)\n- ☐ Facturas del día presentadas a Administración\n- ☐ Incidencias del turno reportadas al encargado\n\n---\n\n## 🚧 Pendientes de definición\n\nPuntos que salieron al escribir este manual y que **todavía no tienen una regla clara**.\nConviene resolverlos y actualizar el documento:\n\n- [x] ~~**Días fijos de pedido por proveedor.**~~ **Documentados** en\n      [Pedidos y pagos a proveedores](../comunes/pedidos-y-pagos-a-proveedores.md).\n      Queda pendiente lo otro: el calendario existe pero **no se respeta en la\n      práctica**. Definir si se hace cumplir — hoy genera urgencias evitables.\n- [ ] **Qué se registra en FUDO.** Hoy algunos insumos sí y otros no, por costumbre.\n      Falta el criterio escrito.\n- [x] ~~**Manejo del dinero.**~~ **Resuelto** y documentado en la Sección 3: Compras\n      estima el gasto del día, Administración entrega el efectivo, y si no alcanza se\n      cubre con transferencia. Ningún pago sale de la caja del local.\n- [ ] **Sobrante de efectivo.** Si el estimado fue mayor al gasto real, no está escrito\n      qué se hace con la diferencia: se devuelve el mismo día, queda como fondo para\n      mañana, o se descuenta del retiro siguiente. Definirlo cierra el circuito.\n- [ ] **Cómo se comunica el estimado.** ¿Verbal, WhatsApp, planilla? Y si queda\n      registro de cuánto se pidió contra cuánto se entregó.\n- [ ] **Hora límite de carga de insumos.** Compras revisa a las 9:00, así que las áreas\n      tendrían que cargar antes. Confirmar cuál es el horario límite real y sumarlo a\n      [Herramientas digitales]
