    else if (act === "nueva-pass") await nuevaContrasena(uid);
    else if (act === "roles-persona") { S.editandoRoles = uid || null; pintar(); }
    else if (act === "editar-rol") { S.editandoRol = el.getAttribute("data-rid") || null; pintar(); }
    else if (act === "eliminar-rol") await eliminarRol(el.getAttribute("data-rid"));
    else if (act === "roles-sugeridos") await crearRolesSugeridos();
    else if (act === "cerrar-cred") { S.credenciales = null; pintar(); }
    else if (act === "copiar-cred") {
      const c = S.credenciales;
      const txt = `Manuales y Recetario de Candela: ${location.origin}/manuales/\nUsuario: ${c.usuario}\nContraseña: ${c.pass}`;
      try { await navigator.clipboard.writeText(txt); toast("📋 Copiado."); } catch { toast("No se pudo copiar: anotalo a mano.", "warn"); }
    }
    else if (act === "publicar") await publicarImportacion();
    else if (act === "descartar-imp") { S.importacion = null; pintar(); }
    else if (act === "editar") await abrirEditor(el.getAttribute("data-id"));
    else if (act === "nuevo-manual") await abrirEditor(null);
    else if (act === "sugerido") abrirSugerido(el.getAttribute("data-id"));
    else if (act === "sugerido-no") await descartarSugerido(el.getAttribute("data-id"));
    else if (act === "seguir-borrador") await abrirEditor(null, el.getAttribute("data-k"));
    else if (act === "descartar-borrador") await descartarBorrador(el.getAttribute("data-k"));
    else if (act === "salir-editor") await salirEditor();
    else if (act === "publicar-edicion") { el.disabled = true; try { await publicarEdicion(); } finally { el.disabled = false; } }
    else if (act === "ver-versiones") await verVersiones();
    else if (act === "restaurar-version") restaurarVersion(el.getAttribute("data-ts"));
    else if (act === "eliminar-manual") await eliminarManual();
    else if (act === "restaurar-manual") await restaurarManual(el.getAttribute("data-id"));
    else if (act === "manual-subir" || act === "manual-bajar") await moverManual(el.getAttribute("data-id"), act === "manual-subir" ? -1 : 1);
    else if (act === "parte-subir" || act === "parte-bajar") await moverParte(el.getAttribute("data-parte"), act === "parte-subir" ? -1 : 1);
    else if (act === "parte-renombrar") await renombrarParte(el.getAttribute("data-parte"));
    else if (act === "imprimir-todo") await imprimirTodo();
  } catch (e) {
    console.error(e);
    toast(e.code ? mensajeError(e.code) : (e.message || String(e)), "error");
  }
}
async function onSubmit(ev) {
  const form = ev.target.closest("form[data-form]");
  if (!form) return;
  ev.preventDefault();
  const tipo = form.getAttribute("data-form");
  const fd = new FormData(form);
  try {
    if (tipo === "login") await ingresar(fd.get("usuario"), fd.get("pass"));
    else if (tipo === "registro") {
      S.registrando = true; S.errorLogin = ""; pintar();
      try { await registrarme({ nombre: fd.get("nombre"), usuario: fd.get("usuario"), pass: fd.get("pass"), pass2: fd.get("pass2") }); S.modoRegistro = false; }
      catch (e) { S.errorLogin = e.code ? mensajeError(e.code) : (e.message || String(e)); }
      finally { S.registrando = false; pintar(); }
    }
    else if (tipo === "masivo") await altaMasiva(fd.get("texto"), marcadosDe(form, "masivo-rol"));
    else if (tipo === "invitacion") await crearInvitacion(marcadosDe(form, "inv-rol"));
    else if (tipo === "aprobar") await aprobarSolicitud(form.getAttribute("data-uid"), marcadosDe(form, "sol-rol"));
    else if (tipo === "clave") {
      await cambiarMiContrasena(fd.get("c1"), fd.get("c2"));
      form.reset();
      toast("✓ Contraseña cambiada. La próxima vez entrá con la nueva.");
    } else if (tipo === "alta") {
      S.creando = true; pintar();
      try {
        const roles = marcadosDe(form, "alta-rol");
        // Si el usuario es el que se sugirió solo y ya existe, se busca uno libre (anar → anar2).
        let usuario = String(fd.get("usuario") || "");
        if (normalizarUsuario(usuario) === usuarioSugerido(fd.get("nombre"))) usuario = await usuarioLibre(usuario);
        const r = await darDeAlta({ nombre: fd.get("nombre"), usuario, pass: fd.get("pass"), roles });
        S.creadosSesion.unshift({ nombre: String(fd.get("nombre")).trim(), usuario: r.usuario, pass: r.pass, roles: nombresRoles(roles) });
        // Listo para la próxima persona: mismo rol, campos vacíos, cursor en el nombre.
        S.alta = { nombre: "", usuario: "", pass: contrasenaNueva(), roles };
        toast(`✓ ${r.usuario} creado. Seguí con la próxima persona.`);
      } finally { S.creando = false; pintar(); }
      const n = document.getElementById("a-n"); if (n) try { n.focus(); } catch {}
    } else if (tipo === "roles-persona") await guardarRolesPersona(form.getAttribute("data-uid"), marcadosDe(form, "rol"));
    else if (tipo === "rol") await guardarRol(form.getAttribute("data-rid") || null, { nombre: fd.get("nombre"), recetario: !!fd.get("recetario"), manuales: marcadosDe(form, "rol-manual") });
  } catch (e) {
    console.error(e);
    toast(e.code ? mensajeError(e.code) : (e.message || String(e)), "error");
  }
}
function onInput(ev) {
  const el = ev.target;
  if (el.id === "rg-u") { el.dataset.auto = "0"; return; }
  if (el.id === "ed-cuerpo" || el.closest?.("#ed-cuerpo") || el.hasAttribute?.("data-ed-campo")) { marcarCambio(); return; }
  const k = el.getAttribute && el.getAttribute("data-input");
  if (!k) return;
  if (k === "buscar") { S.q = el.value; pintar(); }
  else if (k === "rec-buscar") { S.recQ = el.value; pintar(); }
  else if (k === "alta-nombre") {
    const antes = S.alta.usuario, sugeridoAntes = usuarioSugerido(S.alta.nombre);
    S.alta.nombre = el.value;
    if (!antes || antes === sugeridoAntes) { S.alta.usuario = usuarioSugerido(el.value); const u = document.getElementById("a-u"); if (u) u.value = S.alta.usuario; }
  }
  else if (k === "alta-usuario") S.alta.usuario = el.value;
  else if (k === "masivo-texto") S.masivo.texto = el.value;
  else if (k === "rg-nombre") { const u = document.getElementById("rg-u"); if (u && (!u.value || u.dataset.auto === "1")) { u.value = usuarioSugerido(el.value); u.dataset.auto = "1"; } }
  else if (k === "alta-pass") S.alta.pass = el.value;
}
function onChange(ev) {
  const el = ev.target;
  if (el.id === "ed-img") { insertarImagen(el.files && el.files[0]).catch(e => toast("No se pudo agregar la imagen.", "error")); el.value = ""; return; }
  if (el.id === "ed-parte") { leerEditor(); S.edit._redibujar = true; const m = rootEl.querySelector("[data-editor]"); if (m) m.removeAttribute("data-editor"); pintar(); marcarCambio(); return; }
  if (el.hasAttribute?.("data-ed-campo") || el.name === "ed-rol") { marcarCambio(); return; }
  const k = el.getAttribute && el.getAttribute("data-input");
  if (k === "archivo") elegirArchivo(el.files && el.files[0]);
  else if (k === "visible") cambiarVisible(el.getAttribute("data-id"), el.checked).catch(e => toast(mensajeError(e.code || e.message), "error"));
  else if (el.name === "masivo-rol") S.masivo.roles = marcadosDe(el.form, "masivo-rol");
  else if (el.name === "inv-rol") S.invNueva = { ...S.invNueva, roles: marcadosDe(el.form, "inv-rol") };
  else if (S.alta && el.name === "alta-rol") { const p = { ...(S.alta.roles || {}) }; if (el.checked) p[el.value] = true; else delete p[el.value]; S.alta.roles = p; }
}
// Pegar desde Word o Docs: se limpia (sin colores, tipografías ni estilos raros) antes de entrar.
function onPaste(ev) {
  if (!ev.target.closest?.("#ed-cuerpo")) return;
  const dt = ev.clipboardData; if (!dt) return;
  const html = dt.getData("text/html"), texto = dt.getData("text/plain");
  ev.preventDefault();
  if (html) document.execCommand("insertHTML", false, limpiarHtml(html.replace(/<!--[\s\S]*?-->/g, "")));
  else document.execCommand("insertText", false, texto);
  marcarCambio();
}

function montar(el) {
  rootEl = el;
  el.addEventListener("keydown", ev => { if ((ev.key === "Enter" || ev.key === " ") && ev.target.matches?.(".giro-in")) { ev.preventDefault(); ev.target.click(); } });
  el.addEventListener("click", onClick);
  el.addEventListener("submit", onSubmit);
  el.addEventListener("input", onInput);
  el.addEventListener("change", onChange);
  el.addEventListener("paste", onPaste);
  // Botón para volver arriba en los manuales largos.
  const arriba = document.createElement("button");
  arriba.id = "arriba"; arriba.type = "button"; arriba.setAttribute("aria-label", "Volver arriba"); arriba.textContent = "↑";
  arriba.addEventListener("click", () => window.scrollTo({ top: 0, behavior: "smooth" }));
  document.body.appendChild(arriba);
  let pendienteScroll = false;
  window.addEventListener("scroll", () => {
    if (pendienteScroll) return;
    pendienteScroll = true;
    requestAnimationFrame(() => {
      pendienteScroll = false;
      arriba.classList.toggle("ver", window.scrollY > 900 && ["manual", "receta"].includes(S.vista));
      if (S.vista === "manual") marcarSeccion();
    });
  }, { passive: true });
  // Mientras se edita un manual: si queda algo sin guardar, se guarda antes de cerrar la pestaña.
  window.addEventListener("pagehide", () => { if (S.edit?.pendiente) guardarBorrador(); });
  window.addEventListener("beforeunload", ev => { if (S.edit?.pendiente) { guardarBorrador(); ev.preventDefault(); ev.returnValue = ""; } });
  pintar();
}
// Se engancha después de montar: en los tests el stub de Auth puede responder en el acto.
function arrancar() {
  montar(document.getElementById("app"));
  onAuthStateChanged(auth, user => { S.authListo = true; iniciarSesion(user); });
}
arrancar();
</script>
