n- [ ] **Sobrantes**: qué se guarda, qué se tira, dónde se registra\n\n> 📄 Todo esto está en el\n> [cuestionario de áreas de producción](_cuestionario-areas-produccion.md), listo para\n> reenviar a quien está en el puesto.\n\n\n---\n\n## Documentos relacionados\n\n- [Cuestionario de áreas de producción](_cuestionario-areas-produccion.md)\n- [Bases y preparaciones](bases.md)\n- [Manual de Compras](compras.md)\n- [Herramientas digitales](../comunes/herramientas-digitales.md)\n- [Higiene y presentación](../comunes/higiene-y-presentacion.md)\n"}, "bases": {"titulo": "Bases y preparaciones", "icono": "🥣", "grupo": "produccion", "estado": "low", "resumen": "Chantilly, pastelera, bizcochuelo, masa frola y almíbares.", "orden": 11, "contenido": "# Bases y preparaciones — Candela Café & Patisserie\n\n**Candela Café & Patisserie**\n*Versión 0.5 — FÓRMULAS | Agosto 2026*\n\n---\n\n> **Documento común de producción.** Las bases son preparaciones que **no se venden\n> solas**: se hacen aparte y se usan como ingrediente de otros productos, sobre todo en\n> Pastelería y Facturería.\n>\n> Si una base sale mal, salen mal todos los productos que la usan. Por eso van juntas y\n> aparte.\n\n---\n\n## Cómo leer estas fórmulas\n\nLas cantidades están **normalizadas a 1 kg de base terminada**. Para hacer 5 kg de\ncrema chantilly, se multiplica todo por 5.\n\n---\n\n## Fórmulas\n\n### Crema Chantilly\n\n| Ingrediente | Marca / detalle | Cantidad |\n|---|---|---|\n| Crema de leche Cosalta | — | **0.198** |\n| Crema Vegetal | — | **0.6601** |\n| Azucar Rio Grande | — | **0.132** |\n| Esencia de vainilla Circe | — | **0.0099** |\n\n### Crema Pastelera\n\n| Ingrediente | Marca / detalle | Cantidad |\n|---|---|---|\n| Leche entera | — | **0.612** |\n| Azucar Rio Grande | — | **0.2448** |\n| Huevos | — | **0.1224** |\n| Almidon de maiz | — | **0.0612** |\n| Esencia de vainilla Circe | — | **0.0122** |\n\n### Bizcochuelo de Vainilla\n\n| Ingrediente | Marca / detalle | Cantidad |\n|---|---|---|\n| Azucar Rio Grande | — | **0.3241** |\n| Huevos | — | **0.5555** |\n| Harina 0000 | — | **0.3241** |\n| Polvo para hornear | — | **0.0231** |\n| Emulsionante en pasta | — | **0.0231** |\n\n### Masa Frola\n\n| Ingrediente | Marca / detalle | Cantidad |\n|---|---|---|\n| Azucar Rio Grande | — | **0.2119** |\n| Margarina masa Mtk | — | **0.2119** |\n| Huevos | — | **0.1059** |\n| Harina 0000 | — | **0.4237** |\n| Polvo para hornear | — | **0.0212** |\n| Miel de abeja | — | **0.0212** |\n| Esencia de vainilla Circe | — | **0.0042** |\n\n### Almibar Para Tortas\n\n| Ingrediente | Marca / detalle | Cantidad |\n|---|---|---|\n| Azucar Rio Grande | — | **0.5291** |\n| Agua | — | **0.5291** |\n| licor | — | **0.0529** |\n\n### Almibar P/Facturas\n\n| Ingrediente | Marca / detalle | Cantidad |\n|---|---|---|\n| Azucar Rio Grande | — | **0.446** |\n| Agua | — | **0.446** |\n| Naranja | — | **0.0446** |\n| Jalea fruta | — | **0.0892** |\n| Miel de abeja | — | **0.0223** |\n| Esencia de vainilla Circe | — | **0.0044** |\n\n\n---\n\n## Dónde se usa cada base\n\n| Base | Se usa en |\n|---|---|\n| **Crema Chantilly** | Torta de Duraznos · Torta Oreo |\n| **Crema Pastelera** | Facturas con Crema y Dulce |\n| **Bizcochuelo de Vainilla** | Torta de Duraznos |\n| **Masa Frola** | Tarta Cabsha |\n| **Almíbar Para Tortas** | Torta de Duraznos · Torta Tiramisú |\n| **Almíbar P/Facturas** | Medialunas · Facturas con Crema y Dulce |\n\n---\n\n## 🚧 Lo que falta relevar\n\n- [ ] **Proceso de cada base**: pasos, tiempos, temperaturas, punto\n- [ ] **Cuánto dura** cada base una vez hecha, y cómo se conserva\n- [ ] **Cada cuánto se hacen** — por tanda, por día, por demanda\n- [ ] **Cómo se sabe que una base se cortó o se pasó**, y qué se hace en ese caso\n- [ ] **Rendimiento real** — la normalización a 1 kg es del sistema de costeo, hay que\n      confirmar contra el batch que se hace de verdad\n\n---\n\n## Documentos relacionados\n\n- [Manual de Pastelería](pasteleria.md)\n- [Manual de Facturería](factureria.md)\n- [Cuestionario de áreas de producción](_cuestionario-areas-produccion.md)\n\n"}, "herramientas-digitales": {"titulo": "Herramientas digitales", "icono": "🖥️", "grupo": "comunes", "estado": "ok", "resumen": "FUDO, las dos webs, PINs por área y horarios límite.", "orden": 12, "contenido": "# Herramientas digitales — Candela Café & Patisserie\n\n> **Documento común.** Esta es la fuente única de verdad para URLs, PINs y horarios\n> límite. Si algo cambia, se cambia **acá primero** y después en los manuales que\n> lo repiten.\n\n---\n\n## Las tres herramientas\n\n| # | Herramienta | Para qué sirve | Quién la usa |\n|---|---|---|---|\n| 1 | **FUDO** | Punto de venta: ventas, caja, stock, cuentas corrientes | Cajeros, Vendedores, Mozos, Baristas |\n| 2 | **Web Pedidos de Clientes**<br>`pedidos-de-clientes-cc.netlify.app` | Encargues y pedidos a futuro (tortas, catering, eventos) | Cajeros, Vendedores, Mozos |\n| 3 | **Web Pedidos de Producción**<br>`pedidos-produccion.netlify.app` | Pedido diario de cada área de producción | Cajeros, Vendedores, Mozos, Baristas |\n\n> **Baristas:** la Web de Pedidos de Clientes **no es de tu área** — esa la usan\n> caja y ventas.\n\n---\n\n## Horarios límite — Pedidos de Producción\n\nSe carga **una vez por turno**, antes del horario límite de cada área.\n\n| Área | Cargar antes de |\n|---|---|\n| Panadería | **9:00 hs** |\n| Pastelería | **16:00 hs** |\n| Especialidades | **21:00 hs** |\n| Facturería | **21:00 hs** |\n| Sandwiches | **21:00 hs** |\n| Cocina San Luis | **21:00 hs** |\n\n> ℹ️ **Sobre Cocina San Luis:** forma parte del local San Luis, no es un área de\n> producción aparte. Funciona de forma independiente **solo para pedir insumos** —\n> por eso aparece en esta lista con su propio horario. No tiene cuadra de producción\n> ni personal propio: la operación es del local San Luis.\n\n> ⚠️ **Si no cargás a tiempo, producción no puede cumplir.**\n> El pedido es para el **día siguiente**, salvo que el encargado indique otra cosa.\n> Si te olvidaste, avisá al encargado **inmediatamente** — no lo dejes pasar.\n\n---\n\n## PINs por área — Web Pedidos de Clientes\n\nAl cargar productos, el sistema pide un PIN por cada área:\n\n| Área | PIN |\n|---|---|\n| Panadería | `1111` |\n| Pastelería | `2222` |\n| Facturería | `3333` |\n| Especialidades | `4444` |\n| Sandwiches | `5555` |\n| **PIN maestro** (ver todo) | `1412` |\n\n---\n\n## Paso a paso — Cargar un Pedido de Producción\n\n1. Abrí el navegador e ingresá a **`pedidos-produccion.netlify.app`**\n2. Seleccioná el local: **SLA 5.0** o **San Luis**\n3. Seleccioná el área (ej: Panadería)\n4. Ingresá las cantidades de cada producto\n5. Revisá el pedido\n6. Tocá **\"Confirmar pedido\"**\n\n✅ Producción puede ver el pedido de inmediato desde su pantalla.\n\n### Ver la guía de producción\n\n1. Ingresá a **`pedidos-produccion.netlify.app`**\n2. Seleccioná el local\n3. Tocá **\"Guía\"** o **\"Cuadra\"** en el menú\n4. Podés imprimir o consultar desde la pantalla\n\n---\n\n## Paso a paso — Cargar un Pedido de Cliente\n\n1. Abrí el navegador e ingresá a **`pedidos-de-clientes-cc.netlify.app`**\n2. Tocá **\"Ventas\"** en el menú\n3. Completá los datos del cliente:\n   - Nombre completo\n   - Teléfono\n   - Fecha de entrega\n   - Local (SLA 5.0 o San Luis)\n4. Agregá los productos por área — el sistema pide el **PIN del área** (ver tabla arriba)\n5. Ingresá el PIN → elegí productos y cantidades\n6. Repetí para cada área que corresponda\n7. Revisá el pedido completo\n8. Tocá **\"Confirmar\"**\n\n✅ El pedido queda registrado y llega automáticamente al área de producción.\n\n### Errores frecuentes\n\n| Error | Cómo evitarlo |\n|---|---|\n| ❌ Fecha mal cargada | Verificá en el calendario antes de confirmar |\n| ❌ PIN incorrecto | Consultá la tabla de PINs de arriba |\n| ❌ Pedido sin confirmar | Siempre tocá **\"Confirmar\"** al final |\n\n---\n\n## Reglas que no se negocian\n\n- **Nada se entrega sin registrar en FUDO.** Ninguna venta, ningún producto.\n- **Los pedidos de mercadería van a la web.** No se usan papeles ni WhatsApp para esto.\n- **Un pedido con seña deja dos registros:** el pedido en la web y el cobro en FUDO.\n  Los dos son necesarios.\n"}, "atencion-y-reclamos": {"titulo": "Atención al cliente y reclamos", "icono": "💬", "grupo": "comunes", "estado": "ok", "resumen": "Método LAST, 7 pasos de atención, upselling y tiempos.", "orden": 13, "contenido": "# Atención al cliente y reclamos — Candela Café & Patisserie\n\n> **Documento común.** Aplica a todos los roles de cara al público: cajeros,\n> vendedores, mozos y baristas.\n\n---\n\n## Método LAST — Cómo manejar un reclamo\n\nCuando un cliente tiene un problema, seguí estos cuatro pasos **en orden**:\n\n### L — Listen (Escuchar)\n\nDejá que el cliente cuente todo **sin interrumpir**. Aunque ya sepas cuál es el\nproblema, aunque tengas la solución en la punta de la lengua. La persona necesita\nsentirse escuchada antes de aceptar cualquier solución.\n\n### A — Apologize (Disculparse)\n\n> *\"Lamentamos mucho esto, no debería haber pasado.\"*\n\nDisculparse no es admitir culpa ni regalar nada. Es reconocer que la experiencia\ndel cliente no fue la que queríamos darle.\n\n### S — Solve (Resolver)\n\nOfrecé una **solución concreta**, no una explicación:\n\n- Reponer el producto\n- Cambiarlo por otro\n- No cobrar el ítem\n- Rehacer la bebida\n\n### T — Thanks (Agradecer)\n\n> *\"Gracias por avisarnos, eso nos ayuda a mejorar.\"*\n\n---\n\n## Reglas absolutas\n\n> ⚠️ **Nunca discutas con el cliente.**\n> ⚠️ **Nunca niegues el problema.**\n> ⚠️ **Si el reclamo es grande, llamá al encargado de inmediato.**\n\nNo tenés que resolver todo solo/a. Escalar a tiempo es hacer bien tu trabajo, no\nes fallar.\n\n---\n\n## Los 7 pasos de la atención\n\nSirven tanto en mostrador como en mesa:\n\n| # | Paso | Cómo se ve |\n|---|---|---|\n| 1 | **Saludar** | Con sonrisa y contacto visual: *\"¡Hola! ¿Te puedo ayudar?\"* |\n| 2 | **Escuchar** | Dejá que el cliente se exprese sin interrumpir |\n| 3 | **Asesorar** | Describí los productos con entusiasmo. Destacá los favoritos del día |\n| 4 | **Ofrecer más** | Sugerí un complemento — una vez, con naturalidad |\n| 5 | **Confirmar** | Repetí lo que el cliente eligió antes de cobrar |\n| 6 | **Cobrar y registrar** | Registrá en FUDO. Entregá el comprobante |\n| 7 | **Despedir** | *\"¡Que lo disfrutes! Hasta la próxima.\"* |\n\n---\n\n## Upselling — Ofrecer sin presionar\n\nEl upselling es **ofrecer algo que mejore la experiencia** del cliente. No es\npresionar — es asesorar.\n\n### Ejemplos que funcionan\n\n| Si el cliente pide… | Ofrecé… |\n|---|---|\n| Un café | *\"¿Lo acompañás con unas medialunas? Hoy salieron recién.\"* |\n| Una porción | *\"¿Querés llevar una caja también? Tenemos descuento para llevar.\"* |\n| Algo para llevar | *\"¿Te armamos una cajita mixta?\"* |\n| Una torta (en mesa) | *\"¿La querés con helado? Le suma mucho.\"* |\n| Un sandwich | *\"¿Querés una bebida con eso?\"* |\n| Mesa de grupo | *\"¿Compartimos una tabla para empezar?\"* |\n\n> ℹ️ **Ofrecé una vez, con naturalidad. Si el cliente dice que no, no insistas.**\n\n---\n\n## Tiempos de respuesta\n\n| Situación | Tiempo máximo |\n|---|---|\n| Recibir al cliente en la entrada | 30 segundos |\n| Acercarse a la mesa a tomar el pedido | 2 minutos |\n| Atención en mostrador | 3 minutos |\n| Responder WhatsApp (horario comercial) | 10 minutos |\n\nSi algo se va a demorar más de lo esperado, **avisá al cliente antes de que pregunte.**\n"}, "higiene-y-presentacion": {"titulo": "Higiene y presentación", "icono": "🧼", "grupo": "comunes", "estado": "ok", "resumen": "Higiene personal, manipulación, cadena de frío y qué reportar.", "orden": 14, "contenido": "# Higiene y presentación — Candela Café & Patisserie\n\n> **Documento común.** Aplica a todos los roles en ambos locales de venta y en el\n> local de producción.\n\n---\n\n## Higiene personal\n\n- **Lavarse las manos** antes de manipular alimentos y **después de cobrar**.\n  El dinero es una de las superficies más sucias que vas a tocar en el turno.\n- **Uniforme limpio y completo** en todo momento.\n- **No comer ni tomar** en el área de atención.\n- **Uñas cortas y limpias**, pelo recogido.\n\n---\n\n## Manipulación de producto\n\n- **El pan se despacha con pinza y papel — nunca con la mano.**\n- Verificá siempre la **frescura**. Pan viejo no sale.\n- **FIFO** (*primero entra, primero sale*): los productos más viejos van adelante.\n- Separar **productos húmedos de secos** en el empaque.\n\n---\n\n## Orden del puesto\n\n- Mantener el área de trabajo **libre de objetos personales**.\n- Superficies **secas y ordenadas** durante todo el turno.\n- Vitrinas limpias, con **etiqueta de precio visible** en todo momento.\n- Revisar la vitrina **tres veces**: al inicio del turno, a la mitad y antes del cierre.\n\n---\n\n## Cadena de frío\n\n- Verificá la **fecha de vencimiento** de fiambres y lácteos al inicio del turno.\n- Mantené la heladera **limpia y organizada**.\n- **Productos vencidos** → retirá y avisá al encargado **de inmediato**.\n- **No rompas la cadena de frío** — no dejes productos fuera de la heladera sin\n  necesidad.\n\n---\n\n## Qué reportar y cuándo\n\n| Situación | A quién | Cuándo |\n|---|---|---|\n| Producto vencido | Encargado | De inmediato |\n| Producto agotado | Encargado | De inmediato |\n| Equipo que no funciona | Encargado | Antes de abrir |\n| Rotura o consumo interno | Encargado → registrar en FUDO | En el momento |\n| Incidencia del turno | Encargado | Al cierre |\n"}, "pedidos-y-pagos-a-proveedores": {"titulo": "Pedidos y pagos a proveedores", "icono": "🚚", "grupo": "comunes", "estado": "ok", "resumen": "Calendario de los 15 proveedores: pedido, pago y método.", "orden": 15, "contenido": "# Pedidos y pagos a proveedores — Candela Café & Patisserie\n\n*Versión 1.0 | Junio 2026*\n\n> **Documento común.** Aplica a **Compras**, **Administración** y a los **locales de\n> venta**. Es la fuente única de verdad del calendario de pedidos y pagos.\n\n> ### 📌 A qué proveedores aplica este calendario\n> A los que **entregan la mercadería directamente en los locales**. Para ellos,\n> Administración hace llegar el dinero al local, de modo que **ningún local tenga que\n> tocar el efectivo de su caja para pagar**.\n>\n> Las compras que **Compras hace en su recorrido** van por otro circuito: estimado de\n> gasto → efectivo de Administración → pago en el momento. Ver\n> **[Manual de Compras, Sección 3](../produccion/compras.md#3-el-dinero-del-día)**.\n>\n> ✅ **Este circuito está vigente y en uso.**\n\n---\n\n## Las tres reglas\n\n> ### 1. Los pedidos a proveedores solo se hacen en los días indicados.\n> El calendario de abajo no es una sugerencia.\n\n> ### 2. Todo pago se informa y se autoriza. Sin excepción.\n> Al hacer un pedido, hay que avisar a **Administración** para que:\n> - **autorice el pago** del día siguiente, si es por transferencia; o\n> - **envíe el dinero en efectivo** al local que corresponda.\n\n> ### 3. ⛔ Los locales NO pagan con la caja del local.\n> Ningún pago a proveedor sale de la caja. Nunca.\n\n---\n\n## Calendario por proveedor\n\n| Proveedor | Día de pedido | Día de pago | Método de pago |\n|---|---|---|---|\n| **CALSA** | Lunes, miércoles y viernes | Lunes, miércoles y viernes | Efectivo o transferencia |\n| **CARFILA** | Lunes | Martes | Efectivo o transferencia |\n| **COCA COLA** | Lunes y viernes | Martes y sábado | Efectivo o transferencia |\n| **COSALTA** | Lunes y jueves | Martes y viernes | Efectivo o transferencia |\n| **GALOPPO** | Jueves | Viernes | Efectivo o transferencia |\n| **QUESO DE CABRA** | Jueves | Viernes | Solo transferencia |\n| **SALTA PLAST** | Martes | Miércoles | Solo transferencia |\n| **SERENÍSIMA** | Viernes | Lunes | Solo efectivo |\n| **NUECES** | Martes y jueves | Miércoles y viernes | Solo efectivo |\n| **YOGUR GRIEGO** | Lunes y jueves | Martes y viernes | Efectivo o transferencia |\n| **CAMPO QUIJANO (DDL)** | Martes y jueves | Miércoles y viernes | Solo efectivo |\n| **LA ROTONDA LÁCTEOS** | Lunes y jueves | Martes y viernes | Solo efectivo |\n| **LA FRANCISCA** | Lunes y jueves | Martes y viernes | Solo efectivo |\n| **FRUTOS CONGELADOS** | Lunes y jueves | Martes y viernes | Solo efectivo |\n| **TÉCNICOS Y ARREGLOS** | Avisar a Administración | Avisar a Administración | Efectivo o transferencia |\n\n---\n\n## Vista por día — Qué pedir hoy\n\n*La misma información, ordenada como se usa en el día a día.*\n\n### 🔵 Lunes — 8 proveedores *(día pesado)*\n\nCALSA · CARFILA · COCA COLA · COSALTA · YOGUR GRIEGO · LA ROTONDA LÁCTEOS ·\nLA FRANCISCA · FRUTOS CONGELADOS\n\n### 🟢 Martes — 3 proveedores\n\nSALTA PLAST · NUECES · CAMPO QUIJANO (DDL)\n\n### 🟢 Miércoles — 1 proveedor\n\nCALSA\n\n### 🔵 Jueves — 9 proveedores *(día pesado)*\n\nCOSALTA · GALOPPO · QUESO DE CABRA · NUECES · YOGUR GRIEGO · CAMPO QUIJANO (DDL) ·\nLA ROTONDA LÁCTEOS · LA FRANCISCA · FRUTOS CONGELADOS\n\n### 🟢 Viernes — 3 proveedores\n\nCALSA · COCA COLA · SERENÍSIMA\n\n### ⚪ Sábado y domingo — Sin pedidos\n\n---\n\n## Vista por día — Qué se paga hoy\n\n*Para Administración: cuánto efectivo hay que tener listo y qué transferencias salen.*\n\n| Día | Proveedores a pagar | Cantidad |\n|---|---|---|\n| **Lunes** | CALSA · SERENÍSIMA | 2 |\n| **Martes** | CARFILA · COCA COLA · COSALTA · YOGUR GRIEGO · LA ROTONDA · LA FRANCISCA · FRUTOS CONGELADOS | 7 |\n| **Miércoles** | CALSA · SALTA PLAST · NUECES · CAMPO QUIJANO | 4 |\n| **Jueves** | — | 0 |\n| **Viernes** | CALSA · COSALTA · GALOPPO · QUESO DE CABRA · NUECES · YOGUR GRIEGO · CAMPO QUIJANO · LA ROTONDA · LA FRANCISCA · FRUTOS CONGELADOS | **10** |\n| **Sábado** | COCA COLA | 1 |\n\n> ⚠️ **El viernes es el día más pesado de pagos: 10 proveedores**, seis de ellos\n> **solo en efectivo**. El efectivo del viernes hay que preverlo el jueves.\n\n---\n\n## Proveedores que solo cobran en efectivo\n\nEstos **no aceptan transferencia**. Administración tiene que hacer llegar el dinero\nal local antes del día de pago:\n\n| Proveedor | Se paga |\n|---|---|\n| SERENÍSIMA | Lunes |\n| NUECES | Miércoles y viernes |\n| CAMPO QUIJANO (DDL) | Miércoles y viernes |\n| LA ROTONDA LÁCTEOS | Martes y viernes |\n| LA FRANCISCA | Martes y viernes |\n| FRUTOS CONGELADOS | Martes y viernes |\n\n## Proveedores que solo aceptan transferencia\n\n| Proveedor | Se paga |\n|---|---|\n| QUESO DE CABRA | Viernes |\n| SALTA PLAST | Miércoles |\n\n---\n\n## El circuito completo\n\n```\n1. Se hace el pedido al proveedor  ──►  solo en su día de pedido\n                │\n                ▼\n2. Se avisa a Administración        ──►  en el momento de hacer el pedido\n                │\n                ├──► Si es transferencia → Administración autoriza el pago\n                │\n                └──► Si es efectivo → Administración envía el dinero al local\n                │\n                ▼\n3. Llega la mercadería              ──►  quien recibe, verifica\n                │\n                ▼\n4. Se paga                          ──►  en el día de pago del proveedor\n                │\n                ▼\n5. Se rinde la factura              ──►  a Administración\n```\n\n---\n\n## Técnicos y arreglos\n\nNo tienen día fijo. **Siempre se avisa a Administración** antes de contratar o pagar\ncualquier reparación, sin importar el monto.\n\n---\n\n## 🚧 Pendientes de definición\n\n- [ ] **Quién hace el pedido al proveedor.** El documento no lo dice: puede ser\n      Compras, el encargado del local o Administración. Falta definirlo por escrito.\n- [ ] **Cómo se avisa a Administración.** ¿WhatsApp, planilla, llamada? Hoy no está\n      especificado y es el paso del que depende todo el circuito.\n- [ ] **Qué insumo compra cada proveedor.** El calendario no lo dice. Sin eso, quien\n      arma el pedido tiene que saberlo de memoria. Conviene sumar una columna.\n- [ ] **Relación con el campo \"proveedor\" de la app.** La web de Pedidos de Producción\n      guarda un proveedor por producto y permite ordenar el recorrido por proveedor.\n      Habría que verificar que esos nombres coincidan con los de esta lista.\n- [ ] **Qué pasa si se necesita algo fuera del día de pedido.** Ver el circuito de\n      urgencias en el [Manual de Compras](../produccion/compras.md#7-faltantes-y-urgencias).\n- [ ] **Autoría del documento original.** El PDF de origen figura firmado por\n      *\"Olivia Wilson\"* — es el texto de ejemplo de la plantilla de Canva, no una\n      persona real. Corregirlo antes de repartir el documento.\n\n---\n\n## Documentos relacionados\n\n- [Manual de Compras](../produccion/compras.md)\n- [Manual de Cajeros](../venta/cajeros.md)\n- [Herramientas digitales](herramientas-digitales.md)\n"}, "_cuestionario-areas-produccion": {"titulo": "Cuestionario — Áreas de producción", "icono": "📄", "grupo": "guias", "estado": "mid", "resumen": "Preguntas para relevar un área. Se puede reenviar tal cual.", "orden": 16, "contenido": "# Cuestionario — Áreas de producción\n\n**Candela Café & Patisserie**\n\n> 📄 **Este documento no es un manual.** Es la guía de preguntas para relevar cómo\n> trabaja cada área de producción, y después escribir su manual.\n>\n> **Se puede reenviar tal cual** a quien está en el puesto. Sirve para Panadería,\n> Pastelería, Facturería, Especialidades y Sandwiches — algunas preguntas no van a\n> aplicar a todas.\n\n---\n\n## Cómo responderlo\n\nNo hace falta escribir prolijo ni responder todo. Tres formas, de más fácil a más\ncompleta:\n\n1. **Audio.** Contá un día de trabajo de punta a punta, como se lo explicarías a alguien\n   que entra mañana. Es la que mejor funciona.\n2. **Responder suelto**, salteando lo que no aplica.\n3. **Que alguien acompañe un turno completo** y vaya anotando.\n\n> **Lo que se busca no es lo que debería pasar, sino lo que pasa de verdad.** Si hay\n> un paso que el manual viejo dice y nadie hace, eso también hay que saberlo.\n\n---\n\n## 1. El puesto\n\n- ¿Cuántas personas trabajan en el área? ¿Todas hacen lo mismo o hay roles distintos?\n- ¿Qué horario cubre cada una?\n- ¿Hay un responsable del área?\n- ¿Qué pasa si falta alguien? ¿Quién cubre?\n\n---\n\n## 2. El arranque del turno\n\n- ¿Qué es lo **primero** que se hace al entrar? Contame los primeros 30 minutos en orden.\n- ¿Qué equipos se encienden y en qué orden?\n- ¿Hay algo que tenga que estar listo **de la noche anterior**? (masas levando,\n  descongelado, fermentaciones largas)\n- ¿Qué se revisa antes de empezar a producir?\n- **¿Qué cosa, si no está bien, hace que no se pueda arrancar?**\n\n---\n\n## 3. Cómo se sabe qué producir\n\n- El pedido llega por la web de Pedidos de Producción. ¿En qué momento del turno se\n  mira?\n- ¿Se produce **solo** lo que pide el pedido, o hay un mínimo fijo que se hace siempre\n  aunque nadie lo pida?\n- ¿Cómo se decide el orden de producción del día?\n- ¿Qué pasa con los **pedidos de clientes** (tortas, encargues)? ¿Cómo se enteran y\n  cuándo se producen?\n\n---\n\n## 4. El proceso — la parte más importante\n\n*Para cada producto principal del área, o para cada familia de productos:*\n\n- ¿Cuáles son los **pasos**, en orden?\n- ¿Cuánto **tiempo** lleva cada paso?\n- ¿Qué **temperaturas** se usan? (horno, cámara, ambiente)\n- ¿Cuánto dura el **fermentado / reposo / descongelado**?\n- ¿Cómo se sabe que algo está **en su punto**? (color, textura, olor, tacto — lo que\n  se mira de verdad, no lo que dice la receta)\n- ¿Qué **sale mal** habitualmente, y cómo se detecta a tiempo?\n\n> **Este es el bloque que hace que un manual sirva o no.** Un manual que dice\n> \"hornear hasta que esté listo\" no le enseña nada a nadie. Uno que dice \"180°C,\n> 22 minutos, hasta que el borde se despega del molde\" sí.\n\n---\n\n## 5. Tandas y horarios\n\n- ¿Cuántas tandas se hacen por turno?\n- ¿A qué hora tiene que estar lista cada una?\n- ¿Hay productos que **salen a hora fija** porque el local los necesita?\n- ¿Qué se hace si una tanda se atrasa?\n\n---\n\n## 6. Insumos\n\n- ¿Quién carga el pedido de insumos del área en la web?\n- ¿En qué momento se carga?\n- ¿Cómo se decide que algo está por acabarse? ¿Se mira el stock o se sabe de memoria?\n- ¿Qué se hace si **falta un insumo en pleno turno**?\n- ¿Hay insumos que se pueden reemplazar por otro y cuáles no?\n\n---\n\n## 7. Entrega y despacho\n\n- Cuando la producción está lista, ¿qué se hace con ella?\n- ¿Cómo se separa lo que va a cada local?\n- ¿Se marca algo en el sistema? (En la app hay \"En producción\" y \"Listo para despacho\")\n- ¿Cómo se coordina con Compras para el reparto?\n\n---\n\n## 8. Sobrantes y desperdicio\n\n- ¿Qué se hace con lo que sobra al final del día?\n- ¿Hay producto que se puede guardar para mañana y cuál no?\n- ¿Se registra en algún lado lo que se tira?\n- ¿Qué se hace con la producción fallada?\n\n---\n\n## 9. Limpieza y cierre\n\n- ¿Qué se limpia todos los días y qué se limpia una vez por semana?\n- ¿Qué equipos requieren limpieza especial?\n- ¿Qué queda preparado para el turno siguiente?\n- ¿Cómo se apagan los equipos?\n\n---\n\n## 10. Higiene y seguridad\n\n- ¿Hay algo específico del área? (temperaturas de conservación, alérgenos,\n  manipulación de crudos)\n- ¿Qué elementos de seguridad se usan?\n- ¿Qué es lo más peligroso del puesto y cómo se evita?\n\n---\n\n## 11. Cómo se sabe que el turno salió bien\n\n- ¿Qué mira el área para saber que el día estuvo bien?\n- ¿Qué es lo que **no puede pasar** nunca?\n- ¿Cuál es el error más común de alguien que recién entra?\n\n---\n\n## 12. Para el final\n\n- **¿Qué le dirías a alguien que arranca mañana en este puesto?**\n- ¿Qué se aprende recién con el tiempo y no está escrito en ningún lado?\n\n---\n\n## Áreas a relevar\n\n| Área | Fórmulas | Proceso | Fuente |\n|---|---|---|---|\n| Panadería | ✅ Cargadas | ⬜ Pendiente | *(a definir)* |\n| Pastelería | ✅ Cargadas | ⬜ Pendiente | *(a definir)* |\n| Facturería | ✅ Cargadas | ⬜ Pendiente | *(a definir)* |\n| Especialidades | ✅ Cargadas | ⬜ Pendiente | *(a definir)* |\n| Sandwiches | 🔴 Faltan casi todas | ⬜ Pendiente | *(a definir)* |\n| Compras | — | ✅ Relevado | Julio 2026 |\n\n> **Las fórmulas ya están** en cada manual de área, sacadas del módulo de Costeo.\n> Lo que falta es el **proceso** — que es lo que responde este cuestionario.\n> El bloque 4 es el que más importa.\n"}, "_plantilla": {"titulo": "Plantilla de manual", "icono": "🧩", "grupo": "guias", "estado": "mid", "resumen": "Estructura vacía para escribir un manual nuevo.", "orden": 17, "contenido": "# Manual de Procedimientos — [NOMBRE DEL ÁREA / ROL]\n\n**Candela Café & Patisserie**\n*Versión 1.0 | [MES AÑO]*\n\n> 🚧 **Plantilla.** Copiá este archivo, renombralo y completá cada sección.\n> Borrá esta nota y todos los `[corchetes]` cuando termines.\n> Si una sección no aplica al área, eliminala en vez de dejarla vacía.\n\n---\n\n## 🎯 Objetivo del rol\n\n*Una o dos frases: qué produce o garantiza esta persona. Escribilo en positivo —\nqué logra, no qué evita.*\n\n[…]\n\n---\n\n## 🖥️ Tus herramientas digitales\n\n*Listá solo las que usa este rol. Si no usa ninguna, eliminá la sección.*\n\n- **[Herramienta]** — `[url]` — *[para qué]*\n\n> 📖 Paso a paso completo, PINs y horarios límite en\n> **[Herramientas digitales](comunes/herramientas-digitales.md)**.\n\n---\n\n## 1. Apertura\n\n*Qué hace esta persona en los primeros 15 minutos del turno, en orden.*\n\n1. […]\n2. […]\n\n> ⚠️ *[La condición que impide arrancar. Ej: \"No arranques a producir si el horno\n> no llegó a temperatura.\"]*\n\n---\n\n## 2. [Proceso principal del área]\n\n*El corazón del manual. Dividilo en subsecciones por producto o por etapa.*\n\n### [Subproceso]\n\n| Parámetro | Estándar |\n|---|---|\n| […] | […] |\n\n---\n\n## 3. [Segundo proceso]\n\n[…]\n\n---\n\n## 4. Mantenimiento durante el turno\n\n- […]\n\n---\n\n## 5. Cierre\n\n1. […]\n\n---\n\n## 6. Higiene y seguridad\n\n*Lo específico del área. Lo general ya está en el documento común.*\n\n- […]\n\n> 📖 Estándares generales en\n> **[Higiene y presentación](comunes/higiene-y-presentacion.md)**.\n\n---\n\n## 7. Coordinación con otras áreas\n\n| Con quién | Qué se coordina | Cuándo |\n|---|---|---|\n| […] | […] | […] |\n\n---\n\n## 8. Indicadores de desempeño (KPIs)\n\n*Entre 4 y 6. Cada uno tiene que ser medible y verificable en el turno.*\n\n| Indicador | Meta |\n|---|---|\n| […] | […] |\n\n---\n\n## 9. Faltas y consecuencias\n\n*Opcional. Solo si el área lo necesita.*\n\n| Falta | Consecuencia |\n|---|---|\n| […] | […] |\n\n---\n\n## ✅ Checklist diario — [ROL]\n\n*Imprimí o revisá este checklist en cada turno.*\n\n### Apertura\n\n- ☐ […]\n\n### Durante el turno\n\n- ☐ […]\n\n### Cierre\n\n- ☐ […]\n- ☐ Incidencias del turno reportadas al encargado\n\n---\n\n## Documentos relacionados\n\n- [Herramientas digitales](comunes/herramientas-digitales.md)\n- [Atención al cliente y reclamos](comunes/atencion-y-reclamos.md)\n- [Higiene y presentación](comunes/higiene-y-presentacion.md)\n"}};

function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function inline(s){
  const code=[];
  s = s.replace(/`([^`]+)`/g, (m,c)=>{ code.push(c); return `␀${code.length-1}␀`; });
  s = esc(s);
  s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (m,t,u)=>{
    if(/\.md(#.*)?$/.test(u)){
      const slug = u.split('/').pop().replace(/\.md.*$/,'');
      return `<a href="#${slug}" data-nav="${slug}">${t}</a>`;
    }
    if(/^https?:/.test(u)) return `<a href="${u}" target="_blank" rel="noopener">${t}</a>`;
    return `<a href="${u}">${t}</a>`;
  });
  s = s.replace(/~~([^~]+)~~/g,'<del>$1</del>');
  s = s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  s = s.replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<em>$2</em>');
  s = s.replace(/␀(\d+)␀/g,(m,i)=>`<code>${esc(code[+i])}</code>`);
  return s;
}

function qClass(txt){
  if(/⛔|🔴|Nunca|NO PAGA/i.test(txt) && /⛔|🔴/.test(txt)) return ' class="stop"';
  if(/^>?\s*⚠️/m.test(txt)||/⚠️/.test(txt)) return ' class="warn"';
  if(/🔑|📌/.test(txt)) return ' class="key"';
  if(/✅/.test(txt)&&!/☐/.test(txt)) return ' class="ok"';
  return '';
}

function mdToHtml(md){
  const L = md.replace(/\r/g,'').split('\n');
  let out='', i=0;
  const isTable = n => /^\s*\|/.test(L[n]||'') && /^\s*\|[\s:|-]+\|\s*$/.test(L[n+1]||'');

  while(i<L.length){
    const ln=L[i];

    if(/^```/.test(ln)){                                    // code fence
      const buf=[]; i++;
      while(i<L.length && !/^```/.test(L[i])) buf.push(L[i++]);
      i++; out+=`<pre><code>${esc(buf.join('\n'))}</code></pre>`; continue;
    }
    if(isTable(i)){                                          // table
      const head=L[i].split('|').slice(1,-1).map(c=>c.trim()); i+=2;
      let t=`<div class="tw"><table><thead><tr>${head.map(h=>`<th>${inline(h)}</th>`).join('')}</tr></thead><tbody>`;
      while(i<L.length && /^\s*\|/.test(L[i])){
        const cells=L[i].split('|').slice(1,-1).map(c=>c.trim());
        t+=`<tr>${cells.map(c=>`<td>${inline(c)}</td>`).join('')}</tr>`; i++;
      }
      out+=t+'</tbody></table></div>'; continue;
    }
    if(/^>\s?/.test(ln)){                                    // blockquote
      const buf=[];
      while(i<L.length && /^>\s?/.test(L[i])) buf.push(L[i++].replace(/^>\s?/,''));
      const inner=buf.join('\n');
      out+=`<blockquote${qClass(inner)}>${mdToHtml(inner)}</blockquote>`; continue;
    }
    if(/^\s*[-*]\s+\[[ xX]\]/.test(ln) || /^\s*[-*]\s*☐/.test(ln)){   // checklist
      let t='<ul class="chk">';
      while(i<L.length && (/^\s*[-*]\s+\[[ xX]\]/.test(L[i])||/^\s*[-*]\s*☐/.test(L[i]))){
        let raw=L[i].replace(/^\s*[-*]\s+/,''); let done=false, body;
        if(/^\[[xX]\]/.test(raw)){ done=true; body=raw.replace(/^\[[xX]\]\s*/,''); }
        else if(/^\[ \]/.test(raw)){ body=raw.replace(/^\[ \]\s*/,''); }
        else { body=raw.replace(/^☐\s*/,''); }
        i++;
        while(i<L.length && /^\s{4,}\S/.test(L[i]) && !/^\s*[-*]\s/.test(L[i])){ body+=' '+L[i].trim(); i++; }
        t+=`<li class="${done?'done':''}"><span class="bx">${done?'☑':'☐'}</span><span>${inline(body)}</span></li>`;
      }
      out+=t+'</ul>'; continue;
    }
    if(/^\s*[-*]\s+/.test(ln)){                              // ul
      let t='<ul>';
      while(i<L.length && /^\s*[-*]\s+/.test(L[i])){
        let body=L[i].replace(/^\s*[-*]\s+/,''); i++;
        while(i<L.length && /^\s{2,}\S/.test(L[i]) && !/^\s*[-*]\s/.test(L[i]) && !/^\s*\d+\.\s/.test(L[i])){ body+=' '+L[i].trim(); i++; }
        t+=`<li>${inline(body)}</li>`;
      }
      out+=t+'</ul>'; continue;
    }
    if(/^\s*\d+\.\s+/.test(ln)){                             // ol
      let t='<ol>';
      while(i<L.length && /^\s*\d+\.\s+/.test(L[i])){
        let body=L[i].replace(/^\s*\d+\.\s+/,''); i++;
        while(i<L.length && /^\s{3,}\S/.test(L[i]) && !/^\s*\d+\.\s/.test(L[i]) && !/^\s*[-*]\s/.test(L[i])){ body+=' '+L[i].trim(); i++; }
        t+=`<li>${inline(body)}</li>`;
      }
      out+=t+'</ol>'; continue;
    }
    if(/^(-{3,}|\*{3,}|_{3,})\s*$/.test(ln)){ out+='<hr/>'; i++; continue; }
    const h=ln.match(/^(#{1,6})\s+(.*)$/);
    if(h){ const n=h[1].length; out+=`<h${n}>${inline(h[2])}</h${n}>`; i++; continue; }
    if(!ln.trim()){ i++; continue; }
    const p=[];                                              // paragraph
    while(i<L.length && L[i].trim() && !/^(#{1,6}\s|>|\s*[-*]\s|\s*\d+\.\s|```|-{3,}\s*$)/.test(L[i]) && !isTable(i)) p.push(L[i++]);
    if(p.length) out+=`<p>${inline(p.join(' '))}</p>`; else i++;
  }
  return out;
}

function renderNav(){
  const q = (document.getElementById('q').value||'').trim().toLowerCase();
  const nav = document.getElementById('nav');
  if(q.length>=2){
    const hits=[];
    for(const [slug,d] of sorted()){
      const body=(d.contenido||'');
      const idx=body.toLowerCase().indexOf(q);
      if(idx>=0||d.titulo.toLowerCase().includes(q)){
        const from=Math.max(0,idx-38);
        hits.push(`<div class="hit" data-nav="${slug}"><b>${d.icono||'📄'} ${esc(d.titulo)}</b>
          <span>${idx>=0?esc(body.slice(from,from+95).replace(/[#*>|\n]/g,' ').trim()):''}</span></div>`);
      }
    }
    nav.innerHTML = `<div class="nav-group"><div class="nav-gt">${hits.length} resultado${hits.length===1?'':'s'}</div></div>`+
      (hits.join('')||'<div class="hit" style="cursor:default;color:var(--gray)">Sin coincidencias</div>');
    return;
  }
  let h = `<div class="nav-group"><div class="nav-i ${state.slug===null?'on':''}" data-nav="__home"><span class="ic">🏠</span><span class="tx">Inicio</span></div></div>`;
  for(const g of GROUPS){
    const items = sorted().filter(([,d])=>d.grupo===g.k);
    if(!items.length) continue;
    h += `<div class="nav-group"><div class="nav-gt">${g.t}</div>`;
    for(const [slug,d] of items){
      const b=badgeOf(d.estado);
      h += `<div class="nav-i ${state.slug===slug?'on':''}" data-nav="${slug}">
        <span class="ic">${d.icono||'📄'}</span><span class="tx">${esc(d.titulo)}</span>
        <span class="dot ${b[1]}" title="${b[2]}"></span></div>`;
    }
    h += `</div>`;
  }
  nav.innerHTML = h;
}

function renderHome(){
  document.getElementById('crumb').textContent = 'Inicio';
  document.getElementById('btn-edit').style.display='none';
  let h = `<div class="md"><h1>Manuales de Procedimientos</h1>
    <p style="color:var(--gray);margin-bottom:8px">Candela Café &amp; Patisserie — panadería y cafetería de especialidad.
    Dos locales de venta y uno de producción.</p></div>`;
  for(const g of GROUPS){
    const items = sorted().filter(([,d])=>d.grupo===g.k);
    if(!items.length) continue;
    h += `<div class="sec-t" style="margin-top:26px">${g.t}</div><div class="home-grid">`;
    for(const [slug,d] of items){
      const b=badgeOf(d.estado);
      h += `<div class="card" data-nav="${slug}"><div class="ci">${d.icono||'📄'}</div>
        <div class="cn">${esc(d.titulo)}</div>
        <div class="cd">${esc(d.resumen||'')}</div>
        <div style="margin-top:9px"><span class="badge ${b[0]}">${b[2]}</span></div></div>`;
    }
    h += `</div>`;
  }
  if(state.edit){
    h += `<div class="sec-t" style="margin-top:30px">Administración</div>
      <button class="btn btn-g btn-sm" id="btn-export">⬇️ Descargar todos en Markdown</button>
      <p style="font-size:12px;color:var(--gray);margin-top:8px">
      Descarga los manuales como archivos <code>.md</code> para guardarlos en el repositorio.</p>`;
  }
  document.getElementById('doc').innerHTML = h;
  const ex=document.getElementById('btn-export'); if(ex) ex.onclick=exportAll;
}

function renderDoc(){
  const d = state.docs[state.slug];
  if(!d) return renderHome();
  const b = badgeOf(d.estado);
  document.getElementById('crumb').textContent = `${GROUPS.find(g=>g.k===d.grupo)?.t||''} › ${d.titulo}`;
  document.getElementById('btn-edit').style.display = state.edit ? 'inline-flex' : 'none';
  const fecha = d.actualizadoTs ? new Date(d.actualizadoTs).toLocaleDateString('es-AR',{day:'2-digit',month:'long',year:'numeric'}) : null;
  document.getElementById('doc').innerHTML =
    `<div class="doc-meta"><span class="badge ${b[0]}">${b[2]}</span>${fecha?`<span>Actualizado el ${fecha}</span>`:''}</div>
     <div class="md">${mdToHtml(d.contenido||'')}</div>`;
  window.scrollTo(0,0);
}

function renderEditor(){
  const d = state.docs[state.slug];
  state.editing = true; state.dirty = false;
  document.getElementById('doc').innerHTML =
    `<div class="ed-bar">
       <button class="btn btn-p btn-sm" id="e-save">💾 Guardar</button>
       <button class="btn btn-g btn-sm" id="e-cancel">Cancelar</button>
       <span class="sp"></span>
       <span class="ed-hint" id="e-hint">Se escribe en Markdown</span>
     </div>
     <textarea class="ed" id="e-txt" spellcheck="true"></textarea>`;
  const ta = document.getElementById('e-txt');
  ta.value = d.contenido||'';
  ta.oninput = ()=>{ state.dirty=true; document.getElementById('e-hint').textContent='Cambios sin guardar'; };
  document.getElementById('e-save').onclick = async ()=>{
    await update(ref(db,`manuales/docs/${state.slug}`), { contenido: ta.value, actualizadoTs: Date.now() });
    await push(ref(db,`manuales/historial/${state.slug}`), { contenido: d.contenido||'', ts: Date.now() });
    state.editing=false; state.dirty=false; toast('Guardado ✓'); renderDoc();
  };
  document.getElementById('e-cancel').onclick = ()=>{
    if(state.dirty && !confirm('Hay cambios sin guardar. ¿Descartarlos?')) return;
    state.editing=false; state.dirty=false; renderDoc();
  };
  window.scrollTo(0,0);
}

function exportAll(){
  for(const [slug,d] of sorted()){
    const blob = new Blob([d.contenido||''], {type:'text/markdown;charset=utf-8'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = `${slug}.md`;
    document.body.appendChild(a); a.click(); a.remove();
  }
  toast('Descargando los manuales…');
}

/* ═══════════════ NAVEGACIÓN / EVENTOS ═══════════════ */
function go(slug){
  if(state.editing && state.dirty && !confirm('Hay cambios sin guardar. ¿Salir igual?')) return;
  state.editing=false; state.dirty=false;
  state.slug = (slug==='__home') ? null : slug;
  location.hash = state.slug ? '#'+state.slug : '';
  closeSide(); renderNav();
  state.slug ? renderDoc() : renderHome();
}
const closeSide = ()=>{ document.getElementById('sidebar').classList.remove('on'); document.getElementById('scrim').classList.remove('on'); };

document.addEventListener('click', e=>{
  const t = e.target.closest('[data-nav]');
  if(t){ e.preventDefault(); go(t.dataset.nav); }
});
document.getElementById('burger').onclick = ()=>{
  document.getElementById('sidebar').classList.toggle('on');
  document.getElementById('scrim').classList.toggle('on');
};
document.getElementById('scrim').onclick = closeSide;
document.getElementById('q').oninput = renderNav;
document.getElementById('btn-print').onclick = ()=>window.print();
document.getElementById('btn-edit').onclick = ()=>{ if(state.slug) renderEditor(); };
window.addEventListener('beforeunload', e=>{ if(state.dirty){ e.preventDefault(); e.returnValue=''; } });

let tt;
function toast(msg, kind){
  const el=document.getElementById('toast');
  el.textContent=msg; el.className='toast on'+(kind?' '+kind:'');
  clearTimeout(tt); tt=setTimeout(()=>el.className='toast',2600);
}

async function enter(withEdit){
  if(withEdit){
    const v=document.getElementById('gate-pass').value;
    const snap=await get(ref(db,'manuales/config/pass'));
    if(v !== (snap.val()||PASS_DEFAULT)){ document.getElementById('gate-err').style.display='block'; return; }
    state.edit=true;
  }
  document.getElementById('gate').style.display='none';
  document.getElementById('shell').style.display='flex';
  const h=location.hash.slice(1);
  if(h && state.docs[h]) go(h); else renderHome();
  renderNav();
  if(withEdit) toast('Modo edición activado ✏️');
}
document.getElementById('gate-enter').onclick = ()=>enter(false);
document.getElementById('gate-edit').onclick  = ()=>enter(true);
document.getElementById('gate-pass').addEventListener('keydown', e=>{ if(e.key==='Enter') enter(true); });

boot().catch(err=>{ console.error(err); toast('Error al conectar con la base','err'); });
</script>
</body>
</html>
