<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Club Candela · Tu tarjeta</title>
<meta name="theme-color" content="#22201F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Club Candela">
<link rel="icon" href="img/logo.png">
<link rel="apple-touch-icon" href="img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script src="js/vendor/qrcode.js"></script>
<script src="js/fidelizacion-comun.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --terra:#E15D46;--terra-dark:#c94d38;--terra-pale:#f9ddd8;
  --turq:#9BD6CC;--turq-dark:#1A6B62;--turq-pale:#d8f0ed;
  --cream:#EEEBD7;--cream-dark:#dedad8;
  --black:#22201F;--gray:#7d7b6d;--white:#fff;
  --shadow:0 4px 16px rgba(34,32,31,.08),0 2px 6px rgba(34,32,31,.05);
}
html,body{background:var(--cream)}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--black);min-height:100vh;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.top{background:var(--black);color:var(--cream);padding:14px 16px;padding-top:max(14px,env(safe-area-inset-top));display:flex;align-items:center;gap:10px}
.top img{width:30px;height:30px;object-fit:contain}
.top b{font-size:15px;letter-spacing:.2px}
.top span{display:block;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#9a9888}
main{max-width:440px;margin:0 auto;padding:18px 16px 40px}
.card{background:var(--white);border-radius:18px;box-shadow:var(--shadow);padding:22px 18px;margin-bottom:14px}
h1{font-size:22px;font-weight:800;line-height:1.2;margin-bottom:6px}
h2{font-size:15px;font-weight:700;margin-bottom:10px}
.muted{color:var(--gray);font-size:13px}
label{display:block;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--gray);margin:14px 0 6px}
input,select{width:100%;font:inherit;font-size:16px;padding:12px 14px;border:1.5px solid var(--cream-dark);border-radius:12px;background:#fff;color:var(--black)}
input:focus,select:focus{outline:none;border-color:var(--terra)}
.row{display:flex;gap:10px}
.row>*{flex:1}
.hint{font-size:12px;color:var(--gray);margin-top:5px}
.check{display:flex;gap:10px;align-items:flex-start;margin-top:16px;font-size:13px;color:var(--black);text-transform:none;letter-spacing:0;font-weight:400}
.check input{width:20px;height:20px;flex:none;margin-top:1px;accent-color:var(--terra)}
.btn{display:block;width:100%;border:none;border-radius:14px;padding:15px;font:inherit;font-size:16px;font-weight:700;cursor:pointer;background:var(--terra);color:#fff;margin-top:20px;box-shadow:0 4px 18px rgba(225,93,70,.30)}
.btn:disabled{opacity:.6}
.btn-ghost{background:transparent;color:var(--black);box-shadow:none;border:1.5px solid var(--cream-dark)}
.err{color:var(--terra-dark);font-size:13px;margin-top:10px;font-weight:600}
.banner{border-radius:14px;padding:14px 16px;margin-bottom:14px;font-weight:600;font-size:14px;display:flex;gap:10px;align-items:flex-start}
.banner.ok{background:var(--turq-pale);color:var(--turq-dark)}
.banner.info{background:#fff8e8;color:#8A5A00}
.banner .ico{font-size:22px;line-height:1}
.stamps{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0 6px}
.stamp{aspect-ratio:1;border-radius:50%;border:2px dashed var(--cream-dark);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--cream-dark);font-weight:700}
.stamp.on{border:none;background:var(--terra);color:#fff;box-shadow:0 3px 10px rgba(225,93,70,.3)}
.stamp.on img{width:58%;filter:brightness(0) invert(1)}
.stamp.new{animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.2);opacity:0}100%{transform:scale(1);opacity:1}}
.progress{font-size:14px;margin-top:8px}
.premio{background:var(--black);color:var(--cream);border-radius:18px;padding:20px 18px;margin-bottom:14px;text-align:center}
.premio .big{font-size:34px}
.premio b{display:block;font-size:18px;margin:6px 0 4px}
.qrbox{text-align:center}
.qrbox .qr{width:190px;height:190px;margin:10px auto 6px;background:#fff;padding:6px;border-radius:12px;border:1.5px solid var(--cream-dark)}
.qrbox .qr svg{width:100%;height:100%;display:block}
.visitas{list-style:none;font-size:13px}
.visitas li{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--cream)}
.visitas li:last-child{border-bottom:none}
.steps{font-size:13px;padding-left:18px}
.steps li{margin:4px 0}
.center{text-align:center}
.spinner{width:34px;height:34px;border:3px solid var(--cream-dark);border-top-color:var(--terra);border-radius:50%;animation:spin 1s linear infinite;margin:60px auto 14px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<header class="top">
  <img src="img/logo.png" alt="">
  <div><b>Club Candela</b><span>Café &amp; Patisserie</span></div>
</header>
<main id="app"><div class="spinner"></div><p class="center muted">Cargando tu tarjeta…</p></main>

<script>
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDFqS6RG1fkOZGo1x2-WcfT82am7ERHgyY",
  authDomain: "pedidos-de-clientes-4775b.firebaseapp.com",
  databaseURL: "https://pedidos-de-clientes-4775b-default-rtdb.firebaseio.com",
  projectId: "pedidos-de-clientes-4775b",
  storageBucket: "pedidos-de-clientes-4775b.firebasestorage.app",
  messagingSenderId: "702040534350",
  appId: "1:702040534350:web:af4acddff23ee2db24c21f"
};

const MESES = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];

let db, uid, config, locales;
let card = null;
let visitas = [];
let banner = null;       // {tipo:'ok'|'info', texto}
let selloNuevo = false;
const app = document.getElementById("app");
const localQr = new URLSearchParams(location.search).get("l");

function esc(s){ return String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

function quitarLocalDeUrl(){
  // Para que recargar la página no vuelva a intentar sumar el sello
  if (localQr) history.replaceState(null, "", location.pathname);
}

function renderError(msg){
  app.innerHTML = `<div class="card center"><div style="font-size:38px">😕</div><h1>Algo salió mal</h1><p class="muted">${esc(msg)}</p><button class="btn" onclick="location.reload()">Reintentar</button></div>`;
}

// ── Registro ───────────────────────────────────────────────
function renderRegistro(errorMsg){
  const nombreLocal = localQr && locales[localQr] ? locales[localQr].nombre : null;
  app.innerHTML = `
    <div class="card">
      <h1>Sumate al Club Candela ☕</h1>
      <p class="muted">Cada vez que venís sumás un sello. Con ${config.sellosPremio} sellos te regalamos <b>${esc(config.premio)}</b>.</p>
      ${nombreLocal ? `<p class="muted" style="margin-top:6px">Tu primer sello se suma en <b>${esc(nombreLocal)}</b> al registrarte.</p>` : ""}
      <form id="reg" autocomplete="on">
        <label for="f-nombre">Nombre</label>
        <input id="f-nombre" name="name" autocomplete="given-name" required minlength="2" maxlength="60" placeholder="¿Cómo te llamás?">
        <label for="f-tel">WhatsApp</label>
        <input id="f-tel" name="tel" type="tel" inputmode="numeric" autocomplete="tel-national" required placeholder="387 512 3456">
        <div class="hint">Código de área sin 0 y número sin 15.</div>
        <label>Cumpleaños <span style="text-transform:none;font-weight:400">(opcional, para tu regalo)</span></label>
        <div class="row">
          <select id="f-dia"><option value="">Día</option>${Array.from({length:31},(_,i)=>`<option>${i+1}</option>`).join("")}</select>
          <select id="f-mes"><option value="">Mes</option>${MESES.map((m,i)=>`<option value="${i+1}">${m}</option>`).join("")}</select>
        </div>
        <label class="check"><input type="checkbox" id="f-ok" required> <span>Acepto que Candela guarde mis datos para el programa de beneficios y me escriba por WhatsApp con novedades y promociones. Puedo pedir la baja cuando quiera.</span></label>
        ${errorMsg ? `<div class="err">${esc(errorMsg)}</div>` : ""}
        <button class="btn" type="submit" id="f-btn">Crear mi tarjeta</button>
      </form>
    </div>`;
  document.getElementById("reg").addEventListener("submit", registrar);
}

async function registrar(ev){
  ev.preventDefault();
  const nombre = document.getElementById("f-nombre").value.trim().replace(/\s+/g," ");
  const tel = Fidel.normalizarTelefono(document.getElementById("f-tel").value);
  const dia = document.getElementById("f-dia").value;
  const mes = document.getElementById("f-mes").value;
  if (nombre.length < 2) return renderRegistro("Escribí tu nombre.");
  if (!tel) return renderRegistro("El WhatsApp tiene que tener 10 números: código de área sin 0 y número sin 15. Ej: 387 512 3456.");
  if ((dia && !mes) || (!dia && mes)) return renderRegistro("Completá día y mes del cumpleaños, o dejá los dos vacíos.");

  const btn = document.getElementById("f-btn");
  btn.disabled = true; btn.textContent = "Creando…";

  try {
    const duenio = (await db.ref(`fidelizacion/telefonos/${tel}`).once("value")).val();
    if (duenio && duenio !== uid) return renderYaRegistrado(tel);

    const nueva = {
      nombre, telefono: tel,
      creada: firebase.database.ServerValue.TIMESTAMP,
      sellos: 0, totalSellos: 0, canjes: 0,
      ultimoSello: 0, semana: 0, sellosSemana: 0,
    };
    if (dia && mes) nueva.cumple = `${String(mes).padStart(2,"0")}-${String(dia).padStart(2,"0")}`;

    await db.ref("fidelizacion").update({
      [`tarjetas/${uid}`]: nueva,
      [`telefonos/${tel}`]: uid,
    });
    card = (await db.ref(`fidelizacion/tarjetas/${uid}`).once("value")).val();
    banner = { tipo: "ok", texto: `¡Listo, ${nombre}! Ya tenés tu tarjeta.` };
    await intentarSello();
    escucharTarjeta();
  } catch (err) {
    console.error(err);
    renderRegistro("No pudimos crear la tarjeta. Revisá tu conexión e intentá de nuevo.");
  }
}

// El número ya está asociado a otro celular (cambió de teléfono o borró los datos)
function renderYaRegistrado(tel){
  app.innerHTML = `
    <div class="card qrbox">
      <div style="font-size:38px">📱</div>
      <h1>Ese número ya tiene tarjeta</h1>
      <p class="muted">Seguramente la creaste en otro celular o se borraron los datos del navegador. Mostrale este código al personal y la pasamos a este celular con todos tus sellos.</p>
      <div class="qr">${Fidel.qrSvg(Fidel.qrDeTarjeta(uid))}</div>
      <p class="muted">Número: ${esc(tel.slice(0,3))} ${esc(tel.slice(3,6))} ${esc(tel.slice(6))}</p>
      <button class="btn btn-ghost" onclick="location.reload()">Ya me la pasaron, actualizar</button>
    </div>`;
}

// ── Sello ──────────────────────────────────────────────────
async function intentarSello(){
  if (!localQr) return;
  quitarLocalDeUrl();
  if (!locales[localQr]) {
    banner = { tipo: "info", texto: "Este QR no corresponde a ningún local. Pedí ayuda al personal." };
    return;
  }
  const now = Fidel.serverNow();
  const motivo = Fidel.motivoSinSello(card, config, now);
  if (motivo) { banner = { tipo: "info", texto: motivo }; return; }

  const vid = db.ref(`fidelizacion/visitas/${uid}`).push().key;
  try {
    await db.ref("fidelizacion").update({
      [`tarjetas/${uid}`]: Fidel.tarjetaConSello(card, localQr, now),
      [`visitas/${uid}/${vid}`]: { ts: firebase.database.ServerValue.TIMESTAMP, local: localQr },
    });
    selloNuevo = true;
    const texto = `¡Sumaste un sello en ${locales[localQr].nombre}!`;
    banner = { tipo: "ok", texto: banner && banner.tipo === "ok" ? `${banner.texto} ${texto}` : texto };
  } catch (err) {
    console.error(err);
    banner = { tipo: "info", texto: "No pudimos sumar el sello (fuera de horario o ya sumaste hoy). Si creés que es un error, avisale al personal." };
  }
}

// ── Tarjeta ────────────────────────────────────────────────
function escucharTarjeta(){
  db.ref(`fidelizacion/tarjetas/${uid}`).on("value", s => {
    card = s.val();
    if (!card) return renderRegistro();
    renderTarjeta();
  });
  db.ref(`fidelizacion/visitas/${uid}`).limitToLast(5).on("value", s => {
    visitas = Object.values(s.val() || {}).sort((a,b) => b.ts - a.ts);
    if (card) renderTarjeta();
  });
}

function renderTarjeta(){
  const meta = config.sellosPremio;
  const premios = Math.floor(card.sellos / meta);
  const enCurso = card.sellos % meta;
  // Con un premio sin canjear la tarjeta se muestra completa; los sellos extra se aclaran aparte
  const llenos = premios > 0 ? meta : enCurso;
  const faltan = meta - enCurso;
  const extra = premios > 0 ? card.sellos - meta : 0;

  const stamps = Array.from({ length: meta }, (_, i) => {
    const on = i < llenos;
    const nuevo = on && selloNuevo && i === llenos - 1;
    return `<div class="stamp${on ? " on" : ""}${nuevo ? " new" : ""}">${on ? '<img src="img/logo.png" alt="">' : i + 1}</div>`;
  }).join("");

  app.innerHTML = `
    ${banner ? `<div class="banner ${banner.tipo}"><span class="ico">${banner.tipo === "ok" ? "🎉" : "ℹ️"}</span><span>${esc(banner.texto)}</span></div>` : ""}
    ${premios > 0 ? `
      <div class="premio">
        <div class="big">🎁</div>
        <b>¡Tenés ${premios > 1 ? premios + " premios" : "un premio"}!</b>
        <div>${esc(config.premio)}</div>
        <div class="muted" style="color:#b9b6a3;margin-top:8px">Mostrale tu código de abajo al personal para canjearlo.</div>
      </div>` : ""}
    <div class="card">
      <h1>Hola, ${esc(card.nombre.split(" ")[0])} 👋</h1>
      <div class="stamps">${stamps}</div>
      <p class="progress">${premios > 0
        ? `¡Tarjeta completa! Canjeá tu premio.${extra > 0 ? ` Ya tenés <b>${extra} sello${extra === 1 ? "" : "s"}</b> para la próxima.` : ""}`
        : `Te ${faltan === 1 ? "falta <b>1 sello</b>" : `faltan <b>${faltan} sellos</b>`} para: <b>${esc(config.premio)}</b>`}</p>
    </div>
    <div class="card qrbox">
      <h2>Tu código Club Candela</h2>
      <div class="qr">${Fidel.qrSvg(Fidel.qrDeTarjeta(uid))}</div>
      <p class="muted">Mostralo en caja para canjear premios.</p>
    </div>
    <div class="card">
      <h2>¿Cómo sumo sellos?</h2>
      <ol class="steps">
        <li>Cada vez que venís, escaneá el QR de tu mesa o del mostrador.</li>
        <li>Se suma 1 sello por día (hasta ${config.topeSemanal} por semana).</li>
        <li>Con ${meta} sellos, canjeás tu premio en caja.</li>
      </ol>
      <p class="muted" style="margin-top:10px">💡 <b>Guardá esta página</b> para tenerla a mano: en iPhone tocá <b>Compartir → Agregar a inicio</b>; en Android, <b>⋮ → Agregar a pantalla principal</b>.</p>
    </div>
    ${visitas.length ? `
      <div class="card">
        <h2>Tus últimas visitas</h2>
        <ul class="visitas">${visitas.map(v => `<li><span>${esc(locales[v.local]?.nombre || v.local)}</span><span class="muted">${Fidel.fmtFechaHora(v.ts)}</span></li>`).join("")}</ul>
      </div>` : ""}`;
  selloNuevo = false;
}

function renderSesionPersonal(){
  app.innerHTML = `
    <div class="card center">
      <div style="font-size:38px">🧑‍🍳</div>
      <h1>Sesión del personal abierta</h1>
      <p class="muted">Este navegador tiene abierta la sesión del personal de Candela. La tarjeta del Club se usa desde el celular del cliente.</p>
      <button class="btn btn-ghost" onclick="firebase.auth().signOut().then(()=>location.reload())">Cerrar sesión del personal</button>
    </div>`;
}

// ── Inicio ─────────────────────────────────────────────────
async function iniciar(user){
  try {
    uid = user.uid;
    const [cfgSnap, locSnap, cardSnap] = await Promise.all([
      db.ref("fidelizacion/config").once("value"),
      db.ref("fidelizacion/locales").once("value"),
      db.ref(`fidelizacion/tarjetas/${uid}`).once("value"),
    ]);
    config = cfgSnap.val();
    locales = locSnap.val() || {};
    if (!config) return renderError("El Club Candela todavía no está activado. ¡Muy pronto!");
    card = cardSnap.val();
    if (!card) return renderRegistro();
    await intentarSello();
    escucharTarjeta();
  } catch (err) {
    console.error(err);
    renderError("No pudimos conectarnos. Revisá tu conexión a internet.");
  }
}

firebase.initializeApp(FIREBASE_CONFIG);
db = firebase.database();
Fidel.watchServerOffset(db);
let iniciado = false;
firebase.auth().onAuthStateChanged(user => {
  if (iniciado) return;
  if (!user) {
    firebase.auth().signInAnonymously().catch(err => {
      console.error(err);
      renderError("No pudimos iniciar tu tarjeta. Revisá tu conexión a internet.");
    });
    return;
  }
  iniciado = true;
  if (!user.isAnonymous) return renderSesionPersonal();
  // Esperar el offset del reloj del servidor antes de calcular día/semana
  db.ref(".info/serverTimeOffset").once("value").then(() => iniciar(user));
});
</script>
</body>
</html>
