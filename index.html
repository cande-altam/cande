<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Candela Café & Patisserie — Producción (definitivo)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    /* ========== CANDELA — SISTEMA DE PRODUCCIÓN ========== */
    *{box-sizing:border-box;margin:0;padding:0;}
    :root{
      --cream:#EEEBD7;
      --cream-dark:#dedad8;
      --cream-mid:#e5e1cc;
      --black:#22201F;
      --black-soft:#3a3836;
      --terra:#E15D46;
      --terra-light:#ea7a65;
      --terra-pale:#f9ddd8;
      --turq:#9BD6CC;
      --turq-dark:#6bbfb4;
      --turq-pale:#d8f0ed;
      --gray:#9a9888;
      --gray-light:#ccc9b5;
      --white:#ffffff;
      --shadow-sm:0 1px 3px rgba(34,32,31,.06),0 1px 2px rgba(34,32,31,.04);
      --shadow-md:0 4px 16px rgba(34,32,31,.08),0 2px 6px rgba(34,32,31,.05);
      --shadow-lg:0 12px 40px rgba(34,32,31,.12),0 4px 12px rgba(34,32,31,.06);
      --shadow-terra:0 4px 18px rgba(225,93,70,.30);
      --shadow-turq:0 4px 18px rgba(155,214,204,.35);
      --r:14px;--r-sm:8px;--r-xs:6px;
    }
    body{
      font-family:'Plus Jakarta Sans',sans-serif;
      background:var(--cream);
      color:var(--black);
      min-height:100vh;
      font-weight:300;
      font-size:14px;
    }

    /* ── HEADER ── */
    .header{
      background:var(--black);
      padding:0 28px;
      display:flex;align-items:center;justify-content:space-between;
      position:sticky;top:0;z-index:200;height:68px;
      box-shadow:0 1px 0 rgba(255,255,255,.06), 0 4px 24px rgba(0,0,0,.3);
    }
    .logo{
      display:flex;align-items:center;gap:12px;text-decoration:none;
    }
    .logo-mark{
      width:36px;height:36px;flex-shrink:0;
    }
    .logo-text-wrap{display:flex;flex-direction:column;line-height:1.1;}
    .logo-name{
      font-size:15px;font-weight:600;color:var(--cream);letter-spacing:.2px;
    }
    .logo-sub{
      font-size:9px;color:var(--gray);font-weight:400;
      letter-spacing:2px;text-transform:uppercase;margin-top:2px;
    }

    /* ── NAV ── */
    .nav{display:flex;gap:2px;align-items:center;}
    .nav-btn{
      padding:8px 16px;border:none;background:transparent;
      color:rgba(255,255,255,.45);cursor:pointer;font-size:13px;
      font-family:'Plus Jakarta Sans',sans-serif;font-weight:400;
      border-radius:8px;transition:all .2s cubic-bezier(.25,.8,.25,1);
      letter-spacing:.2px;position:relative;
    }
    .nav-btn:hover{color:var(--cream);background:rgba(255,255,255,.08);}
    .nav-btn.active{
      color:#fff;background:var(--terra);font-weight:600;
      box-shadow:var(--shadow-terra);
    }
    .nav-btn .nav-alert{
      position:absolute;top:6px;right:6px;
      width:8px;height:8px;border-radius:50%;
      background:var(--turq);border:2px solid var(--black);
      animation:blink 1.4s ease-in-out infinite;
    }

    /* ── MAIN ── */
    .main{padding:32px;max-width:1160px;margin:0 auto;width:100%;}
    @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
    .main > *{animation:fadeUp .35s ease both;}
    .main > *:nth-child(2){animation-delay:.04s}
    .main > *:nth-child(3){animation-delay:.08s}
    .main > *:nth-child(4){animation-delay:.12s}

    /* ── TYPOGRAPHY ── */
    .page-title{
      font-size:24px;font-weight:700;color:var(--black);
      margin-bottom:4px;letter-spacing:-.3px;
    }
    .page-sub{color:var(--gray);font-size:13px;margin-bottom:28px;font-weight:400;}

    /* ── TABS ── */
    .tabs{display:flex;border-bottom:1.5px solid var(--cream-dark);margin-bottom:28px;}
    .tab{
      padding:13px 32px;cursor:pointer;font-size:14px;color:var(--gray);
      border:none;background:none;font-family:'Plus Jakarta Sans',sans-serif;font-weight:400;
      border-bottom:2px solid transparent;margin-bottom:-1.5px;
      letter-spacing:.2px;transition:all .2s;
    }
    .tab:hover{color:var(--black);}
    .tab.active{color:var(--terra);border-bottom-color:var(--terra);font-weight:600;}

    /* ── CARDS / BLOCKS ── */
    .section-block{
      background:var(--white);border:1px solid rgba(34,32,31,.07);
      border-radius:var(--r);padding:24px 26px;margin-bottom:16px;
      box-shadow:var(--shadow-sm);transition:box-shadow .2s;
    }
    .section-block:hover{box-shadow:var(--shadow-md);}
    .section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
    .section-title{font-size:14px;font-weight:600;color:var(--black);display:flex;align-items:center;gap:8px;}

    /* ── BADGES ── */
    .badge{font-size:11px;padding:3px 10px;border-radius:100px;font-weight:500;letter-spacing:.2px;}
    .badge-open{background:var(--turq-pale);color:var(--turq-dark);}
    .badge-closed{background:#fdecea;color:#b83a25;}
    .badge-warn{background:#fff3ee;color:var(--terra);}

    /* ── BUTTONS ── */
    .btn{
      display:inline-flex;align-items:center;gap:6px;
      padding:9px 20px;border-radius:10px;border:none;cursor:pointer;
      font-size:13px;font-family:'Plus Jakarta Sans',sans-serif;font-weight:600;
      transition:all .2s cubic-bezier(.25,.8,.25,1);letter-spacing:.2px;
      position:relative;overflow:hidden;
    }
    .btn::after{
      content:'';position:absolute;inset:0;border-radius:inherit;
      background:rgba(255,255,255,.15);opacity:0;transition:opacity .15s;
    }
    .btn:active::after{opacity:1;}
    .btn-primary{
      background:var(--terra);color:#fff;
      box-shadow:var(--shadow-terra);
    }
    .btn-primary:hover{background:var(--terra-light);transform:translateY(-1px);box-shadow:0 6px 22px rgba(225,93,70,.38);}
    .btn-primary:active{transform:translateY(0);box-shadow:var(--shadow-terra);}
    .btn-turq{
      background:var(--turq);color:var(--black);
      box-shadow:var(--shadow-turq);
    }
    .btn-turq:hover{background:var(--turq-dark);color:#fff;transform:translateY(-1px);}
    .btn-sm{padding:6px 14px;font-size:12px;border-radius:8px;}
    .btn-ghost{
      background:rgba(34,32,31,.04);border:1px solid rgba(34,32,31,.12);
      color:var(--gray);
    }
    .btn-ghost:hover{border-color:var(--black);color:var(--black);background:rgba(34,32,31,.06);}
    .btn-danger{background:#fdecea;color:#b83a25;border:1px solid #f5c4bc;}
    .btn-danger:hover{background:var(--terra);color:#fff;border-color:var(--terra);}

    /* ── STOCK AREA TABS ── */
    .stock-area-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px;}
    .stock-area-tab{
      padding:8px 18px;border-radius:100px;border:1.5px solid var(--cream-dark);
      background:var(--white);cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;
      font-size:13px;font-weight:400;color:var(--gray);transition:all .2s;
      box-shadow:var(--shadow-sm);
    }
    .stock-area-tab:hover{border-color:var(--turq);color:var(--black);box-shadow:var(--shadow-turq);}
    .stock-area-tab.active{
      background:var(--black);color:var(--cream);border-color:var(--black);
      font-weight:600;box-shadow:0 4px 14px rgba(34,32,31,.25);
    }

    /* ── STOCK GRID ── */
    .stock-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;}
    .stock-item{
      background:var(--white);border:1.5px solid var(--cream-dark);
      border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;
      gap:10px;transition:all .2s;box-shadow:var(--shadow-sm);
    }
    .stock-item:hover{border-color:var(--turq);box-shadow:var(--shadow-md);transform:translateY(-1px);}
    .stock-item.stock-zero{border-color:#f5a4a0;background:#fdecea;}
    .stock-item.stock-low{border-color:#f0c040;background:#fffbe6;}
    .stock-item-name{font-size:13px;font-weight:500;color:var(--black);line-height:1.3;}
    .stock-item-controls{display:flex;align-items:center;gap:8px;}
    .stock-btn{
      width:32px;height:32px;border-radius:8px;border:1.5px solid var(--cream-dark);
      background:var(--white);cursor:pointer;font-size:18px;font-weight:300;
      display:flex;align-items:center;justify-content:center;
      transition:all .15s;color:var(--black);line-height:1;flex-shrink:0;
    }
    .stock-btn:hover{background:var(--terra);color:#fff;border-color:var(--terra);box-shadow:var(--shadow-terra);}
    .stock-qty-input{
      width:70px;height:32px;border-radius:8px;border:1.5px solid var(--cream-dark);
      background:var(--white);font-family:'Plus Jakarta Sans',sans-serif;
      font-size:15px;font-weight:500;text-align:center;color:var(--black);
      outline:none;padding:0 6px;-moz-appearance:textfield;transition:border-color .15s;
    }
    .stock-qty-input::-webkit-outer-spin-button,.stock-qty-input::-webkit-inner-spin-button{-webkit-appearance:none;}
    .stock-qty-input:focus{border-color:var(--terra);box-shadow:0 0 0 3px rgba(225,93,70,.12);}
    .stock-unit{font-size:11px;color:var(--gray);font-weight:400;}
    .stock-status-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
    .stock-item-footer{display:flex;align-items:center;justify-content:space-between;}
    .stock-last-update{font-size:10px;color:var(--gray);font-weight:400;}
    .stock-alert-badge{font-size:10px;padding:2px 8px;border-radius:100px;font-weight:500;}
    .stock-alert-zero{background:#fdecea;color:#c0392b;}
    .stock-alert-low{background:#fffbe6;color:#b8860b;}
    .stock-alert-ok{background:#e8f8f0;color:#27ae60;}
    .stock-header-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
    .stock-summary-bar{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px;}
    .stock-summary-card{
      background:var(--white);border:1px solid rgba(34,32,31,.07);
      border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow-sm);
    }
    .stock-summary-label{font-size:10px;color:var(--gray);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px;font-weight:500;}
    .stock-summary-value{font-size:24px;font-weight:700;color:var(--black);}
    .stock-summary-sub{font-size:11px;color:var(--gray);margin-top:2px;}
    .stock-filter-bar{display:flex;gap:8px;align-items:center;margin-bottom:20px;flex-wrap:wrap;}
    .stock-filter-btn{
      padding:6px 16px;border-radius:100px;border:1.5px solid var(--cream-dark);
      background:var(--white);cursor:pointer;font-size:12px;font-weight:400;
      font-family:'Plus Jakarta Sans',sans-serif;color:var(--gray);transition:all .15s;
    }
    .stock-filter-btn.active{background:var(--black);color:var(--cream);border-color:var(--black);}
    .stock-history{font-size:11px;color:var(--gray);border-top:1px solid var(--cream-dark);padding-top:8px;margin-top:4px;}
    .stock-history-item{display:flex;justify-content:space-between;padding:2px 0;}
    .stock-history-delta{font-weight:500;}
    .stock-history-delta.pos{color:#27ae60;}
    .stock-history-delta.neg{color:#c0392b;}

    /* ── AREA CARDS ── */
    .area-selector{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:28px;}
    .area-card{
      padding:20px 14px 16px;border-radius:var(--r);border:2px solid var(--cream-dark);
      background:var(--white);cursor:pointer;text-align:center;
      transition:all .22s cubic-bezier(.25,.8,.25,1);
      box-shadow:var(--shadow-sm);
    }
    .area-card:hover{
      border-color:var(--turq);background:var(--turq-pale);
      transform:translateY(-2px);box-shadow:var(--shadow-turq);
    }
    .area-card.active{
      border-color:var(--terra);background:linear-gradient(135deg,#fff5f3 0%,#fdecea 100%);
      transform:translateY(-2px);box-shadow:var(--shadow-terra);
    }
    .area-card-icon{font-size:28px;margin-bottom:8px;display:block;}
    .area-card-name{font-size:12px;color:var(--black);margin-bottom:6px;font-weight:600;line-height:1.3;}

    /* ── SUMMARY BAR ── */
    .summary-bar{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px;}
    .summary-card{
      background:var(--white);border-radius:var(--r);padding:16px 18px;
      border:1px solid rgba(34,32,31,.07);box-shadow:var(--shadow-sm);
    }
    .summary-label{font-size:10px;color:var(--gray);margin-bottom:4px;text-transform:uppercase;letter-spacing:1px;font-weight:500;}
    .summary-value{font-size:20px;color:var(--black);font-weight:700;}
    .summary-sub{font-size:11px;color:var(--gray);margin-top:3px;}

    /* ── PROD ITEMS ── */
    .prod-view-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;}
    .prod-item{
      display:flex;align-items:center;justify-content:space-between;
      padding:16px 20px;background:var(--white);border-radius:var(--r);
      border:1.5px solid var(--cream-dark);transition:all .2s;box-shadow:var(--shadow-sm);
    }
    .prod-item:hover{box-shadow:var(--shadow-md);border-color:var(--cream-mid);}
    .prod-item.updated{
      border-color:var(--terra);background:linear-gradient(135deg,#fff5f3,#fdecea);
      box-shadow:var(--shadow-terra);animation:pulse-b 2s ease-in-out 4;
    }
    @keyframes pulse-b{0%,100%{border-color:var(--terra);}50%{border-color:var(--terra-light);}}
    .prod-item-name{font-size:14px;color:var(--black);font-weight:400;}
    .prod-item-qty{font-size:30px;font-weight:700;color:var(--terra);min-width:60px;text-align:right;line-height:1;}
    .prod-item-unit{font-size:11px;color:var(--gray);text-align:right;margin-top:2px;font-weight:400;}

    /* ── ENVÍO TABLE ── */
    .envio-table{
      width:100%;border-collapse:collapse;font-size:13px;
      background:var(--white);border:1px solid var(--cream-dark);
      border-top:none;border-radius:0 0 var(--r) var(--r);overflow:hidden;
    }
    .envio-table th{
      text-align:left;padding:10px 18px;color:var(--gray);
      border-bottom:1px solid var(--cream-dark);font-weight:600;
      font-size:10px;text-transform:uppercase;letter-spacing:.8px;background:var(--cream);
    }
    .envio-table td{padding:10px 18px;border-bottom:1px solid var(--cream-mid);color:var(--black);font-weight:300;}
    .envio-table tr:last-child td{border-bottom:none;}
    .envio-table tr:hover td{background:rgba(155,214,204,.08);}
    .qty-h{font-weight:700;color:var(--terra);}
    .envio-empty{
      background:var(--white);border:1px solid var(--cream-dark);border-top:none;
      border-radius:0 0 var(--r) var(--r);padding:32px;text-align:center;
      color:var(--gray);font-size:13px;
    }

    /* ── FORMS ── */
    .login-wrap{display:flex;align-items:center;justify-content:center;min-height:75vh;}
    .login-card{
      background:var(--white);border:1px solid rgba(34,32,31,.08);
      border-radius:20px;padding:44px 40px;width:360px;
      box-shadow:var(--shadow-lg);
    }
    .login-title{font-size:22px;font-weight:700;color:var(--black);margin-bottom:6px;}
    .login-sub{font-size:13px;color:var(--gray);margin-bottom:28px;font-weight:400;}
    .admin-form{display:flex;flex-direction:column;gap:14px;}
    .form-row{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;}
    .form-group{display:flex;flex-direction:column;gap:6px;flex:1;min-width:120px;}
    .form-label{font-size:10px;color:var(--gray);text-transform:uppercase;letter-spacing:1px;font-weight:600;}
    .form-input,.form-select{
      padding:10px 14px;background:var(--cream);border:1.5px solid var(--cream-dark);
      border-radius:var(--r-sm);color:var(--black);font-size:13px;outline:none;width:100%;
      font-family:'Plus Jakarta Sans',sans-serif;font-weight:400;
      transition:border-color .15s,box-shadow .15s;
    }
    .form-input:focus,.form-select:focus{
      border-color:var(--terra);
      box-shadow:0 0 0 3px rgba(225,93,70,.12);
    }
    .product-list-admin{display:flex;flex-direction:column;gap:6px;max-height:440px;overflow-y:auto;}
    .admin-product-row{
      display:flex;align-items:center;gap:10px;padding:9px 14px;
      background:var(--cream);border-radius:var(--r-sm);border:1px solid var(--cream-mid);
      transition:background .15s;
    }
    .admin-product-row:hover{background:var(--white);}

    /* ── CAT TABS ── */
    .cat-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;}
    .cat-tab{
      padding:6px 16px;border-radius:100px;border:1.5px solid var(--cream-dark);
      background:var(--cream);color:var(--gray);cursor:pointer;
      font-size:12px;font-family:'Plus Jakarta Sans',sans-serif;font-weight:500;
      transition:all .15s;
    }
    .cat-tab:hover{border-color:var(--terra);color:var(--terra);}
    .cat-tab.active{background:var(--terra);border-color:var(--terra);color:#fff;box-shadow:var(--shadow-terra);}

    /* ── TOGGLE ── */
    .toggle{
      width:38px;height:22px;border-radius:11px;background:var(--cream-dark);
      position:relative;cursor:pointer;transition:background .25s;flex-shrink:0;border:none;
    }
    .toggle.on{background:var(--turq);}
    .toggle::after{
      content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;
      border-radius:50%;background:#fff;transition:transform .25s;
      box-shadow:0 1px 4px rgba(0,0,0,.2);
    }
    .toggle.on::after{transform:translateX(16px);}

    /* ── STATUS ── */
    .status-dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:5px;}
    .dot-open{background:var(--turq-dark);}
    .dot-closed{background:#b83a25;}
    .deadline-txt{font-size:12px;color:var(--gray);}

    /* ── LOADING ── */
    .loading{text-align:center;padding:80px 24px;color:var(--gray);font-size:13px;}
    .empty-state{text-align:center;padding:56px 24px;color:var(--gray);font-size:13px;}
    .spinner{
      width:36px;height:36px;
      border:3px solid var(--cream-dark);
      border-top-color:var(--terra);border-radius:50%;
      animation:spin .75s linear infinite;margin:0 auto 16px;
    }
    @keyframes spin{to{transform:rotate(360deg);}}

    /* ── TOAST ── */
    #toast{
      position:fixed;bottom:28px;right:28px;
      background:var(--black);color:var(--cream);
      padding:14px 22px;border-radius:12px;font-size:13px;font-weight:500;
      opacity:0;transform:translateY(12px) scale(.97);
      transition:all .3s cubic-bezier(.25,.8,.25,1);
      pointer-events:none;z-index:999;
      box-shadow:0 8px 32px rgba(0,0,0,.25);
    }
    #toast.show{opacity:1;transform:translateY(0) scale(1);}
    #toast.success{border-left:3px solid var(--turq);}
    #toast.warn{border-left:3px solid var(--terra);}

    /* ── INSUMOS ── */
    .insumo-header-row{
      display:grid;grid-template-columns:20px 1fr 110px 90px 1fr;
      gap:8px;padding:6px 12px;font-size:10px;color:var(--gray);
      text-transform:uppercase;letter-spacing:.8px;
      border-bottom:1.5px solid var(--cream-dark);margin-bottom:6px;font-weight:600;
    }
    .insumo-row{
      display:grid;grid-template-columns:20px 1fr 110px 90px 1fr;
      gap:8px;align-items:center;padding:8px 12px;border-radius:var(--r-sm);
      border:1px solid var(--cream-dark);margin-bottom:5px;
      background:var(--white);transition:all .15s;box-shadow:var(--shadow-sm);
    }
    .insumo-row:hover{border-color:var(--turq);box-shadow:var(--shadow-md);}
    .insumo-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;transition:background .2s;}
    .insumo-name{font-size:13px;font-weight:400;color:var(--black);}
    .insumo-qty{
      padding:5px 10px;border:1.5px solid var(--cream-dark);border-radius:var(--r-xs);
      font-size:13px;font-family:'Plus Jakarta Sans',sans-serif;outline:none;
      background:var(--cream);width:100%;transition:all .15s;
    }
    .insumo-qty:focus{border-color:var(--terra);background:var(--white);box-shadow:0 0 0 3px rgba(225,93,70,.10);}
    .insumo-nota{
      padding:5px 10px;border:1.5px solid var(--cream-dark);border-radius:var(--r-xs);
      font-size:12px;font-family:'Plus Jakarta Sans',sans-serif;outline:none;color:var(--gray);
      background:var(--cream);width:100%;transition:all .15s;
    }
    .insumo-nota:focus{border-color:var(--turq);background:var(--white);}
    .insumo-prio-btns{display:flex;gap:5px;align-items:center;}
    .prio-btn{

// ====================== HELPERS ======================
function todayKey() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function yesterdayKey() {
  const d = new Date(); d.setDate(d.getDate()-1);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function getMergedInsumos() {
  const yesterday = state.insumosPedidos?.[yesterdayKey()] || {};
  const today     = state.insumosPedidos?.[todayKey()]     || {};
  const merged = {};
  const allScopes = new Set([...Object.keys(yesterday), ...Object.keys(today)]);
  allScopes.forEach(scope => {
    merged[scope] = {};
    const yScope = yesterday[scope] || {};
    const tScope = today[scope]     || {};
    const allIds = new Set([...Object.keys(yScope), ...Object.keys(tScope)]);
    allIds.forEach(id => {
      const yItem = yScope[id];
      const tItem = tScope[id];
      if (yItem && tItem) merged[scope][id] = (tItem.ts || 0) >= (yItem.ts || 0) ? tItem : yItem;
      else merged[scope][id] = tItem || yItem;
    });
  });
  return merged;
}
function isClosed(areaKey) {
  const area = AREAS.find(a=>a.key===areaKey);
  if(!area) return false;
  const now=new Date(), [h,m]=area.deadline.split(':').map(Number);
  const dl=new Date(now); dl.setHours(h,m,0,0);
  return now>dl;
}
function fmtQty(n){ return n%1===0?n:parseFloat(n.toFixed(2)); }
function getQty(local,area,pid){
  const todayVal = state.pedidos?.[todayKey()]?.[fbKey(local)]?.[area]?.[pid];
  if(todayVal!==undefined && todayVal!==null) return todayVal;
  return state.pedidos?.[yesterdayKey()]?.[fbKey(local)]?.[area]?.[pid] || '';
}
function showToast(msg,type='success'){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.className=`show ${type}`;
  setTimeout(()=>t.className='',3000);
}
function safeRender(){
  const active=document.activeElement;
  if(active && active.classList.contains('qty-input')) return;
  render();
}

// ====================== FIREBASE SAVE DEFINITIVA ======================
async function saveQty(local, area, pid, val) {
  const numVal = parseFloat(val);
  const path = `pedidos/${todayKey()}/${fbKey(local)}/${area}/${pid}`;
  const tsPath = `pedidosTs/${todayKey()}/${fbKey(local)}/${area}/${pid}`;
  console.log(`💾 Guardando: ${path} = ${val} (num: ${numVal})`);

  // Lock granular: el listener onValue no pisará este path mientras esté guardando
  state.savingPaths.add(path);
  // Mark input as saving in DOM (if still mounted)
  const inputEl = document.querySelector(
    `.qty-input[data-local="${local}"][data-area="${area}"][data-pid="${pid}"]`
  );
  if (inputEl) { inputEl.classList.add('saving'); inputEl.classList.remove('saved'); }
  state.savingCount++;
  try {
    const isZeroOrEmpty = !val || isNaN(numVal) || numVal <= 0;
    if (isZeroOrEmpty) {
      // Si ayer había un valor, guardar 0 explícito para no caer al fallback de ayer.
      // Si ayer no había nada, eliminar limpiamente.
      const yestVal = Number(state.pedidos?.[yesterdayKey()]?.[fbKey(local)]?.[area]?.[pid]);
      if (yestVal > 0) {
        await set(ref(db, path), 0);
        console.log(`⓪ Guardado 0 explícito (override ayer): ${path}`);
      } else {
        await remove(ref(db, path));
        console.log(`🗑 Eliminado: ${path}`);
      }
      await remove(ref(db, tsPath));   // sin cantidad → sin marca de hora
    } else {
      await set(ref(db, path), numVal);
      await set(ref(db, tsPath), Date.now());   // registrar la hora de carga
      console.log(`✅ Guardado: ${path} = ${numVal}`);
      if (isClosed(area)) {
        await set(ref(db, `alertas/${area}/${pid}`), { ts: Date.now(), local });
        state.updatedProducts[pid] = Date.now();
      }
    }
    // Pequeña pausa para asegurar que Firebase haya propagado el cambio
    await new Promise(resolve => setTimeout(resolve, 300));
    // Verificación remota: confirmar que el valor quedó bien en Firebase
    const snap = await get(ref(db, path));
    const remoteVal = snap.val();
    console.log(`🔁 Verificación remota: ${path} → ${remoteVal}`);
    // Actualizar estado local con el valor confirmado por Firebase
    if (!state.pedidos[todayKey()]) state.pedidos[todayKey()] = {};
    if (!state.pedidos[todayKey()][fbKey(local)]) state.pedidos[todayKey()][fbKey(local)] = {};
    if (!state.pedidos[todayKey()][fbKey(local)][area]) state.pedidos[todayKey()][fbKey(local)][area] = {};
    const yestFallback = Number(state.pedidos?.[yesterdayKey()]?.[fbKey(local)]?.[area]?.[pid]) > 0;
    if (remoteVal !== undefined && remoteVal !== null && (remoteVal > 0 || yestFallback)) {
      // Guardar el valor confirmado (puede ser 0 explícito para no caer a ayer)
      state.pedidos[todayKey()][fbKey(local)][area][pid] = remoteVal;
    } else {
      delete state.pedidos[todayKey()][fbKey(local)][area][pid];
    }
  } catch (error) {
    console.error(`❌ Error guardando en ${path}:`, error);
    showToast(`Error al guardar: ${error.message}`, 'warn');
  } finally {
    // Renderizar ANTES de liberar los locks para que el onValue
    // no sobrescriba el estado correcto antes del render final
    safeRender();
    const savedEl = document.querySelector(
      `.qty-input[data-local="${local}"][data-area="${area}"][data-pid="${pid}"]`
    );
    if (savedEl) {
      savedEl.classList.remove('saving');
      savedEl.classList.add('saved');
      setTimeout(() => savedEl?.classList.remove('saved'), 1500);
    }
    state.hasUnsavedChanges = false;
    state.savingPaths.delete(path);
    state.savingCount--;
  }
}

async function saveProductos(productos) { await set(ref(db, 'catalogo/productos'), productos); }
async function saveProductActive(productActive) { await set(ref(db, 'catalogo/activos'), productActive); }

// ====================== FIREBASE LISTENERS ======================
// Suscribe todos los listeners que dependen de la fecha (hoy/ayer). Se puede
// re-ejecutar al cambiar de día: desuscribe los anteriores y crea los nuevos.
function subscribeDateListeners() {
  (state._dateUnsubs || []).forEach(u => { try { u(); } catch (e) {} });
  state._dateUnsubs = [];
  const tKey = todayKey(), yKey = yesterdayKey();

  // pedidos de hoy — merge inteligente que protege valores en vuelo
  state._dateUnsubs.push(onValue(ref(db, `pedidos/${tKey}`), snap => {
    const incoming = snap.val() || {};
    if (state.savingPaths.size === 0) {
      state.pedidos[tKey] = incoming;
    } else {
      const snapshot = JSON.parse(JSON.stringify(incoming));
      state.savingPaths.forEach(lockPath => {
        const parts = lockPath.split('/');
        if (parts.length === 5) {
          const [, , localKey, area, pid] = parts;
          const inFlightVal = state.pedidos[tKey]?.[localKey]?.[area]?.[pid];
          if (inFlightVal !== undefined && inFlightVal !== null) {
            if (!snapshot[localKey]) snapshot[localKey] = {};
            if (!snapshot[localKey][area]) snapshot[localKey][area] = {};
            snapshot[localKey][area][pid] = inFlightVal;
          }
        }
      });
      state.pedidos[tKey] = snapshot;
    }
    if (!state.loading) safeRender();
  }));
  state._dateUnsubs.push(onValue(ref(db, `pedidos/${yKey}`), snap => {
    state.pedidos[yKey] = snap.val() || {};
    if (!state.loading) safeRender();
  }));
  state._dateUnsubs.push(onValue(ref(db, `pedidosTs/${tKey}`), snap => {
    state.pedidosTs[tKey] = snap.val() || {};
    if (!state.loading) safeRender();
  }));
  state._dateUnsubs.push(onValue(ref(db, `pedidosTs/${yKey}`), snap => {
    state.pedidosTs[yKey] = snap.val() || {};
    if (!state.loading) safeRender();
  }));
  state._dateUnsubs.push(onValue(ref(db, `insumosPedidos/${tKey}`), snap => {
    state.insumosPedidos[tKey] = snap.val() || {};
    state.historialInsumos[tKey] = snap.val() || {};
    if (!state.loading) safeRender();
  }));
  state._dateUnsubs.push(onValue(ref(db, `insumosPedidos/${yKey}`), snap => {
    state.insumosPedidos[yKey] = snap.val() || {};
    state.historialInsumos[yKey] = snap.val() || {};
    if (!state.loading) safeRender();
  }));
  state._dateUnsubs.push(onValue(ref(db, `comprados/${tKey}`), snap => {
    state.comprados = snap.val() || {};
    if (!state.loading) safeRender();
  }));
  state._dateUnsubs.push(onValue(ref(db, `confirmados/${tKey}`), snap => {
    state.confirmados = snap.val() || {};
    if (!state.loading) safeRender();
  }));

  state._listenerDay = tKey;
}

// Detecta el cambio de día (pestaña abierta cruzando la medianoche) y
// re-suscribe los listeners a las fechas nuevas para no quedar mostrando ayer.
function checkDateRollover() {
  if (state._listenerDay && todayKey() !== state._listenerDay) {
    console.log(`📅 Cambio de día detectado (${state._listenerDay} → ${todayKey()}). Re-suscribiendo.`);
    subscribeDateListeners();
    if (!state.loading) safeRender();
  }
}

async function initFirebase() {
  const catSnap = await get(ref(db, 'catalogo'));
  if (!catSnap.exists()) {
    await set(ref(db, 'catalogo/productos'), PRODUCTOS_DEFAULT);
    const activos = {};
    Object.values(PRODUCTOS_DEFAULT).flat().forEach(p => { activos[p.id] = true; });
    await set(ref(db, 'catalogo/activos'), activos);
  }

  // Listeners que dependen de la fecha (pedidos/insumos/comprados/confirmados de
  // hoy y ayer). Se re-suscriben solos si la pestaña cruza la medianoche.
  subscribeDateListeners();

  function toArr(val) {
    if (!val) return [];
    if (Array.isArray(val)) return val;
    return Object.values(val);
  }

  onValue(ref(db, 'catalogo/productos'), snap => {
    const fromDB = snap.val() || {};
    const merged = {};
    Object.keys(PRODUCTOS_DEFAULT).forEach(cat => {
      if (fromDB[cat]) merged[cat] = toArr(fromDB[cat]);
      else {
        merged[cat] = PRODUCTOS_DEFAULT[cat];
        set(ref(db, `catalogo/productos/${cat}`), PRODUCTOS_DEFAULT[cat]);
        const activos = {};
        PRODUCTOS_DEFAULT[cat].forEach(p => { activos[p.id] = true; });
        Object.assign(state.productActive, activos);
      }
    });
    state.productos = merged;
    if (!state.loading) safeRender();
  });

  onValue(ref(db, 'catalogo/activos'), snap => {
    state.productActive = snap.val() || {};
    if (!state.loading) safeRender();
  });

  onValue(ref(db, 'alertas'), snap => {
    const data = snap.val() || {};
    const now = Date.now();
    state.updatedProducts = {};
    Object.entries(data).forEach(([area, prods]) => {
      Object.entries(prods).forEach(([pid, info]) => {
        if (now - info.ts < 3600000) state.updatedProducts[pid] = info.ts;
      });
    });
    if (!state.loading) safeRender();
  });

  onValue(ref(db, 'ventasCustomInsumos'), snap => {
    state.ventasCustomInsumos = snap.val() || {};
    if (!state.loading) safeRender();
  });
  onValue(ref(db, 'prodCustomInsumos'), snap => {
    state.prodCustomInsumos = snap.val() || {};
    if (!state.loading) safeRender();
  });
  onValue(ref(db, 'proveedores'), snap => {
    const v = snap.val();
    state.proveedores = Array.isArray(v) ? v : (v ? Object.values(v) : []);
    if (!state.loading) safeRender();
  });
  onValue(ref(db, 'proveedorProducto'), snap => {
    state.proveedorProducto = snap.val() || {};
    if (!state.loading) safeRender();
  });
  onValue(ref(db, 'stock'), snap => {
    state.stock = snap.val() || {};
    if (!state.loading) safeRender();
  });
  onValue(ref(db, 'stockHistory'), snap => {
    state.stockHistory = snap.val() || {};
    if (!state.loading) safeRender();
  });
  onValue(ref(db, 'anuncios'), snap => {
    state.anuncios = snap.val() || {};
    if (!state.loading) render();
  });

  state.loading = false;
  render();
}

// ====================== LÓGICA DE NEGOCIO ======================

// Devuelve la clave de fecha activa POR ÁREA: hoy si algún local ya cargó algo
// para esa área hoy, si no ayer. Evita el problema global donde un pedido de
// pastelería de hoy ocultaba los consolidados de panadería de ayer.
function getActivePedidoKeyForArea(area) {
  const hasTodayDataForArea = LOCALES.some(local => {
    const areaData = state.pedidos?.[todayKey()]?.[fbKey(local)]?.[area] || {};
    return Object.values(areaData).some(v => Number(v) > 0);
  });
  return hasTodayDataForArea ? todayKey() : yesterdayKey();
}

// Fecha activa POR LOCAL Y ÁREA — evita que un local con datos hoy tape los datos de ayer del otro local
function getActivePedidoKeyForLocalArea(local, area) {
  const areaData = state.pedidos?.[todayKey()]?.[fbKey(local)]?.[area] || {};
  return Object.values(areaData).some(v => Number(v) > 0) ? todayKey() : yesterdayKey();
}

// Mantener compatibilidad con renderEnvio/renderHistorial que usan la versión global
function getActivePedidoKey() {
  const todayData = state.pedidos?.[todayKey()];
  const hasDataToday = todayData && Object.values(todayData).some(localData =>
    localData && Object.values(localData).some(areaData =>
      areaData && Object.keys(areaData).length > 0
    )
  );
  return hasDataToday ? todayKey() : yesterdayKey();
}

function getConsolidated(area) {
  const r = {};
  const activeKey = getActivePedidoKeyForArea(area);
  LOCALES.forEach(local => {
    const pedidoArea = state.pedidos?.[activeKey]?.[fbKey(local)]?.[area] || {};
    Object.entries(pedidoArea).forEach(([pid, qty]) => {
      const q = Number(qty);
      if (q > 0) r[pid] = (r[pid] || 0) + q;
    });
  });
  return r;
}

function getEnvioPorLocal(local) {
  const r = [];
  AREAS.forEach(area => {
    const activeKey = getActivePedidoKeyForArea(area.key);
    const prodMap = {};
    (state.productos[area.key] || []).forEach(p => { prodMap[p.id] = p; });
    const pedidoArea = state.pedidos?.[activeKey]?.[fbKey(local)]?.[area.key] || {};
    Object.entries(pedidoArea).forEach(([pid, qty]) => {
      const q = Number(qty);
      if (q <= 0) return;
      if (state.productActive[pid] === false) return;
      const prod = prodMap[pid] || { id: pid, name: pid, unit: 'u' };
      r.push({...prod, qty: q, area: area.label, areaKey: area.key});
    });
  });
  return r;
}

function getUpdatedKeys() {
  const now = Date.now();
  return Object.entries(state.updatedProducts)
    .filter(([k, t]) => now - t < 3600000)
    .map(([k]) => k);
}

function renderDashboard() {
  const hour = new Date().getHours();
  const greeting = hour < 12 ? 'Buenos días' : hour < 19 ? 'Buenas tardes' : 'Buenas noches';
  const fecha = new Date().toLocaleDateString('es-AR', {weekday:'long', day:'numeric', month:'long'});
  const areasVisibles = AREAS.filter(a => a.cuadra !== false);
  let confirmed = 0, withPedido = 0, pending = 0;
  areasVisibles.forEach(a => {
    if (state.confirmados[a.key]) confirmed++;
    else {
      const cons = getConsolidated(a.key);
      const hasPedido = Object.values(cons).some(q => q > 0);
      if (hasPedido) withPedido++; else pending++;
    }
  });
  return `
    <div class="dashboard-greeting">${greeting} 👋</div>
    <div class="dashboard-date">${fecha}</div>
    <div class="dashboard-summary">
      <div class="dash-stat"><div class="dash-stat-val" style="color:var(--turq-dark)">${confirmed}</div><div class="dash-stat-label">Confirmados</div></div>
      <div class="dash-stat"><div class="dash-stat-val" style="color:var(--terra)">${withPedido}</div><div class="dash-stat-label">Con pedido</div></div>
      <div class="dash-stat"><div class="dash-stat-val" style="color:var(--gray)">${pending}</div><div class="dash-stat-label">Pendientes</div></div>
    </div>
    <div style="font-size:11px;color:var(--gray);text-transform:uppercase;letter-spacing:.8px;margin-bottom:12px">Áreas de producción</div>
    <div class="dashboard-areas">
      ${areasVisibles.map(a => {
        const cons = getConsolidated(a.key);
        const isConfirmed = !!state.confirmados[a.key];
        const hasPedido = Object.values(cons).some(q => q > 0);
        const closed = isClosed(a.key);
        const itemCount = Object.values(cons).filter(q => q > 0).length;
        let badgeText, badgeBg, badgeColor;
        if (isConfirmed) { badgeText = '✓ Confirmado'; badgeBg = 'var(--turq-pale)'; badgeColor = 'var(--turq-dark)'; }
        else if (hasPedido) { badgeText = itemCount + ' productos'; badgeBg = 'var(--terra-pale)'; badgeColor = 'var(--terra)'; }
        else if (closed) { badgeText = 'Cerrado'; badgeBg = '#f0f0f0'; badgeColor = 'var(--gray)'; }
        else { badgeText = 'Pendiente'; badgeBg = '#f5f5f0'; badgeColor = 'var(--gray)'; }
        return '<div class="dash-area-card ' + (isConfirmed?'confirmed':hasPedido?'has-pedido':closed?'closed':'') + '" onclick="goToCarga(\'' + a.key + '\')">' +
          (isConfirmed ? '<div class="dash-check">✓</div>' : '') +
          '<div class="dash-area-icon">' + a.icon + '</div>' +
          '<div class="dash-area-name">' + a.label + '</div>' +
          '<span class="dash-area-badge" style="background:' + badgeBg + ';color:' + badgeColor + '">' + badgeText + '</span>' +
          '</div>';
      }).join('')}
    </div>
    <div style="font-size:11px;color:var(--gray);text-transform:uppercase;letter-spacing:.8px;margin-bottom:12px">Acciones rápidas</div>
    <div class="dash-quick-actions">
      <button class="btn btn-primary" onclick="setView('produccion')">📋 Ver Cuadra</button>
      <button class="btn btn-ghost" onclick="window.printEnvioAll()">🖨 Imprimir guía</button>
      <button class="btn btn-ghost" onclick="setView('insumos')">📦 Insumos</button>
    </div>
  `;
}
window.goToCarga = function(areaKey) {
  state.areaTab = areaKey;
  state.view = 'carga';
  render();
};

function renderCarga() {
  const local = LOCALES[state.localTab];
  return `
    <div class="page-title">Carga de pedidos</div>
    <div class="page-sub">Ingresá las cantidades para cada producto · ${new Date().toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'})}</div>
    <div class="tabs">
      ${LOCALES.map((l,i) => `<button class="tab ${state.localTab===i?'active':''}" onclick="setLocalTab(${i})">${l}</button>`).join('')}
    </div>
    ${AREAS.filter(a=>a.cuadra!==false).map(area => {
      const closed = isClosed(area.key);
      const prods = (state.productos[area.key] || []).filter(p => state.productActive[p.id] !== false);
      const filled = prods.filter(p => { const q = getQty(local, area.key, p.id); return q !== '' && parseFloat(q) > 0; }).length;
      return `<div class="section-block">
        <div class="section-header">
          <div class="section-title">
            ${area.icon} ${area.label}
            <span class="badge ${closed?'badge-closed':'badge-open'}">${closed?'Cerrado':'Abierto'}</span>
            ${closed ? `<span class="badge badge-warn">⚠ Notifica a producción</span>` : ''}
          </div>
          <div style="display:flex;align-items:center;gap:8px">
            <span class="deadline-txt">Límite ${area.deadline} · ${filled}/${prods.length} productos</span>
            ${(() => {
              const todayFilled = prods.filter(p => { const q = state.pedidos?.[todayKey()]?.[fbKey(local)]?.[area.key]?.[p.id]; return q !== undefined && q !== null && Number(q) > 0; }).length;
              const yData = state.pedidos?.[yesterdayKey()]?.[fbKey(local)]?.[area.key] || {};
              const yHasData = Object.values(yData).some(v => Number(v) > 0);
              return (todayFilled === 0 && yHasData) ? `<button class="btn btn-ghost btn-sm" onclick="copiarDeAyer('${local}', '${area.key}')">⟳ Copiar de ayer</button>` : '';
            })()}
          </div>
        </div>
        ${closed ? `<div class="alert-box alert-warn"><span class="pulse"></span>Horario cerrado. Cualquier cambio alertará al área de ${area.label}.</div>` : ''}
        <div style="padding:4px 0">
          ${prods.map(p => {
            const qty = getQty(local, area.key, p.id);
            const hasVal = qty !== '' && parseFloat(qty) > 0;
            return `<div class="qty-row">
              <span class="qty-product-name">${p.name}</span>
              <button class="qty-btn minus" onclick="qtyDecrement('${local}','${area.key}','${p.id}')">−</button>
              <input class="qty-input-new ${hasVal?'has-value':''}" type="number" min="0" step="0.1"
                value="${hasVal ? qty : ''}" placeholder="0"
                data-local="${local}" data-area="${area.key}" data-pid="${p.id}"
                onblur="saveQtyInput(this)"
                onkeydown="if(event.key==='Enter')this.blur()"
                oninput="this.classList.toggle('has-value', parseFloat(this.value)>0)">
              <span class="qty-unit-label">${p.unit}</span>
              <button class="qty-btn" onclick="qtyIncrement('${local}','${area.key}','${p.id}')">+</button>
            </div>`;
          }).join('')}
        </div>
        <button class="confirm-area-btn ${state.confirmados[area.key]?'confirmed':''}" 
          onclick="toggleConfirmarArea('${area.key}','${local}')">
          ${state.confirmados[area.key] ? '✓ Pedido confirmado — tocá para editar' : '✓ Confirmar pedido de ' + area.label}
        </button>
      </div>`;
    }).join('')}`;
}

function renderProduccion() {
  const area = AREAS.find(a => a.key === state.areaTab);
  const consolidated = getConsolidated(state.areaTab);
  const updatedKeys = getUpdatedKeys();
  const prods = (state.productos[state.areaTab] || []).filter(p => state.productActive[p.id] !== false);
  // También incluir productos con cantidad pedida que no estén en el catálogo (ej: dados de baja)
  const prodIds = new Set(prods.map(p => p.id));
  const extraItems = Object.entries(consolidated)
    .filter(([pid, qty]) => qty > 0 && !prodIds.has(pid))
    .map(([pid, qty]) => ({ id: pid, name: pid, unit: '' }));
  const allProds = [...prods, ...extraItems];
  const items = allProds.filter(p => consolidated[p.id] > 0);
  const hasUpdates = items.some(p => updatedKeys.includes(p.id));
  const closed = isClosed(state.areaTab);
  const showingYesterday = getActivePedidoKeyForArea(state.areaTab) !== todayKey();

  return `
    ${showingYesterday ? `<div class="alert-box alert-warn">⚠️ Mostrando pedidos del día anterior (${yesterdayKey()}). <button class="btn btn-ghost btn-sm" onclick="forceToday()">⟳ Refrescar hoy</button></div>` : ''}
    <div style="display:flex;justify-content:space-between;margin-bottom:4px"><div class="page-title">Cuadra</div><button class="btn btn-ghost" onclick="printArea(null,'${state.areaTab}')">🖨 Imprimir área</button></div>
    <div class="page-sub">Total consolidado · ${new Date().toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'})}</div>
    <div class="area-selector">${AREAS.filter(a=>a.cuadra!==false).map(a => `<div class="area-card ${state.areaTab===a.key?'active':''}" onclick="setAreaTab('${a.key}')"><div class="area-card-icon">${a.icon}</div><div class="area-card-name">${a.label}</div><span class="badge ${isClosed(a.key)?'badge-closed':'badge-open'}" style="font-size:10px">${isClosed(a.key)?'Cerrado':'hasta '+a.deadline}</span></div>`).join('')}</div>
    ${hasUpdates ? `<div style="background:var(--terra);color:#fff;border-radius:10px;padding:18px;margin-bottom:20px;">⚠️ Pedido modificado fuera de horario. Revisá los productos marcados.</div>` : ''}
    <div class="summary-bar"><div class="summary-card"><div class="summary-label">Área</div><div class="summary-value">${area.label}</div><div class="summary-sub">${area.icon} Límite: ${area.deadline}</div></div><div class="summary-card"><div class="summary-label">Productos pedidos</div><div class="summary-value">${items.length}</div><div class="summary-sub">de ${prods.length} en catálogo</div></div><div class="summary-card"><div class="summary-label">Estado</div><div class="summary-value" style="font-size:15px"><span class="status-dot ${closed?'dot-closed':'dot-open'}"></span>${closed?'Cerrado':'Abierto'}</div><div class="summary-sub">Pedido de hoy</div></div></div>
    ${items.length===0 ? `<div class="empty-state">No hay productos pedidos para ${area.label} todavía.</div>` : `<div class="prod-view-grid">${items.map(p=>{const upd=updatedKeys.includes(p.id); const qty=consolidated[p.id]; const prod=allProds.find(x=>x.id===p.id); return `<div class="prod-item ${upd?'updated':''}"><div class="prod-item-name">${prod?.name || p.id}${upd?' <span class="pulse" style="width:6px;height:6px;display:inline-block;vertical-align:middle;margin-left:4px"></span>':''}</div><div><div class="prod-item-qty">${fmtQty(qty)}</div><div class="prod-item-unit">${prod?.unit||''}</div></div></div>`;}).join('')}</div>`}
    ${(() => {
      const localBreakdown = LOCALES.map(loc => {
        // Usar misma lógica que getQty: hoy si existe, ayer como fallback por producto.
        // Esto evita que productos "visibles en carga" queden ocultos en Cuadra cuando
        // solo algunos fueron re-guardados hoy y el resto aún apunta a ayer.
        const todayArea     = state.pedidos?.[todayKey()]?.[fbKey(loc)]?.[state.areaTab] || {};
        const yesterdayArea = state.pedidos?.[yesterdayKey()]?.[fbKey(loc)]?.[state.areaTab] || {};
        function localQty(pid) {
          const tv = todayArea[pid];
          if (tv !== undefined && tv !== null) return Number(tv);
          return Number(yesterdayArea[pid]) || 0;
        }
        const catalogIds = new Set(prods.map(p => p.id));
        const allPids = new Set([...Object.keys(todayArea), ...Object.keys(yesterdayArea)]);
        const extraLocItems = [...allPids]
          .filter(pid => !catalogIds.has(pid) && localQty(pid) > 0)
          .map(pid => ({ id: pid, name: pid, unit: '' }));
        const allLocalProds = [...prods, ...extraLocItems];
        const localItems = allLocalProds
          .filter(p => localQty(p.id) > 0)
          .map(p => ({ ...p, qty: localQty(p.id) }));
        return { local: loc, items: localItems };
      }).filter(l => l.items.length > 0);
      if (localBreakdown.length === 0) return '';
      return `<div style="margin-top:20px">
        <div style="font-size:11px;color:var(--gray);text-transform:uppercase;letter-spacing:.8px;margin-bottom:10px">Desglose por local</div>
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px">
          ${localBreakdown.map(({ local: loc, items: litems }) => `
            <div class="section-block" style="padding:14px 16px">
              <div style="font-size:13px;font-weight:500;margin-bottom:10px">${loc}</div>
              <table style="width:100%;border-collapse:collapse;font-size:12px">
                ${litems.map(p => `<tr><td style="padding:3px 0;color:var(--black)">${p.name}</td><td style="text-align:right;color:var(--terra);font-weight:500">${fmtQty(p.qty)} ${p.unit}</td></tr>`).join('')}
              </table>
            </div>
          `).join('')}
        </div>
      </div>`;
    })()}`;
}

  html += `<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px"><div><div class="page-title">Guía de envío</div><div class="page-sub">Todos los productos pedidos, agrupados por área · ${fecha}</div></div><button onclick="window.printEnvioAll()" style="background:var(--black);border:none;color:var(--cream);border-radius:8px;padding:9px 20px;cursor:pointer;font-size:13px;font-family:'Plus Jakarta Sans',sans-serif;white-space:nowrap">🖨 Imprimir todo</button></div>`;

    });
    html += `</div>`;
  });
  return html;
}

function renderStock() {
  const allProds = [];
  AREAS.forEach(area => {
    (state.productos[area.key] || []).filter(p => state.productActive[p.id] !== false).forEach(p => allProds.push({...p, areaKey: area.key, areaLabel: area.label, areaIcon: area.icon}));
  });
  const areaProds = allProds.filter(p => p.areaKey === state.stockAreaTab);
  let filtered = areaProds;
  if (state.stockFilter === 'zero') filtered = areaProds.filter(p => !(state.stock[p.id]?.qty > 0));
  else if (state.stockFilter === 'low') filtered = areaProds.filter(p => { const qty = state.stock[p.id]?.qty || 0; return qty > 0 && qty <= 5; });
  const totalProds = areaProds.length;
  const conStock = areaProds.filter(p => (state.stock[p.id]?.qty || 0) > 0).length;
  const sinStock = areaProds.filter(p => !(state.stock[p.id]?.qty > 0)).length;
  const stockBajo = areaProds.filter(p => { const q = state.stock[p.id]?.qty || 0; return q > 0 && q <= 5; }).length;
  function fmtTime(ts) {
    if (!ts) return '';
    const d = new Date(ts);
    const now = new Date();
    const diffMin = Math.round((now - d) / 60000);
    if (diffMin < 1) return 'hace un momento';
    if (diffMin < 60) return `hace ${diffMin} min`;
    const diffH = Math.round(diffMin / 60);
    if (diffH < 24) return `hace ${diffH}h`;
    return d.toLocaleDateString('es-AR', {day:'numeric',month:'short'});
  }
  function statusClass(qty) {
    if (!qty || qty <= 0) return 'stock-zero';
    if (qty <= 5) return 'stock-low';
    return '';
  }
  function dotColor(qty) {
    if (!qty || qty <= 0) return '#e57373';
    if (qty <= 5) return '#f0c040';
    return '#4caf87';
  }
  function alertBadge(qty, unit) {
    if (!qty || qty <= 0) return `<span class="stock-alert-badge stock-alert-zero">Sin stock</span>`;
    if (qty <= 5) return `<span class="stock-alert-badge stock-alert-low">Stock bajo</span>`;
    return `<span class="stock-alert-badge stock-alert-ok">${qty} ${unit}</span>`;
  }
  return `
    <div class="stock-header-row"><div><div class="page-title">Stock en Cuadra</div><div class="page-sub">Cantidad disponible en producción · ${new Date().toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'})}</div></div><button class="btn btn-ghost" onclick="window.printStock('${state.stockAreaTab}')">🖨 Imprimir</button></div>
    <div class="stock-summary-bar"><div class="stock-summary-card"><div class="stock-summary-label">Con stock</div><div class="stock-summary-value" style="color:#27ae60">${conStock}</div><div class="stock-summary-sub">de ${totalProds} productos</div></div><div class="stock-summary-card"><div class="stock-summary-label">Sin stock</div><div class="stock-summary-value" style="color:#e57373">${sinStock}</div><div class="stock-summary-sub">productos en 0</div></div><div class="stock-summary-card"><div class="stock-summary-label">Stock bajo</div><div class="stock-summary-value" style="color:#f0a500">${stockBajo}</div><div class="stock-summary-sub">≤ 5 unidades</div></div></div>
    <div class="stock-area-tabs">${AREAS.map(a => `<button class="stock-area-tab ${state.stockAreaTab===a.key?'active':''}" onclick="setStockAreaTab('${a.key}')">${a.icon} ${a.label}</button>`).join('')}</div>
    <div class="stock-filter-bar"><span style="font-size:12px;color:var(--gray);margin-right:4px">Filtrar:</span><button class="stock-filter-btn ${state.stockFilter==='all'?'active':''}" onclick="setStockFilter('all')">Todos</button><button class="stock-filter-btn ${state.stockFilter==='zero'?'active':''}" onclick="setStockFilter('zero')">Sin stock</button><button class="stock-filter-btn ${state.stockFilter==='low'?'active':''}" onclick="setStockFilter('low')">Stock bajo (≤5)</button><span style="margin-left:auto;font-size:12px;color:var(--gray)">${filtered.length} producto${filtered.length!==1?'s':''}</span></div>
    ${filtered.length===0 ? `<div class="empty-state">No hay productos que coincidan con el filtro.</div>` : `<div class="stock-grid">${filtered.map(p => { const sd = state.stock[p.id] || {}; const qty = sd.qty || 0; const hist = (state.stockHistory[p.id] || []).slice(-3).reverse(); return `<div class="stock-item ${statusClass(qty)}"><div style="display:flex;justify-content:space-between"><div class="stock-item-name">${p.name}</div><div class="stock-status-dot" style="background:${dotColor(qty)}"></div></div><div class="stock-item-controls"><button class="stock-btn" onclick="stockDecrement('${p.id}','${p.unit}')">−</button><input class="stock-qty-input" type="number" min="0" step="1" value="${qty}" data-pid="${p.id}" data-unit="${p.unit}" onblur="stockSetQty(this)" onkeydown="if(event.key==='Enter')this.blur()"><button class="stock-btn" onclick="stockIncrement('${p.id}','${p.unit}')">+</button><span class="stock-unit">${p.unit}</span></div><div class="stock-item-footer">${alertBadge(qty, p.unit)}<span class="stock-last-update">${sd.ts ? fmtTime(sd.ts) : 'Sin registrar'}</span></div>${hist.length ? `<div class="stock-history">${hist.map(h=>`<div class="stock-history-item"><span class="stock-history-delta ${h.delta>0?'pos':'neg'}">${h.delta>0?'+':''}${h.delta} ${p.unit}</span><span>${fmtTime(h.ts)}</span></div>`).join('')}</div>` : ''}</div>`; }).join('')}</div>`}`;
}

// ====================== PROVEEDORES ======================
function escAttr(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
// Proveedor por defecto de un insumo (definido en el catálogo con la prop `prov`)
function getProdProvDefault(id) {
  for (const ak of Object.keys(INSUMOS_PRODUCCION)) {
    const f = (INSUMOS_PRODUCCION[ak]||[]).find(p=>p.id===id);
    if (f) return f.prov || '';
  }
  const fv = INSUMOS_VENTAS.find(p=>p.id===id);
  if (fv) return fv.prov || '';
  for (const ak of Object.keys(state.prodCustomInsumos||{})) {
    const f = (state.prodCustomInsumos[ak]||[]).find(p=>p.id===id);
    if (f) return f.prov || '';
  }
  for (const lk of Object.keys(state.ventasCustomInsumos||{})) {
    const f = (state.ventasCustomInsumos[lk]||[]).find(p=>p.id===id);
    if (f) return f.prov || '';
  }
  return '';
}
// Proveedor efectivo: override elegido por el usuario, si no el por defecto
function getProveedorActual(id) {
  const ov = state.proveedorProducto?.[id];
  if (ov !== undefined && ov !== null && ov !== '') return ov;
  return getProdProvDefault(id);
}
// Lista de proveedores conocidos (por defecto del catálogo + guardados + overrides)
function getListaProveedores() {
  const set = new Set();
  Object.values(INSUMOS_PRODUCCION).flat().forEach(p=>{ if(p.prov) set.add(p.prov); });
  INSUMOS_VENTAS.forEach(p=>{ if(p.prov) set.add(p.prov); });
  (state.proveedores||[]).forEach(n=>{ if(n) set.add(n); });
  Object.values(state.proveedorProducto||{}).forEach(n=>{ if(n) set.add(n); });
  return [...set].sort((a,b)=>a.localeCompare(b,'es'));
}
// Menú desplegable de proveedor para una fila del resumen
function provDropdown(id) {
  const actual = getProveedorActual(id);
  const lista = getListaProveedores();
  const opts = lista.map(n=>`<option value="${escAttr(n)}" ${n===actual?'selected':''}>${n}</option>`).join('');
  const sinAsignar = `<option value="" ${!actual?'selected':''}>— Sin asignar —</option>`;
  return `<select onchange="setProveedorProducto('${id}', this.value)" style="max-width:150px;padding:5px 8px;border:1.5px solid var(--cream-dark);border-radius:6px;background:var(--white);font-family:'Plus Jakarta Sans',sans-serif;font-size:12px;color:var(--black);cursor:pointer">${sinAsignar}${opts}<option value="__nuevo__">＋ Agregar proveedor…</option></select>`;
}
window.setProveedorProducto = async function(id, value) {
  if (value === '__nuevo__') {
    const nombre = (prompt('Nombre del nuevo proveedor:')||'').trim();
    if (!nombre) { render(); return; }
    const lista = Array.from(new Set([...(state.proveedores||[]), nombre]));
    await set(ref(db, 'proveedores'), lista);
    await set(ref(db, `proveedorProducto/${id}`), nombre);
    showToast(`Proveedor "${nombre}" asignado`, 'success');
    return;
  }
  if (value === '') await remove(ref(db, `proveedorProducto/${id}`));
  else await set(ref(db, `proveedorProducto/${id}`), value);
};
window.setResumenOrden = function(o) { state.resumenOrden = o; render(); };

function renderInsumos() {
  const sector = state.insumosSector;
  const insView = state.insumosView || 'detalle';
  const fecha = new Date().toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'});
  const prioColors = { verde:{bg:'#e8f8f0', border:'#4caf87', dot:'#27ae60', label:'Stock OK'}, amarillo:{bg:'#fffbe6', border:'#f0c040', dot:'#f0a500', label:'Stock bajo'}, rojo:{bg:'#fdecea', border:'#e57373', dot:'#c0392b', label:'Urgente'} };
  function getInsumo(scope, id) {
    const fromToday = state.insumosPedidos?.[todayKey()]?.[scope]?.[id];
    const fromYesterday = state.insumosPedidos?.[yesterdayKey()]?.[scope]?.[id];
    if (fromToday && fromYesterday) return (fromToday.ts || 0) >= (fromYesterday.ts || 0) ? fromToday : fromYesterday;
    return fromToday || fromYesterday || null;
  }
  function renderItem(id, name, scope, deleteFn) {
    const item = getInsumo(scope, id);
    const prio = item?.prioridad || '';
    const pc = prioColors[prio] || {bg:'var(--white)', border:'var(--cream-dark)', dot:'#ccc', label:''};
    return `<div class="insumo-row" style="background:${pc.bg};border-color:${pc.border}"><div><div class="insumo-dot" style="background:${pc.dot}" title="${pc.label}"></div></div><div class="insumo-name">${name}${deleteFn ? ` <button onclick="${deleteFn}" style="background:none;border:none;cursor:pointer;color:#bbb">✕</button>` : ''}</div><input class="insumo-qty" type="text" placeholder="Cantidad" value="${item?.qty||''}" data-scope="${scope}" data-id="${id}" onblur="saveInsumo(this)" onkeydown="if(event.key==='Enter')this.blur()"><div class="insumo-prio-btns">${['verde','amarillo','rojo'].map(p => `<button class="prio-btn prio-${p} ${prio===p?'active':''}" onclick="setPrioInsumo('${scope}','${id}','${p}')" title="${prioColors[p].label}"></button>`).join('')}</div><input class="insumo-nota" type="text" placeholder="Aclaración..." value="${item?.nota||''}" data-scope="${scope}" data-id="${id}" data-field="nota" onblur="saveInsumoNota(this)" onkeydown="if(event.key==='Enter')this.blur()"></div>`;
  }
  const topBar = `<div class="page-title">Pedido de insumos</div><div class="page-sub">${fecha}</div><div style="display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap"><button class="btn ${(sector==='produccion'||sector==='ventas')&&insView!=='resumen'?'btn-primary':'btn-ghost'}" onclick="setInsumosSector('produccion')">✏️ Hace el pedido</button><button class="btn ${sector==='verduleria'?'btn-primary':'btn-ghost'}" onclick="setInsumosSector('verduleria')">🥦 Verdulería</button><button class="btn btn-ghost" onclick="setInsumosView('resumen')">📋 Ver resumen</button></div>`;
  if (insView === 'resumen') {
    const todayData = getMergedInsumos();
    // Pendientes: desde insumosPedidos
    let pendRows = [];
    AREAS.forEach(area => {
      const scope = `prod_${area.key}`;
      const pedidos = todayData[scope] || {};
      const items = [...(INSUMOS_PRODUCCION[area.key] || []), ...(state.prodCustomInsumos[area.key] || [])];
      items.forEach(p => { const item = pedidos[p.id]; if (item?.qty || item?.prioridad || item?.nota) pendRows.push({...p, ...item, grupo: area.label, icon: area.icon, _scope: scope, _done: false}); });
    });
    LOCALES.forEach(local => {
      const scope = `ventas_${local.replace(/[ ./]/g,'_')}`;
      const pedidos = todayData[scope] || {};
      const customItems = state.ventasCustomInsumos[local.replace(/[ ./]/g,'_')] || [];
      [...INSUMOS_VENTAS, ...customItems].forEach(p => { const item = pedidos[p.id]; if (item?.qty || item?.prioridad || item?.nota) pendRows.push({...p, ...item, grupo: local, icon:'🛒', _scope: scope, _done: false}); });
    });
    // Comprados hoy: desde state.comprados
    let doneRows = [];
    Object.entries(state.comprados || {}).forEach(([ck, saved]) => {
      if (!saved || typeof saved !== 'object') return;
      const [scope, ...idParts] = ck.split('__'); const id = idParts.join('__');
      // Buscar nombre del producto
      let name = id;
      AREAS.forEach(area => { [...(INSUMOS_PRODUCCION[area.key]||[]), ...(state.prodCustomInsumos[area.key]||[])].forEach(p => { if (p.id === id) name = p.name; }); });
      INSUMOS_VENTAS.forEach(p => { if (p.id === id) name = p.name; });
      // Determinar grupo
      let grupo = scope; let icon = '✓';
      if (scope.startsWith('prod_')) { const ak = scope.replace('prod_',''); const a = AREAS.find(a=>a.key===ak); if(a){grupo=a.label;icon=a.icon;} }
      else if (scope.startsWith('ventas_')) { const lk = scope.replace('ventas_',''); const l = LOCALES.find(l=>l.replace(/[ ./]/g,'_')===lk); if(l){grupo=l;icon='🛒';} }
      doneRows.push({id, name, qty: saved.qty||'', nota: saved.nota||'', prioridad: saved.prioridad||'', grupo, icon, _scope: scope, _done: true});
    });
    const prioOrder = {rojo:0, amarillo:1, verde:2, '':3};
    const prioLabel = {verde:'Stock OK', amarillo:'Stock bajo', rojo:'Urgente'};
    const prioBg2 = {verde:'#e8f8f0', amarillo:'#fffbe6', rojo:'#fdecea'};
    const orden = state.resumenOrden || 'local';
    const allRows = [...pendRows, ...doneRows];
    allRows.forEach(r => { r.proveedor = getProveedorActual(r.id); });
    const totalPend = pendRows.length; const totalDone = doneRows.length;

    function provCell(r) {
      return r._done
        ? `<span style="font-size:12px;color:var(--gray)">${escAttr(r.proveedor||'—')}</span>`
        : provDropdown(r.id);
    }
    function renderTable(rows, showOrigen) {
      return `<table style="width:100%;border-collapse:collapse;"><thead><tr style="border-bottom:1.5px solid var(--black)"><th style="padding:6px 10px;text-align:left">Insumo</th><th style="padding:6px 10px;text-align:left">Cantidad</th><th style="padding:6px 10px;text-align:left">Proveedor</th>${showOrigen?`<th style="padding:6px 10px;text-align:left">Origen</th>`:''}<th style="padding:6px 10px;text-align:left">Prioridad</th><th style="padding:6px 10px;text-align:left">Aclaración</th><th style="padding:6px 10px;text-align:center">Comprado</th></tr></thead><tbody>${rows.map(r => { const done = r._done; return `<tr style="background:${done?'#f0faf7':prioBg2[r.prioridad||'']||'transparent'};opacity:${done?'0.55':'1'}"><td style="padding:8px 10px;${done?'text-decoration:line-through':''}">${r.name}</td><td style="padding:8px 10px">${r.qty||'—'}</td><td style="padding:8px 10px">${provCell(r)}</td>${showOrigen?`<td style="padding:8px 10px;font-size:12px;color:var(--gray)">${r.icon||''} ${r.grupo}</td>`:''}<td style="padding:8px 10px">${r.prioridad?`<span style="background:${prioBg2[r.prioridad]||''};color:${prioColors[r.prioridad]?.dot||'#666'};padding:2px 9px;border-radius:20px">${prioLabel[r.prioridad]||''}</span>`:''}</td><td style="padding:8px 10px">${r.nota||''}</td><td style="padding:8px 10px;text-align:center"><button onclick="toggleComprado('${r._scope}','${r.id}')" style="width:32px;height:32px;border-radius:6px;cursor:pointer;font-size:16px;display:inline-flex;align-items:center;justify-content:center;transition:all .15s;${done?'background:var(--turq);border:2px solid var(--turq-dark);color:white':'background:white;border:2px solid var(--gray-light);color:transparent'}">✓</button></td></tr>`; }).join('')}</tbody></table>`;
    }
    function ordenarPendDone(rows){
      const pend = rows.filter(r=>!r._done).sort((a,b)=>(prioOrder[a.prioridad||'']??3)-(prioOrder[b.prioridad||'']??3));
      const done = rows.filter(r=>r._done);
      return [...pend, ...done];
    }
    const ordenBtns = [['local','🏪 Por local/área'],['proveedor','🚚 Por proveedor'],['prioridad','⚡ Por prioridad']];
    const ordenBar = `<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px">${ordenBtns.map(([k,l])=>`<button class="btn ${orden===k?'btn-primary':'btn-ghost'} btn-sm" onclick="setResumenOrden('${k}')">${l}</button>`).join('')}</div>`;
    const statsBar = `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><div style="font-size:13px;color:var(--gray)"><span style="color:var(--terra);font-weight:600">${totalPend} pendientes</span> · <span style="color:var(--turq-dark);font-weight:600">${totalDone} comprados</span></div><button onclick="window.printResumenInsumos()" style="background:var(--black);border:none;color:var(--cream);border-radius:8px;padding:9px 20px;cursor:pointer;font-size:13px;font-family:'Plus Jakarta Sans',sans-serif">🖨 Imprimir listado</button></div>`;
    let body;
    if (totalPend + totalDone === 0) {
      body = `<div class="empty-state">No hay insumos pedidos aún.</div>`;
    } else if (orden === 'proveedor') {
      const provs = [...new Set(allRows.map(r=>r.proveedor||''))].sort((a,b)=>(a||'zzz').localeCompare(b||'zzz','es'));
      body = provs.map(prov => {
        const rows = ordenarPendDone(allRows.filter(r=>(r.proveedor||'')===prov));
        if(!rows.length) return '';
        const pendN = rows.filter(r=>!r._done).length; const doneN = rows.filter(r=>r._done).length;
        const titulo = prov ? `🚚 ${prov}` : '❓ Sin proveedor asignado';
        return `<div class="section-block"><div class="section-header"><div class="section-title">${titulo} <span class="badge badge-open">${pendN} pendientes</span>${doneN?`<span class="badge" style="background:var(--turq-pale);color:var(--turq-dark);margin-left:4px">${doneN} comprados</span>`:''}</div></div>${renderTable(rows, true)}</div>`;
      }).join('');
    } else if (orden === 'prioridad') {
      body = `<div class="section-block">${renderTable(ordenarPendDone(allRows), true)}</div>`;
    } else {
      const allGrupos = [...new Set([...pendRows.map(r=>r.grupo), ...doneRows.map(r=>r.grupo)])];
      body = allGrupos.map(grupo => {
        const rows = ordenarPendDone(allRows.filter(r=>r.grupo===grupo));
        if(!rows.length) return '';
        const pend = rows.filter(r=>!r._done); const done = rows.filter(r=>r._done);
        const icon = (rows[0])?.icon||'';
        return `<div class="section-block"><div class="section-header"><div class="section-title">${icon} ${grupo} <span class="badge badge-open">${pend.length} pendientes</span>${done.length?`<span class="badge" style="background:var(--turq-pale);color:var(--turq-dark);margin-left:4px">${done.length} comprados</span>`:''}</div></div>${renderTable(rows, false)}</div>`;
      }).join('');
    }
    return topBar + statsBar + ordenBar + body + `<div style="text-align:center;margin-top:8px"><button class="btn btn-ghost" onclick="setInsumosView('detalle')">← Volver al detalle</button></div>`;
  }
  if (sector === 'verduleria') {
    const todayData = getMergedInsumos();
    const rows = [];
    AREAS.forEach(area => {
      const scope = `prod_${area.key}`;
      const pedidos = todayData[scope] || {};
      const allItems = [...(INSUMOS_PRODUCCION[area.key] || []), ...(state.prodCustomInsumos[area.key] || [])];
      allItems.filter(p => p.prov === 'Verdulería').forEach(p => { const item = pedidos[p.id]; if (item?.qty) rows.push({ name: p.name, qty: item.qty, nota: item.nota || '', sector: area.label, icon: area.icon }); });
    });
    LOCALES.filter(l => !l.toLowerCase().includes('sla')).forEach(local => {
      const scope = `ventas_${local.replace(/[ ./]/g,'_')}`;
      const pedidos = todayData[scope] || {};
      INSUMOS_VENTAS.filter(p => p.prov === 'Verdulería').forEach(p => { const item = pedidos[p.id]; if (item?.qty) rows.push({ name: p.name, qty: item.qty, nota: item.nota || '', sector: local, icon: '🏪' }); });
    });
    const grouped = {};
    rows.forEach(r => { if (!grouped[r.name]) grouped[r.name] = { name: r.name, sectores: [], notas: [] }; grouped[r.name].sectores.push(`${r.icon} ${r.sector}${r.qty ? ': ' + r.qty : ''}`); if (r.nota) grouped[r.name].notas.push(r.nota); });
    const items = Object.values(grouped);
    if (items.length === 0) return topBar + `<div class="empty-state">No hay insumos de verdulería pedidos hoy.</div>`;
    return topBar + `<div class="section-block"><div class="section-header"><div class="section-title">🥦 Consolidado de verdulería · ${fecha}</div><button class="btn btn-ghost btn-sm" onclick="printVerduleria()">🖨 Imprimir pedido</button></div><div class="alert-box alert-turq">Lista consolidada de <strong>Producción + San Luis</strong>. Se genera automáticamente.</div><table style="width:100%"><thead><tr style="background:var(--black);color:var(--cream)"><th style="padding:10px">Producto</th><th style="padding:10px">Pedido desde</th><th style="padding:10px">Aclaración</th></tr></thead><tbody>${items.map((item,i) => `<tr style="background:${i%2===0?'var(--white)':'var(--cream)'}"><td style="padding:10px">${item.name}</td><td style="padding:10px">${item.sectores.join(' · ')}</td><td style="padding:10px">${item.notas.join(', ')}</td></tr>`).join('')}</tbody></table></div>`;
  }
  // "Hace el pedido" — áreas de producción + locales SLA y San Luis en un solo selector
  const localTabs = LOCALES.map(l => ({key:`ventas_${l.replace(/[ ./]/g,'_')}`, label:l, icon:'🛒', isLocal:true}));
  const allTabs = [...AREAS.map(a=>({key:a.key, label:a.label, icon:a.icon, isLocal:false})), ...localTabs];
  const activeTabKey = state.insumosAreaTab;
  const isLocalTab = activeTabKey.startsWith('ventas_');
  const tabSelector = `<div class="area-selector" style="grid-template-columns:repeat(4,1fr);margin-bottom:20px">${allTabs.map(t => `<div class="area-card ${activeTabKey===t.key?'active':''}" onclick="setInsumosAreaTab('${t.key}')"><div class="area-card-icon">${t.icon}</div><div class="area-card-name">${t.label}</div></div>`).join('')}</div>`;
  if (isLocalTab) {
    const local = LOCALES.find(l => `ventas_${l.replace(/[ ./]/g,'_')}` === activeTabKey) || '';
    const localKey = local.replace(/[ ./]/g,'_');
    const scope = `ventas_${localKey}`;
    const pedidos = getMergedInsumos()[scope] || {};
    const conPedido = Object.keys(pedidos).filter(id => pedidos[id]?.qty).length;
    const cats = [...new Set(INSUMOS_VENTAS.map(i => i.cat))];
    const customItems = state.ventasCustomInsumos[localKey] || [];
    const allCats = [...new Set([...cats, ...customItems.map(i=>i.cat)])];
    return topBar + tabSelector + `<div class="section-block"><div class="section-header"><div class="section-title">🛒 ${local} <span class="badge badge-open">${conPedido} pedidos</span></div><div><div style="display:flex;gap:6px;font-size:11px"><span>🟢 OK</span><span>🟡 Bajo</span><span>🔴 Urgente</span></div><button class="btn btn-ghost btn-sm" onclick="openAddVentasInsumo('${localKey}')">+ Agregar insumo</button></div></div><div id="ventas-custom-form-${localKey}" style="display:none;background:var(--cream);padding:14px;margin-bottom:14px"><div>Nuevo insumo para ${local}</div><div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap"><input id="vcustom-name-${localKey}" placeholder="Nombre" style="flex:2"><select id="vcustom-cat-${localKey}" style="flex:1">${allCats.map(c=>`<option value="${c}">${c}</option>`).join('')}<option value="__nueva__">+ Nueva categoría...</option></select><div id="vcustom-newcat-wrap-${localKey}" style="display:none"><input id="vcustom-newcat-${localKey}" placeholder="Nueva categoría"></div><button class="btn btn-primary btn-sm" onclick="addVentasCustomInsumo('${localKey}')">Agregar</button><button class="btn btn-ghost btn-sm" onclick="closeAddVentasInsumo('${localKey}')">Cancelar</button></div></div><div class="insumo-header-row"><div></div><div>Insumo</div><div>Cantidad</div><div>Prioridad</div><div>Aclaración</div></div>${allCats.map(cat => { const baseItems = INSUMOS_VENTAS.filter(i => i.cat === cat); const custItems = customItems.filter(i => i.cat === cat); const catItems = [...baseItems, ...custItems]; return `<div class="insumo-cat-title"><span>${cat}</span>${custItems.length ? `<span style="font-size:10px">+${custItems.length} personalizados</span>` : ''}</div>${catItems.map(p => renderItem(p.id, p.name, scope)).join('')}`; }).join('')}</div>`;
  } else {
    const areaKey = activeTabKey;
    const area = AREAS.find(a => a.key === areaKey);
    const baseItems = INSUMOS_PRODUCCION[areaKey] || [];
    const customItems = state.prodCustomInsumos[areaKey] || [];
    const scope = `prod_${areaKey}`;
    const pedidos = getMergedInsumos()[scope] || {};
    const conPedido = Object.keys(pedidos).filter(id => pedidos[id]?.qty).length;
    const hasCats = baseItems.some(p => p.cat);
    const itemsHtml = hasCats
      ? (() => { const cats = [...new Set(baseItems.map(p=>p.cat).filter(Boolean))]; return cats.map(cat => { const catItems = baseItems.filter(p=>p.cat===cat); return `<div class="insumo-cat-title"><span>${cat}</span></div>${catItems.map(p=>renderItem(p.id,p.name,scope)).join('')}`; }).join(''); })()
      : baseItems.map(p => renderItem(p.id, p.name, scope)).join('');
    return topBar + tabSelector + `<div class="section-block"><div class="section-header"><div class="section-title">${area.icon} ${area.label} <span class="badge badge-open">${conPedido} pedidos</span></div><div><div style="display:flex;gap:6px;font-size:11px"><span>🟢 OK</span><span>🟡 Bajo</span><span>🔴 Urgente</span></div><button class="btn btn-ghost btn-sm" onclick="openAddProdInsumo('${areaKey}')">+ Agregar insumo</button></div></div><div id="prod-custom-form-${areaKey}" style="display:none;background:var(--cream);padding:14px;margin-bottom:14px"><div>Nuevo insumo — ${area.label}</div><div style="display:flex;gap:8px;margin-top:8px"><input id="pcustom-name-${areaKey}" placeholder="Nombre" style="flex:1;padding:6px"><button class="btn btn-primary btn-sm" onclick="addProdCustomInsumo('${areaKey}')">Agregar</button><button class="btn btn-ghost btn-sm" onclick="closeAddProdInsumo('${areaKey}')">Cancelar</button></div></div><div class="insumo-header-row"><div></div><div>Insumo</div><div>Cantidad</div><div>Prioridad</div><div>Aclaración</div></div>${itemsHtml}${customItems.length ? `<div style="font-size:10px;padding:8px 10px 2px">Agregados manualmente</div>` : ''}${customItems.map(p => renderItem(p.id, p.name, scope, `deleteProdCustomInsumo('${areaKey}','${p.id}')`)).join('')}</div>`;
  }
}

function renderHistorial() {
  const selectedDate = state.historialDate || todayKey();
  const type = state.historialType || 'productos';
  return `
    <div class="page-title">Historial</div>
    <div class="page-sub">Consultá pedidos e insumos por fecha</div>
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap">
      <input type="date" class="form-input" style="max-width:200px" value="${selectedDate}"
        onchange="setHistorialDate(this.value)" max="${todayKey()}">
      <span style="font-size:13px;color:var(--gray)">${new Date(selectedDate + 'T12:00:00').toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</span>
    </div>
    <div style="display:flex;gap:8px;margin-bottom:24px">
      <button class="btn ${type==='productos'?'btn-primary':'btn-ghost'}" onclick="setHistorialType('productos')">📦 Pedidos de producción</button>
      <button class="btn ${type==='insumos'?'btn-primary':'btn-ghost'}" onclick="setHistorialType('insumos')">🛒 Insumos pedidos</button>
    </div>
    ${type === 'productos' ? renderHistorialFecha(selectedDate) : renderHistorialInsumosFecha(selectedDate)}
  `;
}

function renderHistorialInsumosFecha(dateKey) {
  const data = state.historialInsumos[dateKey];
  if (!data) return `<div class="empty-state">Cargando datos de insumos...</div>`;
  const scopes = Object.keys(data);
  if (scopes.length === 0) return `<div class="empty-state">No hay insumos registrados para esta fecha.</div>`;

  // Map scope key → display label
  function scopeLabel(scope) {
    if (scope.startsWith('prod_')) {
      const ak = scope.replace('prod_', '');
      const a = AREAS.find(a => a.key === ak);
      return a ? `${a.icon} ${a.label}` : scope;
    }
    if (scope.startsWith('ventas_')) {
      const lk = scope.replace('ventas_', '');
      const l = LOCALES.find(l => l.replace(/[ ./]/g,'_') === lk);
      return l ? `🛒 ${l}` : scope;
    }
    return scope;
  }

  // Build name lookup
  function findName(scope, id) {
    if (scope.startsWith('prod_')) {
      const ak = scope.replace('prod_','');
      const found = (INSUMOS_PRODUCCION[ak]||[]).find(p=>p.id===id);
      if (found) return found.name;
    }
    const found = INSUMOS_VENTAS.find(p=>p.id===id);
    return found ? found.name : id;
  }

  const prioLabel = {verde:'Stock OK', amarillo:'Stock bajo', rojo:'Urgente'};
  const prioBg = {verde:'#e8f8f0', amarillo:'#fffbe6', rojo:'#fdecea'};
  const prioColor = {verde:'#27ae60', amarillo:'#f0a500', rojo:'#c0392b'};

  let html = '';
  scopes.forEach(scope => {
    const items = Object.entries(data[scope] || {}).filter(([,v]) => v && (v.qty || v.prioridad || v.nota));
    if (items.length === 0) return;
    html += `<div class="section-block" style="margin-bottom:16px">
      <div style="font-size:15px;font-weight:600;margin-bottom:14px">${scopeLabel(scope)} <span class="badge badge-open">${items.length} insumos</span></div>
      <table style="width:100%;border-collapse:collapse;font-size:13px">
        <thead><tr style="border-bottom:1.5px solid var(--cream-dark)">
          <th style="padding:7px 10px;text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--gray)">Insumo</th>
          <th style="padding:7px 10px;text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--gray)">Cantidad</th>
          <th style="padding:7px 10px;text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--gray)">Prioridad</th>
          <th style="padding:7px 10px;text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--gray)">Aclaración</th>
        </tr></thead>
        <tbody>${items.map(([id,v]) => {
          const name = findName(scope, id);
          const prio = v.prioridad || '';
          return `<tr style="border-bottom:1px solid var(--cream-mid)">
            <td style="padding:8px 10px">${name}</td>
