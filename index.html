<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Candela Café & Patisserie — Producción (definitivo)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=DM+Serif+Display&display=swap" rel="stylesheet">
  <style>
    /* ========== ESTILOS COMPLETOS (igual que antes) ========== */
    *{box-sizing:border-box;margin:0;padding:0;}
    :root{
      --cream:#EEEBD7;
      --cream-dark:#dedad8;
      --cream-mid:#e5e1cc;
      --black:#22201F;
      --black-soft:#3a3836;
      --terra:#E15D46;
      --terra-light:#ea7a65;
      --terra-pale:#f9ddd8;
      --turq:#9BD6CC;
      --turq-dark:#6bbfb4;
      --turq-pale:#d8f0ed;
      --gray:#9a9888;
      --gray-light:#ccc9b5;
      --white:#ffffff;
    }
    body{
      font-family:'DM Sans',sans-serif;
      background:var(--cream);
      color:var(--black);
      min-height:100vh;
      font-weight:300;
      font-size:14px;
    }
    .header{
      background:var(--black);
      padding:0 28px;
      display:flex;align-items:center;justify-content:space-between;
      position:sticky;top:0;z-index:200;height:72px;
      border-bottom:1px solid #3a3836;
    }
    .logo{
      font-family:'DM Serif Display',serif;
      font-size:18px;color:var(--cream);letter-spacing:.5px;
      display:flex;align-items:baseline;gap:6px;
    }
    .logo-sub{
      font-family:'DM Sans',sans-serif;
      font-size:11px;color:var(--gray);font-weight:300;
      letter-spacing:1.5px;text-transform:uppercase;
    }
    .nav{display:flex;gap:6px;align-items:center;}
    .nav-btn{
      padding:12px 22px;border:none;background:transparent;
      color:var(--gray);cursor:pointer;font-size:15px;
      font-family:'DM Sans',sans-serif;font-weight:300;
      border-radius:7px;transition:all .15s;letter-spacing:.3px;
      position:relative;
    }
    .nav-btn:hover{color:var(--cream);background:rgba(255,255,255,.08);}
    .nav-btn.active{color:#fff;background:var(--terra);font-weight:400;}
    .nav-btn .nav-alert{
      position:absolute;top:8px;right:8px;
      width:9px;height:9px;border-radius:50%;
      background:var(--turq);border:2px solid var(--black);
      animation:blink 1.2s ease-in-out infinite;
    }
    .main{padding:32px;max-width:1140px;margin:0 auto;width:100%;}
    .page-title{
      font-family:'DM Serif Display',serif;
      font-size:26px;font-weight:400;color:var(--black);
      margin-bottom:4px;letter-spacing:.3px;
    }
    .page-sub{color:var(--gray);font-size:13px;margin-bottom:28px;font-weight:300;}
    .tabs{display:flex;border-bottom:1.5px solid var(--black);margin-bottom:28px;}
    .tab{
      padding:14px 36px;cursor:pointer;font-size:16px;color:var(--gray);
      border:none;background:none;font-family:'DM Sans',sans-serif;font-weight:300;
      border-bottom:3px solid transparent;margin-bottom:-1.5px;
      letter-spacing:.4px;transition:all .15s;
    }
    .tab:hover{color:var(--black);}
    .tab.active{color:var(--terra);border-bottom-color:var(--terra);font-weight:500;}
    .section-block{
      background:var(--white);border:1px solid var(--cream-dark);
      border-radius:10px;padding:22px 24px;margin-bottom:16px;
    }
    .section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
    .section-title{font-size:14px;font-weight:400;color:var(--black);display:flex;align-items:center;gap:8px;}
    .badge{font-size:11px;padding:2px 9px;border-radius:20px;font-weight:400;letter-spacing:.3px;}
    .stock-area-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px;}
    .stock-area-tab{padding:8px 18px;border-radius:8px;border:1.5px solid var(--cream-dark);background:var(--white);cursor:pointer;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:300;color:var(--gray);transition:all .15s;}
    .stock-area-tab:hover{border-color:var(--black);color:var(--black);}
    .stock-area-tab.active{background:var(--black);color:var(--cream);border-color:var(--black);font-weight:400;}
    .stock-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;}
    .stock-item{background:var(--white);border:1.5px solid var(--cream-dark);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;transition:border-color .15s;}
    .stock-item:hover{border-color:var(--black);}
    .stock-item.stock-zero{border-color:#e57373;background:#fdecea;}
    .stock-item.stock-low{border-color:#f0c040;background:#fffbe6;}
    .stock-item-name{font-size:13px;font-weight:400;color:var(--black);line-height:1.3;}
    .stock-item-controls{display:flex;align-items:center;gap:8px;}
    .stock-btn{width:32px;height:32px;border-radius:6px;border:1.5px solid var(--cream-dark);background:var(--white);cursor:pointer;font-size:18px;font-weight:300;display:flex;align-items:center;justify-content:center;transition:all .12s;color:var(--black);line-height:1;flex-shrink:0;}
    .stock-btn:hover{background:var(--black);color:var(--cream);border-color:var(--black);}
    .stock-qty-input{width:70px;height:32px;border-radius:6px;border:1.5px solid var(--cream-dark);background:var(--white);font-family:'DM Sans',sans-serif;font-size:15px;font-weight:400;text-align:center;color:var(--black);outline:none;padding:0 6px;-moz-appearance:textfield;}
    .stock-qty-input::-webkit-outer-spin-button,.stock-qty-input::-webkit-inner-spin-button{-webkit-appearance:none;}
    .stock-qty-input:focus{border-color:var(--black);}
    .stock-unit{font-size:11px;color:var(--gray);font-weight:300;}
    .stock-status-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
    .stock-item-footer{display:flex;align-items:center;justify-content:space-between;}
    .stock-last-update{font-size:10px;color:var(--gray);font-weight:300;}
    .stock-alert-badge{font-size:10px;padding:2px 7px;border-radius:10px;font-weight:400;}
    .stock-alert-zero{background:#fdecea;color:#c0392b;}
    .stock-alert-low{background:#fffbe6;color:#b8860b;}
    .stock-alert-ok{background:#e8f8f0;color:#27ae60;}
    .stock-header-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
    .stock-summary-bar{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px;}
    .stock-summary-card{background:var(--white);border:1px solid var(--cream-dark);border-radius:10px;padding:16px 18px;}
    .stock-summary-label{font-size:11px;color:var(--gray);text-transform:uppercase;letter-spacing:.8px;margin-bottom:4px;}
    .stock-summary-value{font-size:22px;font-weight:400;color:var(--black);}
    .stock-summary-sub{font-size:11px;color:var(--gray);margin-top:2px;}
    .stock-filter-bar{display:flex;gap:8px;align-items:center;margin-bottom:20px;flex-wrap:wrap;}
    .stock-filter-btn{padding:6px 14px;border-radius:20px;border:1.5px solid var(--cream-dark);background:var(--white);cursor:pointer;font-size:12px;font-weight:300;font-family:'DM Sans',sans-serif;color:var(--gray);transition:all .12s;}
    .stock-filter-btn.active{background:var(--black);color:var(--cream);border-color:var(--black);}
    .stock-history{font-size:11px;color:var(--gray);border-top:1px solid var(--cream-dark);padding-top:8px;margin-top:4px;}
    .stock-history-item{display:flex;justify-content:space-between;padding:2px 0;}
    .stock-history-delta{font-weight:500;}
    .stock-history-delta.pos{color:#27ae60;}
    .stock-history-delta.neg{color:#c0392b;}
    .badge-open{background:var(--turq-pale);color:var(--turq-dark);}
    .badge-closed{background:#f5ddd8;color:#b83a25;}
    .badge-warn{background:#fef0ee;color:var(--terra);border:1px solid var(--terra-pale);}
    .deadline-txt{font-size:12px;color:var(--gray);}
    .product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:7px;}
    .product-row{
      display:flex;align-items:center;gap:8px;padding:8px 10px;
      background:var(--cream);border-radius:6px;border:1px solid var(--cream-mid);
      transition:border-color .15s;
    }
    .product-row:hover{border-color:var(--gray-light);}
    .product-name{flex:1;font-size:12.5px;color:var(--black);font-weight:300;}
    .qty-input{
      width:66px;padding:4px 8px;background:var(--white);
      border:1px solid var(--cream-dark);border-radius:4px;
      color:var(--black);font-size:13px;text-align:center;outline:none;
      font-family:'DM Sans',sans-serif;transition:border-color .15s;
    }
    .qty-input:focus{border-color:var(--terra);}
    .qty-input:disabled{opacity:.4;cursor:not-allowed;}
    .qty-input.saving { border-color: var(--terra); background: #fef5f3; }
    .qty-input.saved  { border-color: var(--turq-dark); background: var(--turq-pale); transition: all 1.5s; }
    .unit-label{font-size:11px;color:var(--gray);width:24px;text-align:left;}
    .btn{
      padding:8px 18px;border-radius:6px;border:none;cursor:pointer;
      font-size:13px;font-family:'DM Sans',sans-serif;font-weight:400;
      transition:all .15s;letter-spacing:.3px;
    }
    .btn-primary{background:var(--terra);color:#fff;}
    .btn-primary:hover{background:var(--terra-light);}
    .btn-sm{padding:5px 13px;font-size:12px;}
    .btn-ghost{background:transparent;border:1px solid var(--cream-dark);color:var(--gray);}
    .btn-ghost:hover{border-color:var(--black);color:var(--black);}
    .btn-danger{background:#f5ddd8;color:#b83a25;border:1px solid var(--terra-pale);}
    .btn-danger:hover{background:var(--terra);color:#fff;}
    .alert-box{
      padding:11px 16px;border-radius:7px;margin-bottom:16px;
      font-size:13px;display:flex;align-items:center;gap:10px;font-weight:300;
    }
    .alert-warn{background:#fef0ee;border:1px solid var(--terra-pale);color:var(--terra);}
    .alert-turq{background:var(--turq-pale);border:1px solid var(--turq);color:var(--turq-dark);}
    .pulse{
      display:inline-block;width:7px;height:7px;border-radius:50%;
      background:var(--terra);flex-shrink:0;
      animation:blink 1.2s ease-in-out infinite;
    }
    @keyframes blink{0%,100%{opacity:1;}50%{opacity:.2;}}
    .area-selector{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:24px;}
    .area-card{
      padding:18px 14px;border-radius:10px;border:1.5px solid var(--cream-dark);
      background:var(--white);cursor:pointer;text-align:center;transition:all .15s;
    }
    .area-card:hover{border-color:var(--turq);background:var(--turq-pale);}
    .area-card.active{border-color:var(--terra);background:#fef5f3;}
    .area-card-icon{font-size:26px;margin-bottom:6px;}
    .area-card-name{font-size:13px;color:var(--black);margin-bottom:5px;font-weight:400;}
    .summary-bar{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px;}
    .summary-card{background:var(--cream);border-radius:8px;padding:14px 16px;border:1px solid var(--cream-mid);}
    .summary-label{font-size:10px;color:var(--gray);margin-bottom:4px;text-transform:uppercase;letter-spacing:.8px;}
    .summary-value{font-size:19px;color:var(--black);font-weight:400;}
    .summary-sub{font-size:11px;color:var(--gray);margin-top:2px;}
    .prod-view-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px;}
    .prod-item{
      display:flex;align-items:center;justify-content:space-between;
      padding:14px 18px;background:var(--white);border-radius:8px;
      border:1px solid var(--cream-dark);transition:border-color .2s;
    }
    .prod-item.updated{border-color:var(--terra);background:#fef5f3;animation:pulse-b 2s ease-in-out 4;}
    @keyframes pulse-b{0%,100%{border-color:var(--terra);}50%{border-color:var(--terra-light);}}
    .prod-item-name{font-size:14px;color:var(--black);font-weight:300;}
    .prod-item-qty{font-size:28px;font-weight:400;color:var(--terra);min-width:60px;text-align:right;line-height:1;}
    .prod-item-unit{font-size:11px;color:var(--gray);text-align:right;margin-top:2px;}
    .envio-table{
      width:100%;border-collapse:collapse;font-size:13px;
      background:var(--white);border:1px solid var(--cream-dark);
      border-top:none;border-radius:0 0 8px 8px;overflow:hidden;
    }
    .envio-table th{
      text-align:left;padding:9px 16px;color:var(--gray);
      border-bottom:1px solid var(--cream-dark);font-weight:400;
      font-size:10px;text-transform:uppercase;letter-spacing:.6px;background:var(--cream);
    }
    .envio-table td{padding:9px 16px;border-bottom:1px solid var(--cream-mid);color:var(--black);font-weight:300;}
    .envio-table tr:last-child td{border-bottom:none;}
    .qty-h{font-weight:500;color:var(--terra);}
    .envio-empty{
      background:var(--white);border:1px solid var(--cream-dark);border-top:none;
      border-radius:0 0 8px 8px;padding:28px;text-align:center;
      color:var(--gray);font-size:13px;
    }
    .login-wrap{display:flex;align-items:center;justify-content:center;min-height:75vh;}
    .login-card{
      background:var(--white);border:1px solid var(--cream-dark);
      border-radius:12px;padding:40px 36px;width:340px;
    }
    .login-title{font-family:'DM Serif Display',serif;font-size:22px;color:var(--black);margin-bottom:6px;}
    .login-sub{font-size:13px;color:var(--gray);margin-bottom:24px;font-weight:300;}
    .admin-form{display:flex;flex-direction:column;gap:12px;}
    .form-row{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;}
    .form-group{display:flex;flex-direction:column;gap:5px;flex:1;min-width:120px;}
    .form-label{font-size:10px;color:var(--gray);text-transform:uppercase;letter-spacing:.8px;}
    .form-input,.form-select{
      padding:8px 12px;background:var(--cream);border:1px solid var(--cream-dark);
      border-radius:6px;color:var(--black);font-size:13px;outline:none;width:100%;
      font-family:'DM Sans',sans-serif;font-weight:300;transition:border-color .15s;
    }
    .form-input:focus,.form-select:focus{border-color:var(--terra);}
    .product-list-admin{display:flex;flex-direction:column;gap:4px;max-height:440px;overflow-y:auto;}
    .admin-product-row{
      display:flex;align-items:center;gap:10px;padding:8px 12px;
      background:var(--cream);border-radius:6px;border:1px solid var(--cream-mid);
    }
    .cat-tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:14px;}
    .cat-tab{
      padding:5px 14px;border-radius:20px;border:1px solid var(--cream-dark);
      background:var(--cream);color:var(--gray);cursor:pointer;
      font-size:12px;font-family:'DM Sans',sans-serif;transition:all .15s;
    }
    .cat-tab:hover{border-color:var(--terra);color:var(--terra);}
    .cat-tab.active{background:var(--terra);border-color:var(--terra);color:#fff;}
    .toggle{
      width:36px;height:20px;border-radius:10px;background:var(--cream-dark);
      position:relative;cursor:pointer;transition:background .2s;flex-shrink:0;border:none;
    }
    .toggle.on{background:var(--turq);}
    .toggle::after{
      content:'';position:absolute;top:3px;left:3px;width:14px;height:14px;
      border-radius:50%;background:#fff;transition:transform .2s;
      box-shadow:0 1px 3px rgba(0,0,0,.2);
    }
    .toggle.on::after{transform:translateX(16px);}
    .status-dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:5px;}
    .dot-open{background:var(--turq-dark);}
    .dot-closed{background:#b83a25;}
    .loading{text-align:center;padding:60px 24px;color:var(--gray);font-size:13px;}
    .empty-state{text-align:center;padding:48px 24px;color:var(--gray);font-size:13px;}
    .spinner{
      width:28px;height:28px;border:2px solid var(--cream-dark);
      border-top-color:var(--terra);border-radius:50%;
      animation:spin .8s linear infinite;margin:0 auto 12px;
    }
    @keyframes spin{to{transform:rotate(360deg);}}
    #toast{
      position:fixed;bottom:24px;right:24px;
      background:var(--black);color:var(--cream);
      padding:12px 20px;border-radius:8px;font-size:13px;
      opacity:0;transform:translateY(8px);
      transition:all .25s;pointer-events:none;z-index:999;
    }
    #toast.show{opacity:1;transform:translateY(0);}
    #toast.success{border-left:3px solid var(--turq);}
    #toast.warn{border-left:3px solid var(--terra);}
    .insumo-header-row{
      display:grid;grid-template-columns:20px 1fr 110px 90px 1fr;
      gap:8px;padding:5px 10px;font-size:10px;color:var(--gray);
      text-transform:uppercase;letter-spacing:.7px;border-bottom:1px solid var(--cream-dark);
      margin-bottom:4px;
    }
    .insumo-row{
      display:grid;grid-template-columns:20px 1fr 110px 90px 1fr;
      gap:8px;align-items:center;padding:7px 10px;border-radius:6px;
      border:1px solid var(--cream-dark);margin-bottom:4px;transition:border-color .15s;
    }
    .insumo-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;transition:background .2s;}
    .insumo-name{font-size:13px;font-weight:300;color:var(--black);}
    .insumo-qty{
      padding:4px 8px;border:1px solid var(--cream-dark);border-radius:4px;
      font-size:13px;font-family:'DM Sans',sans-serif;outline:none;
      background:var(--white);width:100%;transition:border-color .15s;
    }
    .insumo-qty:focus{border-color:var(--terra);}
    .insumo-nota{
      padding:4px 8px;border:1px solid var(--cream-dark);border-radius:4px;
      font-size:12px;font-family:'DM Sans',sans-serif;outline:none;color:var(--gray);
      background:var(--white);width:100%;transition:border-color .15s;
    }
    .insumo-nota:focus{border-color:var(--terra);}
    .insumo-prio-btns{display:flex;gap:5px;align-items:center;}
    .prio-btn{
      width:22px;height:22px;border-radius:50%;border:2px solid transparent;
      cursor:pointer;transition:all .15s;opacity:.35;
    }
    .prio-btn.prio-verde{background:#27ae60;}
    .prio-btn.prio-amarillo{background:#f0a500;}
    .prio-btn.prio-rojo{background:#c0392b;}
    .prio-btn.active{opacity:1;border-color:var(--white);box-shadow:0 0 0 2px currentColor;}
    .insumo-cat-title{
      font-size:11px;font-weight:500;letter-spacing:1px;text-transform:uppercase;
      color:var(--gray);padding:10px 0 4px;border-bottom:1px solid var(--cream-mid);
      margin-bottom:6px;margin-top:10px;
    }
    @media(max-width:700px){
      .area-selector{grid-template-columns:repeat(2,1fr);}
      .main{padding:16px;}
      .nav-btn{padding:6px 10px;font-size:11px;}
      .insumo-header-row,.insumo-row{grid-template-columns:16px 1fr 80px 70px;}
      .insumo-nota{display:none;}
    }
  </style>
</head>

// ====================== HELPERS ======================
function todayKey() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function yesterdayKey() {
  const d = new Date(); d.setDate(d.getDate()-1);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function getMergedInsumos() {
  const yesterday = state.insumosPedidos?.[yesterdayKey()] || {};
  const today     = state.insumosPedidos?.[todayKey()]     || {};
  const merged = {};
  const allScopes = new Set([...Object.keys(yesterday), ...Object.keys(today)]);
  allScopes.forEach(scope => {
    merged[scope] = {};
    const yScope = yesterday[scope] || {};
    const tScope = today[scope]     || {};
    const allIds = new Set([...Object.keys(yScope), ...Object.keys(tScope)]);
    allIds.forEach(id => {
      const yItem = yScope[id];
      const tItem = tScope[id];
      if (yItem && tItem) merged[scope][id] = (tItem.ts || 0) >= (yItem.ts || 0) ? tItem : yItem;
      else merged[scope][id] = tItem || yItem;
    });
  });
  return merged;
}
function isClosed(areaKey) {
  const area = AREAS.find(a=>a.key===areaKey);
  if(!area) return false;
  const now=new Date(), [h,m]=area.deadline.split(':').map(Number);
  const dl=new Date(now); dl.setHours(h,m,0,0);
  return now>dl;
}
function fmtQty(n){ return n%1===0?n:parseFloat(n.toFixed(2)); }
function getQty(local,area,pid){
  const todayVal = state.pedidos?.[todayKey()]?.[fbKey(local)]?.[area]?.[pid];
  if(todayVal!==undefined && todayVal!==null) return todayVal;
  return state.pedidos?.[yesterdayKey()]?.[fbKey(local)]?.[area]?.[pid] || '';
}
function showToast(msg,type='success'){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.className=`show ${type}`;
  setTimeout(()=>t.className='',3000);
}
function safeRender(){
  const active=document.activeElement;
  if(active && active.classList.contains('qty-input')) return;
  render();
}

// ====================== FIREBASE SAVE DEFINITIVA ======================
async function saveQty(local, area, pid, val) {
  const numVal = parseFloat(val);
  const path = `pedidos/${todayKey()}/${fbKey(local)}/${area}/${pid}`;
  console.log(`💾 Guardando: ${path} = ${val} (num: ${numVal})`);

  // Lock granular: el listener onValue no pisará este path mientras esté guardando
  state.savingPaths.add(path);
  // Mark input as saving in DOM (if still mounted)
  const inputEl = document.querySelector(
    `.qty-input[data-local="${local}"][data-area="${area}"][data-pid="${pid}"]`
  );
  if (inputEl) { inputEl.classList.add('saving'); inputEl.classList.remove('saved'); }
  state.savingCount++;
  try {
    if (!val || isNaN(numVal) || numVal <= 0) {
      await remove(ref(db, path));
      console.log(`🗑 Eliminado: ${path}`);
    } else {
      await set(ref(db, path), numVal);
      console.log(`✅ Guardado: ${path} = ${numVal}`);
      if (isClosed(area)) {
        await set(ref(db, `alertas/${area}/${pid}`), { ts: Date.now(), local });
        state.updatedProducts[pid] = Date.now();
      }
    }
    // Pequeña pausa para asegurar que Firebase haya propagado el cambio
    await new Promise(resolve => setTimeout(resolve, 300));
    // Verificación remota: confirmar que el valor quedó bien en Firebase
    const snap = await get(ref(db, path));
    const remoteVal = snap.val();
    console.log(`🔁 Verificación remota: ${path} → ${remoteVal}`);
    // Actualizar estado local con el valor confirmado por Firebase
    if (!state.pedidos[todayKey()]) state.pedidos[todayKey()] = {};
    if (!state.pedidos[todayKey()][fbKey(local)]) state.pedidos[todayKey()][fbKey(local)] = {};
    if (!state.pedidos[todayKey()][fbKey(local)][area]) state.pedidos[todayKey()][fbKey(local)][area] = {};
    if (remoteVal !== undefined && remoteVal !== null && remoteVal > 0) {
      state.pedidos[todayKey()][fbKey(local)][area][pid] = remoteVal;
    } else {
      delete state.pedidos[todayKey()][fbKey(local)][area][pid];
    }
  } catch (error) {
    console.error(`❌ Error guardando en ${path}:`, error);
    showToast(`Error al guardar: ${error.message}`, 'warn');
  } finally {
    // Renderizar ANTES de liberar los locks para que el onValue
    // no sobrescriba el estado correcto antes del render final
    safeRender();
    const savedEl = document.querySelector(
      `.qty-input[data-local="${local}"][data-area="${area}"][data-pid="${pid}"]`
    );
    if (savedEl) {
      savedEl.classList.remove('saving');
      savedEl.classList.add('saved');
      setTimeout(() => savedEl?.classList.remove('saved'), 1500);
    }
    state.hasUnsavedChanges = false;
    state.savingPaths.delete(path);
    state.savingCount--;
  }
}

async function saveProductos(productos) { await set(ref(db, 'catalogo/productos'), productos); }
async function saveProductActive(productActive) { await set(ref(db, 'catalogo/activos'), productActive); }

// ====================== FIREBASE LISTENERS ======================
async function initFirebase() {
  const catSnap = await get(ref(db, 'catalogo'));
  if (!catSnap.exists()) {
    await set(ref(db, 'catalogo/productos'), PRODUCTOS_DEFAULT);
    const activos = {};
    Object.values(PRODUCTOS_DEFAULT).flat().forEach(p => { activos[p.id] = true; });
    await set(ref(db, 'catalogo/activos'), activos);
  }

  // Listener: merge inteligente que protege valores en vuelo
  onValue(ref(db, `pedidos/${todayKey()}`), snap => {
    const incoming = snap.val() || {};
    if (state.savingPaths.size === 0) {
      // Sin guardados en curso: reemplazar completo (maneja también eliminaciones)
      state.pedidos[todayKey()] = incoming;
    } else {
      // Hay guardados en curso: usar Firebase como base y superponer los valores bloqueados
      // Esto garantiza que eliminaciones remotas se reflejen, pero los valores en vuelo
      // no se pisen con snapshots que llegaron antes de que el write se propagara.
      const snapshot = JSON.parse(JSON.stringify(incoming));
      state.savingPaths.forEach(lockPath => {
        // lockPath: "pedidos/YYYY-MM-DD/localKey/area/pid"
        const parts = lockPath.split('/');
        if (parts.length === 5) {
          const [, , localKey, area, pid] = parts;
          const inFlightVal = state.pedidos[todayKey()]?.[localKey]?.[area]?.[pid];
          if (inFlightVal !== undefined && inFlightVal !== null) {
            if (!snapshot[localKey]) snapshot[localKey] = {};
            if (!snapshot[localKey][area]) snapshot[localKey][area] = {};
            snapshot[localKey][area][pid] = inFlightVal;
          }
        }
      });
      state.pedidos[todayKey()] = snapshot;
    }
    if (!state.loading) safeRender();
  });
  onValue(ref(db, `pedidos/${yesterdayKey()}`), snap => {
    state.pedidos[yesterdayKey()] = snap.val() || {};
    if (!state.loading) safeRender();
  });

  function toArr(val) {
    if (!val) return [];
    if (Array.isArray(val)) return val;
    return Object.values(val);
  }

  onValue(ref(db, 'catalogo/productos'), snap => {
    const fromDB = snap.val() || {};
    const merged = {};
    Object.keys(PRODUCTOS_DEFAULT).forEach(cat => {
      if (fromDB[cat]) merged[cat] = toArr(fromDB[cat]);
      else {
        merged[cat] = PRODUCTOS_DEFAULT[cat];
        set(ref(db, `catalogo/productos/${cat}`), PRODUCTOS_DEFAULT[cat]);
        const activos = {};
        PRODUCTOS_DEFAULT[cat].forEach(p => { activos[p.id] = true; });
        Object.assign(state.productActive, activos);
      }
    });
    state.productos = merged;
    if (!state.loading) safeRender();
  });

  onValue(ref(db, 'catalogo/activos'), snap => {
    state.productActive = snap.val() || {};
    if (!state.loading) safeRender();
  });

  onValue(ref(db, 'alertas'), snap => {
    const data = snap.val() || {};
    const now = Date.now();
    state.updatedProducts = {};
    Object.entries(data).forEach(([area, prods]) => {
      Object.entries(prods).forEach(([pid, info]) => {
        if (now - info.ts < 3600000) state.updatedProducts[pid] = info.ts;
      });
    });
    if (!state.loading) safeRender();
  });

  onValue(ref(db, `insumosPedidos/${todayKey()}`), snap => {
    state.insumosPedidos[todayKey()] = snap.val() || {};
    if (!state.loading) safeRender();
  });
  onValue(ref(db, `insumosPedidos/${yesterdayKey()}`), snap => {
    state.insumosPedidos[yesterdayKey()] = snap.val() || {};
    if (!state.loading) safeRender();
  });
  onValue(ref(db, 'ventasCustomInsumos'), snap => {
    state.ventasCustomInsumos = snap.val() || {};
    if (!state.loading) safeRender();
  });
  onValue(ref(db, 'prodCustomInsumos'), snap => {
    state.prodCustomInsumos = snap.val() || {};
    if (!state.loading) safeRender();
  });
  onValue(ref(db, 'stock'), snap => {
    state.stock = snap.val() || {};
    if (!state.loading) safeRender();
  });
  onValue(ref(db, 'stockHistory'), snap => {
    state.stockHistory = snap.val() || {};
    if (!state.loading) safeRender();
  });

  state.loading = false;
  render();
}

// ====================== LÓGICA DE NEGOCIO ======================
function getActivePedidoKey() {
  const todayData = state.pedidos?.[todayKey()];
  const hasDataToday = todayData && Object.values(todayData).some(localData =>
    localData && Object.values(localData).some(areaData =>
      areaData && Object.keys(areaData).length > 0
    )
  );
  return hasDataToday ? todayKey() : yesterdayKey();
}

function getConsolidated(area) {
  const r = {};
  const activeKey = getActivePedidoKey();
  LOCALES.forEach(local => {
    const pedidoArea = state.pedidos?.[activeKey]?.[fbKey(local)]?.[area] || {};
    Object.entries(pedidoArea).forEach(([pid, qty]) => {
      const q = Number(qty);
      if (q > 0) r[pid] = (r[pid] || 0) + q;
    });
  });
  return r;
}

function getEnvioPorLocal(local) {
  const r = [];
  const activeKey = getActivePedidoKey();
  AREAS.forEach(area => {
    const prodMap = {};
    (state.productos[area.key] || []).forEach(p => { prodMap[p.id] = p; });
    const pedidoArea = state.pedidos?.[activeKey]?.[fbKey(local)]?.[area.key] || {};
    Object.entries(pedidoArea).forEach(([pid, qty]) => {
      const q = Number(qty);
      if (q <= 0) return;
      if (state.productActive[pid] === false) return;
      const prod = prodMap[pid] || { id: pid, name: pid, unit: 'u' };
      r.push({...prod, qty: q, area: area.label, areaKey: area.key});
    });
  });
  return r;
}

function getUpdatedKeys() {
  const now = Date.now();
  return Object.entries(state.updatedProducts)
    .filter(([k, t]) => now - t < 3600000)
    .map(([k]) => k);
}

function renderStock() {
  const allProds = [];
  AREAS.forEach(area => {
    (state.productos[area.key] || []).filter(p => state.productActive[p.id] !== false).forEach(p => allProds.push({...p, areaKey: area.key, areaLabel: area.label, areaIcon: area.icon}));
  });
  const areaProds = allProds.filter(p => p.areaKey === state.stockAreaTab);
  let filtered = areaProds;
  if (state.stockFilter === 'zero') filtered = areaProds.filter(p => !(state.stock[p.id]?.qty > 0));
  else if (state.stockFilter === 'low') filtered = areaProds.filter(p => { const qty = state.stock[p.id]?.qty || 0; return qty > 0 && qty <= 5; });
  const totalProds = areaProds.length;
  const conStock = areaProds.filter(p => (state.stock[p.id]?.qty || 0) > 0).length;
  const sinStock = areaProds.filter(p => !(state.stock[p.id]?.qty > 0)).length;
  const stockBajo = areaProds.filter(p => { const q = state.stock[p.id]?.qty || 0; return q > 0 && q <= 5; }).length;
  function fmtTime(ts) {
    if (!ts) return '';
    const d = new Date(ts);
    const now = new Date();
    const diffMin = Math.round((now - d) / 60000);
    if (diffMin < 1) return 'hace un momento';
    if (diffMin < 60) return `hace ${diffMin} min`;
    const diffH = Math.round(diffMin / 60);
    if (diffH < 24) return `hace ${diffH}h`;
    return d.toLocaleDateString('es-AR', {day:'numeric',month:'short'});
  }
  function statusClass(qty) {
    if (!qty || qty <= 0) return 'stock-zero';
    if (qty <= 5) return 'stock-low';
    return '';
  }
  function dotColor(qty) {
    if (!qty || qty <= 0) return '#e57373';
    if (qty <= 5) return '#f0c040';
    return '#4caf87';
  }
  function alertBadge(qty, unit) {
    if (!qty || qty <= 0) return `<span class="stock-alert-badge stock-alert-zero">Sin stock</span>`;
    if (qty <= 5) return `<span class="stock-alert-badge stock-alert-low">Stock bajo</span>`;
    return `<span class="stock-alert-badge stock-alert-ok">${qty} ${unit}</span>`;
  }
  return `
    <div class="stock-header-row"><div><div class="page-title">Stock en Cuadra</div><div class="page-sub">Cantidad disponible en producción · ${new Date().toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'})}</div></div><button class="btn btn-ghost" onclick="window.printStock('${state.stockAreaTab}')">🖨 Imprimir</button></div>
    <div class="stock-summary-bar"><div class="stock-summary-card"><div class="stock-summary-label">Con stock</div><div class="stock-summary-value" style="color:#27ae60">${conStock}</div><div class="stock-summary-sub">de ${totalProds} productos</div></div><div class="stock-summary-card"><div class="stock-summary-label">Sin stock</div><div class="stock-summary-value" style="color:#e57373">${sinStock}</div><div class="stock-summary-sub">productos en 0</div></div><div class="stock-summary-card"><div class="stock-summary-label">Stock bajo</div><div class="stock-summary-value" style="color:#f0a500">${stockBajo}</div><div class="stock-summary-sub">≤ 5 unidades</div></div></div>
    <div class="stock-area-tabs">${AREAS.map(a => `<button class="stock-area-tab ${state.stockAreaTab===a.key?'active':''}" onclick="setStockAreaTab('${a.key}')">${a.icon} ${a.label}</button>`).join('')}</div>
    <div class="stock-filter-bar"><span style="font-size:12px;color:var(--gray);margin-right:4px">Filtrar:</span><button class="stock-filter-btn ${state.stockFilter==='all'?'active':''}" onclick="setStockFilter('all')">Todos</button><button class="stock-filter-btn ${state.stockFilter==='zero'?'active':''}" onclick="setStockFilter('zero')">Sin stock</button><button class="stock-filter-btn ${state.stockFilter==='low'?'active':''}" onclick="setStockFilter('low')">Stock bajo (≤5)</button><span style="margin-left:auto;font-size:12px;color:var(--gray)">${filtered.length} producto${filtered.length!==1?'s':''}</span></div>
    ${filtered.length===0 ? `<div class="empty-state">No hay productos que coincidan con el filtro.</div>` : `<div class="stock-grid">${filtered.map(p => { const sd = state.stock[p.id] || {}; const qty = sd.qty || 0; const hist = (state.stockHistory[p.id] || []).slice(-3).reverse(); return `<div class="stock-item ${statusClass(qty)}"><div style="display:flex;justify-content:space-between"><div class="stock-item-name">${p.name}</div><div class="stock-status-dot" style="background:${dotColor(qty)}"></div></div><div class="stock-item-controls"><button class="stock-btn" onclick="stockDecrement('${p.id}','${p.unit}')">−</button><input class="stock-qty-input" type="number" min="0" step="1" value="${qty}" data-pid="${p.id}" data-unit="${p.unit}" onblur="stockSetQty(this)" onkeydown="if(event.key==='Enter')this.blur()"><button class="stock-btn" onclick="stockIncrement('${p.id}','${p.unit}')">+</button><span class="stock-unit">${p.unit}</span></div><div class="stock-item-footer">${alertBadge(qty, p.unit)}<span class="stock-last-update">${sd.ts ? fmtTime(sd.ts) : 'Sin registrar'}</span></div>${hist.length ? `<div class="stock-history">${hist.map(h=>`<div class="stock-history-item"><span class="stock-history-delta ${h.delta>0?'pos':'neg'}">${h.delta>0?'+':''}${h.delta} ${p.unit}</span><span>${fmtTime(h.ts)}</span></div>`).join('')}</div>` : ''}</div>`; }).join('')}</div>`}`;
}

function renderInsumos() {

    if (fromToday && fromYesterday) return (fromToday.ts || 0) >= (fromYesterday.ts || 0) ? fromToday : fromYesterday;
    return fromToday || fromYesterday || null;
  }

    const item = getInsumo(scope, id);

      const scope = `prod_${area.key}`;

      const items = [...(INSUMOS_PRODUCCION[area.key] || []), ...customItems];
      items.forEach(p => { const item = pedidos[p.id]; if (item?.qty || item?.prioridad || item?.nota) allRows.push({...p, ...item, sector:'Producción', grupo: area.label, icon: area.icon, _scope: scope}); });
    });
    LOCALES.forEach(local => {
      const scope = `ventas_${local.replace(/[ ./]/g,'_')}`;
      const pedidos = todayData[scope] || {};
      const customKey = local.replace(/[ ./]/g,'_');
      const customItems = state.ventasCustomInsumos[customKey] || [];
      const allVentasItems = [...INSUMOS_VENTAS, ...customItems];
      allVentasItems.forEach(p => { const item = pedidos[p.id]; if (item?.qty || item?.prioridad || item?.nota) allRows.push({...p, ...item, sector:'Ventas', grupo: local, icon:'🛒', _scope: scope}); });
    });
    const prioOrder = {rojo:0, amarillo:1, verde:2, '':3};

function render() {
  const app = document.getElementById('app');
  if (state.loading) { app.innerHTML = `<div class="loading"><div class="spinner"></div>Conectando...</div>`; return; }
  let content = '';
  if (state.view === 'carga') content = renderCarga();
  else if (state.view === 'produccion') content = renderProduccion();
  else if (state.view === 'envio') content = renderEnvio();
  else if (state.view === 'stock') content = renderStock();
  else if (state.view === 'admin') content = renderAdmin();
  else if (state.view === 'insumos') content = renderInsumos();
  app.innerHTML = renderHeader() + `<div class="main">${content}</div>`;
  document.querySelectorAll('.btn-print-envio').forEach(btn => btn.addEventListener('click', () => window.printEnvio(btn.dataset.local)));
}

const _processingQty = new Set();
window.handleQtyChange = async function(el) {
  const { local, area, pid } = el.dataset;
  const key = `${local}|${area}|${pid}`;
  if (_processingQty.has(key)) return;          // evitar doble disparo por el.blur()
  _processingQty.add(key);
  try {
    let val = el.value.trim();
    const numVal = parseFloat(val);
    if (val !== "" && (isNaN(numVal) || numVal < 0)) { showToast("Ingresá un número válido", "warn"); el.value = ""; return; }
    // Actualizar estado local optimista
    if (!state.pedidos[todayKey()]) state.pedidos[todayKey()] = {};
    if (!state.pedidos[todayKey()][fbKey(local)]) state.pedidos[todayKey()][fbKey(local)] = {};
    if (!state.pedidos[todayKey()][fbKey(local)][area]) state.pedidos[todayKey()][fbKey(local)][area] = {};
    if (val && !isNaN(numVal) && numVal > 0) state.pedidos[todayKey()][fbKey(local)][area][pid] = numVal;
    else delete state.pedidos[todayKey()][fbKey(local)][area][pid];
    await saveQty(local, area, pid, val);
    // No llamamos safeRender aquí porque saveQty ya lo hace al final
    const closed = isClosed(area);
    showToast(closed ? '⚠ Cambio guardado. Producción fue alertada.' : '✓ Cantidad guardada.', closed ? 'warn' : 'success');
  } finally {
    _processingQty.delete(key);
  }
};
window.handleQtyKeydown = function(el, e) {
  if (e.key === 'Enter') { e.preventDefault(); handleQtyChange(el); }
  else if (e.key === 'Tab') {
    const originalVal = String(getQty(el.dataset.local, el.dataset.area, el.dataset.pid));
    if (el.value.trim() !== originalVal) handleQtyChange(el);
  }
};

window.saveInsumo = async function(el) {
  const { scope, id } = el.dataset;
  const val = el.value.trim();
  const path = `insumosPedidos/${todayKey()}/${scope}/${id}`;
  const snap = await get(ref(db, path));
  const current = snap.val() || {};
  if (!val) { if (!current.nota && !current.prioridad) await remove(ref(db, path)); else await set(ref(db, path), {...current, qty: ''}); }
  else await set(ref(db, path), {...current, qty: val, ts: Date.now()});
};

};
window.setPrioInsumo = async function(scope, id, prio) {
  const path = `insumosPedidos/${todayKey()}/${scope}/${id}`;
  const snap = await get(ref(db, path));
  const current = snap.val() || {};
  const newPrio = current.prioridad === prio ? '' : prio;
  if (!newPrio && !current.qty && !current.nota) await remove(ref(db, path));
  else await set(ref(db, path), {...current, prioridad: newPrio, ts: current.ts || Date.now()});
  if (!state.insumosPedidos[todayKey()]) state.insumosPedidos[todayKey()] = {};
  if (!state.insumosPedidos[todayKey()][scope]) state.insumosPedidos[todayKey()][scope] = {};

};

  const titulo = consolidated ? `Consolidado — ${area.label}` : `Pedido ${area.label} — ${local}`;
  const html = `<!DOCTYPE html><html><head><meta charset="UTF-8"/><title>${titulo}</title><style>@page{size:A4;margin:18mm 16mm;}body{font-family:Helvetica,Arial;font-size:11px;}table{width:100%;border-collapse:collapse;}th,td{padding:6px 10px;border-bottom:1px solid #ddd;}th{background:#222;color:#fff;}</style></head><body><h1>Candela Café</h1><h2>${area.icon} ${titulo}</h2><p>${new Date().toLocaleDateString('es-AR')} · Cierre: ${area.deadline} hs</p><table><thead><tr><th>Producto</th><th>Cantidad</th><th>Unidad</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r.name}</td><td>${r.qty}</td><td>${r.unit}</td></tr>`).join('')}</tbody></table></body></html>`;
  const win = window.open('','_blank','width=794,height=1123');
  win.document.write(html); win.document.close(); win.focus(); setTimeout(()=>win.print(),400);
};
window.printEnvio = function(local) {
  const items = getEnvioPorLocal(local);
  const html = `<!DOCTYPE html><html><head><meta charset="UTF-8"/><title>Guía de envío ${local}</title><style>@page{size:A4;margin:18mm 16mm;}body{font-family:Helvetica,Arial;font-size:11px;}table{width:100%;border-collapse:collapse;}th,td{padding:6px 10px;border-bottom:1px solid #ddd;}th{background:#222;color:#fff;}</style></head><body><h1>Candela Café</h1><h2>📦 Guía de envío — ${local}</h2><p>${new Date().toLocaleDateString('es-AR')}</p><table><thead><tr><th>Producto</th><th>Área</th><th>Cantidad</th><th>Unidad</th></tr></thead><tbody>${items.map(p=>`<tr><td>${p.name}</td><td>${p.area||''}</td><td>${fmtQty(p.qty)}</td><td>${p.unit}</td></tr>`).join('')}</tbody></table></body></html>`;
  const win = window.open('','_blank','width=794,height=1123');
  win.document.write(html); win.document.close(); win.focus(); setTimeout(()=>win.print(),400);
};
window.printStock = function(areaKey) {
  const area = AREAS.find(a=>a.key===areaKey);
  const prods = (state.productos[areaKey]||[]).filter(p=>state.productActive[p.id]!==false);
  const fecha = new Date().toLocaleDateString('es-AR', {weekday:'long',day:'numeric',month:'long',year:'numeric'});
  const rows = prods.map(p=>{ const qty = state.stock[p.id]?.qty||0; const sc = qty<=0?'#c0392b':qty<=5?'#b8860b':'#27ae60'; const sl = qty<=0?'Sin stock':qty<=5?'Bajo':'OK'; return {p, qty, sc, sl}; }).sort((a,b)=>a.qty-b.qty);
  const html = `<!DOCTYPE html><html><head><meta charset="UTF-8"/><title>Stock Cuadra — ${area?.label}</title><style>@page{size:A4;margin:14mm 13mm;}body{font-family:Helvetica,Arial;font-size:11px;}table{width:100%;border-collapse:collapse;}th,td{padding:6px 10px;border-bottom:1px solid #eee;}th{background:#222;color:#fff;}.qty{text-align:right;font-weight:bold;}</style></head><body><h1>Candela Café</h1><h2>📦 Stock Cuadra — ${area?.icon} ${area?.label}</h2><p>${fecha}</p><tr><thead><tr><th>#</th><th>Producto</th><th class="qty">Cantidad</th><th>Unidad</th><th>Estado</th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td>${i+1}</td><td>${r.p.name}</td><td class="qty" style="color:${r.sc}">${r.qty}</td><td>${r.p.unit}</td><td><span style="background:${r.sc};display:inline-block;width:8px;height:8px;border-radius:50%"></span> ${r.sl}</td></tr>`).join('')}</tbody></table></body></html>`;
  const win = window.open('','_blank','width=794,height=1123');
  win.document.write(html); win.document.close(); win.focus(); setTimeout(()=>win.print(),400);
};
async function stockUpdateQty(pid, unit, newQty, oldQty) {
  const delta = newQty - oldQty;
  const ts = Date.now();
  await set(ref(db, `stock/${pid}`), { qty: newQty, ts, unit });
  const histSnap = await get(ref(db, `stockHistory/${pid}`));
  const hist = histSnap.val() || [];
  hist.push({ delta, qty: newQty, ts });
  if (hist.length > 20) hist.splice(0, hist.length - 20);
  await set(ref(db, `stockHistory/${pid}`), hist);
  state.stock[pid] = { qty: newQty, ts, unit };
  state.stockHistory[pid] = hist;
  render();
  showToast(`✓ Stock: ${newQty} ${unit}`);
}
window.stockIncrement = async function(pid, unit) { const current = state.stock[pid]?.qty || 0; await stockUpdateQty(pid, unit, current + 1, current); };
window.stockDecrement = async function(pid, unit) { const current = state.stock[pid]?.qty || 0; if (current <= 0) return; await stockUpdateQty(pid, unit, Math.max(0, current - 1), current); };
window.stockSetQty = async function(el) { const pid = el.dataset.pid; const unit = el.dataset.unit; const newQty = Math.max(0, parseFloat(el.value) || 0); const oldQty = state.stock[pid]?.qty || 0; if (newQty === oldQty) return; await stockUpdateQty(pid, unit, newQty, oldQty); };

// Iniciar
initFirebase();
</script>
