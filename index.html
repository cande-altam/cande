function renderHistorialFecha(dateKey) {
  const pedidosDate = state.pedidos?.[dateKey] || {};
  const hasData = Object.values(pedidosDate).some(localData =>
    localData && Object.values(localData).some(areaData => areaData && Object.keys(areaData).length > 0)
  );
  if (!hasData) return `<div class="empty-state">No hay pedidos registrados para esta fecha.</div>`;

  const tsDate = state.pedidosTs?.[dateKey] || {};
  const fmtHora = ts => ts ? new Date(Number(ts)).toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'}) : '';
  let html = '';
  LOCALES.forEach(local => {
    const localData = pedidosDate[fbKey(local)] || {};
    const localTs = tsDate[fbKey(local)] || {};
    const localHasData = Object.values(localData).some(a => a && Object.keys(a).length > 0);
    if (!localHasData) return;
    html += `<div class="section-block" style="margin-bottom:16px"><div style="font-size:16px;font-weight:500;margin-bottom:16px">${local}</div>`;
    AREAS.forEach(area => {
      const areaData = localData[area.key] || {};
      const areaTs = localTs[area.key] || {};
      const catalogProds = state.productos[area.key] || [];
      const catalogIds = new Set(catalogProds.map(p => p.id));
      // Incluye productos del catálogo (activos o no) + productos pedidos que ya no están en catálogo
      const extraItems = Object.entries(areaData)
        .filter(([pid, qty]) => Number(qty) > 0 && !catalogIds.has(pid))
        .map(([pid]) => ({ id: pid, name: pid, unit: '' }));
      const allProds = [...catalogProds, ...extraItems];
      const items = allProds.filter(p => Number(areaData[p.id]) > 0);
      if (items.length === 0) return;
      // Rango horario de carga del pedido de esta área/local
      const tsVals = items.map(p => Number(areaTs[p.id])).filter(t => t > 0);
      let horaTxt = '';
      if (tsVals.length) {
        const min = Math.min(...tsVals), max = Math.max(...tsVals);
        horaTxt = (fmtHora(min) === fmtHora(max)) ? `🕐 ${fmtHora(max)}` : `🕐 ${fmtHora(min)}–${fmtHora(max)}`;
      }
      html += `<div style="margin-bottom:14px"><div style="font-size:12px;color:var(--gray);margin-bottom:6px;display:flex;justify-content:space-between;gap:8px"><span>${area.icon} ${area.label}</span>${horaTxt?`<span style="color:var(--terra)">${horaTxt}</span>`:''}</div>`;
      html += `<div style="display:flex;flex-wrap:wrap;gap:6px">`;
      items.forEach(p => {
        const h = fmtHora(areaTs[p.id]);
        html += `<span title="${h?'Cargado '+h:'Sin hora registrada'}" style="background:var(--cream);border:1px solid var(--cream-dark);border-radius:6px;padding:4px 10px;font-size:12px">${p.name}: <strong>${fmtQty(Number(areaData[p.id]))}</strong> ${p.unit}${h?` <span style="color:var(--gray)">· ${h}</span>`:''}</span>`;
      });
      html += `</div></div>`;
    });
    html += `</div>`;
  });
  return html;
}

// ====================== ANUNCIOS POR VISTA ======================
// Un anuncio está vigente si está marcado activo y (sin expira O la fecha aún no pasó)
function anuncioVigente(a) {
  if (!a || !a.activo || !a.texto) return false;
  if (a.expira) {
    const today = todayKey();
    if (a.expira < today) return false;              // ya pasó el día
    if (a.expira === today && a.expiraHora) {         // vence hoy a una hora puntual
      const now = new Date();
      const hhmm = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
      if (hhmm >= a.expiraHora) return false;
    }
  }
  return true;
}
// Cadena de claves a evaluar según la vista y su sub-tab activo (de lo más
// específico a lo más general). Carga se segmenta por local, Cuadra por área.
function currentAnuncioKeys() {
  const v = state.view;
  if (v === 'carga') {
    const localKey = fbKey(LOCALES[state.localTab] || '');
    return [`carga:${localKey}`, 'carga', 'global'];
  }
  if (v === 'produccion') {
    return [`produccion:${state.areaTab}`, 'produccion', 'global'];
  }
  return [v, 'global'];
}
// Devuelve el primer anuncio vigente de la cadena. {a, key} o null.
function getAnuncioActual() {
  for (const key of currentAnuncioKeys()) {
    const a = state.anuncios?.[key];
    if (anuncioVigente(a)) return { a, key };
  }
  return null;
}
const ANUNCIO_TIPOS = {
  terra:  { bg:'var(--terra)',     fg:'#fff',          icon:'📢' },
  turq:   { bg:'var(--turq-dark)', fg:'#fff',          icon:'ℹ️' },
  amber:  { bg:'#f0a500',          fg:'#fff',          icon:'⚠️' },
  dark:   { bg:'var(--black)',     fg:'var(--cream)',  icon:'🔔' },
};
function escapeAnuncio(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function renderAnuncioBanner() {
  const res = getAnuncioActual();
  if (!res) return '';
  const t = ANUNCIO_TIPOS[res.a.tipo] || ANUNCIO_TIPOS.terra;
  return `<div class="anuncio-banner" style="background:${t.bg};color:${t.fg}">
    <span class="anuncio-banner-icon">${t.icon}</span>
    <span class="anuncio-banner-text">${escapeAnuncio(res.a.texto)}</span>
  </div>`;
}
function renderAnuncioPopup() {
  const res = getAnuncioActual();
  if (!res) return '';
  const { a, key } = res;
  // El popup se muestra al entrar a la vista; si el usuario ya lo cerró en esta sesión,
  // no reaparece hasta que el admin publique/edite ese anuncio (cambia el ts).
  if (state.anuncioPopupCerrado[key] === (a.ts || 0)) return '';
  const t = ANUNCIO_TIPOS[a.tipo] || ANUNCIO_TIPOS.terra;
  return `<div class="anuncio-overlay" onclick="cerrarAnuncioPopup(event,'${key}')">
    <div class="anuncio-modal" onclick="event.stopPropagation()">
      <div class="anuncio-modal-icon" style="background:${t.bg};color:${t.fg}">${t.icon}</div>
      <div class="anuncio-modal-text">${escapeAnuncio(a.texto)}</div>
      <button class="btn btn-primary" style="width:100%;justify-content:center;margin-top:8px" onclick="cerrarAnuncioPopup(null,'${key}')">Entendido</button>
    </div>
  </div>`;
}
window.cerrarAnuncioPopup = function(ev, key) {
  if (ev) ev.stopPropagation();
  const a = state.anuncios?.[key];
  state.anuncioPopupCerrado[key] = a?.ts || 0;
  render();
};

function render() {
  const app = document.getElementById('app');
  if (state.loading) { app.innerHTML = `<div class="loading"><div class="spinner"></div>Conectando...</div>`; return; }
  let content = '';
  if (state.view === 'dashboard') content = renderDashboard();
  else if (state.view === 'carga') content = renderCarga();
  else if (state.view === 'produccion') content = renderProduccion();
  else if (state.view === 'envio') content = renderEnvio();
  else if (state.view === 'admin') content = renderAdmin();
  else if (state.view === 'insumos') content = renderInsumos();
  else if (state.view === 'historial') content = renderHistorial();
  app.innerHTML = renderHeader() + renderAnuncioBanner() + `<div class="main">${content}</div>` + renderAnuncioPopup();
}

const _processingQty = new Set();
window.handleQtyChange = async function(el) {
  const { local, area, pid } = el.dataset;
  const key = `${local}|${area}|${pid}`;
  if (_processingQty.has(key)) return;          // evitar doble disparo por el.blur()
  _processingQty.add(key);
  try {
    let val = el.value.trim();
    const numVal = parseFloat(val);
    if (val !== "" && (isNaN(numVal) || numVal < 0)) { showToast("Ingresá un número válido", "warn"); el.value = ""; return; }
    // Actualizar estado local optimista
    if (!state.pedidos[todayKey()]) state.pedidos[todayKey()] = {};
    if (!state.pedidos[todayKey()][fbKey(local)]) state.pedidos[todayKey()][fbKey(local)] = {};
    if (!state.pedidos[todayKey()][fbKey(local)][area]) state.pedidos[todayKey()][fbKey(local)][area] = {};
    const yestVal = Number(state.pedidos?.[yesterdayKey()]?.[fbKey(local)]?.[area]?.[pid]);
    if (val && !isNaN(numVal) && numVal > 0) {
      state.pedidos[todayKey()][fbKey(local)][area][pid] = numVal;
    } else if (yestVal > 0) {
      // Override explícito: guardar 0 para no mostrar el valor de ayer
      state.pedidos[todayKey()][fbKey(local)][area][pid] = 0;
    } else {
      delete state.pedidos[todayKey()][fbKey(local)][area][pid];
    }
    await saveQty(local, area, pid, val);
    // No llamamos safeRender aquí porque saveQty ya lo hace al final
    const closed = isClosed(area);
    showToast(closed ? '⚠ Cambio guardado. Producción fue alertada.' : '✓ Cantidad guardada.', closed ? 'warn' : 'success');
  } finally {
    _processingQty.delete(key);
  }
};
const _qtyDebounceTimers = {};
window.debouncedQtySave = function(el) {
  const { local, area, pid } = el.dataset;
  const key = `${local}|${area}|${pid}`;
  clearTimeout(_qtyDebounceTimers[key]);
  state.hasUnsavedChanges = true;
  _qtyDebounceTimers[key] = setTimeout(() => handleQtyChange(el), 600);
};
window.handleQtyKeydown = function(el, e) {
  if (e.key === 'Enter') { e.preventDefault(); handleQtyChange(el); }
  else if (e.key === 'Tab') {
    const originalVal = String(getQty(el.dataset.local, el.dataset.area, el.dataset.pid));
    if (el.value.trim() !== originalVal) handleQtyChange(el);
  }
};

async function stockUpdateQty(pid, unit, newQty, oldQty) {
  const delta = newQty - oldQty;
  const ts = Date.now();
  await set(ref(db, `stock/${pid}`), { qty: newQty, ts, unit });
  const histSnap = await get(ref(db, `stockHistory/${pid}`));
  const hist = histSnap.val() || [];
  hist.push({ delta, qty: newQty, ts });
  if (hist.length > 20) hist.splice(0, hist.length - 20);
  await set(ref(db, `stockHistory/${pid}`), hist);
  state.stock[pid] = { qty: newQty, ts, unit };
  state.stockHistory[pid] = hist;
  render();
  showToast(`✓ Stock: ${newQty} ${unit}`);
}
window.stockIncrement = async function(pid, unit) { const current = state.stock[pid]?.qty || 0; await stockUpdateQty(pid, unit, current + 1, current); };
window.stockDecrement = async function(pid, unit) { const current = state.stock[pid]?.qty || 0; if (current <= 0) return; await stockUpdateQty(pid, unit, Math.max(0, current - 1), current); };
window.stockSetQty = async function(el) { const pid = el.dataset.pid; const unit = el.dataset.unit; const newQty = Math.max(0, parseFloat(el.value) || 0); const oldQty = state.stock[pid]?.qty || 0; if (newQty === oldQty) return; await stockUpdateQty(pid, unit, newQty, oldQty); };

window.qtyIncrement = function(local, area, pid) {
  const input = document.querySelector(`input[data-local="\${local}"][data-area="\${area}"][data-pid="\${pid}"]`);
  if (!input) return;
  const current = parseFloat(input.value) || 0;
  const step = current < 10 ? 1 : current < 100 ? 5 : 10;
  const next = current + step;
  input.value = fmtQty(next);
  input.classList.add('has-value');
  saveQty(local, area, pid, String(next));
};
window.qtyDecrement = function(local, area, pid) {
  const input = document.querySelector(`input[data-local="\${local}"][data-area="\${area}"][data-pid="\${pid}"]`);
  if (!input) return;
  const current = parseFloat(input.value) || 0;
  const step = current <= 10 ? 1 : current <= 100 ? 5 : 10;
  const next = Math.max(0, current - step);
  input.value = next > 0 ? fmtQty(next) : '';
  input.classList.toggle('has-value', next > 0);
  saveQty(local, area, pid, next > 0 ? String(next) : '');
};

    delete state.confirmados[areaKey];
  } else {
    const areaLabel = AREAS.find(a=>a.key===areaKey)?.label || areaKey;
    await set(ref(db, `confirmados/\${todayKey()}/\${areaKey}`), { ts: Date.now(), local });
    state.confirmados[areaKey] = { ts: Date.now(), local };
    showToast('✓ Pedido de ' + areaLabel + ' confirmado', 'success');
    setView('dashboard');
    return;
  }
  render();
};
</script>
</body>
</html>
